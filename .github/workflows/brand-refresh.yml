name: Bomber Fan branding refresh

on:
  push:
    paths:
      - '.github/workflows/brand-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-branding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install --quiet pillow
      - name: Build icons and refresh front screen
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import json, re

          logo_path = Path('Main Logo.png')
          img = Image.open(logo_path).convert('RGBA')
          w, h = img.size
          side = min(w, h)
          img = img.crop(((w-side)//2, (h-side)//2, (w+side)//2, (h+side)//2))

          for size, name in [(192, 'icon-192.png'), (512, 'icon-512.png'), (180, 'apple-touch-icon.png')]:
              img.resize((size, size), Image.Resampling.LANCZOS).save(name, optimize=True)

          mask = Image.new('RGBA', (512, 512), (11, 15, 24, 255))
          inner = img.resize((410, 410), Image.Resampling.LANCZOS)
          mask.alpha_composite(inner, ((512-410)//2, (512-410)//2))
          mask.save('icon-maskable.png', optimize=True)

          manifest = {
              'name': 'Bomber Fan',
              'short_name': 'Bomber Fan',
              'description': 'A 3D local-multiplayer bomber game.',
              'start_url': './',
              'scope': './',
              'display': 'fullscreen',
              'background_color': '#0b0f18',
              'theme_color': '#0b0f18',
              'icons': [
                  {'src': 'icon-192.png', 'sizes': '192x192', 'type': 'image/png', 'purpose': 'any'},
                  {'src': 'icon-512.png', 'sizes': '512x512', 'type': 'image/png', 'purpose': 'any'},
                  {'src': 'icon-maskable.png', 'sizes': '512x512', 'type': 'image/png', 'purpose': 'maskable'}
              ]
          }
          Path('manifest.webmanifest').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<link rel="icon" href="data:image/svg\+xml,[^"]+">', '<link rel="icon" type="image/png" href="icon-192.png">', s, count=1)
          s = re.sub(r'<link rel="apple-touch-icon" href="data:image/svg\+xml,[^"]+">', '<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">', s, count=1)

          marker = '/* BOMBER FAN MAIN LOGO BRAND REFRESH */'
          if marker not in s:
              css = r'''
  /* BOMBER FAN MAIN LOGO BRAND REFRESH */
  #menu {
    background:
      radial-gradient(circle at 50% 28%, rgba(255,139,32,.24) 0%, rgba(255,104,20,.08) 26%, transparent 50%),
      radial-gradient(ellipse at center, rgba(12,15,22,.54) 0%, rgba(4,6,11,.94) 82%);
  }
  #menu::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(circle at 18% 18%, rgba(255,168,58,.09) 0 1px, transparent 2px),
      radial-gradient(circle at 77% 31%, rgba(255,105,21,.10) 0 1px, transparent 2px),
      radial-gradient(circle at 62% 74%, rgba(255,196,74,.08) 0 1px, transparent 2px);
    background-size: 73px 73px, 91px 91px, 117px 117px;
    mix-blend-mode: screen;
  }
  #menu h1 {
    width: min(38vw, 45vh, 400px) !important;
    height: auto; aspect-ratio: 1;
    margin: 0 0 10px !important;
    background: url('Main Logo.png') center / contain no-repeat;
    font-size: 0 !important; letter-spacing: 0 !important;
    filter: drop-shadow(0 12px 14px rgba(0,0,0,.65)) drop-shadow(0 0 34px rgba(255,127,22,.28));
  }
  #menu h1 > * { opacity: 0 !important; pointer-events: none !important; }
  #menu .opts { margin-top: 4px !important; gap: 8px; }
  #menu .opt {
    background: linear-gradient(180deg, rgba(31,32,36,.93), rgba(11,12,15,.95));
    border: 1px solid rgba(255,151,42,.34);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 8px 24px rgba(0,0,0,.42);
    transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease, background .12s ease;
  }
  #menu .opt:hover, #menu .opt.sel, #menu .opt:focus-within {
    transform: translateY(-1px);
    border-color: rgba(255,165,58,.92);
    background: linear-gradient(180deg, rgba(62,39,22,.96), rgba(20,15,12,.98));
    box-shadow: inset 0 1px 0 rgba(255,221,171,.12), 0 0 0 1px rgba(255,123,20,.20), 0 0 22px rgba(255,118,18,.22), 0 10px 26px rgba(0,0,0,.48);
  }
  #menu .opt .lbl.start {
    color: #ffd166;
    text-shadow: 0 0 16px rgba(255,139,32,.42);
    letter-spacing: .8px;
  }
  #menu .opt .val { color: #ffad42; }
  @media (max-height: 560px) {
    #menu h1 { width: min(28vw, 36vh, 210px) !important; margin-bottom: 3px !important; }
    #menu .opts { margin-top: 2px !important; gap: 4px; }
  }
'''
              s = s.replace('</style>', css + '\n</style>', 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit refreshed branding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.webmanifest icon-192.png icon-512.png icon-maskable.png apple-touch-icon.png
          git diff --cached --quiet || git commit -m "Refresh Bomber Fan logo and front screen"
          git push
