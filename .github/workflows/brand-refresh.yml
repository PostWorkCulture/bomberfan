name: Bomber Fan branding refresh

on:
  push:
    paths:
      - '.github/workflows/brand-refresh.yml'
      - '.github/scripts/brand_refresh.py'
      - 'Main Logo.png'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-branding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install --quiet pillow
      - name: Refresh logo, icons and front menu
        run: python .github/scripts/brand_refresh.py
      - name: Commit refreshed branding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.webmanifest icon-192.png icon-512.png icon-maskable.png apple-touch-icon.png
          git diff --cached --quiet || git commit -m "Refresh Bomber Fan logo, icons and front menu"
          git push
