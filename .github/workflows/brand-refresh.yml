name: Bomber Fan branding refresh

on:
  push:
    paths:
      - '.github/workflows/brand-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-branding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install --quiet pillow
      - name: Build icons and refresh front screen
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import json, re

          logo_path = Path('Main Logo.png')
          img = Image.open(logo_path).convert('RGBA')
          w, h = img.size
          side = min(w, h)
          img = img.crop(((w-side)//2, (h-side)//2, (w+side)//2, (h+side)//2))

          for size, name in [(192, 'icon-192.png'), (512, 'icon-512.png'), (180, 'apple-touch-icon.png')]:
              img.resize((size, size), Image.Resampling.LANCZOS).save(name, optimize=True)

          mask = Image.new('RGBA', (512, 512), (11, 15, 24, 255))
          inner = img.resize((410, 410), Image.Resampling.LANCZOS)
          mask.alpha_composite(inner, ((512-410)//2, (512-410)//2))
          mask.save('icon-maskable.png', optimize=True)

          manifest = {
              'name': 'Bomber Fan', 'short_name': 'Bomber Fan',
              'description': 'A 3D local-multiplayer bomber game.',
              'start_url': './', 'scope': './', 'display': 'fullscreen',
              'background_color': '#090b10', 'theme_color': '#f28a18',
              'icons': [
                  {'src': 'icon-192.png', 'sizes': '192x192', 'type': 'image/png', 'purpose': 'any'},
                  {'src': 'icon-512.png', 'sizes': '512x512', 'type': 'image/png', 'purpose': 'any'},
                  {'src': 'icon-maskable.png', 'sizes': '512x512', 'type': 'image/png', 'purpose': 'maskable'}
              ]
          }
          Path('manifest.webmanifest').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<link rel="icon" href="data:image/svg\+xml,[^"]+">', '<link rel="icon" type="image/png" href="icon-192.png">', s, count=1)
          s = re.sub(r'<link rel="apple-touch-icon" href="data:image/svg\+xml,[^"]+">', '<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">', s, count=1)

          marker = '/* BOMBER FAN MAIN LOGO BRAND REFRESH */'
          if marker not in s:
              css = r'''
  /* BOMBER FAN MAIN LOGO BRAND REFRESH */
  #menu {
    isolation: isolate;
    background:
      radial-gradient(circle at 50% 24%, rgba(255,151,35,.28) 0%, rgba(255,93,16,.10) 24%, transparent 48%),
      linear-gradient(180deg, rgba(7,8,11,.36), rgba(4,5,8,.94)),
      radial-gradient(ellipse at center, rgba(19,21,26,.38), rgba(3,4,6,.97));
  }
  #menu::before {
    content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none;
    background:
      linear-gradient(115deg, transparent 0 43%, rgba(255,130,24,.045) 44% 45%, transparent 46% 100%),
      radial-gradient(circle at 16% 18%, rgba(255,189,74,.18) 0 1px, transparent 2px),
      radial-gradient(circle at 78% 28%, rgba(255,104,20,.14) 0 1px, transparent 2px),
      radial-gradient(circle at 66% 76%, rgba(255,196,74,.10) 0 1px, transparent 2px);
    background-size: auto, 69px 69px, 91px 91px, 121px 121px;
    opacity: .9;
  }
  #menu::after {
    content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none;
    box-shadow: inset 0 0 120px rgba(0,0,0,.78), inset 0 -80px 100px rgba(0,0,0,.56);
  }
  #menu h1 {
    width: min(34vw, 43vh, 360px) !important;
    height: auto; aspect-ratio: 1;
    margin: -2vh 0 8px !important;
    background: url('Main Logo.png') center / contain no-repeat;
    font-size: 0 !important; letter-spacing: 0 !important;
    filter: drop-shadow(0 14px 16px rgba(0,0,0,.72)) drop-shadow(0 0 38px rgba(255,126,20,.32));
    animation: bfLogoFloat 3.4s ease-in-out infinite alternate;
  }
  #menu h1 > * { opacity: 0 !important; pointer-events: none !important; }
  @keyframes bfLogoFloat {
    from { transform: translateY(0) scale(1); }
    to { transform: translateY(-4px) scale(1.012); }
  }
  #menu .opts {
    width: min(500px, 88vw) !important;
    margin-top: 2px !important;
    gap: 9px;
    padding: 10px;
    border-radius: 20px;
    background: linear-gradient(180deg, rgba(19,20,24,.52), rgba(7,8,11,.38));
    border: 1px solid rgba(255,171,66,.10);
    box-shadow: 0 18px 50px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.035);
    backdrop-filter: blur(10px) saturate(1.12);
  }
  #menu .opt {
    min-height: 48px;
    padding: 12px 17px;
    border-radius: 13px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(180deg, rgba(34,35,40,.94), rgba(13,14,18,.97));
    border: 1px solid rgba(255,156,45,.28);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.065), 0 6px 18px rgba(0,0,0,.35);
    transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease, background .12s ease;
  }
  #menu .opt::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(100deg, transparent 0 55%, rgba(255,177,70,.07) 74%, transparent 100%);
    transform: translateX(-35%);
    transition: transform .24s ease;
  }
  #menu .opt:hover::before, #menu .opt.sel::before { transform: translateX(20%); }
  #menu .opt:hover, #menu .opt.sel, #menu .opt:focus-within {
    transform: translateY(-2px) scale(1.006);
    border-color: rgba(255,169,62,.95);
    background: linear-gradient(180deg, rgba(68,41,21,.97), rgba(23,16,12,.99));
    box-shadow: inset 0 1px 0 rgba(255,228,183,.13), 0 0 0 1px rgba(255,120,18,.18), 0 0 24px rgba(255,111,13,.24), 0 12px 28px rgba(0,0,0,.48);
  }
  #menu .opt:active { transform: translateY(1px) scale(.997); }
  #menu .opt .lbl {
    color: rgba(255,255,255,.92);
    font-weight: 800;
    letter-spacing: .35px;
    text-shadow: 0 1px 0 rgba(0,0,0,.65);
  }
  #menu .opt .lbl.start {
    color: #ffe1a3;
    font-weight: 950;
    letter-spacing: 1.1px;
    text-transform: uppercase;
    text-shadow: 0 0 18px rgba(255,139,32,.46);
  }
  #menu .opt .val {
    color: #ffae45;
    font-weight: 900;
    letter-spacing: .45px;
    text-shadow: 0 0 12px rgba(255,131,31,.20);
  }
  #menu .build {
    color: #ffb04b;
    opacity: .34;
  }
  @media (prefers-reduced-motion: reduce) {
    #menu h1 { animation: none; }
    #menu .opt, #menu .opt::before { transition: none; }
  }
  @media (max-height: 560px) {
    #menu h1 { width: min(25vw, 33vh, 188px) !important; margin: -1vh 0 2px !important; }
    #menu .opts { width: min(470px, 80vw) !important; margin-top: 0 !important; gap: 4px; padding: 6px; border-radius: 14px; }
    #menu .opt { min-height: 34px; padding: 6px 12px; border-radius: 9px; }
  }
  @media (max-height: 420px) {
    #menu h1 { width: min(21vw, 27vh, 128px) !important; }
    #menu .opts { gap: 3px; padding: 4px; }
    #menu .opt { min-height: 29px; padding: 4px 10px; }
  }
'''
              s = s.replace('</style>', css + '\n</style>', 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit refreshed branding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.webmanifest icon-192.png icon-512.png icon-maskable.png apple-touch-icon.png
          git diff --cached --quiet || git commit -m "Refresh Bomber Fan logo, icons and front menu"
          git push
