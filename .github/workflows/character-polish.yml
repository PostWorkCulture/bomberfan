name: Bomber Fan combat character polish

on:
  push:
    paths:
      - '.github/workflows/character-polish.yml'
      - '.github/scripts/character_polish.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish-characters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply combat character redesign
        run: python .github/scripts/character_polish.py
      - name: Commit character redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Redesign Bomber Fan characters as combat troopers"
          git push
