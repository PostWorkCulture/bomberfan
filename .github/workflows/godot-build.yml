name: Godot build

# Checks the Godot rebuild with real Godot on every push that touches godot/,
# and on main publishes the web build to play/ (https://postworkculture.github.io/bomberfan/play/).
# This is the one workflow allowed to commit: it only ever writes play/.

on:
  push:
    paths:
      - 'godot/**'
      - '.github/workflows/godot-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: godot-build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and web templates
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          set -e
          if [ ! -x ~/godot-bin/godot ]; then
            base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
            mkdir -p ~/godot-bin
            curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -q /tmp/godot.zip -d ~/godot-bin
            mv ~/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot-bin/godot
            curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            unzip -q /tmp/templates.tpz 'templates/web*' 'templates/version.txt' -d /tmp/tpl
            dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
            mkdir -p "$dest"
            mv /tmp/tpl/templates/* "$dest/"
          fi
          ~/godot-bin/godot --version

      - name: Import assets
        run: |
          ~/godot-bin/godot --headless --path godot --import 2>&1 | tee import.log || true

      - name: Smoke test (bots-only rounds, headless)
        run: |
          set +e
          timeout 300 ~/godot-bin/godot --headless --path godot -- --smoke 2>&1 | tee smoke.log
          code=${PIPESTATUS[0]}
          bad=$(grep -hE "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script|Invalid (call|access|get|set|assignment|operands)|Nonexistent function|Identifier .* not declared|previously freed" import.log smoke.log | head -25)
          if [ -n "$bad" ]; then
            echo "$bad" | while IFS= read -r line; do echo "::error title=Godot script error::$line"; done
            exit 1
          fi
          summary=$(grep -h "^SMOKE" smoke.log | tail -1)
          echo "::notice title=Smoke test::${summary:-no summary printed}"
          echo "$summary" | grep -q "^SMOKE OK" || exit 1
          [ "$code" = "0" ] || { echo "::error title=Smoke test::Godot exited with $code"; exit 1; }

      - name: Export web build
        run: |
          set -e
          mkdir -p build/play
          ~/godot-bin/godot --headless --path godot --export-release "Web" "$GITHUB_WORKSPACE/build/play/index.html" 2>&1 | tee export.log
          test -f build/play/index.html && test -f build/play/index.wasm && test -f build/play/index.pck
          ls -la build/play
          echo "::notice title=Web export::$(du -sh build/play | cut -f1) total"

      - name: Publish to play/ on main
        if: github.ref == 'refs/heads/main'
        run: |
          set -e
          rm -rf play
          cp -r build/play play
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A play
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build Godot web preview"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
