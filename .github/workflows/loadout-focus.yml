name: Bomber Fan Loadout focus

on:
  push:
    paths:
      - '.github/workflows/loadout-focus.yml'
      - '.github/scripts/loadout_focus.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish-loadout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Loadout readability and preview focus fix
        run: python .github/scripts/loadout_focus.py
      - name: Commit Loadout focus fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix Loadout layout and brighten character preview"
          git push
