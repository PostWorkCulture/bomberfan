name: Bomber Fan Prize Locker redesign

on:
  push:
    paths:
      - '.github/workflows/locker-refresh.yml'
      - '.github/scripts/locker_refresh.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redesign-locker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restyle Prize Locker
        run: python .github/scripts/locker_refresh.py
      - name: Commit locker redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Redesign Prize Locker as Bomber Fan armoury"
          git push
