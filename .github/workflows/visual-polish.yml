name: Bomber Fan visual polish

on:
  push:
    paths:
      - '.github/workflows/visual-polish.yml'
      - '.github/scripts/visual_polish.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply visual polish
        run: python .github/scripts/visual_polish.py
      - name: Commit visual polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Polish Bomber Fan logo blend and Loadout war room"
          git push
