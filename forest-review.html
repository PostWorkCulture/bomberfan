<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forest lighting review · Bomberfan</title><style>
*{box-sizing:border-box}body{margin:0;background:#101d17;color:#edf0e7;font:14px system-ui}header{min-height:96px;padding:12px 20px;display:flex;align-items:center;gap:20px;justify-content:space-between;flex-wrap:wrap}h1{font-size:18px;margin:0 0 5px}p{margin:0;color:#b7c8bc;font-size:12px;max-width:600px}nav{display:flex;gap:6px;flex-wrap:wrap}button{border:1px solid #657666;background:#20372b;color:#fff;padding:9px 13px;border-radius:9px;cursor:pointer}button[aria-pressed=true]{background:#d3e8ac;color:#172819}iframe{display:block;width:100%;height:calc(100dvh - 110px);min-height:330px;border:0}a{color:#d3e8ac} @media(max-width:720px){header{gap:10px;padding:10px}iframe{height:calc(100dvh - 165px)}}
</style></head><body><header><div><h1>Forest lighting evaluation</h1><p id="description">Warm sunlight, woodland reflections, softer edges and baked contact shading. Choose Loadout, then Fight to play.</p></div><nav aria-label="Lighting comparison"><button data-mode="original" aria-pressed="false">Original</button><button data-mode="auto" aria-pressed="true">Upgraded · Auto</button><button data-mode="balanced" aria-pressed="false">Balanced</button><button data-mode="high" aria-pressed="false">High</button></nav></header><iframe id="game" title="Playable Forest lighting comparison" allow="autoplay; fullscreen" src="forest-preview.html?forestReview=1&lighting=auto"></iframe><script>
const labels={original:'Original lighting and surfaces. Switching treatment restarts the same seeded opening layout.',auto:'Upgraded Forest. Automatically reduces effects on slower devices. Choose Loadout, then Fight to play.',balanced:'Upgraded lighting and surfaces with 1024px shadows and no screen glow, for lower rendering cost.',high:'Full treatment: 2048px shadows, HDR reflections, subtle bloom and colour grading. Higher GPU cost.'};
document.querySelectorAll('button[data-mode]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('button[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.getElementById('description').textContent=labels[button.dataset.mode];document.getElementById('game').src='forest-preview.html?forestReview=1&lighting='+button.dataset.mode;}));
</script></body></html>
