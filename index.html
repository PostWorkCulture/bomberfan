        fins.forEach((fin, i) => { fin.rotation.y = Math.sin(t * 1.2 + i) * 0.025; });
      });
    }

    // Showcase movement is intentionally separate from cosmetic animation.
    // It runs in character select and on the round winner only, never while a
    // character is moving around the arena.
    const showcaseRig = g.children[0];
    if (showcaseRig) {
      g.userData.showcaseRig = showcaseRig;
      const basePos = showcaseRig.position.clone();
      const baseRot = showcaseRig.rotation.clone();
      const baseScale = showcaseRig.scale.clone();
      const hop = t => Math.max(0, Math.sin(t));
      const moves = {
        piglet: (r, t) => {
          const bounce = hop(t * 4.2);
          r.position.y += bounce * 0.095;
          r.position.x += Math.sin(t * 2.1) * 0.035;
          r.rotation.z += Math.sin(t * 4.2) * 0.07;
          r.scale.y *= 1 - bounce * 0.028;
        },
        reaper: (r, t) => {
          r.position.y += 0.06 + Math.sin(t * 1.8) * 0.085;
          r.rotation.y += Math.sin(t * 0.9) * 0.48;
          r.rotation.z += Math.sin(t * 1.8) * 0.045;
        },
        cyclops: (r, t) => {
          r.position.x += Math.sin(t * 2.4) * 0.075;
          r.position.y += hop(t * 4.8) * 0.045;
          r.rotation.z += Math.sin(t * 2.4) * 0.075;
          r.rotation.y += Math.sin(t * 1.2) * 0.16;
        },
        jester: (r, t) => {
          r.position.y += hop(t * 3.6) * 0.14;
          r.rotation.y += Math.sin(t * 1.8) * 0.55;
          r.rotation.z += Math.sin(t * 3.6) * 0.11;
        },
        inferno: (r, t) => {
          const piston = hop(t * 5.2);
          r.position.y += piston * 0.07;
          r.rotation.z += Math.sin(t * 10.4) * 0.018 * piston;
          r.scale.y *= 1 - piston * 0.035;
        },
        hulk: (r, t) => {
          const smash = Math.pow(hop(t * 2.5), 8);
          r.position.y += hop(t * 5.0) * 0.035;
          r.position.z += smash * 0.08;
          r.rotation.x += smash * 0.18;
          r.rotation.y += Math.sin(t * 0.8) * 0.17;
          r.scale.x *= 1 + smash * 0.055;
          r.scale.y *= 1 - smash * 0.045;
        },
        devil: (r, t) => {
          const stomp = hop(t * 4.4);
          r.position.y += stomp * 0.075;
          r.rotation.x += Math.sin(t * 4.4) * 0.09;
          r.rotation.y += Math.sin(t * 1.1) * 0.24;
        },
        maw: (r, t) => {
          const bounce = hop(t * 3.8);
          r.position.y += bounce * 0.12;
          r.scale.x *= 1 + bounce * 0.07;
          r.scale.y *= 1 - bounce * 0.055;
          r.rotation.z += Math.sin(t * 3.8) * 0.065;
        },
        bombog: (r, t) => {
          const toss = hop(t * 3.0);
          r.position.y += toss * 0.075;
          r.rotation.y += Math.sin(t * 1.5) * 0.24;
          r.rotation.z += Math.sin(t * 3.0) * 0.045;
        },
        plague: (r, t) => {
          r.position.x += Math.sin(t * 2.0) * 0.07;
          r.position.y += hop(t * 4.0) * 0.035;
          r.rotation.z += Math.sin(t * 2.0) * 0.095;
          r.rotation.y += Math.sin(t) * 0.2;
        },
        phantom: (r, t) => {
          r.position.x += Math.sin(t * 1.4) * 0.055;
          r.position.y += 0.08 + Math.sin(t * 2.0) * 0.09;
          r.rotation.y += Math.sin(t * 0.7) * 0.62;
          r.rotation.z += Math.sin(t * 1.4) * 0.055;
        },
        joker: (r, t) => {
          const step = hop(t * 4.0);
          r.position.x += Math.sin(t * 2.0) * 0.085;
          r.position.y += step * 0.09;
          r.rotation.z += Math.sin(t * 2.0) * 0.13;
          r.rotation.y += Math.sin(t) * 0.28;
        },
        deadpool: (r, t) => {
          const flourish = Math.sin(t * 2.6);
          r.position.y += hop(t * 5.2) * 0.055;
          r.rotation.y += flourish * 0.34;
          r.rotation.z += Math.sin(t * 5.2) * 0.045;
        },
        blondie: (r, t) => {
          const dash = Math.pow(hop(t * 3.2), 5);
          r.position.x += Math.sin(t * 3.2) * 0.12;
          r.position.y += hop(t * 6.4) * 0.055;
          r.rotation.z -= dash * 0.16;
          r.rotation.y += Math.sin(t * 1.6) * 0.2;
        },
        dino: (r, t) => {
          const stomp = hop(t * 4.6);
          r.position.y += stomp * 0.055;
          r.rotation.z += Math.sin(t * 2.3) * 0.075;
          r.rotation.y += Math.sin(t * 0.75) * 0.2;
          r.scale.y *= 1 - stomp * 0.025;
        },
        wario: (r, t) => {
          const bump = Math.pow(hop(t * 3.6), 7);
          r.position.y += hop(t * 7.2) * 0.04;
          r.position.z += bump * 0.09;
          r.rotation.z += Math.sin(t * 1.8) * 0.11;
          r.rotation.y += Math.sin(t * 0.9) * 0.28;
          r.scale.x *= 1 + bump * 0.07;
          r.scale.y *= 1 - bump * 0.045;
        },
        buzz: (r, t) => {
          const lift = hop(t * 3.1);
          r.position.y += lift * 0.08;
          r.rotation.z += Math.sin(t * 1.55) * 0.065;
          r.rotation.y += Math.sin(t * 0.78) * 0.2;
        },
        minion: (r, t) => {
          const bounce = hop(t * 4.4);
          r.position.y += bounce * 0.1;
          r.rotation.z += Math.sin(t * 2.2) * 0.07;
          r.scale.y *= 1 - bounce * 0.04;
        },
        sonic: (r, t) => {
          const dash = Math.pow(hop(t * 3.5), 5);
          r.position.x += Math.sin(t * 3.5) * 0.13;
          r.position.y += hop(t * 7) * 0.055;
          r.rotation.z -= dash * 0.2;
          r.rotation.y += Math.sin(t * 1.75) * 0.18;
        },
        'tanooki bowser': (r, t) => {
          const slam = Math.pow(hop(t * 2.7), 7);
          r.position.y += hop(t * 5.4) * 0.045;
          r.position.z += slam * 0.07;
          r.rotation.x += slam * 0.12;
          r.rotation.y += Math.sin(t * 0.85) * 0.22;
        },
      };
      const move = moves[combatClass];
      g.userData.showcaseReset = () => {
        showcaseRig.position.copy(basePos);
        showcaseRig.rotation.copy(baseRot);
        showcaseRig.scale.copy(baseScale);
      };
      if (move) g.userData.showcaseAnim = t => {
        g.userData.showcaseReset();
        move(showcaseRig, t);
      };
    }

    // --- Headgear and flourish ---------------------------------------------
    // Both come from the catalogue in section 05. Nothing is welded to a
    // character any more: every hat and every extra is something someone won,
    // so this is one lookup rather than two if-chains that had to be edited
    // every time a cosmetic was added.
    // Animated cosmetics register a function here rather than reaching for a
    // clock of their own. The render loop calls them — see Player.tickCosmetics
    // — so the character in the arena and the one turning in the locker are
    // driven by identical code, and nothing animates while the game is paused.
    g.userData.shoeMat = shoeMat;
    const kitCtx = { mat, def, bodyMat, bellyMat, trimMat, accentMat, seat: def.color,
                     anim: fn => anims.push(fn) };
    const attachmentRoot = showcaseRig || g;
    ['hat', 'extra'].forEach(slot => {
      // A blank slot is genuinely blank. Passing it through cosmeticItem would
      // silently fall back to the retired default horns.
      if (!kit[slot]) return;
      const item = cosmeticItem(slot, kit[slot]);
      // Anything worn belongs to the same animated hierarchy as the body, so a
      // hop, stomp, sway or recoil cannot leave the attachment behind.
      if (item && item.build) item.build(attachmentRoot, kitCtx);
    });
    if (anims.length) g.userData.cosAnim = anims;


    // --- Seat marker and curse aura ----------------------------------------
    // depthWrite MUST stay off. A transparent material that writes depth lands in
    // the transparent pass with the character's own body already in the depth
    // buffer, and the result was a soft body-shaped wash of seat colour hanging
    // over the character — worst at the front row, where the ring is nearly
    // edge-on to the camera. That smear is what read as the characters glitching.
    // AND IT HAS TO BE SMALLER THAN THE CHARACTER, not wider than it. At 0.42 the
    // ring's near arc reached a third of a tile in front of the feet, and from a
    // camera this shallow that arc is genuinely NEARER than the belly — so it won
    // the depth test and painted a coloured halo across the lower body. Not a
    // sorting bug: real geometry in front of the character. Tucked inside the
    // silhouette at 0.3 it stays where a floor marker belongs.
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(0.2, 0.3, 26),
      new THREE.MeshBasicMaterial({
        color: def.color, transparent: true, opacity: 0.55,
        side: THREE.DoubleSide, depthWrite: false,
      })
    );
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.015;
    ring.renderOrder = 2;              // after the floor, before anything above it
    g.add(ring);

    const aura = new THREE.Mesh(
      new THREE.SphereGeometry(0.6, 16, 12),
      new THREE.MeshBasicMaterial({
        color: 0x7bd83a, transparent: true, opacity: 0.22,
        blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false,
      })
    );
    aura.position.y = 0.55;
    aura.visible = false;
    // Unlike the floor ring, an aura surrounds the fighter and must follow the
    // showcase rig during victory and selection movement.
    attachmentRoot.add(aura);
    g.userData.aura = aura;

    // Smooth every character surface before it reaches the shared renderer.
    // Boxes retain their authored hard corners because their faces use split
    // vertices, while spheres, capsules, cylinders and clothing curves lose
    // the visible low-poly faceting that used to read as a wire grid.
    g.traverse(object => {
      if (!object.isMesh) return;
      if (object.geometry && object.geometry.computeVertexNormals) {
        object.geometry.computeVertexNormals();
      }
      const materials = Array.isArray(object.material) ? object.material : [object.material];
      materials.forEach(material => {
        if (!material || material.isMeshBasicMaterial) return;
        material.flatShading = false;
        material.needsUpdate = true;
      });
    });

    return g;
  }
}

// HOW BIG A CHARACTER IS DRAWN, and why it is two numbers.
//
// WIDTH IS AT ITS CEILING, and it was worth re-checking when the seat ring shrank
// from 0.42 to 0.3 — the ring used to be the widest thing about a character, so
// shrinking it looked like it had bought room to make them wider.
//
// It had not. MEASURED, the widest SOLID part is 0.41 — the feet and hands, not
// the body capsule (0.3) and not the ring. A tile is 1.0 across, so the ceiling is
// 0.5 / 0.41 = 1.22 and 1.19 was already sitting on it. Pushed to 1.34 the
// footprint came out at 0.55 and the characters lapped over their neighbours'
// tiles; the test caught it. Left where it was.
//
// HEIGHT HAS NO SUCH LIMIT: nothing collides vertically. So the characters are
// made bigger by being made TALLER — 13% up on the old figure — which is what
// actually buys screen presence from a camera 52 degrees above them. On these
// egg-shaped bodies it reads as chunkier rather than stretched.
Player.VIEW_SCALE = 1.19;
Player.VIEW_SCALE_Y = 1.34;

/* ------------------------------------------------------------------ BOMB -- */
class Bomb {
  constructor(x, y, owner) {
    this.x = x; this.y = y;
    this.fx = x; this.fy = y;          // continuous position while sliding
    this.owner = owner;
    this.fire = owner.effFire;
    this.pierce = owner.pierce;
    this.isMine = owner.mine;
    this.remote = owner.remote;
    this.fuse = this.isMine ? CFG.MINE_FUSE : (this.remote ? Infinity : CFG.BOMB_FUSE);
    this.armT = 0;                     // mines ignore contact until armed
    this.vel = null;                   // set while being kicked
    this.flight = null;                // set while punched or thrown
    this.held = false;
    this.dead = false;
    this.t = 0;

    const g = new THREE.Group();
    // The shell comes from the owner's equipped design. Its COLOUR does not:
    // World.MAT.bomb is chosen per level so the bomb stays visible against that
    // floor, and no cosmetic is allowed to undo that.
    const kit = cosmeticItem('bomb', owner.kit && owner.kit.bomb);
    const shell = kit.build({
      // World.MAT.bomb unless the owner brought its own — the angry snowman's
      // bomb is red, and recolouring the shared material would turn every bomb on
      // the board red with it.
      shellMat: owner.shellMat || World.MAT.bomb,
      mat: (c, o) => new THREE.MeshStandardMaterial(
        Object.assign({ color: c, roughness: 0.45, metalness: 0.1 }, o || {})),
    });
    shell.castShadow = true;
    g.add(shell);
    const band = new THREE.Mesh(
      new THREE.TorusGeometry(0.28, 0.035, 8, 20),
      new THREE.MeshStandardMaterial({ color: owner.def.color, roughness: 0.4, metalness: 0.3 })
    );
    band.rotation.x = Math.PI / 2;
    g.add(band);
    // A powered-up bomb wears a red fuse, so everyone can see at a glance that
    // this one has a longer reach than a stock bomb.
    const hot = this.fire > CFG.START_FIRE;
    const fuse = new THREE.Mesh(
      new THREE.CylinderGeometry(0.03, 0.03, 0.18, 6),
      new THREE.MeshStandardMaterial({
        color: hot ? 0xe8262c : 0xd9c9a0,
        emissive: hot ? 0x6b0d10 : 0x000000,
        roughness: 0.8,
      })
    );
    fuse.position.set(0, 0.4, 0);
    fuse.rotation.z = 0.35;
    g.add(fuse);
    this.spark = new THREE.Mesh(
      new THREE.SphereGeometry(hot ? 0.075 : 0.06, 10, 8),
      new THREE.MeshStandardMaterial({
        color: hot ? 0xffd0c0 : 0xfff3b0,
        emissive: hot ? 0xff3b1a : 0xffaa22,
        emissiveIntensity: hot ? 4 : 3,
      })
    );
    this.spark.position.set(0.06, 0.5, 0);
    g.add(this.spark);

    if (this.isMine) {
      // Mines sit flatter and wear a warning collar
      shell.scale.set(1.15, 0.55, 1.15);
      band.material = new THREE.MeshStandardMaterial({ color: 0xb7d321, roughness: 0.4, metalness: 0.3 });
      fuse.visible = false;
      this.spark.material = new THREE.MeshStandardMaterial({
        color: 0xd7ff4f, emissive: 0xb7d321, emissiveIntensity: 2.5,
      });
      this.spark.position.set(0, 0.22, 0);
    } else if (this.remote) {
      band.material = new THREE.MeshStandardMaterial({ color: 0x2ec4b6, roughness: 0.4, metalness: 0.35 });
    }

    g.position.set(World.wx(x), 0.36, World.wz(y));
    this.mesh = g;
    World.scene.add(g);
  }

  // Start sliding after a kick. Returns false if there is nowhere to go.
  kick(dx, dy) {
    if (this.flight || this.held) return false;
    if (!Game.bombCanEnter(this.x + dx, this.y + dy, this)) return false;
    this.vel = { x: dx, y: dy };
    return true;
  }

  // Punched or thrown: a parabola over `tiles` tiles in the facing direction
  launch(dx, dy, tiles) {
    this.vel = null;
    this.held = false;
    Game.unregisterBomb(this);
    const from = { x: this.fx, y: this.fy };
    const to = Game.landingTile(this.x, this.y, dx, dy, tiles, this);
    this.flight = { from, to, t: 0, dur: CFG.FLIGHT_TIME };
  }

  updateMotion(dt) {
    // --- in the air ---
    if (this.flight) {
      const f = this.flight;
      f.t += dt;
      const k = clamp(f.t / f.dur, 0, 1);
      this.fx = lerp(f.from.x, f.to.x, k);
      this.fy = lerp(f.from.y, f.to.y, k);
      // Arc height is per-flight now. A punch lobs a bomb two tiles; the hazard
      // throws one right across the board, and the same 1.5 over that distance
      // is a flat skim you cannot read the landing point from.
      const h = Math.sin(k * Math.PI) * (f.h === undefined ? 1.5 : f.h);
      // A throw that starts off the board — out of a hand on the wall — begins
      // above the ground, and eases down to the normal resting height.
      const y0 = (f.y0 === undefined ? 0.36 : f.y0);
      this.mesh.position.set(World.wx(this.fx), lerp(y0, 0.36, k) + h, World.wz(this.fy));
      this.mesh.rotation.x += dt * (f.spin === undefined ? 9 : f.spin);
      if (k >= 1) {
        this.mesh.rotation.x = 0;
        this.x = f.to.x; this.y = f.to.y;
        this.fx = this.x; this.fy = this.y;
        this.flight = null;
        this.armT = 0;
        Game.registerBomb(this);
        World.addShake(0.04);
      }
      return;
    }

    // --- being carried ---
    if (this.held) return;

    // --- sliding after a kick ---
    if (this.vel) {
      const step = CFG.KICK_SPEED * dt;
      const nx = this.x + this.vel.x, ny = this.y + this.vel.y;
      this.fx += this.vel.x * step;
      this.fy += this.vel.y * step;
      const passed = this.vel.x !== 0
        ? (this.vel.x > 0 ? this.fx >= nx : this.fx <= nx)
        : (this.vel.y > 0 ? this.fy >= ny : this.fy <= ny);
      if (passed) {
        this.fx = nx; this.fy = ny;
        Game.moveBombTo(this, nx, ny);
        if (!Game.bombCanEnter(nx + this.vel.x, ny + this.vel.y, this)) this.vel = null;
      }
    }

    // A BELT CARRIES BOMBS TOO, and that is the point of belts rather than a
    // side effect of them: you can post a bomb round a corner at somebody who
    // never saw you place it. A bomb already sliding from a kick keeps its own
    // motion — being kicked is a stronger claim on a bomb than the floor's.
    if (!this.vel) {
      const belt = World.beltAt(this.x, this.y);
      if (belt) {
        const step = CFG.BELT_SPEED * dt;
        const nx = this.fx + belt.x * step, ny = this.fy + belt.y * step;
        const tx = Math.round(nx), ty = Math.round(ny);
        // Only hand it to the next tile once it has genuinely crossed, and only
        // if that tile will take it — a belt running into a wall stacks bombs up
        // against it rather than pushing them through it.
        if ((tx !== this.x || ty !== this.y)) {
          if (Game.bombCanEnter(tx, ty, this)) {
            this.fx = nx; this.fy = ny;
            Game.moveBombTo(this, tx, ty);
          }
        } else {
          this.fx = nx; this.fy = ny;
        }
      }
    }

    this.mesh.position.set(World.wx(this.fx), 0.36, World.wz(this.fy));
  }

  update(dt) {
    this.t += dt;
    this.armT += dt;
    this.updateMotion(dt);
    if (!this.remote) this.fuse -= dt;
    // Pulse faster as the fuse runs down — the classic tell
    const urgency = this.remote || this.isMine
      ? 0.25
      : 1 - clamp(this.fuse / CFG.BOMB_FUSE, 0, 1);
    const p = 1 + Math.sin(this.t * (7 + urgency * 16)) * (0.07 + urgency * 0.09);
    this.mesh.scale.set(p, 2 - p, p);
    this.spark.scale.setScalar(0.7 + Math.random() * 0.7);
    if (this.fuse <= 0) return true;
    return false;
  }

  dispose() { World.scene.remove(this.mesh); }
}

/* ----------------------------------------------------------------- BLAST -- */
class Blast {
  constructor(cells) {
    this.cells = cells;              // [{x,y,kind,dir}]
    this.life = CFG.BLAST_LIFE;
    this.tiles = new Set(cells.map(c => World.key(c.x, c.y)));
    this.group = new THREE.Group();

    // Cloned per blast: opacity is animated, so sharing would fade every
    // explosion on screen at the same time.
    this.matArm = World.MAT.flame.clone();
    this.matCore = World.MAT.flameCore.clone();
    this.matShock = World.MAT.shock.clone();
    this.flames = [];

    // Billowing blobs rather than boxes: neighbouring tiles overlap slightly,
    // so a long blast reads as one continuous rolling fire.
    cells.forEach((c, i) => {
      const isCore = c.kind === 'core';
      const m = new THREE.Mesh(new THREE.IcosahedronGeometry(isCore ? 0.62 : 0.56, 1), this.matArm);
      m.position.set(World.wx(c.x), 0.48, World.wz(c.y));
      m.rotation.set(i * 1.7, i * 2.3, i * 0.9);
      m.userData.ownGeometry = true;
      this.group.add(m);
      this.flames.push(m);

      const inner = new THREE.Mesh(new THREE.IcosahedronGeometry(isCore ? 0.4 : 0.32, 1), this.matCore);
      inner.position.copy(m.position);
      inner.rotation.set(i * 0.8, i * 1.1, i * 2.1);
      inner.userData.ownGeometry = true;
      this.group.add(inner);
      this.cores = this.cores || [];
      this.cores.push(inner);
    });

    const c0 = cells[0];
    // Expanding shockwave ring on the ground at the detonation point
    this.shock = new THREE.Mesh(new THREE.RingGeometry(0.35, 0.55, 32), this.matShock);
    this.shock.rotation.x = -Math.PI / 2;
    this.shock.position.set(World.wx(c0.x), 0.06, World.wz(c0.y));
    this.shock.userData.ownGeometry = true;
    this.group.add(this.shock);

    this.light = new THREE.PointLight(0xff8c30, 34, 11, 2);
    this.light.position.set(World.wx(c0.x), 1.4, World.wz(c0.y));
    this.group.add(this.light);

    World.scene.add(this.group);
    this.update(0);
  }

  update(dt) {
    this.life -= dt;
    const t = clamp(this.life / CFG.BLAST_LIFE, 0, 1);   // 1 -> 0 over its life
    const age = 1 - t;

    // Snap open fast, then burn down: reads as an explosion, not a fade-in
    const open = clamp(age / 0.12, 0, 1);
    const scale = 0.35 + open * 0.72;
    const op = t > 0.7 ? 1 : Math.pow(t / 0.7, 0.8);

    this.matArm.opacity = op * 0.88;
    this.matCore.opacity = op * 0.7;

    // RAINBOW FIRE. The flame materials are cloned per blast (invariant 5), so
    // writing colour here touches this explosion and no other. One hue for the
    // whole blast rather than one per flame: the arms share a material, and
    // cloning per flame would be forty materials a detonation for an effect that
    // reads better as a sweep through the spectrum anyway.
    if (this.rainbow) {
      const h = (age * 2.4) % 1;
      this.matArm.color.setHSL(h, 1, 0.58);
      this.matCore.color.setHSL((h + 0.45) % 1, 1, 0.78);
      this.matShock.color.setHSL((h + 0.2) % 1, 1, 0.7);
      if (this.light) this.light.color.setHSL(h, 1, 0.6);
    }
    this.flames.forEach((m, i) => {
      const flicker = 1 + Math.sin(age * 30 + i * 1.4) * 0.09;
      m.scale.set(scale * flicker, scale * (0.86 + Math.sin(age * 22 + i) * 0.08), scale * flicker);
      m.rotation.y += dt * 2.4;
    });
    (this.cores || []).forEach((m, i) => {
      const f = 1 + Math.sin(age * 41 + i * 2.1) * 0.16;
      m.scale.setScalar(scale * f);
      m.rotation.x -= dt * 3.1;
    });

    const s = 1 + age * 4.2;
    this.shock.scale.set(s, s, 1);
    this.matShock.opacity = 0.85 * Math.pow(t, 1.6);

    this.light.intensity = 34 * t * t;
    return this.life <= 0;
  }

  dispose() {
    this.group.traverse(o => { if (o.isMesh) o.geometry.dispose(); });
    this.matArm.dispose();
    this.matCore.dispose();
    this.matShock.dispose();
    World.scene.remove(this.group);
  }
}

/* -------------------------------------------------------------- POWER-UP -- */
class PowerUp {
  constructor(x, y, id) {
    this.x = x; this.y = y; this.id = id;
    this.def = PU_TABLE.find(p => p.id === id) || PU_TABLE[0];

    const g = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({
      map: Icons.texture(id),
      // A black tile emits nothing, so it glows with its OUTLINE colour instead
      // — otherwise the bomb pick-up is an unlit cube on a dark floor.
      emissive: this.def.outline || this.def.color,
      emissiveIntensity: this.def.outline ? 0.5 : 0.34,
      roughness: 0.5,
      metalness: 0.05,
    });
    const cube = new THREE.Mesh(new THREE.BoxGeometry(0.68, 0.68, 0.68), mat);
    cube.castShadow = true;
    g.add(cube);
    this.mat = mat;

    // Floor glow so it is visible even behind a crate edge
    const glow = new THREE.Mesh(
      new THREE.RingGeometry(0.3, 0.46, 24),
      new THREE.MeshBasicMaterial({
        color: this.def.color, transparent: true, opacity: 0.5,
        side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
        depthWrite: false, toneMapped: false,
      })
    );
    glow.rotation.x = -Math.PI / 2;
    glow.position.y = -0.42;
    g.add(glow);
    this.glow = glow;

    g.position.set(World.wx(x), 0.5, World.wz(y));
    this.mesh = g;
    this.t = Math.random() * 6;
    // The extra life is the one prize worth crossing the map for, so it does
    // not just sit there: it grows out of the sparkle burst and then pulses.
    this.special = id === PU.SHIELD;
    this.birth = this.special ? 0 : 1;      // 0 -> 1 as it appears
    if (this.special) { this.t = 0; g.scale.setScalar(0.01); }
    World.scene.add(g);
  }

  update(dt) {
    this.t += dt;
    this.mesh.rotation.y += dt * (this.special ? 1.6 : 1.1);
    this.mesh.position.y = 0.5 + Math.sin(this.t * 2.6) * 0.08;
    this.glow.material.opacity = 0.35 + Math.sin(this.t * 3.4) * 0.15;
    if (!this.special) return;

    // Grow in behind the sparkles, overshooting slightly so it lands with a
    // pop rather than easing politely into place.
    if (this.birth < 1) {
      this.birth = Math.min(1, this.birth + dt / 0.34);
      const e = 1 - Math.pow(1 - this.birth, 3);
      this.mesh.scale.setScalar(e * (1 + 0.28 * Math.sin(this.birth * Math.PI)));
    } else {
      this.mesh.scale.setScalar(1 + Math.sin(this.t * 5.2) * 0.11);   // heartbeat
    }
    this.glow.material.opacity = 0.5 + Math.sin(this.t * 5.2) * 0.28;
    this.mat.emissiveIntensity = 0.5 + Math.sin(this.t * 5.2) * 0.3;
  }

  // Returns a short label for the pickup toast
  apply(player) {
    switch (this.id) {
      case PU.BOMB:      player.maxBombs = Math.min(player.maxBombs + 1, CFG.MAX_BOMBS); break;
      case PU.FIRE:      player.fire = Math.min(player.fire + 1, CFG.MAX_FIRE); break;
      case PU.FULLFIRE:  player.fire = CFG.MAX_FIRE; break;
      // Speed stacks, but on a single shared clock that a fresh pickup resets.
      case PU.SPEED:
        player.speed = Math.min(player.speed + CFG.SPEED_STEP, CFG.MAX_SPEED);
        player.speedT = CFG.SPEED_DURATION;
        break;
      case PU.KICK:      player.kick = true; break;
      case PU.PUNCH:     player.punch = true; break;
      case PU.GLOVE:     player.glove = true; break;
      case PU.REMOTE:    player.remote = true; break;
      case PU.PIERCE:    player.pierce = true; break;
      case PU.BOMBPASS:  player.bombPass = true; break;
      case PU.BLOCKPASS: player.blockPass = true; break;
      case PU.SHIELD:    player.shield = true; break;
      case PU.MINE:      player.mine = true; break;
      case PU.SKULL:     player.applyCurse(); break;
    }
    return this.def.label;
  }

  dispose() {
    this.mesh.traverse(o => { if (o.isMesh) o.geometry.dispose(); });
    this.mat.dispose();
    World.scene.remove(this.mesh);
  }
}


/* ==== 50-ai.js ==================================================== */
/* ============================================================================
   SECTION 50 — AI BOTS
   A danger-map bot: survive first, then break crates, then hunt. Bots fill
   every seat that has no human in it, so a round is always four players.
   ========================================================================== */

const AI = (function () {
  const DIRS = [{ x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }];
  const SAFE = 999;

  // Difficulty presets: how quickly a bot reconsiders, and how often it blunders
  // Aggression comes from think rate and hunger to attack — NEVER from cutting
  // the safety margin. Every tier keeps a generous escape slack, because a bot
  // that blows itself up is not difficult, it is just bad.
  // Would this item actually change anything for this bot? Walking across the
  // arena for a Kick you already own, or a Bomb Up you cannot use, is the most
  // obviously silly version of pick-up obsession.
  function wantsPickup(bot, id) {
    switch (id) {
      case PU.BOMB:  return bot.maxBombs < CFG.MAX_BOMBS;
      case PU.FIRE:  return bot.fire < CFG.MAX_FIRE;
      case PU.KICK:  return !bot.kick;
      // Speed is temporary, so it is worth taking unless already boosted and capped
      case PU.SPEED: return (bot.speedT || 0) <= 0 || bot.speed < CFG.MAX_SPEED;
      default:       return true;
    }
  }

  const TIERS = {
    // greed = chance of even considering a pick-up detour on a given repath.
    // greedRange = how far it will go for one, in tiles.
    // ALL THREE TIERS COME DOWN, because Easy was still a fight. The pass
    // before this one only softened Easy; this one moves every tier, so Normal
    // is what Easy used to be and Hard is roughly the old Normal.
    //
    // EASY IS FOR SOMEONE HALF-WATCHING THE TELLY: it thinks once every 0.4s,
    // comes looking for you one decision in ten, leaves nearly two seconds
    // between bombs, and misreads the board a third of the time.
    //
    // escapeSlack IS DELIBERATELY UNTOUCHED on all three. Blundering is about
    // picking a poor route, never about walking into fire — a bot that kills
    // itself is not gentle, just broken, and the difficulty has to come from
    // how hard it comes after YOU.
    // PERSONA IS WHAT THE BOT WANTS, the numbers are only how fast it goes
    // about it. Three tiers of the same behaviour at different reaction speeds
    // reads as one opponent with a difficulty slider; three different opponents
    // read as three opponents. None of these touches escapeSlack.
    //
    //   coward   — keeps away from people, farms crates, fights only if cornered
    //   scrapper — the game's existing behaviour: opportunistic, takes what is going
    //   bully    — comes at you, and bombs to cut your escapes rather than to hit you
    easy:    { persona: 'coward',   think: 0.40, blunder: 0.34, hunt: 0.10, escapeSlack: 0.50, repath: 0.10, bombGap: 1.80, greed: 0.12, greedRange: 2, shy: 4 },
    normal:  { persona: 'scrapper', think: 0.14, blunder: 0.06, hunt: 0.48, escapeSlack: 0.52, repath: 0.22, bombGap: 0.60, greed: 0.34, greedRange: 4 },
    hard:    { persona: 'bully',    think: 0.07, blunder: 0.02, hunt: 0.80, escapeSlack: 0.55, repath: 0.30, bombGap: 0.28, greed: 0.58, greedRange: 5 },
  };

  // A bot must survive its own opening. Until it has laid this many bombs it
  // plays strictly safe: bigger margins, no gambles, no random scrambling.
  // ONE bomb, not three. The guarantee exists so a bot cannot blow itself up
  // before the round has really started — an opening suicide looks broken rather
  // than beatable. Past that first bomb it is on its own, and it can and will
  // make the same mistakes you do. Three bombs of immunity made the early game
  // feel like the bots were untouchable.
  const SAFE_OPENING_BOMBS = 1;
  const OPENING_EXTRA_SLACK = 0.35;
  // Grid movement auto-centres on every turn, so a cornered route genuinely
  // takes longer than "one tile per tile". Budget for it or bots arrive late.
  const TRAVEL_FACTOR = 1.45;
  // Safety slack on an opening escape, in SECONDS — not a fraction of the fuse.
  // A fraction has to serve two jobs at once and does neither: tight enough to
  // stop early self-kills, it also blocks legitimate 3-tile escapes, so the
  // bots stop bombing, crates never clear and every round grinds to sudden
  // death (measured: 0.5 at a 1.8s fuse took the mean round from 52s to 126s
  // with 100% sudden death). Loose enough to keep them bombing, early
  // self-kills tripled. The slack is really a reaction-time cushion, and
  // reaction time does not scale with the fuse — so it is a constant.
  const OPENING_SAFETY = 0.8;    // seconds of cushion beyond the travel time

  function attach(player, level) {
    player.ai = {
      cfg: TIERS[level] || TIERS.normal,
      level: level || 'normal',
      timer: Math.random() * 0.1,
      path: [],
      wantBomb: false,
      dir: { x: 0, y: 0 },
      fleeing: false,
      bombsLaid: 0,          // counts up as Game confirms each placement
      hold: false,           // parked until its own blast has cleared
      idle: 0,               // seconds with nowhere to go — drives the unsticker
      bombCooldown: 0,
      detonate: false,
      shoveCool: 0,          // stop trying to kick a bomb that will not budge
      shoveKey: null,
      shoveT: 0,
      act: null,             // an explicit action this tick: punch, glove, throw
      face: null,            // the direction that action needs to be aimed
      waitT: 0,              // stand still this long, then run the booked route
      actCool: 0,            // gap between explicit actions, so it cannot spam
    };
  }

  // Extra caution while the bot is still in its guaranteed-safe opening
  function slackFor(bot) {
    const base = bot.ai.cfg.escapeSlack;
    return bot.ai.bombsLaid < SAFE_OPENING_BOMBS ? base + OPENING_EXTRA_SLACK : base;
  }
  const isOpening = bot => bot.ai.bombsLaid < SAFE_OPENING_BOMBS;

  // ---- Danger map ---------------------------------------------------------
  // For every tile: seconds until a blast reaches it (SAFE if never).
  // Every tile of a bomb's cross, respecting walls and Pierce
  function blastCells(b) {
    const out = [{ x: b.x, y: b.y }];
    for (const d of DIRS) {
      for (let s = 1; s <= b.fire; s++) {
        const x = b.x + d.x * s, y = b.y + d.y * s;
        const cell = World.cellAt(x, y);
        if (cell === CELL.HARD) break;
        out.push({ x, y });
        if (cell === CELL.SOFT && !b.pierce) break;
      }
    }
    return out;
  }

  function buildDanger(game) {
    const n = CFG.COLS * CFG.ROWS;
    const danger = new Float32Array(n).fill(SAFE);
    // WHEN THE FIRE ON THIS TILE GOES OUT AGAIN.
    //
    // `danger` alone says "this tile burns at t". It cannot say "and it is
    // clear again at t + BLAST_LIFE", so every tile that ever burns reads as
    // lethal FOREVER. Measured over 22 bot-only rounds, that is a third of all
    // self-inflicted deaths: a bot standing one tile from safety, told by its
    // own map that there is nowhere to go, when waiting half a second and
    // stepping through the burnt tile was the answer.
    //
    // A tile is lethal during [danger, clear). Outside that window it is
    // walkable, and a route is allowed to cross it either before the fire
    // arrives or after it has gone.
    const clear = new Float32Array(n);
    // Whose threat is this tile? 0 = nobody, otherwise player index + 1.
    // A bot in its opening is allowed to run through its OWN blast (it has to)
    // but never through somebody else's.
    const owner = new Int8Array(n);
    const idxOf = p => game.players.indexOf(p) + 1;

    game.blasts.forEach(b => {
      b.cells.forEach(c => {
        const i = World.idx(c.x, c.y);
        danger[i] = 0;
        // Fire already burning: it goes out when this blast's life runs out.
        if (b.life > clear[i]) clear[i] = b.life;
        owner[i] = c.owner ? idxOf(c.owner) : 0;
      });
    });

    const live = game.bombs.filter(b => !b.dead && !b.held && !b.flight);

    // WHERE THE BOMB WILL BE, NOT WHERE IT IS. On a conveyor a bomb travels
    // while its fuse burns, so the cross it is going to throw is not the cross
    // under it now. A bot that reads the current tile walks into a blast that
    // arrived after it did — which is precisely how a themed map makes bots
    // look stupid.
    //
    // Both crosses are marked, current and projected: a belt can be blocked, and
    // being wrong in the direction of caution costs a bot nothing.
    const beltDrift = (b) => {
      let x = b.x, y = b.y;
      let budget = Math.max(0, b.remote ? 1.2 : b.fuse) * CFG.BELT_SPEED;
      for (let n = 0; n < 12 && budget >= 1; n++) {
        const belt = World.beltAt(x, y);
        if (!belt) break;
        const nx = x + belt.x, ny = y + belt.y;
        // Checked against the grid directly rather than through Game: the AI is
        // handed the game's STATE object, not its module, so only what that
        // state carries is in scope here.
        if (World.cellAt(nx, ny) !== CELL.EMPTY) break;
        if (game.bombAt(World.key(nx, ny))) break;
        x = nx; y = ny; budget -= 1;
      }
      return (x === b.x && y === b.y) ? null : { x, y, fire: b.fire, pierce: b.pierce };
    };

    // Effective fuse per bomb. A bomb sitting inside another bomb's cross goes
    // off when that one does — modelling this is what stops a bot planning a
    // 2.5-second escape from a bomb that a chain reaction detonates in 0.4.
    const eff = live.map(b => b.isMine ? SAFE : (b.remote ? 1.2 : Math.max(b.fuse, 0)));
    const cells = live.map(b => {
      const own = blastCells(b);
      const drift = beltDrift(b);
      return drift ? own.concat(blastCells(drift)) : own;
    });
    for (let pass = 0; pass < 4; pass++) {
      let changed = false;
      for (let i = 0; i < live.length; i++) {
        if (eff[i] >= SAFE) continue;
        for (let j = 0; j < live.length; j++) {
          if (i === j) continue;
          if (eff[i] >= eff[j]) continue;
          // bomb j sits in bomb i's blast, so it detonates when i does
          if (cells[i].some(c => c.x === live[j].x && c.y === live[j].y)) {
            eff[j] = eff[i];
            changed = true;
          }
        }
      }
      if (!changed) break;
    }

    live.forEach((b, i) => {
      // A mine has no timer: only the tile it sits on is treated as lethal,
      // because it will not go off until somebody stands there.
      if (b.isMine) {
        const idx = World.idx(b.x, b.y);
        if (0.5 < danger[idx]) { danger[idx] = 0.5; owner[idx] = idxOf(b.owner); }
        // A mine has no fuse, so nothing about it ever "passes" — it stays
        // lethal until somebody sets it off. Deliberately no clear time.
        if (clear[idx] < SAFE) clear[idx] = SAFE;
        return;
      }
      const t = eff[i];
      cells[i].forEach(c => {
        const idx = World.idx(c.x, c.y);
        if (t < danger[idx]) { danger[idx] = t; owner[idx] = idxOf(b.owner); }
        // The window closes BLAST_LIFE after the fire arrives. Take the latest
        // of everything covering this tile: two bombs a beat apart make one
        // long window, not two short ones with a gap nobody could use.
        const ends = t + CFG.BLAST_LIFE;
        if (ends > clear[idx]) clear[idx] = ends;
      });
    });

    game.dangerOwner = owner;
    game.dangerClear = clear;
    return danger;
  }

  // Is a tile lethal for a bot that arrives at `arrive` and leaves at `leave`?
  // This is the whole point of the clear map: a tile that burns at 0.3 and is
  // out by 0.82 is perfectly walkable at 1.0.
  function lethalWindow(game, i, arrive, leave, slack) {
    const start = game.dangerMap[i];
    if (start >= SAFE) return false;                 // never burns
    const end = game.dangerClear ? game.dangerClear[i] : SAFE;
    // Overlap test between [arrive, leave] and the lethal window, with the
    // safety margin applied to the FRONT edge only. Arriving early is what
    // kills; leaving late merely wastes time.
    // WHICH EDGE THE MARGIN IS MEASURED FROM MATTERS, and getting it wrong is
    // invisible. Judging on `leave` — the moment the bot steps off the tile —
    // is the honest occupancy model, and it quietly adds a whole tile-time
    // (0.37s at base speed) to the requirement on every step of every route.
    // Measured on Hard, that one word took self-kills per round from 1.43 to
    // 1.73: routes the bot could make were refused, so it stood still instead,
    // and standing still is how these bots die.
    //
    // Lethality is judged on the CENTRE TILE (invariant 13), so the moment that
    // actually counts is arrival. The half-tile of travel that hides is already
    // paid for by `lag`.
    if (arrive + slack <= start) return false;       // gone before it lands
    if (TUNE.intervals && arrive >= end) return false;  // arrived after it went out
    return true;
  }

  // Is this tile threatened by somebody other than us?
  function foreignThreat(game, bot, x, y) {
    const i = World.idx(x, y);
    if (game.dangerMap[i] >= SAFE) return false;
    const own = game.dangerOwner ? game.dangerOwner[i] : 0;
    return own !== game.players.indexOf(bot) + 1;
  }

  // Would dropping a bomb here leave the bot a way out? Returns the escape
  // route itself so the bot can start running on the very same tick.
  function hasEscape(game, bot, danger) {
    const bx = bot.tileX, by = bot.tileY;
    const sim = Float32Array.from(danger);
    const virtual = { x: bx, y: by, fire: bot.effFire, pierce: bot.pierce };
    // The bomb we are about to drop could itself be set off early by any bomb
    // already covering this tile, so assume the worst of the two.
    const soonest = Math.min(CFG.BOMB_FUSE, danger[World.idx(bx, by)]);
    blastCells(virtual).forEach(c => {
      const i = World.idx(c.x, c.y);
      if (soonest < sim[i]) sim[i] = soonest;
    });
    const found = findEscape(game, bot, sim, bx, by, true);
    // A best-effort route is fine when you are already in trouble. It is NOT a
    // reason to add a bomb to the situation.
    if (!found || !found.safe) return null;
    const route = found.path;

    // ROBUSTNESS, not merely feasibility. Measured over 22 bot-only rounds, the
    // median bot that killed itself was stuck with 1.63s of a 1.8s fuse still
    // to run — in other words it was trapped almost the instant it laid the
    // bomb, by a board that had moved on since the escape was proven. A route
    // that exists only until somebody else's bomb lands in it is not an escape,
    // it is a coincidence.
    //
    // So: the first step of the route must not be the ONLY way out. Block it
    // and look again; if there is no second answer, do not lay the bomb.
    if (TUNE.robustBomb && route.length > 1) {
      const first = route[0];
      const blocked = Float32Array.from(sim);
      blocked[World.idx(first.x, first.y)] = 0;      // pretend that tile is gone
      const alt = findEscape(game, bot, blocked, bx, by, true);
      if (!alt || !alt.safe) {
        // One-way corridor. Acceptable only when nobody is close enough to
        // close it — otherwise this is exactly the death being designed out.
        if (enemyNear(game, bot, 4)) return null;
      }
    }

    // During the opening, insist on a route that clears the blast with room
    // to spare rather than one that only just works.
    if (isOpening(bot)) {
      const perTile = TRAVEL_FACTOR / Math.max(bot.effSpeed || bot.speed, 0.5);
      // Short, quick and finishing somewhere with nothing pending at all
      if (route.length > 4) return null;
      // The opening margin is a FRACTION of the fuse, not a fixed second.
      // Hard-coded, shortening the fuse eats the whole travel budget and the
      // bots either stop placing bombs or start misjudging escapes.
      if ((route.length + 0.5) * perTile + OPENING_SAFETY > CFG.BOMB_FUSE) return null;
      const end = route[route.length - 1];
      if (danger[World.idx(end.x, end.y)] < SAFE) return null;
    }
    return route;
  }

  // ---- Pathfinding --------------------------------------------------------
  function passable(game, x, y, ignoreBombAt, alsoIgnore) {
    if (World.cellAt(x, y) !== CELL.EMPTY) return false;
    const k = World.key(x, y);
    if (!game.bombAt(k)) return true;
    if (ignoreBombAt && ignoreBombAt === k) return true;
    // A bomb we are about to shove out of the way is not in the way.
    if (alsoIgnore && alsoIgnore.has(k)) return true;
    return false;
  }

  // ---- Tunables, so each change can be measured on its own ----------------
  // Every one of these was a hypothesis about why bots kill themselves. Rather
  // than shipping the lot and hoping, each is a switch the measurement harness
  // can flip, and the values below are the ones that won on the numbers.
  const TUNE = {
    // TRAVEL IS A MARGIN, NOT A TRAVEL TIME. Measured directly, a straight tile
    // takes 0.997/speed seconds — so 1.45 over-charges every move by nearly
    // half. Correcting it to the true figure made bots measurably WORSE (self
    // kills per round 1.05 -> 1.35 over 20 rounds), because the surcharge was
    // never really modelling travel: it is the cushion that covers an
    // approximate fuse, a chain nobody predicted and a decision taken up to
    // `think` seconds ago. Left at 1.45, and now labelled honestly.
    travel: 1.45,
    turnCost: 0,        // folded into `travel`; kept so a real turn model can be tried
    // FIRE PASSES — AND THE BOTS CANNOT TIME IT. Modelling each tile's danger as
    // a window that opens and closes, so a bot can walk through a tile once its
    // flame has burnt out, is correct about the game and a disaster in practice:
    // self-kills per round went 0.95 -> 2.6. A blast lives 0.52s and a bot
    // crosses a tile in 0.37s, so the gap it is aiming at is barely wider than
    // its own stride, and every approximation in the fuse estimate lands inside
    // it. The margin that would make it safe is bigger than the opportunity.
    // Kept, switchable, and OFF — the mechanism works, the timing is not there.
    intervals: false,
    waits: false,       // standing still to let a fire pass: same finding, worse
    bestEffort: false,  // 0.95 -> 1.1, and rounds that never end
    moveBeatsStanding: false,
    relaxedPass: false, // 95% of rounds reached sudden death: they stop bombing
    // THE TWO THAT WON.
    beltCost: true,     // price a conveyor into the escape budget
    robustBomb: true,   // refuse a bomb whose only escape is a one-way corridor
    escapeActions: true,// punch/glove/kick a blocking bomb out of the way
  };

  // ---- The escape search --------------------------------------------------
  //
  // Time-ordered, not step-ordered. The old version was a plain BFS with one
  // flat per-tile cost, which has two faults that cost bots their lives:
  //
  //  * TRAVEL_FACTOR charged every tile the 45% surcharge that only a TURN
  //    actually costs, so a straight three-tile sprint — the commonest escape
  //    there is — was priced as though it were a dog-leg and refused.
  //  * fewest STEPS is not soonest ARRIVAL once tiles cost different amounts,
  //    so the route it picked was not the one that got out first.
  //
  // Costs are now per edge: going straight on costs a tile, turning costs a
  // tile plus the re-centring the grid movement makes you pay for it.
  function edgeCost(perTile, fromDir, d) {
    const turning = fromDir && (fromDir.x !== d.x || fromDir.y !== d.y);
    return perTile * (TUNE.travel + (turning ? TUNE.turnCost : 0));
  }

  // ON ICE A STEP IS NOT A TILE, IT IS A WHOLE RUN. The pathfinder's neighbour
  // function has to change shape to match, or every plan it makes is wrong from
  // its first move: measured on the Frozen Lake with one-tile steps, bots killed
  // themselves 2.9 times a round against 1.0 on a plain floor, and rounds ended
  // in twelve seconds.
  //
  // Returns where the slide ends AND every tile it crosses, so the caller can
  // check the whole run for fire rather than only where it stops.
  function slidePath(game, x, y, d, ignore, freed) {
    const tiles = [];
    let cx = x, cy = y;
    for (let n = 0; n < 20; n++) {
      const nx = cx + d.x, ny = cy + d.y;
      if (!passable(game, nx, ny, ignore, freed)) break;
      cx = nx; cy = ny;
      tiles.push({ x: cx, y: cy });
      // You stop when you run off the ice — that is where grip comes back.
      if (World.ruleAt(cx, cy) !== RULE.ICE) break;
    }
    return tiles.length ? { x: cx, y: cy, tiles } : null;
  }

  // One pass of the search, starting `delay` seconds from now. A delay means
  // standing still first — which is how you let a fire burn out and then walk
  // through the tile it was on.
  function searchEscape(game, bot, danger, sx, sy, delay, slack, strict, freed) {
    const startKey = World.key(sx, sy);
    const ignore = startKey;
    const perTile = 1 / Math.max(bot.effSpeed || bot.speed, 0.5);
    // Lethality is judged on the centre tile, so half a tile of travel is
    // "free" distance the bot has not really covered yet. Pay for it up front.
    const lag = perTile * 0.5;

    // Standing still is only an option while the tile we are standing on is
    // not going to catch fire during the wait.
    if (delay > 0 && lethalWindow(game, World.idx(sx, sy), 0, delay, slack)) return null;

    // THE ROUTE TRAVELS WITH THE NODE, rather than being reconstructed from a
    // map of predecessors afterwards. A predecessor map is the usual way to do
    // this and it is wrong here: a node that has already been expanded can be
    // relaxed again at a lower cost once waiting is allowed, which rewrites its
    // predecessor and can close a loop — A points at B, B points back at A —
    // and walking that loop back is an infinite one. It hung the search dead.
    // The grid is 15x13, so carrying a short array per node costs nothing worth
    // measuring and the failure mode simply cannot exist.
    const best = new Map([[startKey, delay]]);
    // Small grid, so an insertion-sorted frontier is cheaper than a heap and a
    // great deal easier to read.
    const queue = [{ x: sx, y: sy, t: delay, dir: null, steps: 0, path: [] }];
    let found = null, fallback = null, fallbackScore = -1;

    while (queue.length) {
      const cur = queue.shift();
      const i = World.idx(cur.x, cur.y);
      if (cur.steps > 0 && danger[i] >= SAFE) {
        found = cur.path;
        break;
      }
      // BEST EFFORT. If nothing permanently safe is reachable, the bot should
      // still go to whichever tile buys it the most time rather than standing
      // where it is and dying on schedule. Standing still was measured as 96%
      // of self-inflicted deaths.
      if (cur.steps > 0 && TUNE.bestEffort) {
        const score = danger[i] - cur.t;
        if (score > fallbackScore) { fallbackScore = score; fallback = cur.path; }
      }
      if (cur.steps > 14) continue;

      // A PAD IS A DOOR, and the search has to treat it as one. Two tiles at
      // opposite ends of the board are adjacent if a pad joins them, and a bot
      // that cannot see that will stand on an escape hatch and burn.
      const steps = DIRS.slice();
      const twin = World.padTwin(cur.x, cur.y);
      if (twin) steps.push({ x: twin.x - cur.x, y: twin.y - cur.y, pad: true });

      const onIce = World.ruleAt(cur.x, cur.y) === RULE.ICE;

      for (const d of steps) {
        let nx, ny, crossed, run = 1;
        if (onIce && !d.pad) {
          const slide = slidePath(game, cur.x, cur.y, d, ignore, freed);
          if (!slide) continue;
          nx = slide.x; ny = slide.y; crossed = slide.tiles; run = slide.tiles.length;
        } else {
          nx = cur.x + d.x; ny = cur.y + d.y;
          if (!passable(game, nx, ny, ignore, freed)) continue;
          crossed = [{ x: nx, y: ny }];
        }
        const k = World.key(nx, ny);
        // In its opening a bot will not cross anybody else's blast, at any
        // timing. Its own it must cross — that is what escaping means.
        if (strict && crossed.some(c => foreignThreat(game, bot, c.x, c.y))) continue;
        // A belt on the tile being left either helps or fights, and the escape
        // budget has to know which: a three-tile run with the current and the
        // same run against it are not the same escape.
        // Crossing a pad costs one tile-time, not the distance it covers.
        let stepCost = d.pad ? perTile : edgeCost(perTile, cur.dir, d);
        if (onIce && !d.pad) stepCost = perTile * run;   // no turn cost mid-slide
        if (TUNE.beltCost) {
          const belt = World.beltAt(cur.x, cur.y);
          if (belt) {
            const along = belt.x * d.x + belt.y * d.y;
            const eff = Math.max(0.6, (bot.effSpeed || bot.speed) + along * CFG.BELT_SPEED);
            stepCost *= (bot.effSpeed || bot.speed) / eff;
          }
        }
        const arrive = cur.t + stepCost + lag;
        // EVERY TILE OF THE RUN, not just where it ends. A slide that finishes
        // somewhere safe having crossed a blast on the way is not an escape, and
        // checking only the destination cannot tell the two apart.
        let burned = false;
        for (let ci = 0; ci < crossed.length; ci++) {
          const at = cur.t + perTile * (ci + 1) + lag;
          if (lethalWindow(game, World.idx(crossed[ci].x, crossed[ci].y), at, at + perTile, slack)) {
            burned = true; break;
          }
        }
        if (burned) continue;
        if (best.has(k) && best.get(k) <= arrive) continue;
        best.set(k, arrive);
        const node = { x: nx, y: ny, t: arrive, dir: d.pad ? null : d, steps: cur.steps + 1,
                       path: cur.path.concat([{ x: nx, y: ny }]) };
        let at = queue.length;
        while (at > 0 && queue[at - 1].t > arrive) at--;
        queue.splice(at, 0, node);
      }
    }
    return found ? { path: found, safe: true }
         : fallback ? { path: fallback, safe: false, score: fallbackScore }
         : null;
  }

  // Escape to a tile that never burns if one can be reached — waiting a beat
  // first if that is what it takes — and otherwise to whichever tile buys the
  // most time. Returns { path, wait, safe }.
  const WAIT_TRIES = [0, 0.22, 0.48, 0.75];

  function findEscape(game, bot, danger, sx, sy, virtualBombHere, freed) {
    const slack = slackFor(bot);
    const strict = isOpening(bot);
    let best = null;
    for (const delay of (TUNE.waits ? WAIT_TRIES : [0])) {
      const r = searchEscape(game, bot, danger, sx, sy, delay, slack, strict, freed);
      if (r && r.safe) return { path: r.path, wait: delay, safe: true };
      if (delay === 0 && r) best = r;      // keep the no-wait best effort
    }
    // Nothing clean. A relaxed pass with the margin cut to a reaction-time
    // minimum, because at this point the alternative is standing still and
    // dying — not a safer option, just a stiller one.
    if (!TUNE.relaxedPass) return best ? { path: best.path, wait: 0, safe: false } : null;
    const last = searchEscape(game, bot, danger, sx, sy, 0, Math.min(slack, 0.12), strict, freed);
    if (last && last.safe) return { path: last.path, wait: 0, safe: true };
    if (last && (!best || (last.score || 0) > (best.score || 0))) best = last;
    return best ? { path: best.path, wait: 0, safe: false } : null;
  }

  // BFS toward the first tile matching a predicate, avoiding danger
  function findTarget(game, bot, danger, test, maxSteps) {
    const strict = isOpening(bot);
    const startKey = World.key(bot.tileX, bot.tileY);
    const prev = new Map();
    const seen = new Set([startKey]);
    const queue = [{ x: bot.tileX, y: bot.tileY, steps: 0 }];
    let head = 0;
    const perTile = 1 / Math.max(bot.effSpeed || bot.speed, 0.5);

    while (head < queue.length) {
      const cur = queue[head++];
      if (cur.steps > 0 && test(cur.x, cur.y)) {
        return reconstruct(prev, World.key(cur.x, cur.y), startKey);
      }
      if (cur.steps > (maxSteps || 22)) continue;
      for (const d of DIRS) {
        const nx = cur.x + d.x, ny = cur.y + d.y;
        const k = World.key(nx, ny);
        if (seen.has(k)) continue;
        if (!passable(game, nx, ny, startKey)) continue;
        const risk = danger[World.idx(nx, ny)];
        if (strict && risk < SAFE) continue;
        if (risk < (cur.steps + 1) * perTile + 0.9) continue;
        seen.add(k);
        prev.set(k, World.key(cur.x, cur.y));
        queue.push({ x: nx, y: ny, steps: cur.steps + 1 });
      }
    }
    return null;
  }

  // Is a route we are already executing still survivable? This uses raw
  // feasibility (can we physically make it?), NOT the cautious margin used
  // when choosing a route in the first place.
  function routeViable(game, bot, danger, path) {
    if (!path.length) return false;
    const perTile = 1 / Math.max(bot.effSpeed || bot.speed, 0.5);
    const MARGIN = 0.12;
    let t = 0, dir = null;
    for (let i = 0; i < path.length; i++) {
      const tile = path[i];
      const prevTile = i ? path[i - 1] : { x: bot.tileX, y: bot.tileY };
      const d = { x: Math.sign(tile.x - prevTile.x), y: Math.sign(tile.y - prevTile.y) };
      // One path entry may be a whole slide, so it costs its real distance.
      const span = Math.abs(tile.x - prevTile.x) + Math.abs(tile.y - prevTile.y);
      t += edgeCost(perTile, dir, d) + perTile * Math.max(0, span - 1);
      dir = d;
      if (!passable(game, tile.x, tile.y, null)) return false;
      const arrive = t + perTile * 0.5;
      if (lethalWindow(game, World.idx(tile.x, tile.y), arrive, arrive + perTile, MARGIN)) return false;
    }
    const end = path[path.length - 1];
    return danger[World.idx(end.x, end.y)] >= SAFE;
  }

  function reconstruct(prev, endKey, startKey) {
    const path = [];
    let k = endKey;
    while (k && k !== startKey) {
      const [x, y] = k.split(',').map(Number);
      path.unshift({ x, y });
      k = prev.get(k);
    }
    return path.length ? path : null;
  }

  // ---- Making a way out ---------------------------------------------------
  // Cornered with no route the search can find, the answer is often not a
  // better route but a bomb that should not be there. Measured over 22
  // bot-only rounds: 44% of the bots that killed themselves had NO safe tile
  // reachable at all, and in more than half of those a bomb was standing
  // directly beside them. Walls you cannot argue with; bombs you can move.
  //
  // In preference order, because they differ in how completely they solve it:
  //   Power Glove — the bomb leaves the board entirely, in your hands
  //   Punch       — three tiles away, and it keeps its fuse
  //   Kick        — slides until it hits something, so it needs room behind it
  function clearTheWay(game, bot, danger) {
    const a = bot.ai;
    const here = World.key(bot.tileX, bot.tileY);

    // Already holding one? Get rid of it — see throwOrBust below.
    if (bot.carrying) { a.act = 'throw'; a.face = bestThrowDir(game, bot); return true; }

    // EVERY ONE OF THESE HAS TO EARN ITS PLACE. The first version simply shoved
    // whatever bomb was nearest, on the reasoning that a bomb out of the way is
    // an improvement. Measured, it was not: on Hard, where bots bomb hardest and
    // are cornered most, blind shoving took self-kills per round from 1.43 to
    // 1.83 — a bot walking INTO a bomb to kick it is a bot walking towards the
    // thing that is about to kill it, and half the time the shove opened
    // nothing.
    //
    // So an action is only taken when removing that bomb demonstrably produces
    // an escape the bot does not otherwise have. The bomb's DANGER is left on
    // the map while we check, which is deliberately pessimistic: it may well
    // have slid clear by the time the fuse runs out, and a route that survives
    // the assumption that it has not is a route worth taking.
    const opens = (key) => {
      const freed = new Set([key]);
      const r = findEscape(game, bot, danger, bot.tileX, bot.tileY, false, freed);
      return !!(r && r.safe);
    };

    if (bot.glove && game.bombAt(here) && opens(here)) { a.act = 'glove'; return true; }

    for (const d of DIRS) {
      const bx = bot.tileX + d.x, by = bot.tileY + d.y;
      const key = World.key(bx, by);
      const bomb = game.bombAt(key);
      if (!bomb || bomb.flight || bomb.held) continue;
      if (!opens(key)) continue;
      if (bot.punch) { a.act = 'punch'; a.face = d; return true; }
      // KICK IS A ROUTE, NOT AN ACTION — walking into the bomb is what kicks it
      // — and that makes it the one option here that can fail silently. If the
      // shove does not take, the bot keeps walking into the same bomb, gets
      // nowhere, and reads as frozen: it put a 19.5s standstill into a suite
      // whose limit is 10.
      //
      // Two guards. Ask the question the KICK will ask (`bombCanEnter`), not a
      // lookalike, and give up on shoving for a moment if it did not work, so a
      // bot that cannot move a bomb goes and does something else instead.
      if (bot.kick && a.shoveCool <= 0 && Game.bombCanEnter(bx + d.x, by + d.y, bomb)) {
        a.path = [{ x: bx, y: by }];      // walking into it IS the kick
        a.shoveKey = key;
        a.shoveT = 0.5;
        return true;
      }
    }
    return false;
  }

  // Which way to throw a carried bomb: at the nearest rival if one is roughly
  // in line, otherwise simply away from where we are standing.
  function bestThrowDir(game, bot) {
    let best = null, bestScore = -Infinity;
    for (const d of DIRS) {
      const tx = bot.tileX + d.x * CFG.THROW_TILES, ty = bot.tileY + d.y * CFG.THROW_TILES;
      if (World.cellAt(tx, ty) === CELL.HARD) continue;
      let score = 0;
      game.players.forEach(p => {
        if (!p.alive || p === bot) return;
        const dist = Math.abs(p.tileX - tx) + Math.abs(p.tileY - ty);
        if (dist <= 2) score += 10 - dist;
      });
      // Never lob it onto our own head
      score -= Math.max(0, 3 - (Math.abs(d.x) + Math.abs(d.y)) * CFG.THROW_TILES);
      if (score > bestScore) { bestScore = score; best = d; }
    }
    return best || DIRS[0];
  }

  // A CARRIED BOMB IS INVISIBLE TO THE DANGER MAP. `buildDanger` filters out
  // anything held or in flight, which is correct — a bomb in somebody's hands
  // threatens no tile. But it means a bot holding one is told it is perfectly
  // safe right up until the thing goes off in its face. Nothing could hit this
  // before, because bots never picked a bomb up. They do now, so this is the
  // guard that has to exist alongside that.
  function throwOrBust(game, bot) {
    const b = bot.carrying;
    if (!b) return false;
    const flight = CFG.FLIGHT_TIME + 0.25;
    if (b.fuse <= flight) {
      bot.ai.act = 'throw';
      bot.ai.face = bestThrowDir(game, bot);
      return true;
    }
    return false;
  }

  // ---- Persona ------------------------------------------------------------
  // How far is the nearest living rival?
  function enemyDistance(game, bot, x, y) {
    let best = Infinity;
    game.players.forEach(p => {
      if (!p.alive || p === bot) return;
      const d = Math.abs(p.tileX - x) + Math.abs(p.tileY - y);
      if (d < best) best = d;
    });
    return best;
  }

  // THE COWARD. Walks away from people. Not a retreat to a corner — it heads
  // for the first tile that puts real distance between it and the nearest
  // rival, and goes back to opening crates once it has room.
  function fleeFromEnemies(game, bot, danger) {
    const near = enemyDistance(game, bot, bot.tileX, bot.tileY);
    const want = near + 3;
    return findTarget(game, bot, danger,
      (x, y) => enemyDistance(game, bot, x, y) >= want, 10);
  }

  // THE BULLY. Rather than walking onto the tile you are standing on and
  // bombing there — which is what "hunt" does, and what you dodge without
  // thinking — it looks for the tile where a bomb takes your ROUTES away.
  //
  // The scoring is the escape search run from somebody else's position, which
  // already exists, so this costs a handful of small searches on a 15x13 grid
  // and no new algorithm at all.
  function escapeCount(game, victim, danger) {
    let n = 0;
    const seen = new Set([World.key(victim.tileX, victim.tileY)]);
    const q = [{ x: victim.tileX, y: victim.tileY, s: 0 }];
    let head = 0;
    while (head < q.length) {
      const c = q[head++];
      if (c.s > 6) continue;
      for (const d of DIRS) {
        const nx = c.x + d.x, ny = c.y + d.y, k = World.key(nx, ny);
        if (seen.has(k)) continue;
        if (!passable(game, nx, ny, null)) continue;
        seen.add(k);
        if (danger[World.idx(nx, ny)] >= SAFE) n++;
        q.push({ x: nx, y: ny, s: c.s + 1 });
      }
    }
    return n;
  }

  // Would a bomb on THIS tile shut the victim in? Returns how many safe tiles
  // they would have left — lower is better for the bully.
  function boxInScore(game, bot, victim, danger, x, y) {
    const sim = Float32Array.from(danger);
    const virtual = { x, y, fire: bot.effFire, pierce: bot.pierce };
    blastCells(virtual).forEach(c => {
      const i = World.idx(c.x, c.y);
      if (CFG.BOMB_FUSE < sim[i]) sim[i] = CFG.BOMB_FUSE;
    });
    return escapeCount(game, victim, sim);
  }

  // ---- Decision -----------------------------------------------------------
  function think(game, bot) {
    const a = bot.ai;
    const danger = game.dangerMap;
    const here = World.idx(bot.tileX, bot.tileY);
    const inDanger = danger[here] < SAFE;

    a.wantBomb = false;
    a.act = null;
    a.face = null;

    // 0. Holding a live bomb always outranks everything else on the board.
    if (throwOrBust(game, bot)) return;

    // 1. Get out of the fire — this always wins over anything else
    if (inDanger) {
      a.fleeing = true;

      // Already running a route that still gets us out? Then keep running it.
      // Re-planning every tick was the old killer: the selection margin gets
      // stricter as our own fuse burns down, so a bot would throw away a route
      // it was halfway through and end up stranded in the blast.
      if (a.path.length && routeViable(game, bot, danger, a.path)) return;

      const escape = findEscape(game, bot, danger, bot.tileX, bot.tileY, false);
      if (escape) { a.path = escape.path; a.waitT = escape.wait || 0; return; }

      // Nothing at all came back — not even a best-effort tile. Before giving
      // up, see whether the way out can be MADE rather than found: a bomb in
      // the corridor can be shoved, punched or picked up, and 54% of the bots
      // that killed themselves had one standing right beside them.
      if (TUNE.escapeActions && clearTheWay(game, bot, danger)) return;

      // Take the least-bad neighbour: the one that burns latest, and never one
      // that is already on fire.
      const opts = DIRS
        .filter(d => passable(game, bot.tileX + d.x, bot.tileY + d.y, null))
        .map(d => ({ d, risk: danger[World.idx(bot.tileX + d.x, bot.tileY + d.y)] }))
        .filter(o => o.risk > 0.35)
        .sort((p, q) => q.risk - p.risk);
      // MOVING BEATS STANDING unless every neighbour is worse than here. The
      // old rule refused any tile that burned sooner than the one it was on,
      // which reads as caution and measured as 96% of self-inflicted deaths:
      // a bot with 1.2s left declining a tile with 1.0s, then dying on the
      // tile it kept. A tile that burns later than we can leave it is fine.
      if (opts.length && (TUNE.moveBeatsStanding || opts[0].risk > danger[here])) {
        a.path = [{ x: bot.tileX + opts[0].d.x, y: bot.tileY + opts[0].d.y }];
      } else {
        a.path = [];        // genuinely trapped: standing still beats running in
      }
      return;
    }
    a.fleeing = false;
    a.path = a.path || [];

    // 1a. Opening discipline. Until a bot has laid SAFE_OPENING_BOMBS bombs it
    //     will not lay another while its previous one is still live or its
    //     flame is still burning nearby. It keeps MOVING the whole time — it
    //     just does not add a second bomb to a situation it is still escaping.
    //     (Freezing here made bots look broken whenever a player bombed near
    //     them, so holding now suppresses bombing only, never movement.)
    let holding = false;
    if (isOpening(bot) && a.hold) {
      const ownLive = game.bombs.some(b => b.owner === bot && !b.dead);
      holding = ownLive || blastNear(game, bot.tileX, bot.tileY, 1);
      if (!holding) a.hold = false;
    }

    // 1b. Holding remote bombs? Set them off once we are clear and someone
    //     else is not. Without this a remote bot would never explode anything.
    if (bot.remote) {
      const live = game.bombs.filter(b => b.owner === bot && b.remote && !b.dead && !b.held && !b.flight);
      if (live.length) {
        const safeHere = danger[here] >= SAFE;
        const worthIt = live.some(b => enemyInBlast(game, bot, b));
        if (safeHere && (worthIt || live.length >= bot.maxBombs)) {
          a.detonate = true;
          return;
        }
      }
    }

    // 2. Worth dropping a bomb here? Only ever with a proven way out, and the
    //    bot starts running along that exact route on the same tick.
    if (!holding && a.bombCooldown <= 0 && bot.activeBombs < bot.maxBombs &&
        bot.canBomb && Math.random() > a.cfg.blunder) {
      const foreignNear = isOpening(bot) && DIRS.concat([{ x: 0, y: 0 }])
        .some(d => foreignThreat(game, bot, bot.tileX + d.x, bot.tileY + d.y));
      // A COWARD DOES NOT PICK FIGHTS. It bombs crates, and it bombs a player
      // only when one is close enough that walking away is no longer on offer.
      const coward = a.cfg.persona === 'coward';
      const aggressive = coward
        ? enemyNear(game, bot, 1)
        : (enemyInLine(game, bot) || enemyNear(game, bot, 2));
      const useful = !foreignNear && (adjacentSoft(bot) || aggressive);
      // In the opening a bot will not bomb purely to chase a kill — crates only,
      // unless the kill is free. That keeps its first few bombs survivable.
      const allowed = useful;
      if (allowed) {
        const route = hasEscape(game, bot, danger);
        if (route) {
          a.wantBomb = true;
          a.path = route;                       // flee immediately, do not dawdle
          a.bombCooldown = a.cfg.bombGap;
          if (isOpening(bot)) a.hold = true;    // and then sit tight until it is over
          return;
        }
      }
    }

    // 2b. THE COWARD KEEPS ITS DISTANCE — but only once it has done anything
    //     useful where it stands. Placed AHEAD of the bombing rule it made an
    //     Easy bot a pure pacifist: measured over 30 bot-only rounds, 8 deaths
    //     in the whole sample against 33 before, and every single round decided
    //     by the closing walls rather than by anybody. A coward still opens
    //     crates; it just does not go looking for people.
    //
    //     It still has to sit outside the repath dice roll below — an Easy bot
    //     rolls that once every few seconds, and a coward that ambles towards
    //     you for two seconds before remembering to be frightened does not read
    //     as one. Measured at that position: it closed 1.33 tiles rather than
    //     opening any.
    //
    //     Cornered is the exception. With somebody right next to it there is
    //     nowhere to be brave about, so it bombs like anyone else — which the
    //     rule above already does, at range 1, for a coward.
    if (a.cfg.persona === 'coward' && !holding && !enemyNear(game, bot, 1) &&
        enemyNear(game, bot, a.cfg.shy || 4)) {
      const away = fleeFromEnemies(game, bot, danger);
      if (away) { a.path = away; return; }
    }

    // 3. Nothing to blow up here — go somewhere useful
    if (a.path.length === 0 || Math.random() < a.cfg.repath) {
      const wantHunt = Math.random() < a.cfg.hunt;
      let path = null;

      // Pick-ups are opportunistic, not an obsession. This used to run first,
      // unconditionally, across twelve tiles — so every bot beelined for every
      // item on the map the instant it appeared, including ones that would do
      // nothing for it. Three things hold it back now: it only looks some of
      // the time (greed), only nearby (greedRange), and only for something it
      // actually wants.
      if (Math.random() < a.cfg.greed) {
        path = findTarget(game, bot, danger, (x, y) => {
          const item = game.powerUpAt(World.key(x, y));
          return item != null && wantsPickup(bot, item.id);
        }, a.cfg.greedRange);
      }

      // A visible enemy outranks a trinket
      if (path && wantHunt && enemyNear(game, bot, 3)) path = null;

      // THE BULLY hunts the tile that takes your escapes away, not the tile you
      // are standing on. If it can find a spot within a few steps that leaves
      // the nearest rival with fewer ways out than they have now, it goes there
      // — and the ordinary bombing rule above does the rest once it arrives.
      if (!path && wantHunt && a.cfg.persona === 'bully') {
        let victim = null, vd = Infinity;
        game.players.forEach(p => {
          if (!p.alive || p === bot) return;
          const d = Math.abs(p.tileX - bot.tileX) + Math.abs(p.tileY - bot.tileY);
          if (d < vd) { vd = d; victim = p; }
        });
        if (victim && vd <= 7) {
          const now = escapeCount(game, victim, danger);
          let bestTile = null, bestScore = now;
          for (const d of DIRS) {
            const x = victim.tileX + d.x, y = victim.tileY + d.y;
            if (!passable(game, x, y, null)) continue;
            const score = boxInScore(game, bot, victim, danger, x, y);
            if (score < bestScore) { bestScore = score; bestTile = { x, y }; }
          }
          if (bestTile) {
            path = findTarget(game, bot, danger,
              (x, y) => x === bestTile.x && y === bestTile.y, 10);
          }
        }
      }

      if (!path && wantHunt) {
        path = findTarget(game, bot, danger, (x, y) =>
          game.players.some(p => p.alive && p !== bot && p.tileX === x && p.tileY === y), 24);
      }
      if (!path) {
        path = findTarget(game, bot, danger, (x, y) =>
          DIRS.some(d => World.cellAt(x + d.x, y + d.y) === CELL.SOFT), 20);
      }
      if (!path) {
        // Last resort wander, which still respects danger. Walking into a live
        // blast because there was nothing better to do is exactly the kind of
        // self-destruction this bot is not allowed to commit.
        //
        // But a bot must never stand still forever either — that is what made
        // rounds stall out. The longer it has been stuck, the more it is
        // willing to accept, so it always gets moving again eventually.
        const minSafety = a.idle > 6 ? 0.35 : a.idle > 2.5 ? 1.2 : SAFE;
        const relaxed = a.idle > 2.5;
        const opts = DIRS.filter(d => {
          const nx = bot.tileX + d.x, ny = bot.tileY + d.y;
          if (!passable(game, nx, ny, null)) return false;
          if (danger[World.idx(nx, ny)] < minSafety) return false;
          return relaxed || !(isOpening(bot) && foreignThreat(game, bot, nx, ny));
        });
        if (opts.length) {
          const d = opts[(Math.random() * opts.length) | 0];
          path = [{ x: bot.tileX + d.x, y: bot.tileY + d.y }];
        }
      }

      // Walled in with no route anywhere? Blast a way out. After four seconds
      // of being stuck, a bot will bomb an adjacent crate even without a proven
      // escape — a risky move beats a frozen match.
      if (!path && a.idle > 4 && bot.canBomb && bot.activeBombs < bot.maxBombs &&
          adjacentSoft(bot) && danger[here] >= SAFE) {
        a.wantBomb = true;
        a.bombCooldown = 1.2;
      }

      a.path = path || [];
    }
  }

  // Is any live flame within `r` tiles? Used to keep a bot parked until its
  // own explosion has burnt out.
  function blastNear(game, x, y, r) {
    for (const bl of game.blasts) {
      for (let dy = -r; dy <= r; dy++) {
        for (let dx = -r; dx <= r; dx++) {
          if (bl.tiles.has(World.key(x + dx, y + dy))) return true;
        }
      }
    }
    return false;
  }

  function adjacentSoft(bot) {
    return DIRS.some(d => World.cellAt(bot.tileX + d.x, bot.tileY + d.y) === CELL.SOFT);
  }

  // Is any rival standing inside this bomb's cross right now?
  function enemyInBlast(game, bot, bomb) {
    const tiles = [World.key(bomb.x, bomb.y)];
    for (const d of DIRS) {
      for (let s = 1; s <= bomb.fire; s++) {
        const x = bomb.x + d.x * s, y = bomb.y + d.y * s;
        const cell = World.cellAt(x, y);
        if (cell === CELL.HARD) break;
        tiles.push(World.key(x, y));
        if (cell === CELL.SOFT) break;
      }
    }
    return game.players.some(p => p.alive && p !== bot && tiles.indexOf(World.key(p.tileX, p.tileY)) !== -1);
  }

  // Close enough to be worth bombing at: same row/column within blast reach,
  // or simply adjacent. Without this bots circle each other indefinitely.
  function enemyNear(game, bot, r) {
    return game.players.some(p => p.alive && p !== bot &&
      Math.abs(p.tileX - bot.tileX) + Math.abs(p.tileY - bot.tileY) <= r);
  }

  function enemyInLine(game, bot) {
    for (const d of DIRS) {
      for (let s = 1; s <= bot.fire; s++) {
        const x = bot.tileX + d.x * s, y = bot.tileY + d.y * s;
        const cell = World.cellAt(x, y);
        if (cell === CELL.HARD || cell === CELL.SOFT) break;
        if (game.players.some(p => p.alive && p !== bot && p.tileX === x && p.tileY === y)) return true;
      }
    }
    return false;
  }

  // ---- Per-frame steering -------------------------------------------------
  function step(game, bot, dt) {
    const a = bot.ai;
    a.timer -= dt;
    if (a.bombCooldown > 0) a.bombCooldown -= dt;
    if (a.actCool > 0) a.actCool -= dt;
    if (a.shoveCool > 0) a.shoveCool -= dt;
    // Did the shove actually shift anything? If the bomb is still sitting where
    // it was when the attempt ran out, stop trying it for a couple of seconds.
    if (a.shoveT > 0) {
      a.shoveT -= dt;
      if (a.shoveT <= 0) {
        if (a.shoveKey && game.bombAt(a.shoveKey)) { a.shoveCool = 2.0; a.path = []; }
        a.shoveKey = null;
      }
    }

    // A booked wait: stand still and let a fire burn out, then run. The search
    // only ever returns a wait it has already proved this tile survives.
    if (a.waitT > 0) {
      a.waitT -= dt;
      if (a.waitT > 0) {
        // Still hold the action if one is pending — a bomb in the hand does not
        // wait politely.
        const held = a.act; a.act = null;
        const f = a.face; a.face = null;
        return { dir: { x: 0, y: 0 }, bomb: false, act: held, face: f };
      }
    }

    const hereRisk = game.dangerMap[World.idx(bot.tileX, bot.tileY)];
    const safeHere = hereRisk >= SAFE;

    // Safety net, checked every frame rather than every think tick: never step
    // into a tile that is about to catch fire.
    //
    // CRITICAL: this only applies while the bot is standing somewhere safe. A
    // bot fleeing its own bomb is *supposed* to run through tiles with a short
