    // fuse — cancelling its route mid-escape is what makes bots blow themselves
    // up, and it is exactly the bug this guard used to cause.
    if (a.path.length) {
      const next = a.path[0];
      const nextRisk = game.dangerMap[World.idx(next.x, next.y)];
      // Never, under any circumstances, walk into a tile that is burning right
      // now or is a hair from detonating — unless standing still is even worse.
      if (nextRisk < 0.3 && nextRisk <= hereRisk) { a.path = []; a.timer = 0; }
      // Standing somewhere safe? Then also refuse anything due to blow soon.
      // (Skipped while fleeing — a committed escape is allowed to run through
      //  tiles with a short fuse, that is the whole point of it.)
      else if (safeHere && !a.fleeing && nextRisk < 0.75) { a.path = []; a.timer = 0; }
      // In its opening, a bot will not set foot in any bomb's cross at all
      else if (!a.fleeing && isOpening(bot) && nextRisk < SAFE) { a.path = []; a.timer = 0; }
    }

    // Newly in danger with nowhere booked: rethink this instant
    if (!safeHere && (!a.path.length || !a.fleeing)) a.timer = 0;

    if (a.timer <= 0) {
      a.timer = a.cfg.think;
      think(game, bot);
    }

    let dir = { x: 0, y: 0 };
    // Idle only counts while safe: a bot correctly holding still to avoid a
    // blast is not stuck, it is being sensible.
    if (!a.path.length && safeHere) a.idle += dt; else a.idle = 0;

    if (a.path.length) {
      const next = a.path[0];
      const dx = next.x - bot.gx, dy = next.y - bot.gy;
      if (Math.abs(dx) < 0.08 && Math.abs(dy) < 0.08) {
        a.path.shift();
      } else if (Math.abs(dx) > Math.abs(dy)) {
        dir = { x: Math.sign(dx), y: 0 };
      } else {
        dir = { x: 0, y: Math.sign(dy) };
      }
    } else {
      // No route: if we are mid-step toward somewhere that just caught fire,
      // back up to the tile we are still standing in. Damage is judged on the
      // centre tile, so retreating genuinely saves the bot.
      const ox = bot.tileX - bot.gx, oy = bot.tileY - bot.gy;
      const hereBurning = game.dangerMap[World.idx(bot.tileX, bot.tileY)] < 0.3;
      if (!hereBurning && (Math.abs(ox) > 0.06 || Math.abs(oy) > 0.06)) {
        dir = Math.abs(ox) > Math.abs(oy)
          ? { x: Math.sign(ox), y: 0 }
          : { x: 0, y: Math.sign(oy) };
      }
    }

    if (a.detonate) { a.detonate = false; game.detonateRemote(bot); }

    const bomb = a.wantBomb;
    a.wantBomb = false;
    // An explicit action is spent on the tick it is issued, and rate-limited
    // so a cornered bot cannot punch sixty times a second.
    let act = a.act, face = a.face;
    a.act = null; a.face = null;
    if (act && a.actCool > 0) { act = null; face = null; }
    else if (act) a.actCool = 0.25;
    return { dir, bomb, act, face };
  }

  return { attach, step, buildDanger, TIERS, SAFE_OPENING_BOMBS, TUNE };
})();

  function init() {
    root = document.getElementById('ui');
    root.innerHTML = `

      <div id="menu">
        <p class="dim build"></p>
        <h1 aria-label="Bomber Fan"></h1>

          <div class="opt" data-opt="rounds"><span class="lbl">Rounds</span><span class="val"></span></div>
          <div class="opt" data-opt="difficulty"><span class="lbl">Difficulty</span><span class="val"></span></div>

    hud = document.getElementById('hud');

  // ---- Compact / rotate ---------------------------------------------------
  // ONE predicate, read by both the CSS (via the body class) and fitCamera, so
  // the layout and the camera reserve can never disagree about which mode the
  // window is in.
  function isCompact() {
    // Compact is a property of the DEVICE and the window, never of whether the
    // controls happen to be up. It used to include TouchPad.active, which was
    // fine while the controls were an opt-in setting — but now they are on by
    // default, and that rule handed every desktop the phone strip and hid the
    // two-player option. A real phone or tablet still gets it (available), and
    // so does any window too small for panels down the sides.
    return TouchPad.available || window.innerHeight <= 560 || window.innerWidth <= 820;
  }
  // Controls up on a window big enough to keep the side panels: the panels move
  // to the top of each column so the bottom corners are free. See body.padded.
  function isPadded() { return TouchPad.active && !isCompact(); }
  // Portrait on a device that has no keyboard: a 15x13 arena cannot fit a tall
  // window at a playable size, so ask for a rotate rather than shrink to nothing.
  // Only a device that genuinely IS a phone or tablet gets the rotate wall —
  // TouchPad.available, not .active, because a desktop player who switches the
  // on-screen controls on by hand must never be told to rotate their monitor.
  // And it is always dismissible: if this detection is ever wrong on some
  // device, the player must not be trapped behind it.
  let orientationDismissed = false;
  function isBlockedByOrientation() {
    return TouchPad.available && !orientationDismissed
      && window.innerHeight > window.innerWidth;
  }
  function dismissOrientation() {
    orientationDismissed = true;
    applyCompact();
  }
  function applyCompact() {
    document.body.classList.toggle('compact', isCompact());
    document.body.classList.toggle('padded', isPadded());
    if (rotate) rotate.classList.toggle('hidden', !isBlockedByOrientation());
  }

  // Buttons in the pause panel, so a phone (which has no P, R or Q key) can
  // still resume, restart, quit and toggle the on-screen controls.
  function bindPause(handlers) {
    pause.querySelectorAll('.pbtns button').forEach(btn => {
      btn.addEventListener('click', () => handlers[btn.dataset.act] && handlers[btn.dataset.act]());
    });
    // The music row. Its own binding rather than one of the .pbtns, because
    // those close the panel and this one must not.
    pause.querySelectorAll('.pmusic button').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        if (handlers.music) handlers.music(btn.dataset.act === 'musicup' ? 1 : -1);
      });
    });
    const tp = document.getElementById('tpause');
    if (tp) tp.addEventListener('click', () => handlers.pause && handlers.pause());
    // The controls toggle is a live-round control, not a settings item. It was
    // the fourth button in the pause panel; a switch you have to stop the game
    // to reach is a switch nobody flicks.
    const tc = document.getElementById('tctl');
    if (tc) tc.addEventListener('click', e => {
      e.stopPropagation();
      if (handlers.controls) handlers.controls();
    });
    const th = document.getElementById('thome');
    if (th) th.addEventListener('click', e => {
      e.stopPropagation();
      if (handlers.home) handlers.home();
    });
    // The whole results panel continues, not just its button: there is no
    // ENTER key on a phone and this screen was previously a dead end.
    results.addEventListener('click', () => handlers.continue && handlers.continue());
    const anyway = rotate.querySelector('[data-act="anyway"]');
    if (anyway) anyway.addEventListener('click', e => {
      e.stopPropagation();
      dismissOrientation();
      if (handlers.anyway) handlers.anyway();
    });
  }

  // How far down the screen the top strip actually reaches, in CSS pixels.
  // MEASURED, not assumed: the strip's height depends on font metrics, the
  // safe-area inset and how much each card is showing, and a hard-coded reserve
  // drifts out of step the moment any of those change.
  // WHERE THE CLOCK SITS ON A PHONE. The cards form a strip across the top with
  // it, so hard-centring drops it on whichever card reaches the middle. Measured
  // instead: find the right edge of the left group and the left edge of the right
  // group, and sit in the middle of what is left. That gap is real free space and
  // it moves as cards grow, which no fixed offset can follow.
  //
  // THE CARD STRIP, measured off the button row rather than inset past it.
  //
  // The strip is centred over the board by the stylesheet. On a wide screen that
  // is the end of it. On a narrow one a fully-loaded strip can reach the buttons
  // in the top-right corner, and the fix used to be a fixed left inset that had
  // to be re-derived by hand every time a button was added to that row (68, then
  // 112, then 160). This measures the two boxes instead: centred while it fits,
  // slid left by exactly the overlap when it does not, and never past the left
  // safe inset.
  const CARD_EDGE = 8;
  function cardStripBox() {
    if (!hud || hud.classList.contains('hidden')) return null;
    let l = Infinity, t = Infinity, r2 = -Infinity, b = -Infinity;
    hud.querySelectorAll('#cards-left .card, #cards-right .card').forEach(c => {
      const r = c.getBoundingClientRect();
      if (!r.width || !r.height) return;
      l = Math.min(l, r.left); t = Math.min(t, r.top);
      r2 = Math.max(r2, r.right); b = Math.max(b, r.bottom);
    });
    return l < r2 ? { left: l, top: t, right: r2, bottom: b } : null;
  }
  function placeCards(park) {
    const strip = document.getElementById('cards-left');
    if (!strip || !hud) return;
    // Back to the stylesheet's centring before measuring, or every call would
    // measure the offset the previous call applied and creep leftwards.
    strip.style.transform = '';
    // PARK IT AT THE TOP BEFORE THE CAMERA MEASURES IT. dropCards slides the strip
    // down the screen until it is sitting on the arena's roofline, and if the fit
    // then measured it there it would push the board down, which would move the
    // roofline, which would move the strip: a loop with no fixed point. So the
    // fit always sees the strip in its resting place at the top of the screen and
    // the drop happens afterwards, into space the board was never going to use.
    if (park) strip.style.top = '';
    if (hud.classList.contains('hidden')) return;
    const box = cardStripBox();
    if (!box) return;
    const btns = document.getElementById('tbtns');
    if (!btns || btns.classList.contains('off')) return;
    const br = btns.getBoundingClientRect();
    if (!br.width) return;
    // Only the buttons that share the strip's band matter — a control in a
    // bottom corner is not in the way of anything up here.
    if (br.top > box.bottom || br.bottom < box.top) return;
    const over = box.right - (br.left - CARD_EDGE);
    if (over <= 0) return;
    // Never further left than the screen edge: if the strip is so wide that
    // clearing the buttons would push it off, it stops at the edge and the two
    // are allowed to touch. Both are translucent and the alternative is a card
    // nobody can read.
    const shift = Math.min(over, Math.max(0, box.left - CARD_EDGE));
    if (shift <= 0) return;
    strip.style.transform = 'translateX(' + -Math.round(shift) + 'px)';
  }

  // JUST ABOVE THE ARENA, not at the top of the screen.
  //
  // The strip is anchored to the top of the window in the stylesheet, because
  // that is where the camera has to believe it is (see placeCards). Where it
  // BELONGS is on the arena's roofline — the projected top of the far wall — so
  // it reads as a label on the board rather than as browser furniture floating
  // in a corner. Once the board is fitted, that gap above it is dead screen and
  // the strip is dropped into it.
  //
  // Measured off the far wall's TOP (world y = 1.25), not the floor's back edge:
  // the wall stands up in front of the far edge, so a strip placed against the
  // floor line would be sitting on the wall itself.
  const CARD_DROP_GAP = 10;
  const WALL_TOP_Y = 1.25;
  function dropCards() {
    const strip = document.getElementById('cards-left');
    if (!strip || !hud || hud.classList.contains('hidden')) return;
    strip.style.top = '';                       // measure from the resting place
    const box = cardStripBox();
    if (!box || typeof World === 'undefined' || !World.arenaFarEdge) return;
    const rest = box.top, height = box.bottom - box.top;
    // The roofline is the top of the WALL, or the top of whatever is standing on
    // the back of it — a witch's hat is most of a tile taller than the wall she
    // stands on, and anchoring to the wall alone put the back row through the
    // cards on a shorter window.
    const standing = (typeof Props !== 'undefined' && Props.backTop) || 0;
    const roof = World.arenaFarEdge(Math.max(WALL_TOP_Y, standing)).y;
    if (!isFinite(roof)) return;
    // Never ABOVE its resting place — that is the position the board was fitted
    // around, and moving up from it would be a promise the camera never made.
    const want = Math.max(rest, roof - CARD_DROP_GAP - height);
    strip.style.top = Math.round(strip.offsetTop + (want - rest)) + 'px';
  }

  // The clock — skulls only, and only in sudden death — keeps out of the strip's
  // way. Once the strip has dropped onto the arena there is room above it and the
  // skulls take the top of the screen; while it is still up there they go
  // underneath it instead of landing on whichever card reaches the middle.
  function placeClock() {
    const clock = document.getElementById('clock');
    if (!clock || !hud) return;
    clock.style.left = '';
    const box = cardStripBox();
    if (!box) { clock.style.top = ''; return; }
    const h = clock.getBoundingClientRect().height || 30;
    if (box.top > h + 12) { clock.style.top = ''; return; }   // room above the strip
    clock.style.top = Math.round(box.bottom + 6) + 'px';
  }

  // THE VISUAL VIEWPORT, published as --vvh.
  //
  // window.innerHeight is the LAYOUT viewport. On Chrome for Android and on iOS
  // Safari that includes the strip underneath the URL bar, which you cannot see
  // and cannot touch. Anything anchored to the bottom of it — the thumb controls
  // above all — ends up partly under the bar, with no reachable screen below to
  // drag into. window.visualViewport reports what is actually on the glass, and
  // on Android it changes mid-game as the bar hides and shows.
  //
  // Also used for the camera fit, so the board is sized to the visible area
  // rather than to a rectangle that runs off the bottom of the phone.
  function viewportH() {
    const vv = window.visualViewport;
    return Math.round(vv && vv.height ? vv.height : window.innerHeight);
  }
  function syncViewport() {
    document.documentElement.style.setProperty('--vvh', viewportH() + 'px');
  }

  // HOW BIG THE THUMB CONTROLS MAY BE, measured against the board rather than
  // guessed from the viewport.
  //
  // A control is anchored in a bottom corner. It clears the board if it is either
  // NARROWER than the gap beside the board, or SHORT enough to sit under it — so
  // the largest safe diameter is the bigger of those two gaps. Every fixed size
  // is a guess about a screen somebody has not tried yet, and the guesses kept
  // being wrong: 156 on a 440px-tall phone, then 112 on a taller board.
  //
  // Floored, because a control small enough to clear every possible board is a
  // control nobody can hit. At the floor a little overlap is accepted — both are
  // translucent — and the alternative is worse.
  const CTL_MAX = 84, CTL_MIN = 56, CTL_EDGE = 8, CTL_LIFT = 30;
  function sizeTouch() {
    if (!root) return;
    // On documentElement rather than on #ui: it resolves everywhere, and it can be
    // read back from anywhere (the ?touch readout does exactly that).
    const html = document.documentElement;
    if (!isCompact()) { html.style.removeProperty('--ctl'); return; }
    // FROM THE VIEWPORT, NOT FROM THE BOARD. It used to be measured against the
    // arena — the largest circle that still cleared it — which was right while the
    // board was sized first and the controls had to fit in what was left. It is
    // the other way round now: fitCamera is handed these rectangles and grows the
    // board around them (see hudBlockRects), so measuring the controls off the
    // board would be a circle with the board measuring itself off the controls.
    // A thumb control also wants to be the size a thumb wants, not whatever a
    // particular map happened to leave over.
    const px = Math.round(Math.max(CTL_MIN, Math.min(CTL_MAX, viewportH() * 0.26)));
    html.style.setProperty('--ctl', px + 'px');
  }

  // How far down the screen anything ACROSS THE TOP reaches. The cards are a
  // strip across the top again, so they count: their height is the whole cost of
  // this layout and it is the number the camera has to know about.
  function hudReserveTop() {
    if (!hud || hud.classList.contains('hidden')) return 0;
    let bottom = 0;
    const cards = cardStripBox();
    if (cards && cards.top < window.innerHeight * 0.34) bottom = Math.max(bottom, cards.bottom);
    const btns = document.getElementById('tbtns');
    if (btns && !btns.classList.contains('off')) {
      const r = btns.getBoundingClientRect();
      if (r.height) bottom = Math.max(bottom, r.bottom);
    }
    // The clock counts ONLY while it is actually at the top. In compact it sits at
    // the bottom centre (the card strip owns the top), and measuring it there put
    // the "top reserve" at almost the whole height of the screen and squeezed the
    // board to a third of its size.
    //
    // Decided by WHERE IT IS, not by which rule positioned it: for an absolutely
    // positioned element getComputedStyle().top resolves to a used pixel value
    // even when the stylesheet says auto, so asking the stylesheet cannot work.
    const clock = document.getElementById('clock');
    if (clock) {
      const r = clock.getBoundingClientRect();
      const atTop = r.top < window.innerHeight * 0.34;
      if (r.height && atTop) bottom = Math.max(bottom, r.bottom);
    }
    return bottom;
  }

  // The on-screen controls belong to a live round only. Left up on the menu or
  // the results screen, their grab zones lie over the buttons and eat the taps.
  function showTouch(v) {
    const t = document.getElementById('touch');
    if (t) t.classList.toggle('off', !v);
    const tp2 = document.getElementById('tpause');
    if (tp2) tp2.classList.toggle('off', !v);
    // The TOGGLE follows the round, not the controls: it has to be up while
    // they are down, or there is no way to bring them back.
    const tc = document.getElementById('tctl');
    if (tc) tc.classList.toggle('off', !v);
    setControlToggle();
  }
  // HOME IS NOT PART OF THE CONTROLS. It used to be toggled by showTouch, which
  // tied it to "a round is being played" and took it off the locker — the one
  // screen you can get stuck on, because the only other way out is FIGHT. It has
  // its own rule now: up wherever there is somewhere to go back to.
  function showHome(v) {
    const th = document.getElementById('thome');
    if (th) th.classList.toggle('off', !v);
  }
  // Reflect the current state on the button: lit when the controls are up,
  // dimmed and struck through when they are not.
  function setControlToggle() {
    const tc = document.getElementById('tctl');

  // ---- Menu ---------------------------------------------------------------
  // Order must match the markup above — bindMenu maps DOM index to row
  const MENU_ROWS = ['level', 'rounds', 'difficulty', 'players', 'start'];
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

  // Mouse support: hovering a row selects it, clicking adjusts or starts.
  function bindMenu(handlers) {
    menu.querySelectorAll('.opt').forEach((el, i) => {
      el.addEventListener('mouseenter', () => handlers.onHover(i));
      el.addEventListener('click', () => handlers.onClick(i));
    });
  }

  // Two humans sharing one phone is not something we ship: whenever the
  // on-screen controls are up, the Players row is hidden and every match is one
  // human plus three bots. Menu navigation skips hidden rows.
  function rowVisible(i) {
    if (MENU_ROWS[i] !== 'players') return true;
    // Hidden only on a device with NO KEYBOARD. Two humans share one keyboard,
    // and the on-screen stick drives a single seat — but that is an argument
    // about the device, not about whether the stick happens to be up. Keyed off
    // TouchPad.active it vanished from every desktop the moment the controls
    // became on-by-default.
    return !TouchPad.available;
  }

  function renderMenu(sel, opts) {
    menu.querySelectorAll('.opt').forEach((el, i) => {
      el.classList.toggle('sel', i === sel);
      el.classList.toggle('hidden', !rowVisible(i));
    });
    menu.querySelector('[data-opt="players"] .val').textContent =
      opts.humans === 1 ? '1 Human + 3 Bots' : '2 Humans + 2 Bots';
    menu.querySelector('[data-opt="difficulty"] .val').textContent = cap(opts.difficulty);
    menu.querySelector('[data-opt="rounds"] .val').textContent =
      opts.wins === 1 ? 'Single round' : 'First to ' + opts.wins;
    // The label stays put on "Random" while the maps rotate behind the menu —
    // a name that changes every few seconds just reads as flicker.
    const lvl = LEVELS.find(l => l.id === opts.level);
    menu.querySelector('[data-opt="level"] .val').textContent = lvl ? lvl.name : 'Random';
  }
  /* ------------------------------------------------------- the wordmark -- */
  // Built here rather than typed into the markup so each letter's tilt, bob and
  // size is DATA. Hand-tuned per letter — a formula (alternate the sign, step
  // the angle) reads as a wave rather than as lettering that was drawn.
  //
  // Two gradients: the first word runs hot, the second cold, which is the
  // oldest trick in arcade lettering for stopping a long name reading as one
  // undifferentiated slab.
  const WM_HOT  = 'linear-gradient(178deg, #ffe98a 4%, #ffd23f 26%, #ff8a1f 58%, #f5322c 100%)';
  const WM_COLD = 'linear-gradient(178deg, #d8fbff 4%, #6ee7ff 34%, #2f8cff 78%, #1b4fd8 100%)';
  //                letter, rotation, bob, scale
  // Hand-tuned one letter at a time, because a formula reads as a wave and
  // lettering does not. BOMBER runs hot and FAN runs cold; the second word is
  // shorter, which is why its letters carry a touch more scale — three cold
  // letters under six hot ones would otherwise read as an afterthought.
  const WM_ONE = [['B', -7, 3, 1.07], ['O', 5, -5, 0.99], ['M', -4, 6, 1.05],
                  ['B', 8, -3, 1.02], ['E', -6, 4, 0.97], ['R', 4, -6, 1.04]];
  const WM_TWO = [['F', -5, 5, 1.06], ['A', 6, -4, 1.0], ['N', -3, 6, 1.08]];

  function wmLine(cls, letters, grad) {
    return `<span class="wline ${cls}" aria-hidden="true">` + letters.map(([ch, r, y, s]) =>
      `<span class="wl" style="--r:${r}deg;--y:${y}%;--s:${s};--g:${grad}">` +
        `<i>${ch}</i><b>${ch}</b>` +
      `</span>`).join('') + '</span>';
  }

  function buildWordmark() {
    const h1 = document.querySelector('#menu h1');
    if (!h1) return;
    // An original 11-point burst. Deliberately irregular: alternating long and
    // short spikes at uneven angles, because a perfectly regular star reads as
    // a sheriff's badge rather than as something going off.
    const spikes = [
      [0, 1.00], [30, 0.44], [58, 0.86], [92, 0.40], [118, 0.97], [150, 0.46],
      [178, 0.80], [206, 0.38], [236, 0.92], [268, 0.42], [300, 0.88], [332, 0.45],
    ];
    const pts = spikes.map(([deg, r]) => {
      const a = (deg - 90) * Math.PI / 180;
      return (50 + Math.cos(a) * r * 48).toFixed(1) + ',' + (50 + Math.sin(a) * r * 48).toFixed(1);
    }).join(' ');
    const burst =
      `<svg class="wburst" viewBox="0 0 100 100" aria-hidden="true">` +
        `<polygon points="${pts}" fill="#0a1024"` +
        ` stroke="#0a1024" stroke-width="9" stroke-linejoin="round"/>` +
        `<polygon points="${pts}" fill="#ffd23f" transform="translate(50 50) scale(.86) translate(-50 -50)"/>` +
        `<polygon points="${pts}" fill="#ff5a1f" transform="translate(50 50) scale(.52) translate(-50 -50)"/>` +
      `</svg>`;
    h1.innerHTML = wmLine('one', WM_ONE, WM_HOT) + wmLine('two', WM_TWO, WM_COLD) + burst;
  }

  function showMenu(v) { menu.classList.toggle('hidden', !v); }

  /* ---------------------------------------------------- character select -- */
  // Twenty fighters and one action. The old prize ladder no longer appears in
  // this flow: this screen has one job, choosing who walks into the arena.
  function selectRows() { return PLAYER_DEFS.map((_, i) => 'class:' + i).concat(['fight']); }

  function buildSelectList() {
    const box = select.querySelector('.sroster');
    box.innerHTML = PLAYER_DEFS.map((def, i) => {
      const colour = '#' + def.color.toString(16).padStart(6, '0');
      return `<button class="charpick" data-class="${i}" role="option" style="--fighter:${colour}">` +
        `<span class="charface" style="background-image:url('${def.portrait}')" aria-hidden="true"></span>` +
        `<span class="charcopy"><b>${def.name}</b><small>${def.role}</small></span>` +
        `<span class="charindex">${String(i + 1).padStart(2, '0')}</span>` +
        `<i aria-hidden="true"></i>` +
      `</button>`;
    }).join('');
  }

  /* ------------------------------------------------ the cosmic wardrobe -- */
  // NOTHING FLOATS IN IT ANY MORE. The planets, moons, hangers, comets, rings
  // and pick-up art are all gone: with the palette down to purple and pink the
  // shapes were the last thing competing with the list and the character, and
  // they were the thing you were not meant to be looking at. What is left is the
  // gradient and the painted starfield, both of which are one layer each in CSS
  // (see #select .sbg and its ::after) rather than elements in the DOM.

  // The preview panel has to stay a genuine hole in the backdrop: the character
  // inside it is drawn by the WebGL canvas UNDERNEATH this overlay, so an
  // opaque layer over it shows nothing at all. A keyhole polygon — round the
  // outside, then back in and anticlockwise around the panel — cuts it out.
  // Measured from the live rect, because the panel scales with the viewport.
  function punchPreviewHole() {
    const bg = select && select.querySelector('.sbg');
    const pv = document.getElementById('spreview');
    if (!bg || !pv || select.classList.contains('hidden')) return;
    const o = select.getBoundingClientRect();
    const r = pv.getBoundingClientRect();
    if (r.width < 4 || r.height < 4) { bg.style.clipPath = ''; return; }
    // Inset by 2px. The hole is a DOM rectangle in CSS pixels; the preview is
    // scissored with ROUNDED integers, so on a fractional layout the two can
    // disagree by a pixel and a thin stripe of the arena shows through the
    // seam. The panel's own 1px border sits over the inset, so nothing of the
    // character is lost.
    const IN = 2;
    const x1 = Math.ceil(r.left - o.left) + IN, x2 = Math.floor(r.right - o.left) - IN;
    const y1 = Math.ceil(r.top - o.top) + IN,   y2 = Math.floor(r.bottom - o.top) - IN;
    bg.style.clipPath =
      `polygon(0 0, 100% 0, 100% 100%, 0 100%, 0 ${y1}px, ` +
      `${x1}px ${y1}px, ${x1}px ${y2}px, ${x2}px ${y2}px, ${x2}px ${y1}px, 0 ${y1}px)`;
  }

  // Hovering and clicking both drive the live character preview.
  function bindSelect(handlers) {
    select.querySelectorAll('.charpick').forEach(el => {
      const choose = () => handlers.onClass(Number(el.dataset.class));
      el.addEventListener('mouseenter', choose);
      el.addEventListener('focus', choose);
      el.addEventListener('click', choose);
    });
    const fight = select.querySelector('[data-srow="fight"]');
    fight.addEventListener('mouseenter', () => handlers.onFightHover());
    fight.addEventListener('click', () => handlers.onFight());
  }

  // sel = fighter index, or PLAYER_DEFS.length for FIGHT.
  function renderSelect(sel, selectedClass) {
    const def = PLAYER_DEFS[selectedClass];
    const colour = '#' + def.color.toString(16).padStart(6, '0');
    select.style.setProperty('--fighter', colour);
    select.querySelectorAll('.charpick').forEach((el, i) => {
      const chosen = i === selectedClass;
      el.classList.toggle('selected', chosen);
      el.classList.toggle('sel', i === sel);
      el.setAttribute('aria-selected', chosen ? 'true' : 'false');
    });
    const onFight = sel === PLAYER_DEFS.length;
    select.querySelector('[data-srow="fight"]').classList.toggle('sel', onFight);
    select.querySelector('.srole').textContent = def.role;
    select.querySelector('.smove').textContent = def.move;
    select.querySelector('.sbio').textContent = def.bio;
    select.querySelector('.spreviewtag').textContent = 'ANIMATING  ·  ' + def.move.toUpperCase();
    const portrait = select.querySelector('.preview-fallback');
    if (portrait) {
      portrait.dataset.fighter = def.name.toLowerCase().replace(/[^a-z0-9]+/g, '-');
      portrait.style.backgroundImage = `url('${def.portrait}')`;
    }
    punchPreviewHole();
  }

  function showSelect(v) {
    select.classList.toggle('hidden', !v);
    if (v) punchPreviewHole();
  }
  // Where the renderer should draw the live character, in CSS pixels
  function previewRect() {
    const el = document.getElementById('spreview');
    return el ? el.getBoundingClientRect() : null;
  }
  function setPreviewName(name) {
    const el = select.querySelector('.sname');
    if (el) el.textContent = name;
  }
  // Line the option column up with the wordmark above it. Measuring the actual
  // rendered text is the only way to keep them flush as the title scales with
  // the viewport — a hard-coded width drifts out of alignment immediately.
  function alignOptionsToTitle() {
    const h1 = menu.querySelector('h1');
    const opts = menu.querySelector('.opts');
    if (!h1 || !opts) return;

    // The optical ink width of the wordmark. Its layout box is wider than the
    // letters look — letter-spacing adds a gap after the final glyph, and every
    // glyph carries a side bearing — so matching the box leaves the rows
    // visibly proud of the wordmark.
    const inkOf = el => {
      const cs = getComputedStyle(el);
      return el.getBoundingClientRect().width
        - (parseFloat(cs.letterSpacing) || 0)
        - (parseFloat(cs.fontSize) || 0) * 0.11;
    };

    const box = h1.getBoundingClientRect().width;
    if (box < 40) return;                      // not laid out yet

    // What the widest row actually needs to stay on one line. Measured from the
    // rendered text rather than guessed: the longest value ("2 Humans + 2 Bots")
    // changes with wording and font, and a guessed width wraps the moment it
    // grows.
    let needed = 0;
    menu.querySelectorAll('.opt').forEach(row => {
      if (row.classList.contains('hidden')) return;
      const cs = getComputedStyle(row);
      let content = 0;
      row.querySelectorAll('.lbl, .val').forEach(el => {
        const ecs = getComputedStyle(el);
        content += el.getBoundingClientRect().width
          + (parseFloat(ecs.marginRight) || 0) + (parseFloat(ecs.marginLeft) || 0);
      });
      needed = Math.max(needed, content
        + parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight)
        + parseFloat(cs.borderLeftWidth) + parseFloat(cs.borderRightWidth)
        + 2);                                   // a hair of slack against rounding
    });

    const cap = window.innerWidth * 0.94;
    const target = Math.min(Math.max(inkOf(h1), needed), cap);
    opts.style.width = Math.round(target) + 'px';

    // Grow the wordmark to match, so the two still share one edge. Scaling the
    // font by the width ratio is close but not exact (letter-spacing does not
    // scale), so measure again and correct once.
    const baseline = parseFloat(getComputedStyle(h1).fontSize) || 0;
    if (baseline > 0 && inkOf(h1) < target - 1) {
      for (let i = 0; i < 3; i++) {
        const ink = inkOf(h1);
        if (Math.abs(ink - target) <= 1) break;
        const next = (parseFloat(getComputedStyle(h1).fontSize) || baseline) * (target / Math.max(ink, 1));
        // Never let the wordmark grow so tall it pushes START off a short screen
        h1.style.fontSize = Math.min(next, window.innerHeight * 0.30) + 'px';
      }
    } else {
      h1.style.fontSize = '';                   // back to the stylesheet clamp
    }
  }


  // ---- HUD ----------------------------------------------------------------
  // Two cards down the left edge, two down the right — placed to match where
  // each player actually spawns, so the panel is next to its character.
  //  seat 0 spawns top-left, seat 3 bottom-left, seat 2 top-right, seat 1 bottom-right
  const SIDE_OF = { 0: 'left', 3: 'left', 2: 'right', 1: 'right' };
  const ORDER = { 0: 0, 3: 1, 2: 0, 1: 1 };

  // With a single human there is only one panel anybody reads, so it goes on
  // the left ON ITS OWN at three times the area of a bot's, and the three bots
  // share a slim column on the right. With two humans the old two-a-side
  // layout stands, because then both edges matter.
  function isSolo() { return !!hud && hud.classList.contains('solo'); }

  // What the panels actually occupy, measured. fitCamera used a hardcoded
  // width per breakpoint, which cannot survive a card that changes size.
  // THE RECTANGLES THE BOARD MUST KEEP OUT OF, in CSS pixels.
  //
  // This replaces reserving columns. A reserve is a guess shaped like a wall: it
  // takes the width of the widest thing in a corner and refuses the board that
  // much down the WHOLE height of the screen, on BOTH sides, because the board is
  // centred. On a phone that was throwing away roughly 40% of the width to keep
  // clear of two boxes that only occupy the top inch — and the board is a
  // projected diamond whose narrowest part is exactly where those boxes are.
  //
  // Handing fitCamera the actual boxes instead lets it push the board as large as
  // it will go and only back off where something is really in the way.
  function hudBlockRects() {
    // Settle the strip's position BEFORE reading it. fitCamera calls this once
    // and then searches; if the strip were nudged clear of the buttons after the
    // search, the board would have been fitted around a rectangle that has since
    // moved. Once per fit, not once per candidate.
    // PARKED, deliberately: the camera measures the strip at the top of the
    // screen and dropCards puts it on the arena's roofline afterwards.
    placeCards(true);
    const out = [];
    const add = el => {
      if (!el || el.classList.contains('off') || el.classList.contains('hidden')) return;
      const r = el.getBoundingClientRect();
      if (r.width > 1 && r.height > 1)
        out.push({ left: r.left, top: r.top, right: r.right, bottom: r.bottom });
    };
    if (hud && !hud.classList.contains('hidden')) {
      // The card column as ONE box, not four: the gaps between cards are not
      // usable board space, and four boxes is four times the work per candidate.
      let l = Infinity, t = Infinity, r2 = -Infinity, b = -Infinity;
      hud.querySelectorAll('#cards-left .card, #cards-right .card').forEach(c => {
        const r = c.getBoundingClientRect();
        if (!r.width) return;
        l = Math.min(l, r.left); t = Math.min(t, r.top);
        r2 = Math.max(r2, r.right); b = Math.max(b, r.bottom);
      });
      if (l < r2) out.push({ left: l, top: t, right: r2, bottom: b });
    }
    add(document.getElementById('tbtns'));
    // The thumb controls too. They are circles and this treats them as squares,
    // which reserves a little more than it has to in two corners — worth it to
    // keep one kind of shape in this list.
    const touch = document.getElementById('touch');
    if (touch && !touch.classList.contains('off')) {
      add(document.getElementById('tstick'));
      add(document.getElementById('tbomb'));
    }
    return out;
  }

  // How much room down each side the HUD needs. Still used by the menu framing
  // and by the tests; the play framing works from hudBlockRects now.
  function hudReserveSide() {
    if (!hud || hud.classList.contains('hidden')) return 0;
    let w = 0;
    const btns = document.getElementById('tbtns');
    if (btns && !btns.classList.contains('off')) {
      const r = btns.getBoundingClientRect();
      if (r.width) w = Math.max(w, r.width + 14);
    }
    hud.querySelectorAll('#cards-left .card, #cards-right .card').forEach(c => {
      const r = c.getBoundingClientRect();
      if (r.width) w = Math.max(w, r.width);
    });
    return w;
  }

  function buildCards(players) {
    const left = document.getElementById('cards-left');
    const right = document.getElementById('cards-right');
    left.innerHTML = right.innerHTML = '';
    cards = [];
    const humans = players.filter(p => p.isHuman);
    const solo = humans.length === 1 ? humans[0].seat : -1;
    hud.classList.toggle('solo', solo >= 0);
    players
      .slice()
      .sort((a, b) => (a.seat === solo ? -1 : b.seat === solo ? 1 : ORDER[a.seat] - ORDER[b.seat]))
      .forEach(p => {
        const el = document.createElement('div');
        el.className = 'card';
        el.style.setProperty('--c', hex(p.def.color));
        el.innerHTML = `
          <div class="info">
            <div class="name">${p.def.name}<span class="tagme">${p.isHuman ? 'P' + (p.seat + 1) : 'CPU'}</span><span class="wins"></span></div>
          </div>`;
        // EVERY CARD GOES IN THE LEFT COLUMN. There is one list now, in one
        // corner; #cards-right survives as an empty box because the layout code,
        // the camera reserve and the tests all still ask for it by id.
        left.appendChild(el);
        cards[p.seat] = el;
      });
  }

  function updateHUD(game) {
    game.players.forEach((p, i) => {
      const el = cards[i];
      if (!el) return;
      el.classList.toggle('dead', !p.alive);
      el.classList.toggle('cursed', !!p.curse);
      // NO PICK-UP TALLY. A card carries a name, a seat colour and the score,
      // and nothing else: the bomb count, the fire count and the row of ability
      // chips are all gone. Everything they said is already on the board — you
      // can see how far your own blast reaches, and Kick has the gold boots.
      // What is left is the one thing the arena cannot tell you, which is where
      // the match stands.
      el.querySelector('.wins').textContent = game.opts.wins > 1
        ? p.wins + '/' + game.opts.wins : (p.wins ? String(p.wins) : '');
    });
    // NO CLOCK, JUST THE SKULLS. There is nothing to count down to that a player
    // can act on until sudden death, and when it arrives the skulls say so.
    //
    // They belong to a round that is still being fought. They used to hang on
    // through the whole outro because they were keyed off g.suddenDeath alone,
    // which stays true until the next round is built — so they sat there flashing
    // over the win banner. Gated on PLAY as well, they go the instant it is won.
    const clock = document.getElementById('clock');
    if (clock) clock.classList.toggle('sd',
      !!game.suddenDeath && game.state === STATE.PLAY);

    // Cards grow as players collect things. The camera reserve is measured from
    // them, so a change in the strip's height has to re-fit — otherwise the
    // strip creeps down over the board during a round, which is exactly what it
    // did. Compared, not recomputed blindly: fitCamera runs a binary search.
    placeCards();
    dropCards();
    placeClock();
    const reserve = Math.round(hudReserveTop());
    if (reserve !== lastReserve) {
      lastReserve = reserve;
      if (typeof World !== 'undefined' && World.fit) World.fit();
    }
  }

  function showHUD(v) { hud.classList.toggle('hidden', !v); }

  // THE START COUNTDOWN. One big rainbow number, and while it is up the round
  // clock is hidden — hence the class on #hud rather than on #count alone: it is
  // a statement about the whole HUD ("something else is doing the counting"),
  // not about this one element.
  //
  // Pass a string to show it, null to clear. Every call re-triggers the pop, and
  // the only reliable way to restart a running CSS animation is to take the class
  // off, force a reflow, and put it back — hence the offsetWidth read, which is
  // load-bearing and not a leftover.
  function setCountdown(text) {
    const el = document.getElementById('count');
    if (!el) return;
    if (text === null || text === undefined || text === '') {
      el.classList.add('hidden');
      el.classList.remove('pop');
      el.textContent = '';
      hud.classList.remove('counting');
      return;
    }
    el.textContent = String(text);
    el.classList.remove('hidden');
    el.classList.remove('pop');
    void el.offsetWidth;                  // reflow, so the animation restarts
    el.classList.add('pop');
    hud.classList.add('counting');
  }

  // The scrolling warning along the board's edge. Pass null to clear it.
  // The phrase goes in TWICE: the track scrolls to -50% and snaps back, which
  // is only seamless if the second copy is already where the first one was.
  // TWO BANDS, top and bottom. The far edge was the only one carrying it, and on
  // a phone in landscape the top of the screen is the half your thumbs are not
  // near and your eyes are not on. The front of the board gets a copy.
  const SD_BANDS = ['sdband', 'sdband2'];
  let sdBandText = null;
  function setSdBand(text) {
    const els = SD_BANDS.map(id => document.getElementById(id)).filter(Boolean);
    if (!els.length) return;
    if (!text) { els.forEach(el => el.classList.add('hidden')); sdBandText = null; return; }
    if (text !== sdBandText) {
      sdBandText = text;
      const one = (text + '  \u00b7  ').repeat(4);
      els.forEach(el => {
        el.querySelector('.sdtrack').innerHTML = `<span>${one}</span><span>${one}</span>`;
      });
    }
    els.forEach(el => el.classList.remove('hidden'));
    placeSdBand();
  }

  // THE COUNTDOWN. Whole seconds only: a number with decimals on it is a
  // stopwatch, and what this has to say is "five... four... three".
  let sdCountShown = null;
  function setSdCount(seconds) {
    const el = document.getElementById('sdcount');
    if (!el) return;
    if (seconds === null || seconds === undefined) {
      el.classList.add('hidden');
      sdCountShown = null;
      return;
    }
    const n = Math.max(0, Math.ceil(seconds));
    el.classList.remove('hidden');
    if (n !== sdCountShown) {
      sdCountShown = n;
      const b = el.querySelector('b');
      b.textContent = String(n);
      // Restart the pulse so the beat lands on the digit changing rather than
      // free-running and drifting further out of step every second.
      b.style.animation = 'none';
      void b.offsetWidth;
      b.style.animation = '';
      Audio3.countdown(n <= 3);
    }
    placeSdCount();
  }

  // THE FRONT WALL AS A BAND, not the near edge as a line. Measured on a phone
  // it is about 50px deep — the lid of the outer wall plus the sliver of its
  // outer face — and it is the only strip at the bottom of the screen that is
  // guaranteed to be wall rather than board. The warning takes the top of it and
  // the number takes the rest, so the two can both be up at once without ever
  // sitting on each other.
  function frontWallBand() {
    const lid = World.arenaNearEdge(WALL_TOP_Y, 1);   // inner top corner of the wall
    const base = World.arenaNearEdge(0, 0);           // the bottom of the board
    const depth = Math.max(16, base.y - lid.y);
    return {
      top: lid.y, bottom: base.y, depth,
      innerLeft: lid.left, innerRight: lid.right,
      left: base.left, right: base.right,
      // The number gets the larger share: it is the part you are reading.
      split: lid.y + Math.max(14, Math.min(34, depth * 0.44)),
    };
  }

  function placeSdCount() {
    const el = document.getElementById('sdcount');
    if (!el || el.classList.contains('hidden')) return;
    const f = frontWallBand();
    const w = Math.max(80, f.right - f.left);
    const h = Math.max(12, f.bottom - f.split);
    el.style.left = Math.round(f.left) + 'px';
    el.style.width = Math.round(w) + 'px';
    el.style.top = Math.round(f.split) + 'px';
    el.style.height = Math.round(h) + 'px';
    const b = el.querySelector('b');
    // Sized to the WALL, so it can never outgrow the strip it is written on —
    // which is what stopped it being the biggest thing on the screen.
    if (b) b.style.fontSize = Math.max(11, Math.round(h * 0.92)) + 'px';
  }

  // Sit the band on the arena's own front edge, measured from the projected
  // board rather than guessed from the viewport — the board moves whenever the
  // HUD reserve or the window changes, and a fixed offset drifts off it.
  function placeSdBand() {
    placeOneBand('sdband', World.arenaFarEdge(1.0));
    // The bottom copy sits INSIDE the front wall rather than centred on its top
    // line: centring is right at the back, where there is empty screen above the
    // wall to take the overhang, and wrong at the front, where the overhang
    // would land on the last row of playable tiles.
    const f = frontWallBand();
    placeOneBand('sdband2', { left: f.innerLeft, right: f.innerRight, y: 0 },
                 { top: f.top, height: f.split - f.top });
  }

  function placeOneBand(id, e, fixed) {
    const el = document.getElementById(id);
    if (!el || el.classList.contains('hidden')) return;
    // Aligned to the FAR EDGE as a line, not to the board's bounding box. That
    // box is as wide as the NEAR edge, which under this camera is a couple of
    // hundred pixels wider than the back of the board — sized to it, the band
    // hung well past both top corners. Projecting the two back corners at the
    // top of the wall gives the real width, and the real height to sit at.
    const w = Math.max(80, e.right - e.left);
    const h = fixed ? Math.max(14, fixed.height) : Math.max(18, Math.min(40, w * 0.055));
    el.style.left = Math.round(e.left) + 'px';
    el.style.width = Math.round(w) + 'px';
    el.style.top = Math.round(fixed ? fixed.top : e.y - h / 2) + 'px';
    el.style.height = Math.round(h) + 'px';
    const track = el.querySelector('.sdtrack');
    if (track) track.style.fontSize = Math.round(h * 0.52) + 'px';
  }

  // ---- Banners ------------------------------------------------------------
  let bannerT = 0;
  // The round-result banner sits between the two seat panels. Victory lines
  // vary a lot in length, so rather than trusting a fixed font size it is
  // measured and shrunk until it fits the gap — at any window size, for any
  // line. Must run before the pop animation starts, or the scale transform
  // corrupts the measurement.
  function fitSmallBanner() {
    const span = banner.querySelector('span');
    span.style.fontSize = '';                    // back to the stylesheet value
    const left = document.getElementById('cards-left');
    const right = document.getElementById('cards-right');
    let avail = window.innerWidth * 0.9;
    if (left && right && !hud.classList.contains('hidden')) {
      const lb = left.getBoundingClientRect(), rb = right.getBoundingClientRect();
      if (rb.left > lb.right) avail = Math.min(avail, rb.left - lb.right - 28);
    }
    let size = parseFloat(getComputedStyle(span).fontSize) || 38;
    for (let i = 0; i < 30 && size > 12; i++) {
      if (span.getBoundingClientRect().width <= avail) break;
      size *= 0.94;
      span.style.fontSize = size + 'px';
    }
  }

  function showBanner(text, colorHex, seconds, small) {
    const span = banner.querySelector('span');
    span.textContent = text;
    span.style.color = colorHex || '#ffffff';
    banner.classList.toggle('small', !!small);
    // Drop 'pop' BEFORE un-hiding. Un-hiding an element that still carries an
    // animation class restarts that animation, and the scale transform would
    // corrupt the width measurement fitSmallBanner depends on.
    banner.classList.remove('pop');
    banner.classList.remove('hidden');
    if (small) fitSmallBanner(); else span.style.fontSize = '';
    void banner.offsetWidth;         // restart the CSS animation
    banner.classList.add('pop');
    bannerT = seconds == null ? 1.2 : seconds;
  }
  function bannerBusy() { return bannerT > 0; }
  function tickBanner(dt) {
    if (bannerT > 0) {
      bannerT -= dt;
      if (bannerT <= 0) banner.classList.add('hidden');
    }
  }

  // ---- Overlays -----------------------------------------------------------
  function showPause(v) {
    pause.classList.toggle('hidden', !v);
    if (v) renderMusicRow();
  }

  // The setting is read from Audio3 rather than mirrored here, so the panel can
  // never claim a level the audio is not actually at.
  function renderMusicRow() {
    const el = pause.querySelector('.pmusic .pmval');
    if (el) el.textContent = Audio3.musicStepLabel;
  }

  // The pause panel lists whatever scheme is actually in play
  // The one line on the pause panel. It names whoever stopped the game, because
  // a jab with nobody's name in it is just a sign.
  function setPauseTaunt(name) {

  // Draw the preview through the game's existing WebGL context. The canvas is

  function renderPreview() {
    const pv = g.preview;
    const rect = UI.previewRect();

    mountPreviewCanvas();
    const r = World.renderer;
    const w = Math.round(rect.width);
    const hh = Math.round(rect.height);
    g.previewViewport = { x: 0, y: 0, w, h: hh };
