      [[-0.06, 1.08], [0.06, 1.08]].forEach(([x, y]) => {
        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.028, 8, 6), mat(0x1a1a1a));
        eye.position.set(x, y, 0.14);
        g.add(eye);
      });
    },
    icespike(g) {
      [[0.16, 0.9, 0, 0], [0.11, 0.6, 0.22, 0.12], [0.09, 0.44, -0.2, -0.1]].forEach(([r, h, x, z]) => {
        const spike = new THREE.Mesh(new THREE.ConeGeometry(r, h, 6),
          mat(0x9fd8f5, { roughness: 0.2, metalness: 0.1, transparent: true, opacity: 0.85 }));
        spike.position.set(x, h / 2, z);
        spike.castShadow = true;
        g.add(spike);
      });
    },

    // ---- Dunes -----------------------------------------------------------
    cactus(g) {
      const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.16, 0.6, 4, 10), mat(0x3f8f4a));
      body.position.y = 0.46;
      body.castShadow = true;
      g.add(body);
      [[-1, 0.5], [1, 0.66]].forEach(([side, y]) => {
        const arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.09, 0.2, 4, 8), mat(0x3f8f4a));
        arm.position.set(side * 0.2, y, 0);
        arm.rotation.z = side * -0.9;
        g.add(arm);
        const up = new THREE.Mesh(new THREE.CapsuleGeometry(0.09, 0.18, 4, 8), mat(0x3f8f4a));
        up.position.set(side * 0.3, y + 0.19, 0);
        g.add(up);
      });
    },
    pot(g) {
      const body = new THREE.Mesh(new THREE.SphereGeometry(0.3, 14, 12), mat(0xb5713f));
      body.scale.set(1, 1.15, 1);
      body.position.y = 0.32;
      body.castShadow = true;
      g.add(body);
      const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.17, 0.2, 12), mat(0xb5713f));
      neck.position.y = 0.66;
      g.add(neck);
      const lip = new THREE.Mesh(new THREE.TorusGeometry(0.14, 0.035, 6, 14), mat(0x8d5430));
      lip.position.y = 0.75;
      lip.rotation.x = Math.PI / 2;
      g.add(lip);
    },

    // ---- Haunted House ---------------------------------------------------
    // A sheet ghost. Semi-transparent and EMISSIVE: a plain white material on an
    // almost-black level reads as a grey lump, and the glow is what makes it look
    // lit from inside rather than lit by the scene.
    ghost(g) {
      const skin = () => new THREE.MeshStandardMaterial({
        color: 0xeef2ff, emissive: 0x9fb0ff, emissiveIntensity: 1.15,
        roughness: 0.9, metalness: 0, transparent: true, opacity: 0.78,
        depthWrite: false,
      });
      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.26, 16, 12, 0, Math.PI * 2, 0, Math.PI * 0.62), skin());
      head.position.y = 0.86;
      g.add(head);
      // The sheet: a cone, and a scalloped hem made of small spheres so the
      // bottom edge is ragged rather than a clean circle.
      const body = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.62, 16, 1, true), skin());
      body.position.y = 0.6;
      g.add(body);
      for (let i = 0; i < 9; i++) {
        const a2 = (i / 9) * Math.PI * 2;
        const lobe = new THREE.Mesh(new THREE.SphereGeometry(0.075, 8, 6), skin());
        lobe.position.set(Math.cos(a2) * 0.28, 0.3 + (i % 2) * 0.05, Math.sin(a2) * 0.28);
        g.add(lobe);
      }
      // Two holes and an O of a mouth. Black, unlit, and NOT transparent, so they
      // read as holes in the sheet instead of shading on it.
      const hole = new THREE.MeshBasicMaterial({ color: 0x080510 });
      [[-0.085, 0.9], [0.085, 0.9]].forEach(([x, y]) => {
        const e = new THREE.Mesh(new THREE.SphereGeometry(0.05, 10, 8), hole);
        e.position.set(x, y, 0.19);
        e.scale.set(1, 1.25, 0.5);
        g.add(e);
      });
      const mouth = new THREE.Mesh(new THREE.SphereGeometry(0.045, 10, 8), hole);
      mouth.position.set(0, 0.77, 0.2);
      mouth.scale.set(0.8, 1.3, 0.5);
      g.add(mouth);
      g.userData.float = true;          // see FLOAT below
      g.userData.scale = 1.18;          // it is a ghost, it should loom a little
    },

    // The witch. She is the hazard on this map, so she has to be the thing your
    // eye goes to: the tallest prop, the only pointed silhouette, and lit green.
    witch(g, angry) {
      const cloak = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.78, 12), mat(0x2b1150));
      cloak.position.y = 0.39;
      cloak.castShadow = true;
      g.add(cloak);
      const face = new THREE.Mesh(new THREE.SphereGeometry(0.17, 14, 12),
        mat(0x7fd04a, { roughness: 0.75 }));
      face.position.y = 0.9;
      face.scale.set(1, 1.08, 0.95);
      g.add(face);
      const nose = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.22, 7), mat(0x6cb83e));
      nose.position.set(0, 0.88, 0.17);
      nose.rotation.x = Math.PI / 2.1;
      g.add(nose);
      // Pointed hat: brim then cone, tipped forward so it has some attitude
      const hatMat = mat(0x150826, { roughness: 0.85 });
      const brim = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.34, 0.035, 16), hatMat);
      brim.position.y = 1.05;
      g.add(brim);
      const cone = new THREE.Mesh(new THREE.ConeGeometry(0.19, 0.62, 12), hatMat);
      cone.position.set(0, 1.36, -0.03);
      cone.rotation.x = -0.16;
      cone.castShadow = true;
      g.add(cone);
      const band = new THREE.Mesh(new THREE.TorusGeometry(0.155, 0.028, 6, 16),
        mat(angry ? 0xff3b2f : 0xffc24d, { roughness: 0.5 }));
      band.position.y = 1.12;
      band.rotation.x = Math.PI / 2;
      g.add(band);
      // Eyes: flat and unlit so they hold their colour against a black level
      const eyeC = angry ? 0xff3020 : 0xd8ff5a;
      [-1, 1].forEach(side => {
        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.035, 8, 6),
          new THREE.MeshBasicMaterial({ color: eyeC }));
        eye.position.set(side * 0.06, 0.94, 0.14);
        g.add(eye);
      });
      // Broom, held out to one side
      const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.8, 6), mat(0x5a3a1c));
      shaft.position.set(0.26, 0.5, 0.02);
      shaft.rotation.z = 0.22;
      g.add(shaft);
      const bristles = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.26, 8), mat(0xc9a24a));
      bristles.position.set(0.36, 0.11, 0.02);
      bristles.rotation.z = Math.PI + 0.22;
      g.add(bristles);
      g.userData.hover = true;
      g.userData.scale = 1.12;
    },

    gravestone(g) {
      const stone = mat(0x8d8f9c, { roughness: 0.95 });
      const slab = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.6, 0.13), stone);
      slab.position.y = 0.36;
      slab.castShadow = true;
      g.add(slab);
      const top = new THREE.Mesh(
        new THREE.CylinderGeometry(0.23, 0.23, 0.13, 14, 1, false, 0, Math.PI), stone);
      top.position.y = 0.66;
      top.rotation.x = Math.PI / 2;
      top.rotation.z = Math.PI / 2;
      g.add(top);
      // A carved cross, cut a little proud of the face
      const carve = mat(0x5f6270, { roughness: 1 });
      const up = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.3, 0.03), carve);
      up.position.set(0, 0.46, 0.07);
      g.add(up);
      const across = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.07, 0.03), carve);
      across.position.set(0, 0.53, 0.07);
      g.add(across);
      // The mound it leans out of, and the whole stone tipped off true
      const mound = new THREE.Mesh(
        new THREE.SphereGeometry(0.32, 14, 8, 0, Math.PI * 2, 0, Math.PI * 0.5),
        mat(0x2e2437, { roughness: 1 }));
      mound.scale.y = 0.34;
      g.add(mound);
      slab.rotation.z = top.rotation.y = 0;
      g.rotation.z = -0.07;
    },

    pumpkin(g) {
      const skinM = mat(0xff7a1a, { roughness: 0.55 });
      // Ribs rather than one sphere: a jack-o'-lantern is read by its grooves
      for (let i = 0; i < 7; i++) {
        const rib = new THREE.Mesh(new THREE.SphereGeometry(0.16, 12, 10), skinM);
        const a2 = (i / 7) * Math.PI * 2;
        rib.position.set(Math.cos(a2) * 0.12, 0.26, Math.sin(a2) * 0.12);
        rib.scale.set(1, 0.92, 1);
        rib.castShadow = true;
        g.add(rib);
      }
      const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.06, 0.16, 7), mat(0x4c6b28));
      stalk.position.y = 0.45;
      stalk.rotation.z = 0.18;
      g.add(stalk);
      // The carved face GLOWS: unlit triangles and a jagged grin, in candle yellow
      const lit = new THREE.MeshBasicMaterial({ color: 0xffd451 });
      [-1, 1].forEach(side => {
        const eye = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.09, 3), lit);
        eye.position.set(side * 0.08, 0.31, 0.26);
        eye.rotation.x = Math.PI / 2;
        eye.rotation.y = side * 0.3;
        g.add(eye);
      });
      const nose = new THREE.Mesh(new THREE.ConeGeometry(0.035, 0.06, 3), lit);
      nose.position.set(0, 0.25, 0.27);
      nose.rotation.x = Math.PI / 2;
      g.add(nose);
      for (let i = 0; i < 5; i++) {
        const tooth = new THREE.Mesh(new THREE.ConeGeometry(0.032, 0.07, 3), lit);
        tooth.position.set((i - 2) * 0.06, 0.17, 0.255);
        tooth.rotation.x = Math.PI / 2;
        tooth.rotation.z = i % 2 ? Math.PI : 0;
        g.add(tooth);
      }
      const glow = new THREE.PointLight(0xff8c1a, 0.9, 2.2);
      glow.position.set(0, 0.3, 0.2);
      g.add(glow);
      g.userData.flicker = true;
      g.userData.scale = 1.14;
    },

    // ---- Circuit ---------------------------------------------------------
    pylon(g) {
      const post = new THREE.Mesh(new THREE.BoxGeometry(0.16, 1.0, 0.16), mat(0x1b3a4a, { metalness: 0.4 }));
      post.position.y = 0.5;
      post.castShadow = true;
      g.add(post);
      [0.35, 0.62, 0.89].forEach(y => {
        const ring = new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.035, 6, 16),
          new THREE.MeshBasicMaterial({ color: 0x6ef0ff, toneMapped: false }));
        ring.position.y = y;
        ring.rotation.x = Math.PI / 2;
        g.add(ring);
      });
    },
    server(g) {
      const box = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.8, 0.36), mat(0x18202e, { metalness: 0.3 }));
      box.position.y = 0.4;
      box.castShadow = true;
      g.add(box);
      for (let i = 0; i < 5; i++) {
        const led = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.03, 0.02),
          new THREE.MeshBasicMaterial({ color: i % 2 ? 0xff3fa4 : 0x6ef0ff, toneMapped: false }));
        led.position.set(0, 0.16 + i * 0.13, 0.19);
        g.add(led);
      }
    },

    // ---- Temple ----------------------------------------------------------
    brazier(g) {
      const bowl = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.16, 0.26, 12), mat(0x6d5c3f, { metalness: 0.3 }));
      bowl.position.y = 0.55;
      bowl.castShadow = true;
      g.add(bowl);
      const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.14, 0.44, 10), mat(0x6d5c3f, { metalness: 0.3 }));
      stem.position.y = 0.22;
      g.add(stem);
      const fire = new THREE.Mesh(new THREE.IcosahedronGeometry(0.2, 0),
        new THREE.MeshBasicMaterial({ color: 0xff8a2b, toneMapped: false }));
      fire.position.y = 0.76;
      g.add(fire);
      const glow = new THREE.PointLight(0xff8a2b, 4, 3.5, 2);
      glow.position.y = 0.85;
      g.add(glow);
    },
    idol(g) {
      const base = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.22, 0.4), mat(0xbdb392));
      base.position.y = 0.11;
      base.castShadow = true;
      g.add(base);
      const head = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.46, 0.34), mat(0xd3c9a6));
      head.position.y = 0.45;
      head.castShadow = true;
      g.add(head);
      [[-0.08], [0.08]].forEach(([x]) => {
        const eye = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.05, 0.03), mat(0x4a4436));
        eye.position.set(x, 0.52, 0.18);
        g.add(eye);
      });
      const crown = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.2, 4), mat(0xe0d6b2));
      crown.position.y = 0.78;
      crown.rotation.y = Math.PI / 4;
      g.add(crown);
    },

    // ---- Donut Town ------------------------------------------------------
    // ORIGINAL ARTWORK. A frosted donut and a cooling tower are ordinary objects.
    // Nothing here reproduces a copyrighted character design or uses a
    // trademarked name: the level is the LOOK — cartoon yellow, lawn green and
    // frosting pink — not somebody else's cast.
    donut(g) {
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.08, 0.42, 8), mat(0x8d6a3f));
      post.position.y = 0.21;
      g.add(post);
      // Dough first, then a slightly fatter ring of frosting sat ON it, so the
      // frosting reads as a separate layer rather than as paint.
      const dough = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.135, 12, 24), mat(0xe8b06a));
      dough.position.y = 0.66;
      dough.rotation.x = Math.PI / 2;
      dough.castShadow = true;
      g.add(dough);
      const icing = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.145, 12, 24),
        mat(0xff5aa8, { roughness: 0.3 }));
      icing.position.y = 0.71;
      icing.rotation.x = Math.PI / 2;
      icing.scale.y = 0.62;
      g.add(icing);
      // Sprinkles: little capsules laid flat around the ring, alternating colour
      const SPR = [0xffffff, 0x35d0ff, 0xffe14d, 0x6bff8f, 0xff8a3d];
      for (let i = 0; i < 10; i++) {
        const a = (i / 10) * Math.PI * 2 + 0.3;
        const s2 = new THREE.Mesh(new THREE.CapsuleGeometry(0.018, 0.055, 3, 6),
          mat(SPR[i % SPR.length], { roughness: 0.35 }));
        s2.position.set(Math.cos(a) * 0.3, 0.79, Math.sin(a) * 0.3);
        s2.rotation.set(Math.PI / 2, 0, a * 1.7);
        g.add(s2);
      }
    },
    coolingtower(g) {
      // A hyperboloid is two stacked truncated cones — cheap and unmistakable.
      // DoubleSide: the shell is open-ended at both ends so the tower reads as a
      // funnel rather than a solid lump, and without the back faces you see
      // straight through it to the sky.
      const shell = mat(0xd9d4c8, { roughness: 0.75, side: THREE.DoubleSide });
      const lower = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.42, 0.6, 16, 1, true), shell);
      lower.position.y = 0.3;
      lower.castShadow = true;
      g.add(lower);
      const upper = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.26, 0.42, 16, 1, true), shell);
      upper.position.y = 0.81;
      upper.castShadow = true;
      g.add(upper);
      const rim = new THREE.Mesh(new THREE.TorusGeometry(0.36, 0.022, 6, 18), mat(0xb4ada0));
      rim.position.y = 1.02;
      rim.rotation.x = Math.PI / 2;
      g.add(rim);
      // Two red hazard bands, because a plain grey funnel disappears at this size
      // Radii taken FROM the taper, not guessed: the lower cone runs 0.42 -> 0.26
      // over y 0..0.6, so at y 0.42 it is 0.308. A band that misses its shell
      // floats in the air beside it.
      [[0.42, 0.308], [0.72, 0.289]].forEach(([y, r]) => {
        const band = new THREE.Mesh(new THREE.TorusGeometry(r, 0.026, 6, 18),
          mat(0xe03a2f, { roughness: 0.4 }));
        band.position.y = y;
        band.rotation.x = Math.PI / 2;
        g.add(band);
      });
      // Steam: three soft blobs drifting off the top, and they ANIMATE with the
      // rest of the props when a big blast shakes the edge (see Props.tick).
      const puffMat = new THREE.MeshStandardMaterial({
        color: 0xffffff, transparent: true, opacity: 0.5, roughness: 1, depthWrite: false });
      [[0.02, 1.16, 0.16], [-0.09, 1.3, 0.12], [0.08, 1.42, 0.09]].forEach(([x, y, r]) => {
        const puff = new THREE.Mesh(new THREE.SphereGeometry(r, 10, 8), puffMat);
        puff.position.set(x, y, 0);
        puff.renderOrder = 3;
        g.add(puff);
      });
    },
  };

  // THE BOMB IN ITS HANDS. Built once with the prop and simply hidden, rather
  // than created and thrown away every eleven seconds — a hazard that only
  // exists at the moment it fires gives you nothing to read, and the whole point
  // of a wind-up is that you can see it coming.
  //
  // Its own small mesh, not the real Bomb: the real one has a fuse that starts
  // the moment it exists, and a bomb that spent its wind-up burning down would
  // land already half spent.
  function buildHeldBomb() {
    const g = new THREE.Group();
    const shell = new THREE.Mesh(new THREE.SphereGeometry(0.2, 14, 12),
      new THREE.MeshStandardMaterial({
        color: 0xe0201a, roughness: 0.34, metalness: 0.25,
        emissive: 0x4a0603, emissiveIntensity: 0.6 }));
    shell.castShadow = true;
    g.add(shell);
    const fuse = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.13, 6),
      new THREE.MeshStandardMaterial({ color: 0xd9c9a0, roughness: 0.8 }));
    fuse.position.set(0, 0.26, 0);
    fuse.rotation.z = 0.35;
    g.add(fuse);
    const spark = new THREE.Mesh(new THREE.SphereGeometry(0.055, 10, 8),
      new THREE.MeshStandardMaterial({
        color: 0xfff3b0, emissive: 0xffaa22, emissiveIntensity: 3 }));
    spark.position.set(0.04, 0.33, 0);
    g.add(spark);
    g.userData.spark = spark;
    // Held out to the side, at about the height of a hand
    g.position.set(0.34, 0.62, 0.1);
    g.visible = false;
    return g;
  }

  // `k` runs 0 -> 1 across the wind-up. The bomb appears, the arm draws back and
  // the fuse sparks harder as the throw approaches, so the last half second reads
  // as "now" rather than as more of the same.
  function windUp(k) {
    if (!heldBomb) return;
    if (k === null) { heldBomb.visible = false; if (angryGroup) angryGroup.rotation.z = 0; return; }
    heldBomb.visible = true;
    const e = Math.min(1, Math.max(0, k));
    heldBomb.scale.setScalar(0.6 + 0.4 * Math.min(1, e * 4));
    // draw back and up
    heldBomb.position.set(0.34 + e * 0.16, 0.62 + e * 0.5, 0.1 - e * 0.24);
    if (angryGroup) angryGroup.rotation.z = -e * 0.22;
    const sp = heldBomb.userData.spark;
    if (sp) sp.scale.setScalar(0.7 + e * 1.6 + Math.random() * 0.4);
  }

  // Where the thrown bomb leaves from, in world units — the hand, not the tile.
  function throwOrigin() {
    if (!heldBomb || !angryGroup) return null;
    heldBomb.updateMatrixWorld(true);
    const v = new THREE.Vector3();
    heldBomb.getWorldPosition(v);
    return v;
  }

  // A scowl for the dangerous one: two brows angled inwards over the eyes. Added
  // by the builder wrapper rather than inside the builder, so the harmless ones
  // are untouched and there is one place that knows what "angry" looks like.
  // The eyes sit at different heights on a snowman and a witch, so the brow line
  // comes from a small table rather than one magic number.
  const BROW_Y = { snowman: 1.10, witch: 0.99 };
  function addScowl(g, kind) {
    const y = BROW_Y[kind] === undefined ? 1.10 : BROW_Y[kind];
    [-1, 1].forEach(side => {
      const brow = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.028, 0.03),
        new THREE.MeshStandardMaterial({ color: 0x2a0605, roughness: 0.6 }));
      brow.position.set(side * 0.065, y, 0.15);
      brow.rotation.z = side * -0.5;
      g.add(brow);
    });
  }

  // Where props stand: on the outer wall, clear of the playable interior.
  // Given as [gridX, gridY, facing] — the wall top is y = 1.
  //
  // NOTHING ON THE BACK WALL. A prop stands on the wall and reaches a tile or
  // more above it, and the back wall is the exact band the card strip occupies —
  // measured, a cooling tower came 29px past the cards and a witch's hat 44px.
  // The alternatives were making the camera keep the props clear as well as the
  // board (which costs arena on every level, to stop a prop tip being drawn
  // behind a panel) or shrinking the props until they fitted a gap the camera is
  // actively trying to close. Moving them costs nothing: the back row was the
  // furthest from the camera and the smallest on screen, and the sides and front
  // are where they are actually worth looking at.
  const SPOTS = [
    [0,  2,  Math.PI / 2],
    [14, 2, -Math.PI / 2],
    [0,  6,  Math.PI / 2],
    [14, 6, -Math.PI / 2],
    [3,  12, Math.PI],
    [11, 12, Math.PI],
  ];

  // Build every prop for a level and return one group to add to the scene
  let angryPos = null;          // grid tile the angry snowman stands on, or null
  let angryGroup = null;        // ...and the group itself, so it can hold things
  let heldBomb = null;          // the red bomb it winds up with before throwing
  // HOW HIGH THE BACK ROW REACHES, in world units, drift included.
  //
  // The card strip is placed just above the arena, and "the arena" used to mean
  // the top of the outer wall. The props STAND on that wall — a witch's hat is
  // most of a tile above it and a ghost bobs on top of that — so on a shorter
  // window the back row went straight through the cards. Measured here, once, at
  // build time: measuring it live would work too and would make the strip jitter
  // every time a ghost breathed.
  let backTop = 0;
  const DRIFT_UP = { FLOAT: 0.29, HOVER: 0.11, FLICKER: 0 };

  function build(level, wx, wz) {
    const group = new THREE.Group();
    clear();                    // the old props are about to be disposed
    angryPos = null;
    angryGroup = null;
    heldBomb = null;
    backTop = 0;
    let angryDone = false;
    const kinds = level.props || [];
    if (!kinds.length) return group;

    SPOTS.forEach((spot, i) => {
      const kind = kinds[i % kinds.length];
      const builder = BUILD[kind];
      if (!builder) return;
      const g = new THREE.Group();
      // THE FIRST ONE OF THE HAZARD KIND IS THE ANGRY ONE. First rather than
      // random so it is in the same corner every round on a given map — a hazard
      // you can learn where to expect is a hazard; one that moves is just noise.
      //
      // WHICH kind is declared by the LEVEL. It used to be the string 'snowman'
      // written in here, which was fine while Glacier was the only map with a
      // hazard and would have quietly made the witch harmless the moment a
      // second one existed.
      const angry = !!level.hazard && kind === level.hazard && !angryDone;
      builder(g, angry);
      if (angry) {
        addScowl(g, kind);
        angryDone = true;
        angryPos = [spot[0], spot[1]];
        angryGroup = g;
        heldBomb = buildHeldBomb();
        g.add(heldBomb);
      }
      g.position.set(wx(spot[0]), 1.02, wz(spot[1]));
      g.rotation.y = spot[2] + (i % 2 ? 0.25 : -0.2);
      // Per-spot variation, times whatever the builder asked for. A ghost and a
      // toadstool are not the same size of thing and one shared number said they
      // were.
      const s = (0.82 + (i % 3) * 0.07) * (g.userData.scale || 1);
      g.scale.setScalar(s);
      g.traverse(o => { if (o.isMesh) o.userData.ownGeometry = true; });
      register(g, i);
      // ...and if this kind of thing moves under its own steam, sign it up.
      const idle = g.userData.float ? FLOAT
                 : g.userData.hover ? HOVER
                 : g.userData.flicker ? FLICKER : null;
      if (idle) {
        g.userData.restY = 1.02;
        g.userData.restX = g.position.x;
        g.userData.restZ = g.position.z;
        g.userData.light = null;
        g.traverse(o => { if (o.isLight) g.userData.light = o; });
        // WHICH WAY IS ONTO THE BOARD, from where this one stands. A ghost on
        // the left wall goes right to cross the arena; one on the front wall
        // goes back. Worked out from the spot rather than guessed, so a prop
        // moved to a different wall keeps behaving.
        const inward = spot[0] === 0 ? { x: 1, z: 0 }
                     : spot[0] === CFG.COLS - 1 ? { x: -1, z: 0 }
                     : spot[1] === 0 ? { x: 0, z: 1 }
                     : { x: 0, z: -1 };
        g.userData.inward = inward;
        g.userData.along = { x: inward.z, z: inward.x };   // perpendicular
        drifting.push({ g, fn: idle, phase: i * 1.31 });
      }
      // Anything in the back HALF of the board still counts towards the roofline
      // the card strip is placed against — nothing stands on the back wall any
      // more, but a prop two tiles down the side is still up in that band.
      if (spot[1] <= 2) {
        g.updateMatrixWorld(true);
        const bb = new THREE.Box3().setFromObject(g);
        // How far this kind of thing can rise off its rest position. Named
        // explicitly rather than read off the function — Function.name is the
        // sort of thing that survives every test and dies to a minifier.
        const lift = g.userData.float ? DRIFT_UP.FLOAT
                   : g.userData.hover ? DRIFT_UP.HOVER : 0;
        backTop = Math.max(backTop, bb.max.y + lift);
      }
      group.add(g);
    });
    return group;
  }

  // WHAT MOVES, AND HOW.
  //
  // Props stood dead still until now — they are scenery bolted to the wall. A
  // ghost that does not move is a white cone, so this level needed them alive.
  // Each is a pure function of (group, time): no state of its own, so a prop can
  // be built, ticked, thrown away and rebuilt without anything to reset.
  //
  // Every one of them works from the rest position stashed at build time rather
  // than from wherever the prop currently is, or a blast that knocks them about
  // would leave them permanently displaced.
  // A GHOST GOES WANDERING. Bobbing on the spot is a decoration; leaving and
  // coming back is a thing that lives there.
  //
  // Two kinds of excursion, alternating, so neither becomes the only thing it
  // does: a longer patrol ALONG its own wall, and a shorter drift OUT over the
  // playing area and straight back. The board one is deliberately the smaller of
  // the two — a ghost parked over the middle of the arena is scenery in the way
  // of the game.
  //
  // Driven by a periodic function of the clock, not by a random roll per frame:
  // the same ghost does the same thing at the same time on every machine, which
  // is what makes it testable at all.
  const WANDER_PERIOD = 13;        // seconds for one out-and-back, per ghost
  const WANDER_ACTIVE = 0.45;      // ...of which this fraction is spent moving
  const PATROL_TILES = 3;          // along its own wall
  const CROSS_TILES = 1.9;         // out over the board — under two squares
  function FLOAT(g, t, phase) {          // ghosts: bob, sway, turn, fade, wander
    const u = g.userData;
    // Where we are in this ghost's own cycle, and which cycle it is
    const local = t + phase * 4.3;
    const cycle = Math.floor(local / WANDER_PERIOD);
    const k = (local / WANDER_PERIOD) - cycle;
    // Out and back on a half sine: nothing to reset, and it arrives home at
    // exactly the speed it left.
    const swell = k < WANDER_ACTIVE ? Math.sin((k / WANDER_ACTIVE) * Math.PI) : 0;
    // Alternate: even cycles patrol the wall, odd ones cross the board. The
    // direction of a patrol flips every other time so it does not always set off
    // the same way.
    const crossing = (cycle & 1) === 1;
    const dir = crossing ? u.inward : u.along;
    const sign = crossing ? 1 : ((cycle & 2) ? -1 : 1);
    const reach = (crossing ? CROSS_TILES : PATROL_TILES) * CFG.TILE * swell * sign;
    const dx = (dir ? dir.x : 0) * reach;
    const dz = (dir ? dir.z : 0) * reach;

    g.position.y = u.restY + 0.16 + Math.sin(t * 1.15 + phase) * 0.13
                 // rides a little higher while it is out over the board
                 + (crossing ? swell * 0.35 : 0);
    g.position.x = u.restX + dx + Math.sin(t * 0.47 + phase * 1.7) * 0.22;
    g.position.z = (u.restZ === undefined ? g.position.z : u.restZ) + dz;
    // Faces the way it is going while it is going somewhere
    const turn = Math.abs(reach) > 0.05 ? Math.atan2(dx, dz) : 0;
    g.rotation.y = u.rest + Math.sin(t * 0.63 + phase) * 0.45 + turn * 0.55 * swell;
    // Breathing opacity — the difference between a floating sheet and a balloon.
    // Thinner while it is out over the arena, so it never hides a tile outright.
    const o = 0.62 + 0.2 * (0.5 + 0.5 * Math.sin(t * 0.8 + phase * 2.1)) - swell * (crossing ? 0.22 : 0);
    g.traverse(m => { if (m.isMesh && m.material && m.material.transparent) m.material.opacity = o; });
  }
  function HOVER(g, t, phase) {          // the witch: rocks on her heels, slowly
    g.position.y = g.userData.restY + 0.06 + Math.sin(t * 0.9 + phase) * 0.05;
    g.rotation.z = Math.sin(t * 0.72 + phase) * 0.07;
    g.rotation.y = g.userData.rest + Math.sin(t * 0.31 + phase) * 0.18;
  }
  function FLICKER(g, t, phase) {        // pumpkins: a candle, not a light bulb
    if (!g.userData.light) return;
    const f = 0.62 + 0.3 * Math.sin(t * 7.3 + phase) * Math.sin(t * 2.9 + phase * 3.1);
    g.userData.light.intensity = Math.max(0.15, f * 1.5);
  }

  // WHEN A BIG ONE GOES OFF, THE EDGE MOVES TOO.
  //
  // The camera shake alone says "that was loud" and the board says nothing back:
  // the props stand on the outer wall dead still through a blast that shook the
  // whole picture. These wobble instead — a decaying rock about the base, out of
  // phase per prop so it reads as six separate objects taking a knock rather than
  // one rigid row.
  //
  // Driven from the SIMULATION step like the camera shake, so it freezes with the
  // game when paused and is testable without rendering a frame.
  const shaken = [];
  const drifting = [];
  function register(g, i) {
    g.userData.rest = g.rotation.y;
    g.userData.phase = i * 1.7;
    shaken.push(g);
  }
  function clear() { shaken.length = 0; drifting.length = 0; driftT = 0; }

  let shakeT = 0, shakeAmp = 0, driftT = 0;
  function hit(amount) {
    // Takes the same number the camera does, so one blast cannot shake the props
    // hard and the camera gently. Capped, and it tops up rather than resetting.
    shakeAmp = Math.min(shakeAmp + amount, 0.5);
  }
  function tick(dt) {
    // The things that move on their own go FIRST, so a blast still overrides
    // them for as long as it lasts — being knocked about should beat drifting.
    if (drifting.length) {
      driftT += dt;
      for (let i = 0; i < drifting.length; i++) {
        const d = drifting[i];
        d.fn(d.g, driftT, d.phase);
      }
    }
    if (shakeAmp <= 0) return;
    shakeT += dt;
    shakeAmp = Math.max(0, shakeAmp - dt * 1.6);
    for (let i = 0; i < shaken.length; i++) {
      const g = shaken[i];
      const t = shakeT * 26 + g.userData.phase;
      g.rotation.y = g.userData.rest + Math.sin(t) * shakeAmp * 0.55;
      g.rotation.z = Math.sin(t * 0.8 + 1.1) * shakeAmp * 0.35;
      g.position.y = 1.02 + Math.abs(Math.sin(t * 0.5)) * shakeAmp * 0.12;
    }
    if (shakeAmp === 0) {
      // Settle exactly, so a prop cannot drift a degree per blast. Anything with
      // an idle animation is put back on its baseline here too and picks its own
      // motion up again on the next tick.
      shaken.forEach(g => {
        g.rotation.y = g.userData.rest;
        g.rotation.z = 0;
        g.position.y = 1.02;
      });
    }
  }

  return { build, tick, hit, clear, KINDS: Object.keys(BUILD), SPOTS,
           get shaking() { return shakeAmp; },
           get moving() { return drifting.length; },
           // World y the back row reaches, drift included. 0 on a bare level.
           get backTop() { return backTop; },
           windUp, throwOrigin,
           get holding() { return !!heldBomb && heldBomb.visible; },
           // Null on every map without one, which is what switches the hazard off
           get angryAt() { return angryPos; } };
})();


/* ==== 40-entities.js ============================================== */
/* ============================================================================
   SECTION 40 — ENTITIES: players, bombs, blasts, power-ups
   ========================================================================== */

/* ------------------------------------------------------ CHARACTER MODELS -- */
const CharacterModels = (() => {
  const cache = new Map();
  let runtimePromise = null;

  function runtime() {
    if (window.BFCharacter3D) return Promise.resolve(window.BFCharacter3D);
    if (runtimePromise) return runtimePromise;
    runtimePromise = new Promise((resolve, reject) => {
      const started = performance.now();
      const check = () => {
        if (window.BFCharacter3D) { resolve(window.BFCharacter3D); return; }
        if (performance.now() - started > 12000) {
          reject(new Error('Character model runtime did not initialise'));
          return;
        }
        setTimeout(check, 30);
      };
      check();
    });
    return runtimePromise;
  }

  function source(def) {
    if (!cache.has(def.model)) {
      cache.set(def.model, runtime().then(RT => {
        const loader = new RT.GLTFLoader();
        return loader.loadAsync(def.model).then(gltf => ({ RT, gltf }));
      }));
    }
    return cache.get(def.model);
  }

  function animationController(RT, model, clips, def) {
    if (!clips || !clips.length) return null;
    const mixer = new RT.THREE.AnimationMixer(model);
    const named = new Map(clips.map(clip => [clip.name.toLowerCase(), clip]));
    const find = (...names) => {
      for (const name of names) {
        const clip = named.get(String(name || '').toLowerCase());
        if (clip) return clip;
      }
      return null;
    };
    const idle = find('Idle', 'Flying_Idle') || clips[0];
    const expression = find(def.expression, 'Yes', 'Wave', 'Punch', 'Headbutt') || idle;
    const altExpression = find(def.altExpression, 'Weapon', 'Punch', 'Wave', 'Yes', 'Headbutt') || expression;
    let current = null;
    let currentClip = null;
    let lastT = null;
    let showcaseBeat = null;
    let showcaseEpoch = null;

    const play = (clip, once) => {
      if (!clip || currentClip === clip) return;
      const next = mixer.clipAction(clip);
      next.reset();
      next.enabled = true;
      next.clampWhenFinished = !!once;
      next.setLoop(once ? RT.THREE.LoopOnce : RT.THREE.LoopRepeat, once ? 1 : Infinity);
      next.fadeIn(0.16).play();
      if (current) current.fadeOut(0.16);
      current = next;
      currentClip = clip;
    };

    play(idle, false);
    return {
      update(t) {
        const dt = lastT === null ? 0 : Math.min(0.05, Math.max(0, t - lastT));
        lastT = t;
        mixer.update(dt);
      },
      showcase(t) {
        if (showcaseEpoch === null) showcaseEpoch = t;
        // Lead with the signature move whenever a fighter is selected, then
        // breathe briefly before replaying it. This reads as deliberate
        // personality instead of a model idling for several seconds.
        const phase = (t - showcaseEpoch) % 5.6;
        const beat = phase < 1.65 ? 0 : phase < 2.2 ? 1 : phase < 3.95 ? 2 : 3;
        if (beat === showcaseBeat) return;
        showcaseBeat = beat;
        const clip = beat === 0 ? expression : beat === 2 ? altExpression : idle;
        play(clip, clip !== idle);
      },
      reset() {
        showcaseBeat = null;
        showcaseEpoch = null;
        play(idle, false);
      },
    };
  }

  function prepareMaterial(RT, material, def) {
    const copy = material.clone();
    if (copy.map) {
      copy.map.colorSpace = RT.THREE.SRGBColorSpace;
      copy.map.anisotropy = Math.max(copy.map.anisotropy || 1, 8);
      copy.map.needsUpdate = true;
    }
    if (copy.isMeshStandardMaterial || copy.isMeshPhysicalMaterial) {
      copy.roughness = 0.3;
      copy.metalness = Math.min(copy.metalness || 0, 0.08);
      if (copy.emissive) {
        if (copy.map) {
          copy.emissiveMap = copy.map;
          copy.emissive.setHex(0xffffff);
          copy.emissiveIntensity = 0.11;
        } else {
          copy.emissive.setHex(def.color).multiplyScalar(0.06);
          copy.emissiveIntensity = 0.38;
        }
      }
    }
    copy.flatShading = false;
    copy.dithering = true;
    copy.needsUpdate = true;
    return copy;
  }

  function create(def) {
    const group = new THREE.Group();
    group.userData.combatClass = def.name.toLowerCase().replace(/[^a-z0-9]+/g, '-');
    group.userData.modelReady = false;

    // The seat ring is below the model, never across a face or body feature.
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(0.2, 0.3, 30),
      new THREE.MeshBasicMaterial({
        color: def.color, transparent: true, opacity: 0.62,
        side: THREE.DoubleSide, depthWrite: false, toneMapped: false,
      })
    );
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.014;
    ring.renderOrder = 2;
    group.add(ring);

    const aura = new THREE.Mesh(
      new THREE.SphereGeometry(0.52, 18, 14),
      new THREE.MeshBasicMaterial({
        color: 0x7bd83a, transparent: true, opacity: 0.2,
        blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false,
      })
    );
    aura.position.y = 0.55;
    aura.visible = false;
    group.add(aura);
    group.userData.aura = aura;

    group.userData.modelPromise = source(def).then(({ RT, gltf }) => {
      if (group.userData.cancelled) return false;
      const model = RT.clone(gltf.scene);
      model.traverse(object => {
        if (!object.isMesh) return;
        object.castShadow = true;
        object.receiveShadow = true;
        if (Array.isArray(object.material)) {
          object.material = object.material.map(material => prepareMaterial(RT, material, def));
        } else if (object.material) {
          object.material = prepareMaterial(RT, object.material, def);
        }
      });

      model.updateMatrixWorld(true);
      let box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const fit = Math.min(
        0.72 / Math.max(size.x, 0.001),
        0.95 / Math.max(size.y, 0.001),
        0.72 / Math.max(size.z, 0.001)
      );
      model.scale.setScalar(fit);
      model.updateMatrixWorld(true);
      box = new THREE.Box3().setFromObject(model);
      const centre = box.getCenter(new THREE.Vector3());
      model.position.set(-centre.x, -box.min.y + (def.flying ? 0.11 : 0), -centre.z);
      model.updateMatrixWorld(true);
      group.add(model);
      group.userData.modelRoot = model;

      const controller = animationController(RT, model, gltf.animations, def);
      if (controller) {
        group.userData.cosAnim = [t => controller.update(t)];
        group.userData.showcaseAnim = t => controller.showcase(t);
        group.userData.showcaseReset = () => controller.reset();
      }
      group.userData.animationCount = gltf.animations.length;
      group.userData.modelReady = true;
      return true;
    }).catch(error => {
      group.userData.modelError = String(error && (error.message || error));
      console.error('Could not load fighter model:', def.name, error);
      return false;
    });

    return group;
  }

  return { create };
})();

/* ---------------------------------------------------------------- PLAYER -- */
class Player {
  constructor(seat, def, isHuman) {
    this.seat = seat;
    this.def = def;
    this.isHuman = isHuman;
    this.wins = 0;
    this.kit = defaultLoadout();
    this.mesh = Player.buildMesh(def, this.kit);
    this.aura = this.mesh.userData.aura;
    World.scene.add(this.mesh);
    this.reset();
  }

  // Rebuild with an explicit kit when a diagnostic needs it. Normal matches
  // always use the character's standard silhouette and default bomb.
  applyLoadout(kit) {
    const next = kit || defaultLoadout();
    if (this.kit && COSMETIC_SLOTS.every(s => this.kit[s] === next[s])) return false;
    this.kit = next;
    const old = this.mesh;
    World.scene.remove(old);
    old.userData.cancelled = true;
    old.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.dispose());
    });
    this.mesh = Player.buildMesh(this.def, next);
    this.aura = this.mesh.userData.aura;
    Player.applyViewScale(this.mesh);
    this.mesh.visible = this.alive !== false;
    World.scene.add(this.mesh);
    this.syncMesh();
    return true;
  }

  reset() {
    const s = SPAWNS[this.seat];
    this.gx = s.x; this.gy = s.y;
    this.alive = true;
    this.speed = CFG.BASE_SPEED;
    this.maxBombs = CFG.START_BOMBS;
    this.fire = CFG.START_FIRE;
    this.activeBombs = 0;
    // Total laid this round, not the live count. Drives the heart hint: once
    // anyone is three bombs in, nobody is going to stumble onto it by accident.
    this.bombsLaid = 0;
    this.dir = { x: 0, y: 1 };                  // last facing, used by punch
    this.ignoreBombs = new Set();
    this.bob = 0;
    this.kickT = 0;                             // phase for the gold boot pulse
    this.deathT = 0;
    // Cleared with the round, or last round's stamp decides this round's winner
    this.deathOrder = null;
    // THE JETPACK HOP. `airT` counts down while you are off the ground; nothing
    // on the floor can touch you until it runs out. `hopCool` stops it being
    // held down as permanent immunity.
    this.airT = 0;
    this.hopCool = 0;

    // Abilities from collectables
    this.kick = false;
    this.punch = false;
    this.glove = false;
    this.remote = false;
    this.pierce = false;
    this.bombPass = false;
    this.blockPass = false;
    this.mine = false;
    this.shield = false;

    this.carrying = null;      // bomb held above the head (Power Glove)
    this.padCool = 0;          // stops a pair of pads bouncing you forever
    this.slideV = { x: 0, y: 0 };  // momentum, on ice only
    this.curse = null;         // { id, t }
    this.curseLock = 0;
    this.invuln = 0;
    this.autoBombT = 0;
    this.dustT = 0;
    this.speedT = 0;           // seconds of Speed Up left; 0 = back to base

    this.mesh.visible = true;
    Player.applyViewScale(this.mesh);
    this.mesh.rotation.set(0, 0, 0);
    this.syncMesh();
  }

  // ---- Effective stats: curses override the underlying values -------------
  // Speed Ups collected, derived from the stat rather than tracked separately
  get speedLevel() {
    return Math.max(0, Math.round((this.speed - CFG.BASE_SPEED) / CFG.SPEED_STEP));
  }

  get effSpeed() {
    if (!this.curse) return this.speed;
    if (this.curse.id === 'slow') return 1.85;
    if (this.curse.id === 'hyper') return CFG.MAX_SPEED + 0.8;
    return this.speed;
  }
  get effFire() {
    return this.curse && this.curse.id === 'minifire' ? 1 : this.fire;
  }
  get canBomb() {
    return !(this.curse && this.curse.id === 'nobomb');
  }

  applyCurse(id) {
    const pick = id || CURSES[(Math.random() * CURSES.length) | 0].id;
    this.curse = { id: pick, t: CFG.CURSE_TIME };
    this.curseLock = CFG.CURSE_TOUCH_LOCK;
  }

  get tileX() { return Math.round(this.gx); }
  get tileY() { return Math.round(this.gy); }

  // -- Collision ------------------------------------------------------------
  // Tiles the player's body overlaps right now. A bomb sitting on one of these
  // must never block movement: you are already inside it, so blocking would
  // trap you where you stand. This applies whoever dropped it — being sealed in
  // by an opponent's bomb was a real way to lose with no counterplay.
  currentFootprint() {
    const r = CFG.PLAYER_RADIUS;
    return {
      x0: Math.floor(this.gx - r + 0.5), x1: Math.floor(this.gx + r + 0.5),
      y0: Math.floor(this.gy - r + 0.5), y1: Math.floor(this.gy + r + 0.5),
    };
  }

  // `air` is passed rather than read off the player so a caller can ask the
  // GROUND question of an airborne one — which is exactly what landing has to
  // do to decide whether it needs to put them somewhere else.
  blockedAt(px, py, air) {
    if (air === undefined) air = this.airT > 0;
    const r = CFG.PLAYER_RADIUS;
    const x0 = Math.floor(px - r + 0.5), x1 = Math.floor(px + r + 0.5);
    const y0 = Math.floor(py - r + 0.5), y1 = Math.floor(py + r + 0.5);
    const here = this.currentFootprint();
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        // OFF THE GROUND, ONLY THE ARENA'S OWN EDGE STOPS YOU. Pillars, crates,
        // sudden-death blocks and bombs all pass underneath — that is the whole
        // point of the hop. The outer wall does not: a jetpack is a way over a
        // block, not a way out of the match.
        if (air) {
          if (x < 1 || y < 1 || x > CFG.COLS - 2 || y > CFG.ROWS - 2) return true;
          continue;
        }
        const cell = World.cellAt(x, y);
        if (cell === CELL.HARD) return true;
        if (cell === CELL.SOFT && !this.blockPass) return true;
        if (cell === CELL.EMPTY) {
          const k = World.key(x, y);
          const b = Game.bombAt(k);
          if (!b || this.bombPass || b === this.carrying) continue;
          if (this.ignoreBombs.has(k)) continue;
          // Standing on it already? Then walk out of it.
          const inside = x >= here.x0 && x <= here.x1 && y >= here.y0 && y <= here.y1;
          if (inside) continue;
          return true;
        }
      }
    }
    return false;
  }

  // Sub-stepped move so the player finishes flush against a wall
  slide(axis, delta) {
    let remaining = delta;
    for (let i = 0; i < 4 && Math.abs(remaining) > 1e-4; i++) {
      const nx = axis === 'x' ? this.gx + remaining : this.gx;
      const ny = axis === 'y' ? this.gy + remaining : this.gy;
      if (!this.blockedAt(nx, ny)) { this.gx = nx; this.gy = ny; return true; }
      remaining *= 0.5;
    }
    return false;
  }

  update(dt, dir, wantsBomb) {
    if (!this.alive) { this.updateDeath(dt); return; }

    // Timers
    if (this.invuln > 0) this.invuln -= dt;
    if (this.curseLock > 0) this.curseLock -= dt;
    if (this.airT > 0) {
      this.airT -= dt;
      // COMING DOWN. Whatever you were over is what you land on, and if that
      // is a block you have to be put somewhere: a player left standing inside
      // a pillar is unreachable and the round cannot end.
      if (this.airT <= 0) { this.airT = 0; this.land(); }
    }
    if (this.hopCool > 0) this.hopCool -= dt;
    // Speed Ups are temporary: when the clock runs out every one of them
    // lapses at once and the player drops straight back to base speed.
    if (this.speedT > 0) {
      this.speedT -= dt;
      if (this.speedT <= 0) { this.speedT = 0; this.speed = CFG.BASE_SPEED; }
    }
    if (this.curse) {
      this.curse.t -= dt;
      if (this.curse.t <= 0) this.curse = null;
    }

    // Reversed controls curse
    if (this.curse && this.curse.id === 'reverse') dir = { x: -dir.x, y: -dir.y };

    // Bomb fever: drops one wherever you stand, whether you like it or not
    if (this.curse && this.curse.id === 'autobomb') {
      this.autoBombT -= dt;
      if (this.autoBombT <= 0) { this.autoBombT = 0.55; wantsBomb = true; }
    }

    // ICE. A MOVE COMMITS YOU TO THE WHOLE RUN.
    //
    // The first version treated ice as momentum you could steer against, and it
    // was not ice: pressing the opposite way reversed you on the spot, so the
    // rink cost you nothing and taught you nothing. This is the classic model
    // instead — you set off in a direction and you keep going until something
    // stops you, and only then do you get to choose again.
    //
    // Axis-locked on purpose. Grid movement already only travels on one axis at
    // a time, and a diagonal drift would fight the auto-centring that makes
    // turning feel tight everywhere else in the game.
    if (!this.slideV) this.slideV = { x: 0, y: 0 };
    if (World.ruleAt(this.tileX, this.tileY) === RULE.ICE) {
      const going = this.slideV.x || this.slideV.y;
      if (!going && (dir.x || dir.y)) {
        // Setting off: take the axis the player asked for.
        this.slideV = dir.x ? { x: Math.sign(dir.x), y: 0 } : { x: 0, y: Math.sign(dir.y) };
        this.iceStuck = 0;
      } else if (going) {
        // Already running. Did we actually get anywhere since last frame? If
        // not, something is in the way and the slide is over — that is what
        // hands control back, rather than a timer that would be wrong on every
        // different length of run.
        const prev = this.icePrev;
        if (prev && Math.abs(this.gx - prev.x) + Math.abs(this.gy - prev.y) < 0.004) {
          this.iceStuck = (this.iceStuck || 0) + dt;
          if (this.iceStuck > 0.06) { this.slideV = { x: 0, y: 0 }; this.iceStuck = 0; }
        } else this.iceStuck = 0;
        dir = { x: this.slideV.x, y: this.slideV.y };
      }
      this.icePrev = { x: this.gx, y: this.gy };
    } else if (this.slideV.x || this.slideV.y) {
      // Off the ice, grip comes back at once.
      this.slideV = { x: 0, y: 0 };
      this.icePrev = null;
    }

    const step = this.effSpeed * dt;
    let moved = false;

    if (dir.x !== 0) {
      this.dir = { x: dir.x, y: 0 };
      // Auto-centre on the row: this is what makes grid movement feel tight
      this.gy = approach(this.gy, Math.round(this.gy), step * CFG.TURN_SNAP);
      const before = this.gx;
      moved = this.slide('x', dir.x * step) || moved;
      if (this.gx === before) Game.tryKick(this, dir);
      this.mesh.rotation.y = dir.x > 0 ? Math.PI / 2 : -Math.PI / 2;
    } else if (dir.y !== 0) {
      this.dir = { x: 0, y: dir.y };
      this.gx = approach(this.gx, Math.round(this.gx), step * CFG.TURN_SNAP);
      const before = this.gy;
      moved = this.slide('y', dir.y * step) || moved;
      if (this.gy === before) Game.tryKick(this, dir);
      this.mesh.rotation.y = dir.y > 0 ? 0 : Math.PI;
    }

    // THE FLOOR MOVES. A belt carries whatever is standing on it, and it is
    // applied AFTER steering rather than instead of it, so walking against the
    // current works and simply costs you ground. BELT_SPEED is well under
    // BASE_SPEED on purpose: a belt you cannot beat is a wall that looks like a
    // floor.
    //
    // Judged on the CENTRE TILE, like everything else that asks "where is this
    // player" (invariant 13) — half on a belt and half off is on it.
    // Gated on the OVERLAY, not on the level. Asking `level.rule` first was a
    // saving worth nothing — beltAt is one array lookup — and it made the
    // overlay and the behaviour disagree, which is the exact failure this whole
    // design is meant to make impossible.
    // TELEPORT PADS. Stepping onto one puts you on its twin, and the twin
    // starts its own cooldown as well as this one's — without that you arrive
    // on a pad and are immediately sent back, which is a loop with a character
    // trapped inside it rather than a mechanic.
    if (this.padCool > 0) this.padCool -= dt;
    if (!this.airborne && this.padCool <= 0) {
      const twin = World.padTwin(this.tileX, this.tileY);
      if (twin) {
        this.gx = twin.x; this.gy = twin.y;
        this.padCool = CFG.PAD_COOLDOWN;
        // Anything mid-step is finished here rather than carried across: a
        // player arriving off-lane on the far side of the board slides into the
        // first wall they meet.
        this.dir = { x: 0, y: 0 };
        this.ignoreBombs.clear();
        Game.spawnPuff(twin.x, twin.y, 0x6ef0ff);
        Audio3.pickup();
      }
    }

    if (!this.airborne) {
      const belt = World.beltAt(this.tileX, this.tileY);
      if (belt) {
        // A BELT DOES NOT STEER YOU, IT ONLY CARRIES YOU. The first version
        // re-centred the perpendicular axis the way the player's own movement
        // does — and that is a steering affordance, not a property of the
        // floor. Walking across a belt then meant the player pulling one way
        // and the belt snapping them back the other, netting almost exactly
        // zero: a bot stood in that tug-of-war for 33 seconds and read as
        // completely frozen.
        const carry = CFG.BELT_SPEED * dt;
        this.slide(belt.x ? 'x' : 'y', (belt.x || belt.y) * carry);
      }
    }

    // Release bomb-pass once the player has fully stepped off that tile
    if (this.ignoreBombs.size) {
      for (const k of Array.from(this.ignoreBombs)) {
        const [bx, by] = k.split(',').map(Number);
        if (Math.abs(this.gx - bx) > 0.5 + CFG.PLAYER_RADIUS ||
            Math.abs(this.gy - by) > 0.5 + CFG.PLAYER_RADIUS) {
          this.ignoreBombs.delete(k);
        }
      }
    }

    if (wantsBomb) Game.tryAction(this);

    this.bob = moved ? this.bob + dt * 13 : approach(this.bob, 0, dt * 10);
    // The boot pulse runs whether you are moving or standing still — Kick is a
    // thing you HAVE, not a thing you are doing.
    this.kickT = this.kick ? this.kickT + dt : 0;

    // Speed Ups kick up a visible trail — the more you hold, the more smoke
    const lvl = this.speedLevel + (this.curse && this.curse.id === 'hyper' ? 3 : 0);
    if (moved && lvl > 0) {
      this.dustT -= dt;
      if (this.dustT <= 0) {
        this.dustT = Math.max(0.16 - lvl * 0.022, 0.045);
        Game.spawnDust(this.gx, this.gy, 0xdfe7f2, lvl);
      }
    } else {
      this.dustT = 0;
    }

    this.syncMesh();
  }

  syncMesh() {
    // Gold shoes mean Kick. Compared before writing so an unchanged pair costs a
    // boolean per frame rather than a material update.
    const sm = this.mesh.userData.shoeMat;
    if (sm && !!this.mesh.userData.shoesGold !== !!this.kick) {
      this.mesh.userData.shoesGold = !!this.kick;
      sm.color.setHex(this.kick ? SHOE_GOLD : SHOE_BLACK);
      sm.emissive.setHex(this.kick ? SHOE_GLOW : 0x000000);
      sm.emissiveIntensity = 1;
    }
    // AND THEY BREATHE. Even at their new size the boots are about a seventh of
    // the character, and a seventh of a 22-pixel-wide sprite is easy to look
    // straight past. A patch that changes brightness is not: movement is what
    // the eye picks up at this size, which is why the heart pulses and the
    // sudden-death skulls flash rather than simply being red. Only written
    // while Kick is actually held.
    if (sm && this.kick) {
      const k = 0.5 + 0.5 * Math.sin(this.kickT * SHOE_PULSE_RATE);
      sm.emissiveIntensity = SHOE_PULSE_LOW + (SHOE_PULSE_HIGH - SHOE_PULSE_LOW) * k;
    }
    // A half-sine over the hop, so the rise and the fall are one motion and the
    // top of the arc is the middle of the immune window rather than the end.
    const lift = this.airT > 0
      ? Math.sin((1 - this.airT / CFG.HOP_TIME) * Math.PI) * CFG.HOP_HEIGHT : 0;
    this.mesh.position.set(World.wx(this.gx),
      0.02 + Math.abs(Math.sin(this.bob)) * 0.07 + lift, World.wz(this.gy));
    // Characters are drawn slightly larger than their collision box purely for
    // readability from the overhead camera. Collision still uses PLAYER_RADIUS.
    const S = Player.VIEW_SCALE, SY = Player.VIEW_SCALE_Y;
    const squash = 1 + Math.sin(this.bob * 2) * 0.03;
    this.mesh.scale.set(S / squash, SY * squash, S / squash);

    // A held bomb rides above the head until it is thrown
    if (this.carrying) {
      this.carrying.mesh.position.set(
        this.mesh.position.x,
        this.mesh.position.y + 1.25,
        this.mesh.position.z
      );
    }
    // Flash while the shield's grace period is running
    if (this.invuln > 0) {
      this.mesh.visible = Math.floor(this.invuln * 14) % 2 === 0;
    } else if (this.alive) {
      this.mesh.visible = true;
    }
    // Cursed players glow a sickly green
    if (this.aura) this.aura.visible = !!this.curse;
  }

  // force = there is nothing to survive. A closing wall lands ON your tile and
  // that tile becomes solid: absorbing the hit with a shield left you standing
  // ALIVE inside a block, unreachable, with the round unable to end. An extra life
  // is protection from a blast, not from being built into a wall.
  // What the special button does for this player right now, or null.
  get special() { return kitSpecial(this.kit); }
  get airborne() { return this.airT > 0; }

  // UP AND OVER. Short, and on a cooldown longer than itself, so it is a dodge
  // you time rather than a way to live in the air. You still cannot be in two
  // tiles at once — the hop does not move you, it takes you out of the blast.
  // WHERE YOU COME DOWN. If the ground rules are happy with where you already
  // are, you land there and nothing moves — the ordinary case, because most hops
  // end over open floor. Otherwise the nearest tile that will take you does,
  // searched outwards so you are set down beside the block you jumped rather
  // than across the board from it. Ties break in a fixed order, so the same hop
  // lands in the same place every time.
  land() {
    if (!this.blockedAt(this.gx, this.gy, false)) return null;
    const cx = Math.round(this.gx), cy = Math.round(this.gy);
    for (let ring = 1; ring <= Math.max(CFG.COLS, CFG.ROWS); ring++) {
      let best = null, bestD = Infinity;
      for (let dy = -ring; dy <= ring; dy++) {
        for (let dx = -ring; dx <= ring; dx++) {
          if (Math.max(Math.abs(dx), Math.abs(dy)) !== ring) continue;
          const x = cx + dx, y = cy + dy;
          if (x < 1 || y < 1 || x > CFG.COLS - 2 || y > CFG.ROWS - 2) continue;
          if (World.cellAt(x, y) !== CELL.EMPTY) continue;
          if (this.blockedAt(x, y, false)) continue;      // a bomb is sitting on it
          const d = (x - this.gx) ** 2 + (y - this.gy) ** 2;
          if (d < bestD - 1e-9) { bestD = d; best = { x, y }; }
        }
      }
      if (best) {
        this.gx = best.x; this.gy = best.y;
        this.ignoreBombs.clear();
        return best;
      }
    }
    return null;                                          // nowhere at all to go
  }

  hop() {
    if (!this.alive || this.airT > 0 || this.hopCool > 0) return false;
    this.airT = CFG.HOP_TIME;
    this.hopCool = CFG.HOP_COOLDOWN;
    Audio3.hop();
    return true;
  }

  kill(force) {
    if (!this.alive) return;
    // OFF THE GROUND. A blast is a thing that happens on the floor, and the
    // whole point of the hop is that it goes underneath you. A closing WALL
    // still gets you — it fills the space you are going to land in — which is
    // why this sits after the `force` check rather than before it.
    if (!force && this.airT > 0) return;
    if (!force && this.invuln > 0) return;
    if (!force && this.shield) {
      // The shield eats one hit and buys a moment of flashing safety
      this.shield = false;
      this.invuln = CFG.SHIELD_INVULN;
      Audio3.shieldBreak();
      Game.spawnPuff(this.gx, this.gy, 0xff4d6d);
      return;
    }
    if (this.carrying) { Game.dropCarried(this); }
    this.alive = false;
    this.deathT = 0;
    // WHEN, in simulation steps, so the round can tell who went last. A counter
    // rather than a clock: two players caught by the same blast on the same step
    // get the same number and that is a genuine dead heat, while two crushed by
    // walls a fraction apart do not.
    this.deathOrder = Game.nextDeathOrder();
    Audio3.death();
    Game.spawnPuff(this.gx, this.gy, this.def.color);
  }

  updateDeath(dt) {
    this.deathT += dt;
    const t = Math.min(this.deathT / 0.7, 1);
    this.mesh.rotation.y += dt * 14;
    const k = Math.max(0.001, 1 - t);
    this.mesh.scale.set(k * Player.VIEW_SCALE, k * Player.VIEW_SCALE_Y, k * Player.VIEW_SCALE);
    this.mesh.position.y = 0.02 + Math.sin(t * Math.PI) * 0.8;
    if (t >= 1) this.mesh.visible = false;
  }

  // -- Model ---------------------------------------------------------------
  // Walk a built character's registered animators. One entry point, called from
  // the render loop for every live player and for the locker's preview — an
  // animated cosmetic must look identical in both or the locker is lying.
  // One place that knows the shape, so a preview and a corpse cannot disagree
  static applyViewScale(mesh, k) {
    const f = k === undefined ? 1 : k;
    mesh.scale.set(f * Player.VIEW_SCALE, f * Player.VIEW_SCALE_Y, f * Player.VIEW_SCALE);
  }

  static tickCosmetics(mesh, t) {
    const list = mesh && mesh.userData && mesh.userData.cosAnim;
    if (list) for (let i = 0; i < list.length; i++) list[i](t);
  }

  static tickShowcase(mesh, t) {
    const fn = mesh && mesh.userData && mesh.userData.showcaseAnim;
    if (fn) fn(t);
  }

  static resetShowcase(mesh) {
    const fn = mesh && mesh.userData && mesh.userData.showcaseReset;
    if (fn) fn();
  }

  static buildMesh(def, loadout) {
    if (def.model) return CharacterModels.create(def, loadout);
    const g = new THREE.Group();
    const kit = loadout || {};
    const finish = cosmeticItem('finish', kit.finish);

    // `darken` is ours, not three's. It scales lightness and leaves hue alone,
    // which is what keeps a Shadow player still recognisably the red one — see
    // the seat-colour rule at the top of section 05.
    const mat = (c, o) => {
      const opts = Object.assign({
        color: c,
        roughness: 0.38,
        metalness: 0.04,
        clearcoat: 0.28,
        clearcoatRoughness: 0.46,
      }, o || {});
      const d = opts.darken;
      delete opts.darken;
      const m = new THREE.MeshPhysicalMaterial(opts);
      if (d) m.color.multiplyScalar(d);
      return m;
    };
    // Ask the finish how this class of surface should be made
    const styled = (role, base) => {
      const o = Object.assign({}, base || {});
      if (finish && finish[role]) finish[role](o, def.color);
      return o;
    };

    const bodyMat = mat(def.color, styled('body'));
    /* CHARACTER FINISH V2
       Keep the full seat colour. The earlier gunmetal wash made every fighter
       darker and flatter; clean colour separation and a soft clearcoat make
       the rounded forms readable without drawing construction lines on them. */
    if (!finish) {
      bodyMat.roughness = 0.36;
      bodyMat.metalness = 0.04;
      bodyMat.clearcoat = 0.34;
      bodyMat.clearcoatRoughness = 0.42;
    }
    const combatGunMat = mat(0x11151c, { roughness: 0.34, metalness: 0.72 });
    const combatBlackMat = mat(0x05070a, { roughness: 0.28, metalness: 0.58 });
    const combatGlowMat = mat(def.color, {
      roughness: 0.18, metalness: 0.42,
      emissive: def.color, emissiveIntensity: 0.72
    });
    const brightShellMat = mat(def.color, {
      roughness: 0.3, metalness: 0.24,
      emissive: def.color, emissiveIntensity: 0.22
    });
    const combatHotMat = mat(0xff4b18, {
      roughness: 0.2, metalness: 0.2,
      emissive: 0xff2600, emissiveIntensity: 1.8
    });
    // The chest panel carries the seat colour when the body itself cannot — see
    // the chrome finish. Its own roughness, so it reads as paint on metal.
    const chestSeat = !!(finish && finish.chestIsSeat);
    const bellyMat = chestSeat
      ? mat(def.color, { roughness: 0.42, metalness: 0.25 })
      : mat(def.belly, styled('body', { roughness: 0.55 }));
    const trimMat = mat(def.trim, styled('trim', { roughness: 0.35, metalness: 0.2 }));
    // SHOES, and they are a readout. Black on everyone, gold the moment you pick
    // Kick up — the one ability with no other tell on the character, and the one
    // people kept forgetting they had. Its own material so it can be recoloured
    // live without rebuilding the model, and separate from `trim` so the hands
    // keep carrying the seat colour under a chrome finish.
    const shoeMat = mat(SHOE_BLACK, { roughness: 0.42, metalness: 0.15 });
    const accentMat = mat(def.accent, styled('trim', { roughness: 0.4 }));

    /* BOMBER FAN DISTINCT OPERATIVES V3 */
    /* Each class owns its proportions and primary geometry. Nothing below is a
       shared mascot with class parts stuck on afterwards. The widest solid point
       stays inside x +/-0.41 so VIEW_SCALE preserves the gameplay footprint. */
    const combatClass = def.name.toLowerCase();
    g.userData.combatClass = combatClass;
    const anims = [];
    const boneMat = mat(0xb7b2a8, { roughness: 0.58, metalness: 0.28 });
    const stealthMat = mat(0x020307, { roughness: 0.22, metalness: 0.76 });
    const darkClothMat = mat(0x090b10, { roughness: 0.84, metalness: 0.04 });
    const add = (geo, material, p, s, r, parent) => {
      const m = new THREE.Mesh(geo, material);
      if (p) m.position.set(p[0], p[1], p[2]);
      if (s) m.scale.set(s[0], s[1], s[2]);
      if (r) m.rotation.set(r[0], r[1], r[2]);
      m.castShadow = true;
      (parent || g).add(m);
      return m;
    };
    const roundedBox = (width, height, depth, radius) => {
      const curve = Math.min(
        radius === undefined ? Math.min(width, height) * 0.16 : radius,
        width * 0.42,
        height * 0.42
      );
      const bevelSize = Math.min(curve * 0.38, width * 0.08, height * 0.08, depth * 0.22);
      const bevel = Math.min(curve * 0.4, depth * 0.22);
      const innerWidth = width - bevelSize * 2;
      const innerHeight = height - bevelSize * 2;
      const innerCurve = Math.max(0.001, curve - bevelSize);
      const shape = new THREE.Shape();
      const x = -innerWidth / 2, y = -innerHeight / 2;
      shape.moveTo(x + innerCurve, y);
      shape.lineTo(x + innerWidth - innerCurve, y);
      shape.quadraticCurveTo(x + innerWidth, y, x + innerWidth, y + innerCurve);
      shape.lineTo(x + innerWidth, y + innerHeight - innerCurve);
      shape.quadraticCurveTo(x + innerWidth, y + innerHeight, x + innerWidth - innerCurve, y + innerHeight);
      shape.lineTo(x + innerCurve, y + innerHeight);
      shape.quadraticCurveTo(x, y + innerHeight, x, y + innerHeight - innerCurve);
      shape.lineTo(x, y + innerCurve);
      shape.quadraticCurveTo(x, y, x + innerCurve, y);
      const geo = new THREE.ExtrudeGeometry(shape, {
        depth: Math.max(0.001, depth - bevel * 2),
        bevelEnabled: true,
        bevelSegments: 4,
        bevelSize,
        bevelThickness: bevel,
        curveSegments: 5,
        steps: 1,
      });
      geo.center();
      return geo;
    };
    const capsule = (radius, length, material, p, s, r, parent) =>
      add(new THREE.CapsuleGeometry(radius, length, 10, 20), material, p, s, r, parent);
    const glowOrb = (radius, p, parent) =>
      add(new THREE.SphereGeometry(radius, 28, 20), combatGlowMat, p, null, null, parent);

    if (combatClass === 'piglet') {
      // PIGLET: a clean storybook pig silhouette with short ears, an offset
      // profile snout, bright red dress, stick-like limbs and black shoes.
      // The earlier long ears and striped jumper made this read as a rabbit.
      const rig = new THREE.Group();
      rig.position.y = -0.015;
      g.add(rig);
      const pigPink = mat(0xff91b2, {
        roughness: 0.38, metalness: 0.01, clearcoat: 0.42,
        emissive: 0x64142f, emissiveIntensity: 0.07 });
      const pigLight = mat(0xffc4d6, {
        roughness: 0.4, metalness: 0.01, clearcoat: 0.35 });
      const pigRed = mat(0xe92d49, {
        roughness: 0.34, metalness: 0.03, clearcoat: 0.46,
        emissive: 0x6f071c, emissiveIntensity: 0.1 });
      const pigCheek = mat(0xff5f8c, {
        roughness: 0.42, metalness: 0.01, clearcoat: 0.25 });
      const pigFace = mat(0x1d1119, { roughness: 0.62, metalness: 0 });
      const eyeWhite = mat(0xfffbff, { roughness: 0.35, metalness: 0.01, clearcoat: 0.3 });

      // Flared dress, small legs and broad rounded shoes establish the familiar
      // proportions before any facial detail is visible.
      const dress = add(new THREE.CylinderGeometry(0.19, 0.305, 0.42, 32), pigRed,
        [0, 0.39, 0], [1, 1, 0.78], null, rig);
      const arms = [];
      [-1, 1].forEach(side => {
        const arm = capsule(0.032, 0.31, pigPink,
          [side * 0.27, 0.43, 0.015], [0.9, 1, 0.8], [0, 0, side * -0.38], rig);
        add(new THREE.SphereGeometry(0.045, 24, 18), pigPink,
          [side * 0.335, 0.265, 0.06], [1, 0.82, 0.9], null, rig);
        arms.push({ arm, side, rest: arm.rotation.z });
        capsule(0.035, 0.19, pigPink,
          [side * 0.11, 0.13, 0], [0.9, 1, 0.8], [0, 0, side * 0.05], rig);
        add(new THREE.SphereGeometry(0.095, 28, 20), pigFace,
          [side * 0.14, 0.045, 0.13], [1.22, 0.42, 1.46], [0, side * 0.08, 0], rig);
      });

      const headRig = new THREE.Group();
      headRig.rotation.y = -0.16;
      rig.add(headRig);
      const head = add(new THREE.SphereGeometry(0.29, 34, 26), pigPink,
        [-0.005, 0.79, 0.015], [1.08, 0.88, 0.82], null, headRig);
      // The snout sits to one side and forward, creating a three-quarter profile
      // rather than the old symmetrical pig mask.
      const snout = add(new THREE.SphereGeometry(0.16, 32, 24), pigLight,
        [-0.205, 0.73, 0.205], [1.32, 0.72, 0.72], null, headRig);
      [-1, 1].forEach(side => add(new THREE.SphereGeometry(0.019, 22, 16), pigFace,
        [-0.255 + side * 0.052, 0.745, 0.307], [0.8, 1.05, 0.46], null, headRig));

      // Short rounded ears, not rabbit ears.
      const ears = [];
      [[-0.105, 0.99, -0.06], [0.09, 1.015, -0.045]].forEach((p, i) => {
        const ear = capsule(0.057, 0.12, pigPink, p, [0.9, 1, 0.72],
          [0, 0, i ? -0.08 : 0.12], headRig);
        capsule(0.025, 0.07, pigCheek, [p[0], p[1], p[2] + 0.04], [0.72, 1, 0.48],
          [0, 0, i ? -0.08 : 0.12], headRig);
        ears.push({ ear, rest: ear.rotation.z, side: i ? 1 : -1 });
      });

      // Two eyes remain visible in the three-quarter view. The far eye is
      // smaller, while the cheek and smile keep the expression warm.
      [[-0.085, 0.845, 0.24, 0.043], [0.095, 0.86, 0.205, 0.052]].forEach(e => {
        add(new THREE.SphereGeometry(e[3], 26, 18), eyeWhite,
          [e[0], e[1], e[2]], [0.88, 1.12, 0.46], null, headRig);
        add(new THREE.SphereGeometry(e[3] * 0.44, 22, 16), pigFace,
          [e[0] - 0.006, e[1] - 0.005, e[2] + 0.033], [0.8, 1.05, 0.45], null, headRig);
      });
      add(new THREE.SphereGeometry(0.075, 28, 20), pigCheek,
        [0.105, 0.72, 0.238], [1, 0.88, 0.42], null, headRig);
      add(new THREE.TorusGeometry(0.072, 0.01, 10, 28, Math.PI * 0.82), pigFace,
        [0.04, 0.655, 0.267], [1, 0.64, 0.46], [Math.PI / 2, 0, 2.65], headRig);

      // A small curled tail peeks from behind the dress in profile.
      const tail = add(new THREE.TorusGeometry(0.073, 0.018, 12, 32, Math.PI * 1.65), pigPink,
        [0.245, 0.41, -0.105], [1, 1, 0.72], [0, 0, -0.45], rig);

      anims.push(t => {
        const bounce = Math.max(0, Math.sin(t * 3.2));
        rig.position.y = -0.015 + bounce * 0.045;
        headRig.rotation.y = -0.16 + Math.sin(t * 0.9) * 0.08;
        head.rotation.z = Math.sin(t * 1.8) * 0.014;
        snout.scale.z = 0.72 + Math.max(0, Math.sin(t * 2.4)) * 0.025;
        ears.forEach(({ ear, rest, side }, i) => {
          ear.rotation.z = rest + side * Math.sin(t * 2.1 + i * 0.5) * 0.045;
        });
        arms.forEach(({ arm, side, rest }, i) => {
          arm.rotation.z = rest + side * Math.sin(t * 3.2 + i) * 0.08;
        });
        dress.scale.x = 1 + bounce * 0.025;
        tail.rotation.z = -0.45 + Math.sin(t * 2.4) * 0.08;
      });
    } else if (combatClass === 'reaper') {
      // REAPER: tall inverted wedge, floating skull, long arms and torn lower points.

        [-1, 0, 1].forEach(i => add(new THREE.ConeGeometry(0.018, 0.07, 6), hornMat,
          [side * 0.37 + i * 0.04, 0.14, 0.2], null, [Math.PI / 2, 0, 0], rig));
        arms.push({ arm, hand, side, rest: arm.rotation.z });
        capsule(0.11, 0.24, orangeMat, [side * 0.17, 0.14, 0], null, null, rig);
        add(new THREE.SphereGeometry(0.14, 28, 20), orangeMat,
          [side * 0.19, 0.045, 0.13], [1.08, 0.42, 1.35], null, rig);
      });
      const headRig = new THREE.Group();
      rig.add(headRig);
      add(new THREE.SphereGeometry(0.27, 34, 26), orangeMat,
        [0, 0.79, 0.04], [1.05, 0.92, 0.9], null, headRig);
      add(new THREE.SphereGeometry(0.205, 30, 22), creamMat,
        [0, 0.72, 0.22], [1.08, 0.72, 0.66], null, headRig);
      add(new THREE.SphereGeometry(0.08, 26, 18), creamMat,
        [0, 0.76, 0.34], [1.18, 0.7, 0.5], null, headRig);
      add(new THREE.SphereGeometry(0.04, 22, 16), cuffMat,
        [0, 0.755, 0.39], [1.05, 0.8, 0.55], null, headRig);
      [-1, 1].forEach(side => {
        add(new THREE.SphereGeometry(0.05, 24, 18), eyeWhite,
          [side * 0.11, 0.83, 0.25], [1, 1.2, 0.5], null, headRig);
        add(new THREE.SphereGeometry(0.019, 20, 14), redMat,
          [side * 0.11, 0.83, 0.282], null, null, headRig);
        add(roundedBox(0.12, 0.03, 0.02, 0.01), redMat,
          [side * 0.11, 0.9, 0.245], null, [0, 0, side * -0.32], headRig);
        add(new THREE.ConeGeometry(0.07, 0.23, 8), hornMat,
          [side * 0.2, 1.0, 0], null, [0, 0, side * -0.3], headRig);
        add(new THREE.ConeGeometry(0.11, 0.23, 8), orangeMat,
          [side * 0.265, 0.96, -0.015], [0.9, 1, 0.8], [0, 0, side * -0.55], headRig);
        add(new THREE.ConeGeometry(0.022, 0.09, 6), hornMat,
          [side * 0.08, 0.65, 0.37], null, [Math.PI / 2, 0, 0], headRig);
      });
      [-1, -.5, 0, .5, 1].forEach(i => add(new THREE.ConeGeometry(0.045, 0.2, 6), redMat,
        [i * 0.11, 1.01 - Math.abs(i) * 0.035, -0.04], null, [0, 0, i * -0.14], headRig));
      const tail = new THREE.Group();
      tail.position.set(0.24, 0.36, -0.35);
      tail.rotation.z = -0.8;
      rig.add(tail);
      const tailTan = mat(0xa85b20, { roughness: 0.52, metalness: 0.01 });
      [0, 1, 2, 3].forEach(i => capsule(0.075 - i * 0.007, 0.16,
        i % 2 ? tailTan : orangeMat, [0, i * 0.13, 0], null, null, tail));
      anims.push(t => {
        const slam = Math.pow(Math.max(0, Math.sin(t * 2.7)), 7);
        rig.position.y = Math.max(0, Math.sin(t * 5.4)) * 0.035;
        rig.rotation.x = slam * 0.12;
        headRig.rotation.y = Math.sin(t * 0.85) * 0.1;
        arms.forEach(({ arm, side, rest }) => { arm.rotation.z = rest + side * slam * 0.25; });
        tail.rotation.z = -0.8 + Math.sin(t * 2.1) * 0.32;
        shell.rotation.y = Math.sin(t * 0.7) * 0.035;
        body.scale.x = 1.02 + slam * 0.03;
      });
    } else if (combatClass === 'inferno') {
      // INFERNO: a living furnace with an arched boiler body and exhaust crown.
      const rig = new THREE.Group();
      g.add(rig);
      add(new THREE.CylinderGeometry(0.29, 0.32, 0.55, 24), combatGunMat,
        [0, 0.4, 0], [1, 1, 0.84], null, rig);
      add(new THREE.SphereGeometry(0.29, 28, 20), bodyMat,
        [0, 0.48, 0.02], [1, 0.86, 0.78], null, rig);
      const fire = add(new THREE.SphereGeometry(0.12, 28, 20), combatHotMat,
        [0, 0.4, 0.31], [1, 1, 0.42], null, rig);
      add(new THREE.TorusGeometry(0.18, 0.035, 16, 32), boneMat,
        [0, 0.4, 0.285], [1, 1, 0.6], null, rig);
      [-1, 1].forEach(side => {
        capsule(0.08, 0.3, bodyMat, [side * 0.31, 0.35, 0], null, null, rig);
        add(new THREE.SphereGeometry(0.11, 28, 20), shoeMat,
          [side * 0.16, 0.075, 0.07], [1, 0.45, 1.3], null, rig);
        add(new THREE.CylinderGeometry(0.05, 0.07, 0.3, 24), combatGunMat,
          [side * 0.14, 0.9, -0.02], null, [0, 0, side * -0.08], rig);
      });
      const head = add(new THREE.CylinderGeometry(0.2, 0.23, 0.25, 24), brightShellMat,
        [0, 0.75, 0.02], [1, 1, 0.85], null, rig);
      [-1, 1].forEach(side => glowOrb(0.055, [side * 0.13, 0.9, 0.03], rig));
      add(roundedBox(0.28, 0.065, 0.045), combatBlackMat,
        [0, 0.76, 0.225], null, null, rig);
      add(roundedBox(0.19, 0.022, 0.016), combatHotMat,
        [0, 0.765, 0.255], null, null, rig);
      add(new THREE.CylinderGeometry(0.065, 0.09, 0.37, 24), combatGunMat,
        [0, 0.97, -0.03], null, null, rig);
      anims.push(t => {
        const pulse = 1 + Math.sin(t * 3.4) * 0.12;
        fire.scale.set(pulse, pulse, 0.42 * pulse);
        combatHotMat.emissiveIntensity = 1.5 + Math.max(0, Math.sin(t * 3.4)) * 0.8;
        head.rotation.y = Math.sin(t * 0.5) * 0.035;
      });
    } else {
      // STEALTH: compact diamond mass, crouched limbs and swept blade silhouette.
      const rig = new THREE.Group();
      rig.position.y = -0.015;
      g.add(rig);
      const torso = add(new THREE.SphereGeometry(0.32, 28, 20), stealthMat,
        [0, 0.4, 0], [0.79, 0.96, 0.72], [0, 0, 0], rig);
      add(new THREE.SphereGeometry(0.235, 28, 20), bodyMat,
        [0, 0.43, 0.13], [0.78, 0.8, 0.5], [0, 0, 0], rig);
      const core = add(new THREE.OctahedronGeometry(0.082, 0), combatGlowMat,
        [0, 0.45, 0.285], [1.25, 0.5, 0.3], [0, 0, Math.PI / 4], rig);
      const fins = [];
      [-1, 1].forEach(side => {
        const fin = add(new THREE.ConeGeometry(0.075, 0.34, 4), stealthMat,
          [side * 0.285, 0.5, -0.015], [0.72, 1, 0.62], [0, 0, side * -1.0], rig);
        fins.push(fin);
        capsule(0.052, 0.21, combatBlackMat,
          [side * 0.22, 0.3, 0.12], [0.8, 1, 0.78], [0, 0, side * -0.62], rig);
        add(new THREE.ConeGeometry(0.045, 0.17, 4), trimMat,
          [side * 0.29, 0.23, 0.16], [0.72, 1, 0.65], [0, 0, side * -1.05], rig);
        add(new THREE.SphereGeometry(0.09, 28, 20), shoeMat,
          [side * 0.145, 0.07, 0.1], [0.86, 0.42, 1.42], [0, side * 0.2, 0], rig);
        add(new THREE.ConeGeometry(0.05, 0.22, 4), darkClothMat,
          [side * 0.105, 0.16, -0.03], [0.8, 1, 0.7], [Math.PI, 0, side * 0.12], rig);
      });

      const headRig = new THREE.Group();
      rig.add(headRig);
      add(new THREE.SphereGeometry(0.29, 28, 20), stealthMat,
        [0, 0.73, 0], [0.83, 0.92, 0.79], [0, 0, 0], headRig);
      add(new THREE.ConeGeometry(0.13, 0.26, 4), combatGunMat,
        [0, 0.925, -0.015], [0.88, 1, 0.8], [0, 0, 0], headRig);
      add(new THREE.SphereGeometry(0.185, 28, 20), combatBlackMat,
        [0, 0.72, 0.205], [0.95, 0.55, 0.35], [0, 0, 0], headRig);
      const scan = add(roundedBox(0.245, 0.023, 0.016), combatHotMat,
        [0, 0.755, 0.28], null, [0, 0, 0], headRig);
      add(new THREE.ConeGeometry(0.045, 0.24, 4), stealthMat,
        [-0.2, 0.82, -0.02], null, [0, 0, 0.72], headRig);
      add(new THREE.ConeGeometry(0.045, 0.24, 4), stealthMat,
        [0.2, 0.82, -0.02], null, [0, 0, -0.72], headRig);
      anims.push(t => {
        const scanX = Math.sin(t * 1.8) * 0.035;
        scan.position.x = scanX;
        headRig.rotation.y = Math.sin(t * 0.8) * 0.09;
        const breath = Math.sin(t * 1.9) * 0.012;
        torso.scale.y = 0.96 + breath;
        core.scale.set(1.25 + breath * 3, 0.5 + breath, 0.3);
