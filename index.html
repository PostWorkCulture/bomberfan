    v.scene.traverse(o => {
      if (o.geometry) geometries.add(o.geometry);
      if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => materials.add(m));
    });
    geometries.forEach(x => x.dispose());
    materials.forEach(x => x.dispose());
    g.victory = null;
  }

  function buildVictory(winner) {
    clearVictory();
    if (!winner) return;
    const scene = new THREE.Scene();
    const winnerColour = new THREE.Color(winner.def.color);
    scene.background = winnerColour.clone().multiplyScalar(0.105);
    scene.fog = new THREE.Fog(scene.background.clone(), 5.5, 10);

    scene.add(new THREE.HemisphereLight(0xffffff, winner.def.color, 3.0));
    const key = new THREE.DirectionalLight(0xfff0d1, 7.2);
    key.position.set(2.8, 4.5, 4.5); scene.add(key);
    const rim = new THREE.DirectionalLight(winner.def.color, 8.5);
    rim.position.set(-3.5, 2.2, -3); scene.add(rim);
    const fill = new THREE.PointLight(0xffffff, 4.2, 8);
    fill.position.set(-1.8, 1.3, 2.6); scene.add(fill);

    const halo = new THREE.Mesh(
      new THREE.CircleGeometry(1.45, 48),
      new THREE.MeshBasicMaterial({
        color: winner.def.color, transparent: true, opacity: 0.16,
        blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false,
      })
    );
    halo.position.set(0, 0.5, -0.5);
    scene.add(halo);

    const plinth = new THREE.Mesh(
      new THREE.CylinderGeometry(0.72, 0.92, 0.12, 48),
      new THREE.MeshStandardMaterial({
        color: 0x151821, roughness: 0.32, metalness: 0.68,
        emissive: winner.def.color, emissiveIntensity: 0.18,
      })
    );
    plinth.position.y = -0.48;
    scene.add(plinth);
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(0.78, 0.025, 8, 48),
      new THREE.MeshBasicMaterial({
        color: winner.def.color, transparent: true, opacity: 0.9,
        blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false,
      })
    );
    ring.rotation.x = Math.PI / 2;
    ring.position.y = -0.405;
    scene.add(ring);

    const points = [];
    for (let i = 0; i < 90; i++) {
      const a = i * 2.399963;
      const radius = 1.15 + (i % 9) * 0.12;
      points.push(Math.cos(a) * radius, -0.35 + (i % 15) * 0.115, -0.8 + Math.sin(a) * 0.5);
    }
    const sparksGeo = new THREE.BufferGeometry();
    sparksGeo.setAttribute('position', new THREE.Float32BufferAttribute(points, 3));
    const sparks = new THREE.Points(sparksGeo, new THREE.PointsMaterial({
      color: winner.def.trim || winner.def.color, size: 0.035,
      transparent: true, opacity: 0.82, blending: THREE.AdditiveBlending,
      depthWrite: false, toneMapped: false,
    }));
    scene.add(sparks);

    // Six staggered fireballs keep detonating around the winner. Every burst
    // owns its materials because opacity and scale run on different phases.
    const explosions = [
      [-0.62, 0.12, -0.34, 0.00], [0.62, 0.42, -0.36, 0.23],
      [-0.50, 1.02, -0.48, 0.46], [0.50, 1.16, -0.5, 0.69],
      [-0.72, 0.68, -0.58, 0.84], [0.72, -0.02, -0.42, 0.12],
    ].map(spec => {
      const group = new THREE.Group();
      group.position.set(spec[0], spec[1], spec[2]);
      const flameMat = new THREE.MeshBasicMaterial({
        color: 0xff5a12, transparent: true, opacity: 0,
        blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false,
      });
      const coreMat = new THREE.MeshBasicMaterial({
        color: 0xfff2a8, transparent: true, opacity: 0,
        blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false,
      });
      const shockMat = new THREE.MeshBasicMaterial({
        color: winner.def.trim || 0xffd166, transparent: true, opacity: 0,
        blending: THREE.AdditiveBlending, depthWrite: false,
        side: THREE.DoubleSide, toneMapped: false,
      });
      const fire = new THREE.Group();
      group.add(fire);
      fire.add(new THREE.Mesh(new THREE.IcosahedronGeometry(0.27, 1), flameMat));
      for (let i = 0; i < 7; i++) {
        const a = i / 7 * Math.PI * 2;
        const blob = new THREE.Mesh(new THREE.IcosahedronGeometry(0.14 + (i % 3) * 0.025, 1), flameMat);
        blob.position.set(Math.cos(a) * 0.2, Math.sin(a) * 0.18, (i % 2) * 0.04);
        fire.add(blob);
      }
      const core = new THREE.Mesh(new THREE.IcosahedronGeometry(0.16, 1), coreMat);
      core.position.z = 0.035;
      group.add(core);
      const shock = new THREE.Mesh(new THREE.RingGeometry(0.18, 0.24, 32), shockMat);
      shock.position.z = 0.025;
      group.add(shock);
      scene.add(group);
      return { group, fire, core, shock, flameMat, coreMat, shockMat, phase: spec[3] };
    });

    const turn = new THREE.Group();
    turn.rotation.y = -0.28;
    scene.add(turn);
    const mesh = Player.buildMesh(winner.def, winner.kit || defaultLoadout());
    Player.applyViewScale(mesh, winner.def.flying ? 1.42 : 1.18);
    mesh.position.y = -0.42;
    turn.add(mesh);

    const cam = new THREE.PerspectiveCamera(28, 16 / 9, 0.1, 30);
    g.victory = { scene, cam, turn, mesh, halo, plinth, ring, sparks, explosions };
  }

  function renderVictory() {
    const v = g.victory;
    if (!v) return;
    const r = World.renderer;
    const w = r.domElement.clientWidth, h = r.domElement.clientHeight;
    const aspect = Math.max(0.32, w / Math.max(1, h));
    v.cam.aspect = aspect;
    const shake = (v.blastShake || 0) * 0.018;
    v.cam.position.set(
      (aspect < 0.72 ? 0.45 : 0.72) + (Math.random() - 0.5) * shake,
      0.78 + (Math.random() - 0.5) * shake,
      aspect < 0.72 ? 4.15 : 3.25
    );
    v.cam.lookAt(0, 0.38, 0);
    v.cam.updateProjectionMatrix();
    r.setScissorTest(false);
    r.setViewport(0, 0, w, h);
    r.render(v.scene, v.cam);
  }

  function startMatch() {
    restoreGameCanvas();
    // The Players row is hidden with touch controls up, so make the value match
    // what the player can actually see and choose.
    if (!UI.rowVisible(UI.MENU_ROWS.indexOf('players'))) g.opts.humans = 1;
    g.players.forEach(p => World.scene.remove(p.mesh));
    g.players = [];
    // Put the chosen fighter in seat one, then draw three distinct opponents
    // from the other nineteen so the full roster keeps appearing across matches.
    const others = PLAYER_DEFS.filter((_, i) => i !== g.selectedClass);
    const rosterRng = makeRng(g.seed ^ 0xa511e9b3);
    for (let i = others.length - 1; i > 0; i--) {
      const j = Math.floor(rosterRng() * (i + 1));
      const swap = others[i]; others[i] = others[j]; others[j] = swap;
    }
    const matchDefs = [PLAYER_DEFS[g.selectedClass]].concat(others.slice(0, CFG.MAX_PLAYERS - 1));
    for (let seat = 0; seat < CFG.MAX_PLAYERS; seat++) {
      const isHuman = seat < g.opts.humans;
      const p = new Player(seat, matchDefs[seat], isHuman);
      // Solo play uses the arrow keys — the comfortable one-handed layout.
      // With two humans, P1 takes WASD and P2 takes the arrows as usual.
      p.keymap = isHuman ? (g.opts.humans === 1 ? KEYMAPS[1] : KEYMAPS[seat]) : null;
      if (!isHuman) AI.attach(p, g.opts.difficulty);
      g.players.push(p);
    }
    g.round = 1;
    UI.buildCards(g.players);
    UI.showMenu(false);
    UI.showSelect(false);
    UI.showHUD(true);
    World.setFraming('play');
    UI.showResults('', g.players, false);
    startRound();
  }

  function startRound() {
    clearVictory();
    UI.showVictory('', '#ffffff', '', false, false);
    UI.showHUD(true);
    clearRoundEntities();
    g.roundWinner = null;
    g.seed = (g.seed * 1103515245 + 12345) >>> 0;
    const rng = makeRng(g.seed);
    g.level = pickLevel(rng);
    // Each arena has its own weight underfoot. Set before the round starts, so
    // the first beat of the pulse is already the right one.
    Audio3.bassForLevel(g.level.id);
    World.buildArena(rng, g.level);
    g.players.forEach(p => {
      Player.resetShowcase(p.mesh);
      p.reset();
      if (p.ai) AI.attach(p, g.opts.difficulty);
    });
    g.roundTime = CFG.ROUND_SECONDS;
    g.suddenDeath = false;
    g.sdCountdown = 0;
    UI.setSdBand(null);
    UI.setSdCount(null);
    g.sdRing = 0;
    g.sdTimer = 0;
    g.sdDone = 0;
    g.sdQueue = [];
    g.sdStagger = 0;
    g.cratesClearedAt = -1;
    g.hazardT = 0;
    g.sdWarned = false;
    g.heartHinted = false;
    g.roundElapsed = 0;
    g.detonationsSinceClear = 0;
    g.resupplyBag = weightedDropBag(makeRng(g.seed ^ 0x9e3779b9));
    g.state = STATE.INTRO;
    g.stateT = 0;
    // ...and square before the first frame of the intro is ever drawn
    World.group.rotation.y = 0;
    g.lastCountdown = -1;
    g.goT = 0;
    UI.setCountdown(null);
    g.paused = false;
    UI.showPause(false);
    // No ROUND banner: it landed in the middle of the screen underneath the
    // countdown, and every card already carries the running score. The
    // countdown owns the centre of the screen on its own.
  }

  function clearRoundEntities() {
    g.bombs.forEach(b => b.dispose());
    g.blasts.forEach(b => b.dispose());
    g.powerUps.forEach(p => p.dispose());
    g.puffs.forEach(p => { World.scene.remove(p.mesh); p.geo.dispose(); p.mat.dispose(); });
    g.dust.forEach(d => { World.scene.remove(d.m); d.mat.dispose(); });
    g.dust = [];
    g.bombs = []; g.bombMap.clear(); g.blasts = []; g.powerUps.clear(); g.puffs = [];
    g.fallingBlocks = [];
    // A bomb still in the witch's hand when the round ends would sit there
    // through the winner banner and the whole of the next round's build.
    g.hazardT = 0; g.hazardTarget = null;
    if (typeof Props !== 'undefined' && Props.windUp) Props.windUp(null);
    World.clearHeartFlash();
  }

  // Victory lines are drawn from a shuffled bag: every line in the set is used
  // once before any of them comes round again. On a refill the last few lines
  // used are pushed away from the draw end, so a line can never reappear within
  // WIN_LINE_GAP wins even across the bag boundary.
  const WIN_LINE_GAP = 4;
  let winBag = [];
  const recentWins = [];
  function nextWinLine(name) {
    if (!winBag.length) {
      winBag = WIN_LINES.slice();
      for (let i = winBag.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = winBag[i]; winBag[i] = winBag[j]; winBag[j] = t;
      }
      // pop() draws from the tail, so the tail is what must not be recent.
      const guard = Math.min(WIN_LINE_GAP, winBag.length - 1);
      for (let k = 0; k < guard; k++) {
        const tail = winBag.length - 1 - k;
        if (recentWins.indexOf(winBag[tail]) === -1) continue;
        for (let j = 0; j < winBag.length - guard; j++) {
          if (recentWins.indexOf(winBag[j]) !== -1) continue;
          const t = winBag[tail]; winBag[tail] = winBag[j]; winBag[j] = t;
          break;
        }
      }
    }
    const line = winBag.pop();
    recentWins.push(line);
    if (recentWins.length > WIN_LINE_GAP) recentWins.shift();
    return line.split('{N}').join(name);
  }

  function endRound(winner) {
    g.state = STATE.ROUND_END;
    g.stateT = 0;
    g.roundWinner = winner || null;
    // The round is over: the sudden-death dressing goes with it. The scrolling
    // band and the skulls are both warnings about a fight still in progress, and
    // leaving them up over the win banner was the "hangs around too long".
    UI.setSdBand(null);
    UI.setSdCount(null);
    // A round can end inside GO! — a bot walking into its own opening bomb does
    // exactly that — and a rainbow GO! over the win banner is nonsense.
    g.goT = 0;
    UI.setCountdown(null);
    if (winner) {
      winner.wins++;
      Audio3.roundWin();
      const line = nextWinLine(winner.def.name.toUpperCase());
      const matchWinner = winner.wins >= g.opts.wins;
      buildVictory(winner);
      UI.showHUD(false);
      UI.showVictory(winner.def.name.toUpperCase(),
                     '#' + winner.def.color.toString(16).padStart(6, '0'),
                     line, matchWinner, true);
      g.outroDuration = CFG.ROUND_OUTRO;
      // Keep the arena colour celebration underneath the dedicated full-screen
      // scene so the transition back into the board remains coherent.
      World.tintWalls(winner.def.color);
    } else {
      clearVictory();
      UI.showVictory('', '#ffffff', '', false, false);
      g.outroDuration = 3.0;
      UI.showBanner('DRAW', '#ffd166', g.outroDuration, true);
    }
    UI.updateHUD(g);
  }

  function endMatch(winner) {
    g.state = STATE.MATCH_END;
    g.roundWinner = winner || null;
    Audio3.matchWin();
    UI.showResults(winner ? winner.def.name.toUpperCase() + ' WINS THE MATCH' : 'MATCH OVER', g.players, true);
  }

  function toMenu() {
    restoreGameCanvas();
    clearVictory();
    UI.showVictory('', '#ffffff', '', false, false);
    clearRoundEntities();
    UI.setCountdown(null);
    g.goT = 0;
    g.players.forEach(p => World.scene.remove(p.mesh));
    g.players = [];
    g.state = STATE.MENU;
    UI.showResults('', [], false);
    UI.showHUD(false);
    UI.showSelect(false);
    UI.showMenu(true);
    World.setFraming('menu');
    UI.alignOptionsToTitle();
    g.menuCycleT = CFG.MENU_CYCLE;
    syncMenuPreview();
  }

  /* -------------------------------------------------------------- bombs -- */

  // A bomb's map entry follows it around while it slides or flies
  function registerBomb(bomb) { g.bombMap.set(World.key(bomb.x, bomb.y), bomb); }
  function unregisterBomb(bomb) {
    const k = World.key(bomb.x, bomb.y);
    if (g.bombMap.get(k) === bomb) g.bombMap.delete(k);
  }
  function moveBombTo(bomb, x, y) {
    unregisterBomb(bomb);
    bomb.x = x; bomb.y = y;
    registerBomb(bomb);
  }

  // Can a bomb occupy this tile? Players block it too, so a kicked bomb
  // stops against whoever it hits rather than sliding through them.
  function bombCanEnter(x, y, self) {
    if (World.cellAt(x, y) !== CELL.EMPTY) return false;
    const other = g.bombMap.get(World.key(x, y));
    if (other && other !== self) return false;
    return !g.players.some(p =>
      p.alive && p.tileX === x && p.tileY === y &&
      !(self && p === self.owner && self.owner.ignoreBombs.has(World.key(x, y))));
  }

  // Where does a punched/thrown bomb come down? Walk out from the thrower and
  // take the furthest clear tile, wrapping past anything occupied.
  function landingTile(x, y, dx, dy, tiles, self) {
    let best = { x, y };
    for (let i = 1; i <= tiles; i++) {
      const tx = x + dx * i, ty = y + dy * i;
      if (World.cellAt(tx, ty) === CELL.HARD) break;
      if (World.cellAt(tx, ty) === CELL.SOFT) break;
      best = { x: tx, y: ty };
    }
    // If the ideal landing spot is taken, shuffle back toward the thrower
    while ((best.x !== x || best.y !== y) && !bombCanEnter(best.x, best.y, self)) {
      best = { x: best.x - dx, y: best.y - dy };
    }
    return best;
  }

  // Walking into a bomb with the Kick ability shoves it away
  function tryKick(player, dir) {
    if (!player.kick) return false;
    const tx = player.tileX + dir.x, ty = player.tileY + dir.y;
    const bomb = g.bombMap.get(World.key(tx, ty));
    if (!bomb || bomb.flight || bomb.held) return false;
    if (!bomb.kick(dir.x, dir.y)) return false;
    Audio3.kick();
    return true;
  }

  function dropCarried(player) {
    const bomb = player.carrying;
    if (!bomb) return;
    player.carrying = null;
    bomb.held = false;
    // Prefer the tile underfoot, else the first free neighbour
    let spot = { x: player.tileX, y: player.tileY };
    if (!bombCanEnter(spot.x, spot.y, bomb)) {
      const alt = [[1, 0], [-1, 0], [0, 1], [0, -1]]
        .map(([dx, dy]) => ({ x: spot.x + dx, y: spot.y + dy }))
        .find(t => bombCanEnter(t.x, t.y, bomb));
      if (alt) spot = alt;
    }
    bomb.x = spot.x; bomb.y = spot.y;
    bomb.fx = spot.x; bomb.fy = spot.y;
    registerBomb(bomb);
  }

  // The action button does the most useful thing available, in priority order:
  // throw a held bomb, pick one up, punch an adjacent one, detonate by remote,
  // otherwise place a bomb.
  // The three things the button can do besides placing a bomb, each pulled out
  // so an explicit intent and the priority chain run exactly the same code.
  function doThrow(player) {
    if (!player.carrying) return false;
    const b = player.carrying;
    player.carrying = null;
    b.launch(player.dir.x, player.dir.y, CFG.THROW_TILES);
    Audio3.throwBomb();
    return true;
  }

  function doGlove(player) {
    if (!player.glove) return false;
    const here = g.bombMap.get(World.key(player.tileX, player.tileY));
    if (!here || here.flight) return false;
    unregisterBomb(here);
    here.held = true;
    here.vel = null;
    player.carrying = here;
    player.ignoreBombs.delete(World.key(here.x, here.y));
    Audio3.pickup();
    return true;
  }

  function doPunch(player) {
    if (!player.punch) return false;
    const tx = player.tileX + player.dir.x, ty = player.tileY + player.dir.y;
    const target = g.bombMap.get(World.key(tx, ty));
    if (!target || target.flight || target.held) return false;
    target.launch(player.dir.x, player.dir.y, CFG.PUNCH_TILES);
    Audio3.punch();
    return true;
  }

  // `intent` is for the BOTS. A human has one button and it does the most
  // useful thing available, in priority order — throw a held bomb, pick one up,
  // punch an adjacent one, place, then detonate by remote. That chain is what
  // makes one key playable, and it is deliberately untouched.
  //
  // A bot has no such constraint and the chain actively works against it: a bot
  // that owns the Power Glove and is standing on a bomb would pick that bomb up
  // every time it meant to place one, with no way to say which it wanted. So a
  // bot names the action instead.
  function tryAction(player, intent) {
    if (!player.alive) return false;

    if (intent) {
      switch (intent) {
        case 'throw': return doThrow(player);
        case 'glove': return doGlove(player);
        case 'punch': return doPunch(player);
        case 'bomb':  return tryPlaceBomb(player);
        case 'remote': return player.remote ? detonateRemote(player) : false;
        default: return false;
      }
    }

    if (doThrow(player)) return true;
    if (doGlove(player)) return true;
    if (doPunch(player)) return true;
    if (tryPlaceBomb(player)) return true;

    // Nothing left to place — a remote holder sets off what is already down
    if (player.remote) return detonateRemote(player);
    return false;
  }

  function detonateRemote(player) {
    const mine = g.bombs.filter(b => b.owner === player && b.remote && !b.dead && !b.held);
    if (!mine.length) return false;
    mine.forEach(b => { b.fuse = 0; });
    return true;
  }

  // THE ANGRY SNOWMAN'S BOMB.
  //
  // A bomb needs an owner: for its blast range, for the activeBombs accounting,
  // for the sound its owner has equipped. This is that owner, and it is
  // deliberately NOT a player — it never dies, never scores, and the AI's danger
  // map attributes its blast to no seat at all (idxOf returns 0 for anything not
  // in the players array, which is already the "nobody" sentinel).
  //
  // shellMat is the one thing it overrides: World.MAT.bomb is shared with every
  // player's bomb and per-level for contrast, so recolouring it would turn every
  // bomb on the board red. Its own material, red, and never disposed with the
  // others because the Bomb owns it.
  const HAZARD = {
    seat: -1, effFire: 2, pierce: false, mine: false, remote: false,
    maxBombs: CFG.START_BOMBS, activeBombs: 0, bombsLaid: 0, ai: null,
    kit: null, carrying: null,
    // The band round a bomb is its owner's seat colour. This one has no seat, so
    // it gets its own def rather than a null dereference in the constructor.
    def: { name: 'Hazard', color: 0x3a0605 },
    shellMat: new THREE.MeshStandardMaterial({
      color: 0xe0201a, roughness: 0.34, metalness: 0.25,
      emissive: 0x4a0603, emissiveIntensity: 0.6 }),
  };

  // Somewhere empty, with no bomb on it and nobody standing on it. Landing one
  // directly under a player would be an unavoidable death from a thing they
  // cannot fight back against, which is not a hazard, it is a coin flip.
  function freeHazardTile() {
    const free = [];
    for (let y = 1; y < CFG.ROWS - 1; y++) {
      for (let x = 1; x < CFG.COLS - 1; x++) {
        if (World.cellAt(x, y) !== CELL.EMPTY) continue;
        const k = World.key(x, y);
        if (g.bombMap.has(k)) continue;
        if (g.players.some(p => p.alive && p.tileX === x && p.tileY === y)) continue;
        free.push({ x, y });
      }
    }
    return free.length ? free[Math.floor(Math.random() * free.length)] : null;
  }

  // THE WIND-UP, THEN THE THROW.
  //
  // It used to be one line: a bomb appeared on a tile, already ticking, with no
  // warning and nothing to connect it to the thing that threw it. Now the witch
  // (or the snowman) holds a red bomb for a second and a half first, and then it
  // arcs across the board where you can watch it and see where it is going to
  // land. Two seconds of notice on a hazard you cannot fight is the difference
  // between a hazard and a coin flip.
  // WHERE IT IS GOING TO LAND, marked for the whole time it is in the air.
  // Reconciled from the state every step rather than switched on at the throw
  // and off at the landing: there are several ways a round can end mid-flight,
  // and every one of them would have been a way to leave the marker up.
  //
  // The tile is chosen at the start of the wind-up, so the marker goes up a
  // beat and a half BEFORE the bomb is thrown and stays up through the arc —
  // it comes off on the frame the bomb lands, and not before.
  function syncHazardMark() {
    if (g.hazardTarget) { World.hazardMark(g.hazardTarget.x, g.hazardTarget.y); return; }
    const inAir = g.bombs.find(b => b.owner === HAZARD && b.flight && !b.dead);
    if (inAir) { World.hazardMark(inAir.flight.to.x, inAir.flight.to.y); return; }
    World.hazardMark(null);
  }

  function updateHazard(dt) {
    hazardStep(dt);
    syncHazardMark();
  }

  function hazardStep(dt) {
    const at = Props.angryAt;
    if (!at) { g.hazardT = 0; g.hazardTarget = null; Props.windUp(null); return; }
    g.hazardT = (g.hazardT || 0) + dt;

    const windStart = CFG.HAZARD_EVERY - CFG.HAZARD_WINDUP;
    if (g.hazardT < windStart) return;

    // Pick the tile at the START of the wind-up, not at the throw: the arc has to
    // be aimed at something, and re-picking it at the last moment would make the
    // wind-up a lie.
    if (!g.hazardTarget) {
      g.hazardTarget = freeHazardTile();
      if (!g.hazardTarget) { g.hazardT = 0; return; }   // nowhere to put it; wait
      Audio3.hazardWind();
    }
    if (g.hazardT < CFG.HAZARD_EVERY) {
      Props.windUp((g.hazardT - windStart) / CFG.HAZARD_WINDUP);
      return;
    }

    const t = g.hazardTarget;
    g.hazardTarget = null;
    g.hazardT = 0;
    Props.windUp(null);

    const bomb = new Bomb(at[0], at[1], HAZARD);
    // Straight into the air, from the hand. It is NOT registered on a tile until
    // it lands — registerBomb runs at the end of the flight — so nothing collides
    // with a bomb that is still overhead.
    const hand = Props.throwOrigin();
    const dist = Math.hypot(t.x - at[0], t.y - at[1]);
    bomb.fx = at[0]; bomb.fy = at[1];
    bomb.flight = {
      from: { x: at[0], y: at[1] }, to: { x: t.x, y: t.y },
      t: 0, dur: CFG.HAZARD_FLIGHT,
      // A high, slow lob: you are meant to have time to look at it and move.
      // CAPPED, because the camera frames the board and not the sky — measured,
      // an uncapped arc across the diagonal peaked 5.3 units up and left the top
      // of the screen, which is a bomb you cannot watch at all.
      h: Math.min(1.0 + dist * 0.16, 3.0),
      y0: hand ? hand.y : 1.4,
      spin: 5,
    };
    g.bombs.push(bomb);
    HAZARD.activeBombs++;
    World.addShake(0.02);
    Audio3.throwBomb();
  }

  // THE SPECIAL BUTTON. One button, and what it does is whatever the worn prize
  // grants — so there is never a second control to find, and a player with no
  // prize on has nothing to press.
  function trySpecial(player) {
    if (!player || !player.alive) return false;
    switch (player.special) {
      case 'hop':
        return player.hop();
      case 'detonate': {
        // Blow YOUR bombs, now. Not everyone's: a button that set off the whole
        // board would be a bomb thief rather than a prize.
        const mine = g.bombs.filter(b => b.owner === player && !b.dead && !b.flight);
        if (!mine.length) return false;
        mine.forEach(b => { b.fuse = 0; });
        Audio3.placeBomb();
        return true;
      }
      default:
        return false;
    }
  }

  function tryPlaceBomb(player) {
    if (!player.alive || !player.canBomb) return false;
    const x = player.tileX, y = player.tileY;
    const k = World.key(x, y);
    if (g.bombMap.has(k)) return false;
    if (player.activeBombs >= player.maxBombs) return false;
    if (World.cellAt(x, y) !== CELL.EMPTY) return false;

    const bomb = new Bomb(x, y, player);
    g.bombs.push(bomb);
    g.bombMap.set(k, bomb);
    player.activeBombs++;
    player.ignoreBombs.add(k);
    player.bombsLaid = (player.bombsLaid || 0) + 1;
    if (player.ai) player.ai.bombsLaid++;
    Audio3.placeBomb();
    return true;
  }

  // Resolve a detonation and every bomb it chains into, in one pass
  function detonate(startBomb) {
    const queue = [startBomb];
    const processed = new Set();
    const allCells = [];
    const owners = [];
    let maxFire = 0, maxBombUps = 0;
    // Items uncovered by THIS explosion must not be burnt by it — otherwise a
    // crate's contents pop into existence and vanish in the same frame, which
    // is exactly why no pick-ups were ever appearing.
    const justRevealed = new Set();

    while (queue.length) {
      const bomb = queue.shift();
      const bk = World.key(bomb.x, bomb.y);
      if (processed.has(bk)) continue;
      processed.add(bk);

      bomb.dead = true;
      g.bombMap.delete(bk);
      bomb.owner.activeBombs = Math.max(0, bomb.owner.activeBombs - 1);
      if (bomb.owner.carrying === bomb) bomb.owner.carrying = null;
      if (owners.indexOf(bomb.owner) === -1) owners.push(bomb.owner);
      if (bomb.fire > maxFire) maxFire = bomb.fire;
      if (bomb.owner.maxBombs > maxBombUps) maxBombUps = bomb.owner.maxBombs;

      const cells = [{ x: bomb.x, y: bomb.y, kind: 'core', owner: bomb.triggeredBy || bomb.owner }];
      const DIRS = [
        { x: 1, y: 0, a: 'h' }, { x: -1, y: 0, a: 'h' },
        { x: 0, y: 1, a: 'v' }, { x: 0, y: -1, a: 'v' },
      ];

      for (const d of DIRS) {
        for (let s = 1; s <= bomb.fire; s++) {
          const x = bomb.x + d.x * s, y = bomb.y + d.y * s;
          const cell = World.cellAt(x, y);
          if (cell === CELL.HARD) break;

          if (cell === CELL.SOFT) {
            cells.push({ x, y, kind: 'arm', dir: d.a, owner: bomb.triggeredBy || bomb.owner });
            const hiddenPU = World.destroySoft(x, y);
            Audio3.breakBlock();
            spawnPuff(x, y, 0xc9873f);
            if (hiddenPU) {
              spawnPowerUp(x, y, hiddenPU);
              justRevealed.add(World.key(x, y));
              // The extra life gets a send-off: a burst of sparkles, and the
              // heart itself grows out of it rather than simply being there.
              if (hiddenPU === PU.SHIELD) spawnSparkles(x, y);
            }
            if (bomb.pierce) continue;      // Pierce keeps going through crates
            break;
          }

          cells.push({ x, y, kind: 'arm', dir: d.a, owner: bomb.triggeredBy || bomb.owner });

          const other = g.bombMap.get(World.key(x, y));
          if (other && !other.dead) {
            other.triggeredBy = bomb.triggeredBy || bomb.owner;
            queue.push(other);
            break;
          }
        }
      }
      allCells.push(...cells);
    }

    const blast = new Blast(allCells);
    blast.owners = owners;
    blast.maxFire = maxFire;
    // Which bomb lit each tile — lets us tell a suicide from a kill
    blast.tileOwner = new Map();
    allCells.forEach(c => {
      const k = World.key(c.x, c.y);
      if (!blast.tileOwner.has(k)) blast.tileOwner.set(k, c.owner);
    });
    g.blasts.push(blast);
    // Whose bomb was it? The sound is a prize, so the boom belongs to the owner.
    // First cell wins for a chain — a five-bomb chain is one event, not five.
    const src = blast.tileOwner && blast.tileOwner.values().next().value;
    const snd = cosmeticItem('sound', src && src.kit ? src.kit.sound : null);
    const sfx = (snd && snd.sfx) || 'explode';
    (Audio3[sfx] || Audio3.explode).call(Audio3);
    // Same lookup drives the look. update(0) already ran inside the constructor,
    // so re-run it now that the flag is set rather than showing one orange frame.
    if (snd && snd.rainbow) { blast.rainbow = true; blast.update(0); }

    // Screen shake is reserved for genuinely powerful bombs. An ordinary
    // starting-strength blast does not move the camera at all — shake every
    // time anything pops and it stops meaning anything.
    // An un-upgraded bomb still shakes the camera by exactly zero. Beyond that,
    // the base amount comes from blast range and is then multiplied by 1.15 for
    // every Bomb Up the owner has collected, so a stacked-up player's bombs land
    // noticeably harder than a fresh one's.
    const extraFire = maxFire - CFG.START_FIRE;
    const bombUps = Math.max(0, maxBombUps - CFG.START_BOMBS);
    if (extraFire > 0 || bombUps > 0) {
      const base = 0.05 + Math.max(0, extraFire) * 0.045;
      const amount = base * Math.pow(CFG.SHAKE_PER_BOMBUP, bombUps);
      World.addShake(Math.min(amount, CFG.SHAKE_MAX));
      // ...and the things standing on the edge of the arena take it too. Same
      // number, so the two can never disagree about how big the bang was.
      Props.hit(Math.min(amount, CFG.SHAKE_MAX) * 2.4);
    }

    // Power-ups already lying on the floor are destroyed by fire; ones this
    // blast has just uncovered are not.
    blast.tiles.forEach(k => {
      if (justRevealed.has(k)) return;
      const pu = g.powerUps.get(k);
      if (pu) { pu.dispose(); g.powerUps.delete(k); }
    });

    applyBlastDamage(blast);

    // With no crates left there is nothing to open, so the arena restocks
    // itself: every RESUPPLY_EVERY detonations, drop a couple of fresh items
    // on random free tiles. Keeps a stripped arena from going stale.
    // ...and nothing at all once the walls start closing: sudden death is about
    // the arena shrinking under you, and fresh items on a five-tile pit are
    // noise at exactly the moment the board needs to read clearly.
    if (World.softCount() === 0 && !g.suddenDeath) {
      g.detonationsSinceClear++;
      if (g.detonationsSinceClear % CFG.RESUPPLY_EVERY === 0 &&
          g.powerUps.size < CFG.RESUPPLY_MAX_LOOSE) resupply(CFG.RESUPPLY_COUNT);
    }
  }

  // Scatter n items on random tiles that are free of everything
  function resupply(n) {
    const free = [];
    for (let y = 1; y < CFG.ROWS - 1; y++) {
      for (let x = 1; x < CFG.COLS - 1; x++) {
        if (World.cellAt(x, y) !== CELL.EMPTY) continue;
        const k = World.key(x, y);
        if (g.bombMap.has(k) || g.powerUps.has(k)) continue;
        if (g.blasts.some(b => b.tiles.has(k))) continue;
        if (g.players.some(p => p.alive && p.tileX === x && p.tileY === y)) continue;
        free.push({ x, y });
      }
    }
    for (let i = 0; i < n && free.length; i++) {
      const pick = free.splice(Math.floor(Math.random() * free.length), 1)[0];
      spawnPowerUp(pick.x, pick.y, g.resupplyBag());
      spawnPuff(pick.x, pick.y, 0xffffff);
    }
    if (n > 0) Audio3.pickup();
  }

  function applyBlastDamage(blast) {
    g.players.forEach(p => {
      if (!p.alive) return;
      if (!blast.tiles.has(World.key(p.tileX, p.tileY))) return;
      const wasAlive = p.alive;
      p.kill();
      if (wasAlive && !p.alive) {
        g.stats.deaths++;
        const killer = blast.tileOwner && blast.tileOwner.get(World.key(p.tileX, p.tileY));
        if (killer === p) {
          g.stats.selfKills++;
          // "Early" now means the bomb the opening guarantee actually covers.
          // It used to be the first three, which stopped meaning anything the
          // moment the guarantee shrank to one.
          if (p.ai && p.ai.bombsLaid <= AI.SAFE_OPENING_BOMBS) g.stats.earlySelfKills++;
        }
      }
    });
  }

  function spawnPowerUp(x, y, id) {
    const k = World.key(x, y);
    if (g.powerUps.has(k)) return;
    g.powerUps.set(k, new PowerUp(x, y, id));
  }

  /* ---------------------------------------------------------- particles -- */
  // A bright, fast burst for the one crate that matters. Deliberately not the
  // same as spawnPuff: more bits, faster, gold and pink, and no gravity arc, so
  // it reads as a sparkle rather than debris.
  function spawnSparkles(x, y) {
    const geo = new THREE.OctahedronGeometry(0.075, 0);
    const group = new THREE.Group();
    const bits = [];
    for (let i = 0; i < 22; i++) {
      const mat = new THREE.MeshBasicMaterial({
        color: i % 2 ? 0xffd166 : 0xff4d6d,
        transparent: true, opacity: 1, toneMapped: false,
      });
      const m = new THREE.Mesh(geo, mat);
      m.position.set(0, 0.5, 0);
      group.add(m);
      const a = Math.random() * Math.PI * 2, up = 0.4 + Math.random() * 1.5;
      const sp = 2.6 + Math.random() * 3.4;
      bits.push({ m, mat, vx: Math.cos(a) * sp, vy: up * 2.4, vz: Math.sin(a) * sp,
                  rx: (Math.random() - 0.5) * 14, rz: (Math.random() - 0.5) * 14 });
    }
    group.position.set(World.wx(x), 0.1, World.wz(y));
    World.scene.add(group);
    // Same shape updatePuffs already expects. Sparkles own a material EACH
    // (they are two colours), so they carry their own disposer rather than the
    // single shared `mat` a normal puff has.
    g.puffs.push({
      mesh: group, bits, life: 0.85, geo,
      mat: { dispose() { bits.forEach(b => b.mat.dispose()); } },
      sparkle: true,
    });
  }

  function spawnPuff(x, y, color) {
    const geo = new THREE.BoxGeometry(0.16, 0.16, 0.16);
    const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.7 });
    const group = new THREE.Group();
    const bits = [];
    for (let i = 0; i < 10; i++) {
      const m = new THREE.Mesh(geo, mat);
      m.position.set((Math.random() - 0.5) * 0.4, 0.3 + Math.random() * 0.3, (Math.random() - 0.5) * 0.4);
      group.add(m);
      bits.push({
        m,
        vx: (Math.random() - 0.5) * 3.2,
        vy: 2.2 + Math.random() * 2.4,
        vz: (Math.random() - 0.5) * 3.2,
        rx: (Math.random() - 0.5) * 9,
        rz: (Math.random() - 0.5) * 9,
      });
    }
    group.position.set(World.wx(x), 0, World.wz(y));
    World.scene.add(group);
    g.puffs.push({ mesh: group, bits, life: 0.9, geo, mat });
  }

  /* ---- Speed trail: the faster you are, the more you kick up ------------- */
  const DUST_CAP = 48;
  let dustGeo = null;

  function spawnDust(x, y, colour, power) {
    if (g.dust.length >= DUST_CAP) return;
    if (!dustGeo) dustGeo = new THREE.SphereGeometry(0.13, 8, 6);
    const mat = new THREE.MeshBasicMaterial({
      color: colour, transparent: true, opacity: 0.5, depthWrite: false, toneMapped: false,
    });
    const m = new THREE.Mesh(dustGeo, mat);
    m.position.set(
      World.wx(x) + (Math.random() - 0.5) * 0.25,
      0.1 + Math.random() * 0.08,
      World.wz(y) + (Math.random() - 0.5) * 0.25
    );
    const s = 0.55 + power * 0.22;
    m.scale.setScalar(s);
    World.scene.add(m);
    g.dust.push({ m, mat, life: 0.45 + power * 0.07, max: 0.45 + power * 0.07, grow: 1.4 + power * 0.5 });
  }

  function updateDust(dt) {
    for (let i = g.dust.length - 1; i >= 0; i--) {
      const d = g.dust[i];
      d.life -= dt;
      const t = Math.max(d.life / d.max, 0);
      d.mat.opacity = 0.5 * t;
      d.m.scale.multiplyScalar(1 + d.grow * dt);
      d.m.position.y += dt * 0.22;
      if (d.life <= 0) {
        World.scene.remove(d.m);
        d.mat.dispose();
        g.dust.splice(i, 1);
      }
    }
  }

  function updatePuffs(dt) {
    for (let i = g.puffs.length - 1; i >= 0; i--) {
      const p = g.puffs[i];
      p.life -= dt;
      p.bits.forEach(b => {
        b.vy -= (p.sparkle ? 3.5 : 11) * dt;      // sparkles hang, debris drops
        b.m.position.x += b.vx * dt;
        b.m.position.y += b.vy * dt;
        b.m.position.z += b.vz * dt;
        b.m.rotation.x += b.rx * dt;
        b.m.rotation.z += b.rz * dt;
        if (b.m.position.y < 0.08) { b.m.position.y = 0.08; b.vy *= -0.35; b.vx *= 0.7; b.vz *= 0.7; }
        b.m.scale.setScalar(Math.max(0.01, p.life / 0.9));
        if (p.sparkle) b.mat.opacity = Math.max(0, p.life / 0.85);
      });
      if (p.life <= 0) {
        World.scene.remove(p.mesh);
        p.geo.dispose();
        p.mat.dispose();
        g.puffs.splice(i, 1);
      }
    }
  }

  /* ------------------------------------------------------- sudden death -- */

  // A weighted picker for resupply drops, matching the crate drop table
  function weightedDropBag(rng) {
    const total = PU_DROPS.reduce((a, p) => a + p.weight, 0);
    return function () {
      let r = rng() * total;
      for (const p of PU_DROPS) { r -= p.weight; if (r <= 0) return p.id; }
      return PU_DROPS[0].id;
    };
  }

  // The tiles forming one square ring, `inset` steps in from the outer wall.
  // inset 1 is the outermost playable row/column.
  function ringTiles(inset) {
    const x0 = inset, x1 = CFG.COLS - 1 - inset;
    const y0 = inset, y1 = CFG.ROWS - 1 - inset;
    if (x0 > x1 || y0 > y1) return [];
    const out = [];
    for (let x = x0; x <= x1; x++) {
      out.push({ x, y: y0 });
      if (y1 !== y0) out.push({ x, y: y1 });
    }
    for (let y = y0 + 1; y < y1; y++) {
      out.push({ x: x0, y });
      if (x1 !== x0) out.push({ x: x1, y });
    }
    return out;
  }

  function startSuddenDeath() {
    // The number has done its job; the band and the skulls carry it from here.
    UI.setSdCount(null);
    if (g.suddenDeath) return;
    g.suddenDeath = true;
    g.sdRing = 0;
    g.sdDone = 0;
    g.sdQueue = [];
    g.sdCountdown = 0;
    // No centred slab: the words run along the edge of the board instead, where
    // they cover nothing you have to see to stay alive.
    UI.setSdBand('SUDDEN DEATH');
    Audio3.death();
    // THE FIRST RING FALLS NOW, on the same frame the countdown reads zero.
    //
    // It used to start a SD_RING_INTERVAL timer here, so the number hit zero,
    // the words changed to SUDDEN DEATH — and then nothing happened for four
    // seconds. The countdown was counting to an announcement rather than to an
    // event, which is exactly what made it read as out of sync. The interval is
    // the gap between rings; it is not a delay before the first one.
    closeNextRing();
    g.sdTimer = CFG.SD_RING_INTERVAL;
  }

  // Queue the next ring. Blocks land one after another for the look of the
  // walls closing in rather than a whole ring appearing at once.
  function closeNextRing() {
    if (g.sdRing >= CFG.SD_MAX_RINGS) return;
    g.sdRing++;
    g.sdQueue = ringTiles(g.sdRing).filter(t => World.cellAt(t.x, t.y) !== CELL.HARD);
    g.sdStagger = 0;
    World.addShake(0.12);
  }

  // tile is for the test suite: normally the next one comes off the queue.
  function dropSuddenDeathBlock(tile) {
    const t = tile || g.sdQueue.shift();
    if (!t) return;
    if (World.cellAt(t.x, t.y) === CELL.HARD) return;

    World.destroySoft(t.x, t.y);
    World.setCell(t.x, t.y, CELL.HARD);

    const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.98, 1.0, 0.98), World.MAT.border);
    mesh.position.set(World.wx(t.x), 5, World.wz(t.y));
    mesh.castShadow = mesh.receiveShadow = true;
    mesh.userData.ownGeometry = true;
    World.group.add(mesh);
    g.fallingBlocks = g.fallingBlocks || [];
    g.fallingBlocks.push({ mesh, y: 5, target: 0.5, vy: 0 });

    // Anything on that tile is gone
    const k = World.key(t.x, t.y);
    const pu = g.powerUps.get(k);
    if (pu) { pu.dispose(); g.powerUps.delete(k); }
    const bomb = g.bombMap.get(k);
    if (bomb) {
      g.bombMap.delete(k);
      bomb.dead = true;
      bomb.owner.activeBombs = Math.max(0, bomb.owner.activeBombs - 1);
    }
    // FORCED. Shields and the post-shield invulnerability must not apply here.
    g.players.forEach(p => { if (p.alive && p.tileX === t.x && p.tileY === t.y) p.kill(true); });
  }

  // Decides when the endgame starts and drives the rings once it has.
  function updateEndgame(dt) {
    g.roundElapsed += dt;

    // Note the moment the arena runs out of crates
    // THE HEART HINT. Once anybody is three bombs into the round, nobody is
    // going to find the Extra Life by luck any more — so if it is still sitting
    // in its crate, show where it is and let them fight over it. A guaranteed
    // prize that nobody ever opens may as well not be in the game.
    if (!g.heartHinted && World.heartKey &&
        g.players.some(p => (p.bombsLaid || 0) >= CFG.HEART_HINT_BOMBS)) {
      const stillHidden = World._hidden().get(World.heartKey) === PU.SHIELD;
      const stillACrate = (() => {
        const [hx, hy] = World.heartKey.split(',').map(Number);
        return World.cellAt(hx, hy) === CELL.SOFT;
      })();
      if (stillHidden && stillACrate) World.heartHint(true);
      g.heartHinted = true;
    }

    if (g.cratesClearedAt < 0 && World.softCount() === 0) g.cratesClearedAt = g.roundElapsed;

    if (!g.suddenDeath) {
      const since = g.cratesClearedAt >= 0 ? g.roundElapsed - g.cratesClearedAt : -1;

      // Notice before the arena starts shrinking — same band, different words,
      // so the warning and the thing it warns about read as one event.
      if (!g.sdWarned && since >= CFG.CRATES_CLEAR_GRACE - CFG.SD_WARNING) {
        g.sdWarned = true;
        UI.setSdBand('WALLS CLOSING IN');
        Audio3.countdown(false);
      }
      if (g.sdWarned) {
        const left = (g.cratesClearedAt + CFG.CRATES_CLEAR_GRACE) - g.roundElapsed;
        g.sdCountdown = Math.max(0, left);
        // The number on the arena's front edge. It only exists between the last
        // crate and the walls moving, which is now the same five seconds the
        // warning band covers.
        UI.setSdCount(g.sdCountdown);
      }

      const cratesGoneLongEnough = since >= CFG.CRATES_CLEAR_GRACE;
      if (cratesGoneLongEnough || g.roundTime <= 0) startSuddenDeath();
      return;
    }

    // Feed the current ring in a block at a time
    if (g.sdQueue.length) {
      g.sdStagger -= dt;
      while (g.sdStagger <= 0 && g.sdQueue.length) {
        dropSuddenDeathBlock();
        g.sdStagger += CFG.SD_BLOCK_STAGGER;
      }
      return;
    }

    if (g.sdRing < CFG.SD_MAX_RINGS) {
      g.sdTimer -= dt;
      if (g.sdTimer <= 0) {
        g.sdTimer = CFG.SD_RING_INTERVAL;
        closeNextRing();
      }
      return;
    }

    // Arena is as small as it gets. If nobody has won by now, call it a draw
    // rather than let the round run for ever.
    g.sdDone += dt;
    if (g.sdDone >= CFG.SD_DRAW_AFTER) endRound(null);
  }

  function updateFallingBlocks(dt) {
    if (!g.fallingBlocks) return;
    for (let i = g.fallingBlocks.length - 1; i >= 0; i--) {
      const b = g.fallingBlocks[i];
      b.vy += 34 * dt;
      b.y -= b.vy * dt;
      if (b.y <= b.target) {
        b.y = b.target;
        World.addShake(0.1);
        Audio3.breakBlock();
        g.fallingBlocks.splice(i, 1);
      }
      b.mesh.position.y = b.y;
    }
  }

  /* ------------------------------------------------------- simulation ---- */
  function stepSim(dt) {
    g.dangerMap = AI.buildDanger(g);

    // Players
    g.players.forEach(p => {
      if (!p.alive) { p.update(dt, { x: 0, y: 0 }, false); return; }
      let dir = { x: 0, y: 0 }, bomb = false;
      if (g.state === STATE.PLAY) {
        const km = p.keymap;
        if (p.isHuman && km) {
          dir = Input.direction(km);
          bomb = Input.consumePress(km.action);
          // The special is consumed here rather than inside Player.update, so a
          // press is spent whether or not the worn prize can do anything with
          // it — otherwise it would queue up and fire the moment one could.
          if (km.special && Input.consumePress(km.special)) trySpecial(p);
        } else if (p.ai) {
          const move = AI.step(g, p, dt);
          dir = move.dir; bomb = move.bomb;
          // A named action is aimed, so the facing has to be set before it
          // runs — a punch goes wherever the character is looking.
          if (move.act) {
            if (move.face) p.dir = { x: move.face.x, y: move.face.y };
            tryAction(p, move.act);
          }
        }
        // A human seat with no keymap (or a bot with no brain) simply idles
        // rather than crashing the frame.
      }
      p.update(dt, dir, bomb);
    });

    // NOBODY IS EVER ALIVE INSIDE A BLOCK. Movement will not walk you into a solid
    // tile, so in normal play this never fires; it exists because sudden death
    // makes tiles solid UNDER people, and one frame of rounding between the block
    // landing and the crush check was enough to leave somebody sealed in, alive and
    // unreachable, with the round unable to end. Cheaper to make the state
    // impossible than to find every route into it.
    // ...but NOT while somebody is over one with a jetpack. Being above a block
    // is the hop working; `land()` is what guarantees they are not still there
    // when they come down, and this guard is what catches it if it ever is.
    g.players.forEach(p => {
      if (p.alive && !p.airborne && World.isSolid(p.tileX, p.tileY)) {
        p.kill(true);
        spawnPuff(p.tileX, p.tileY, 0xffffff);
      }
    });

    // Pickups
    g.players.forEach(p => {
      if (!p.alive) return;
      const k = World.key(p.tileX, p.tileY);
      const pu = g.powerUps.get(k);
      if (pu && Math.abs(p.gx - pu.x) < 0.55 && Math.abs(p.gy - pu.y) < 0.55) {
        const isCurse = pu.id === PU.SKULL;
        const isHeart = pu.id === PU.SHIELD;
        pu.apply(p);
        pu.dispose();
        g.powerUps.delete(k);
        if (isCurse) Audio3.curse(); else Audio3.pickup();
        spawnPuff(p.gx, p.gy, pu.def.color);
        // The one Extra Life is worth announcing on the arena itself
        if (isHeart) World.flashHearts(p.def.color);
      }
    });

    // Curses jump on contact — touch a cursed player and it is yours
    for (let i = 0; i < g.players.length; i++) {
      for (let j = i + 1; j < g.players.length; j++) {
        const a = g.players[i], b = g.players[j];
        if (!a.alive || !b.alive) continue;
        if (Math.abs(a.gx - b.gx) > 0.7 || Math.abs(a.gy - b.gy) > 0.7) continue;
        if (!!a.curse === !!b.curse) continue;
        const from = a.curse ? a : b, to = a.curse ? b : a;
        if (from.curseLock > 0) continue;
        to.curse = from.curse;
        to.curseLock = CFG.CURSE_TOUCH_LOCK;
        from.curse = null;
        Audio3.curse();
      }
    }

    // Land mines wait for a victim rather than a timer
    g.bombs.forEach(b => {
      if (!b.isMine || b.dead || b.flight || b.held || b.armT < CFG.MINE_ARM) return;
      const hit = g.players.some(p => p.alive && p !== b.owner &&
        p.tileX === b.x && p.tileY === b.y);
      if (hit) b.fuse = 0;
    });

    // Bombs
    for (let i = g.bombs.length - 1; i >= 0; i--) {
      const b = g.bombs[i];
      if (b.dead) { b.dispose(); g.bombs.splice(i, 1); continue; }
      if (b.update(dt)) { detonate(b); b.dispose(); g.bombs.splice(i, 1); }
    }

    // Blasts (lethal for their whole lifetime, not just the first frame)
    for (let i = g.blasts.length - 1; i >= 0; i--) {
      const bl = g.blasts[i];
      applyBlastDamage(bl);
      if (bl.update(dt)) { bl.dispose(); g.blasts.splice(i, 1); }
    }

    g.powerUps.forEach(p => p.update(dt));
    updatePuffs(dt);
    updateDust(dt);
    updateFallingBlocks(dt);
  }

  // A monotonic stamp for the order players died in. It advances once per
  // SIMULATION STEP, not once per death: everything killed by the same blast on
  // the same step shares a number, which is what keeps a mutual kill a draw.
  function nextDeathOrder() { return g.stepIndex; }

  function checkRoundOver() {
    const alive = g.players.filter(p => p.alive);
    const dying = g.players.filter(p => !p.alive && p.deathT < 0.7);
    if (alive.length > 1 || dying.length > 0) return;
    if (alive.length === 1) { endRound(alive[0]); return; }

    // NOBODY LEFT STANDING. It used to be a flat draw, which threw away the one
    // thing everyone watching already knows: somebody was still alive a moment
    // after everybody else. The closing walls drop a block at a time, so the
    // last player crushed outlasted the rest and takes the round.
    //
    // A genuine dead heat is still a draw: two players caught by the same blast
    // die on the same simulation step, share a death stamp, and there is no
    // "last" to award it to.
    let last = null, tied = false;
    g.players.forEach(p => {
      const at = p.deathOrder;
      if (at === undefined || at === null) return;
      if (!last || at > last.deathOrder) { last = p; tied = false; }
      else if (at === last.deathOrder) tied = true;
    });
    endRound(last && !tied ? last : null);
  }

  /* -------------------------------------------------------------- loop --- */
  let last = 0, acc = 0;

  function frame(now) {
    requestAnimationFrame(frame);
    const t = now / 1000;
    // Animated cosmetics run on the RENDER clock, not the simulation step: they
    // are decoration, they must be smooth on a 120Hz screen, and they must stop
    // dead when the game is paused rather than catching up in a lurch.
    if (!g.paused) {
      for (let i = 0; i < g.players.length; i++) {
        const p = g.players[i];
        if (p && p.mesh) Player.tickCosmetics(p.mesh, t);
      }
      if (g.preview && g.preview.mesh) {
        Player.tickCosmetics(g.preview.mesh, t);
        Player.tickShowcase(g.preview.mesh, t);
      }
      if (g.preview && g.preview.bomb) Player.tickCosmetics(g.preview.bomb, t);
      if ((g.state === STATE.ROUND_END || g.state === STATE.MATCH_END) && g.victory) {
        Player.tickCosmetics(g.victory.mesh, t);
        Player.tickShowcase(g.victory.mesh, t);
        g.victory.turn.rotation.y = -0.28 + Math.sin(t * 0.45) * 0.11;
        g.victory.halo.rotation.z = t * 0.08;
        g.victory.ring.rotation.z = t * 0.32;
        g.victory.sparks.rotation.y = -t * 0.16;
        g.victory.sparks.position.y = Math.sin(t * 0.8) * 0.035;
        let blastShake = 0;
        g.victory.explosions.forEach((blast, i) => {
          const age = (t * 0.42 + blast.phase) % 1;
          const open = Math.min(1, age / 0.1);
          const fade = Math.max(0, 1 - age / 0.76);
          const heat = Math.max(0, 1 - age / 0.48);
          const scale = 0.28 + open * 0.72 + age * 0.72;
          blast.group.scale.setScalar(scale);
          blast.group.rotation.z = t * (i % 2 ? -0.24 : 0.24);
          blast.fire.rotation.z = t * (i % 2 ? 0.55 : -0.48);
          blast.core.scale.setScalar(0.65 + open * 0.72);
          blast.shock.scale.setScalar(0.7 + age * 3.5);
          blast.flameMat.opacity = fade * 0.92;
          blast.coreMat.opacity = heat * 0.98;
          blast.shockMat.opacity = fade * 0.68;
          blast.group.visible = fade > 0.01;
          if (age < 0.1) blastShake = Math.max(blastShake, 1 - age / 0.1);
        });
        g.victory.blastShake = blastShake;
      }
      if (g.sdWarned || g.suddenDeath) { UI.placeSdBand(); UI.placeSdCount(); }
    }
    let dt = last ? Math.min(t - last, CFG.MAX_FRAME_DT) : 0;
    last = t;

    // Portrait on a touch device: the rotate overlay is up, so hold the
    // simulation rather than letting a round play out unseen behind it.
    if (!g.paused && !UI.isBlockedByOrientation()) {
      acc += dt;
      let guard = 0;
      while (acc >= CFG.FIXED_DT && guard++ < 8) {
        tick(CFG.FIXED_DT);
        acc -= CFG.FIXED_DT;
      }
    }

    // The menu track follows the game's own state, checked here rather than
    // hung on each transition: there are seven ways out of a round and six of
    // them would eventually be forgotten. Audio3 ignores a call that asks for
    // what is already happening, so this costs a string compare per frame.
    syncAudio();

    World.updateCamera();
    World.render();
    // The winner owns the whole arena canvas. Loadout renders its fighter into
    // the dedicated canvas inside the preview panel.
    if ((g.state === STATE.ROUND_END || g.state === STATE.MATCH_END) && g.victory) renderVictory();
    else if (g.state === STATE.SELECT) renderPreview();
  }

  function tick(dt) {
    g.stateT += dt;
    g.stepIndex++;
    syncTouchVisibility();
    UI.tickBanner(dt);
    World.decayShake(dt);
    World.updateHeartFlash(dt);

    switch (g.state) {
      case STATE.SELECT:
        // Character select stays front-facing. The fighter's unique showcase
        // animation supplies the movement; an automatic turntable can leave
        // every option showing its back when the player switches between them.
        World.group.rotation.y += dt * 0.05;
        break;

      case STATE.MENU:
        World.group.rotation.y += dt * 0.05;
        // Random? Then walk through the maps so you can see them all
        if (g.opts.level === 'random') {
          g.menuCycleT -= dt;
          if (g.menuCycleT <= 0) {
            g.menuCycleT = CFG.MENU_CYCLE;
            showMenuLevel(g.menuPreview + 1);
          }
        }
        break;

      case STATE.INTRO: {
        // SQUARE TO THE CAMERA, IMMEDIATELY — not eased into place.
        //
        // Only the ARENA lives in World.group. Players, bombs, blasts and
        // pick-ups are all added to World.scene, so any rotation on the group
        // slides the board out from under everything standing on it: the
        // characters hold still while their tiles move, which is precisely the
        // glitch you see as a round starts. It is small coming off the menu and
        // large coming off a match-end screen, which spins the board for as long
        // as the results are up. Snapped rather than approached, so there is no
        // frame where the two disagree.
        World.group.rotation.y = 0;
        const remain = CFG.ROUND_INTRO - g.stateT;
        const n = Math.ceil(remain - 0.35);
        if (n !== g.lastCountdown && n >= 1 && n <= 3) {
          g.lastCountdown = n;
          // Its own element, not the banner: big, rainbow, and the only timer on
          // screen while it runs. See UI.setCountdown.
          UI.setCountdown(String(n));
          Audio3.countdown(false);
        }
        stepSim(dt);
        if (g.stateT >= CFG.ROUND_INTRO) {
          g.state = STATE.PLAY;
          g.stateT = 0;
          Input.clearPresses();          // no stale menu keypress becomes a bomb
          // GO! finishes the same sequence in the same place, so the eye does not
          // have to move; g.goT clears it and hands the clock back.
          UI.setCountdown('GO!');
          g.goT = CFG.GO_HOLD;
          Audio3.countdown(true);
        }
        break;
      }

      case STATE.PLAY:
        World.group.rotation.y = 0;
        // GO! is the tail of the countdown, so it is cleared on the play clock
        // rather than by a CSS timeout — pausing must not run it out underneath.
        if (g.goT > 0) {
          g.goT -= dt;
          if (g.goT <= 0) { g.goT = 0; UI.setCountdown(null); }
        }
        g.roundTime = Math.max(0, g.roundTime - dt);
        updateHazard(dt);
        updateEndgame(dt);
        if (g.state !== STATE.PLAY) break;      // updateEndgame may have ended it
        stepSim(dt);
        checkRoundOver();
        UI.updateHUD(g);
        break;

      case STATE.ROUND_END:
        stepSim(dt);
        if (g.stateT >= (g.outroDuration || CFG.ROUND_OUTRO)) {
          const champ = g.players.find(p => p.wins >= g.opts.wins);
          if (champ) endMatch(champ);
          else { g.round++; startRound(); }
        }
        break;

      case STATE.MATCH_END:
        World.group.rotation.y += dt * 0.12;
        break;
    }

    // A one-shot press expires HERE, on the simulation step — never on the
    // render frame. The two are not the same thing: on a 120Hz phone a frame
    // arrives every 8ms while a step is 16.7ms, so roughly every other frame
    // runs no step at all. Clearing per frame silently threw away about half
    // of all bomb taps, which is exactly what an intermittent bomb button
    // feels like. It could not reproduce under the software renderer, where
    // every slow frame runs several steps.
    Input.endTick();
  }

  // Headless helper: advance the simulation without waiting on the renderer.
  // Used by the test suite; harmless in normal play.
  // The music and the round's bass both follow the game's own state, checked
  // once a frame rather than hung on each transition: there are seven ways out
  // of a round and six of them would eventually be forgotten. Audio3 ignores a
  // call that asks for what is already happening, so this costs a string
  // compare per frame.
  //
  // Its own function, and exported, because it runs from the RENDER loop — the
  // music must keep playing while the simulation is paused — and a headless
  // test that only ever calls advance() would otherwise never exercise it.
  function syncAudio() { Audio3.musicForState(g.state); }

  function advance(seconds) {
    const n = Math.max(0, Math.round(seconds / CFG.FIXED_DT));
    for (let i = 0; i < n; i++) tick(CFG.FIXED_DT);
  }

  return {
    init, tryPlaceBomb, tryAction, tryKick, spawnPuff, spawnDust, spawnPowerUp, bombAt, powerUpAt, advance,
    registerBomb, unregisterBomb, moveBombTo, bombCanEnter, landingTile, dropCarried,
    endRound, nextWinLine, syncAudio,           // exposed for the test suite
    _dropRingBlock: dropSuddenDeathBlock,
    get players() { return g.players; },
    get bombs() { return g.bombs; },
    get blasts() { return g.blasts; },
    get powerUps() { return g.powerUps; },
    get dangerMap() { return g.dangerMap; },
    get roundTime() { return g.roundTime; },
    get opts() { return g.opts; },
    get stats() { return g.stats; },
    get suddenDeath() { return g.suddenDeath; },
    get sdRing() { return g.sdRing; },
    get menuPreview() { return g.menuPreview; },
    get state() { return g.state; },
    _debug: g,
    nextDeathOrder,
    trySpecial,
    toggleControls,
    _rebuildPreview: buildPreview,
    // Headless contexts throttle requestAnimationFrame, so a test cannot wait
    // for the loop to have drawn a frame. It asks for one instead.
    _renderPreview: renderPreview,
    toSelect,
  };
})();

// Single namespace on window: keeps the global scope clean while still giving
// the headless test suite (and the browser console) a way in.
window.BlastArena = {
  Game, World, Input, Audio3, UI, AI, Icons, Props, TouchPad,
  CFG, CELL, RULE, BELT_DIR, PU, PU_TABLE, PU_DROPS, PU_CODE, CURSES, PLAYER_DEFS, SPAWNS, KEYMAPS,
  DIFFICULTIES, ROUND_OPTIONS, LEVELS, WIN_LINES,
  colourDistance, bombColourFor, SHOE_BLACK, SHOE_GOLD, SHOE_GLOW,
  SHOE_PULSE_RATE, SHOE_PULSE_LOW, SHOE_PULSE_HIGH,
  Locker, COSMETICS, COSMETIC_SLOTS, LOCKER_ITEMS, LOCKER_MAX, lockerItem,
  cosmeticItem, kitSpecial, prizePool, PRIZE_COUNT,
  Player, Bomb, Blast, PowerUp, STATE,
};

// Query-only release audit. It waits for all twenty external rigs, then proves
// each has finite skinned geometry, an animation set and a gameplay-safe size.
if (new URLSearchParams(location.search).get('audit') === 'characters') {
  document.documentElement.dataset.characterAudit = 'running';
  (async () => {
    const rows = await Promise.all(PLAYER_DEFS.map(async def => {
      try {
        const root = Player.buildMesh(def, {});
        const loaded = await root.userData.modelPromise;
        let meshes = 0, skinnedMeshes = 0, vertices = 0, badValues = 0;
        let standardMaterials = 0, flatShadedMaterials = 0;
        const auditedMaterials = new Set();
        root.traverse(object => {
          if (!object.isMesh) return;
          meshes++;
          if (object.isSkinnedMesh) skinnedMeshes++;
          const position = object.geometry && object.geometry.attributes && object.geometry.attributes.position;
          if (position) {
            vertices += position.count;
            for (let i = 0; i < position.array.length; i++) {
              if (!Number.isFinite(position.array[i])) badValues++;
            }
          }
          const materials = Array.isArray(object.material) ? object.material : [object.material];
          materials.forEach(material => {
            if (!material || auditedMaterials.has(material)) return;
            auditedMaterials.add(material);
            if (material.isMeshStandardMaterial || material.isMeshPhysicalMaterial) standardMaterials++;
            if (material.flatShading) flatShadedMaterials++;
          });
        });
        const box = root.userData.modelRoot
          ? new THREE.Box3().setFromObject(root.userData.modelRoot) : new THREE.Box3();
        const size = box.getSize(new THREE.Vector3());
        const animations = root.userData.animationCount || 0;
        const ok = !!loaded && root.userData.modelReady && meshes > 2 &&
          skinnedMeshes > 0 && vertices > 0 && badValues === 0 &&
          standardMaterials > 0 && flatShadedMaterials === 0 && animations >= 8 &&
          Number.isFinite(size.x + size.y + size.z) && size.x <= 0.725 && size.z <= 0.725;
        return { name: def.name, ok, meshes, skinnedMeshes, vertices, badValues,
                 standardMaterials, flatShadedMaterials, animations,
                 size: [size.x, size.y, size.z].map(value => Number(value.toFixed(4))) };
      } catch (error) {
        return { name: def.name, ok: false, error: String(error && (error.stack || error)) };
      }
    }));
    document.documentElement.dataset.characterAudit = JSON.stringify({
      count: rows.length,
      failures: rows.filter(row => !row.ok),
      rows,
    });
  })();
}

// WebGL is required for a match, but it is not required to browse the roster.
// If a device refuses the graphics context, build the same Loadout DOM and
// keep its polished portrait fallback interactive. This is also a recovery
// path for in-app browsers that temporarily exhaust their WebGL context quota.
function initStaticLoadout(error) {
  console.warn('Bomber Fan is using portrait-only Loadout mode.', error);
  document.body.classList.add('webgl-fallback');
  UI.init();
  UI.showMenu(false);
  UI.showSelect(true);
  const requested = new URLSearchParams(location.search).get('preview') || '';
  let selected = Math.max(0, PLAYER_DEFS.findIndex(
    def => def.name.toLowerCase() === requested.toLowerCase()
  ));
  const render = () => {
    UI.renderSelect(selected, selected);
    UI.setPreviewName(PLAYER_DEFS[selected].name.toUpperCase());
  };
  UI.bindSelect({
    onClass(index) { selected = index; render(); },
    onFightHover() {},
    onFight() {},
  });
  const fight = document.querySelector('#select [data-srow="fight"]');
  if (fight) {
    fight.setAttribute('aria-disabled', 'true');
    const label = fight.querySelector('.start');
    if (label) label.textContent = '3D UNAVAILABLE';
  }
  const hint = document.querySelector('#select .shint');
  if (hint) hint.textContent = 'Portrait preview mode. 3D gameplay needs WebGL.';
  render();
}

window.addEventListener('load', () => {
  try {
    Game.init(document.getElementById('scene'));
  } catch (error) {
    initStaticLoadout(error);
  }
});

})();
</script>
</body>
