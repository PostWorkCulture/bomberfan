(function () {
'use strict';

/* ==== 00-config.js ================================================ */
/* ============================================================================
   SECTION 00 — CONFIGURATION & TUNING
   All magic numbers live here. Change gameplay feel from this block alone.
   ========================================================================== */

const CFG = {
  // ---- Arena -------------------------------------------------------------
  COLS: 15,              // total columns including the outer wall
  ROWS: 13,              // total rows including the outer wall
  TILE: 1,               // world units per tile
  SOFT_DENSITY: 0.70,    // proportion of free interior tiles that get a crate
  POWERUP_CHANCE: 0.2364, // proportion of crates hiding a power-up

  // ---- Players -----------------------------------------------------------
  MAX_PLAYERS: 4,
  BASE_SPEED: 3.9,       // tiles per second
  SPEED_STEP: 3.9,       // one Speed Up doubles base speed
  MAX_SPEED: 9.0,        // a second Speed Up adds a little more, then it caps
  SPEED_DURATION: 4,     // seconds a Speed Up lasts; a fresh one resets the clock
  PLAYER_RADIUS: 0.36,   // collision half-extent
  // How fast a player re-centres on the perpendicular axis when they change
  // direction. This is most of what "responsive" feels like on a grid: turn a
  // corner off-centre and you slide diagonally until you are back on the lane,
  // and a low value reads as the controls lagging behind your thumb.
  TURN_SNAP: 2.8,
  START_BOMBS: 1,
  // Classic reach: a fresh bomb clears one square in each direction. Every
  // Fire Up adds one more. Nobody starts with any Fire Ups, so the fire stat
  // is absent from the HUD card until the first one is collected.
  START_FIRE: 1,
  MAX_BOMBS: 8,
  MAX_FIRE: 9,           // effectively full-map

  // ---- Bombs -------------------------------------------------------------
  // A bomb you cannot see is a bomb you die to. No single shell colour works on
  // every floor — the classic near-black vanishes on Circuit's near-black
  // ground, and a pale one vanishes on Beach sand — so the shell is CHOSEN per
  // level: keep the iconic dark bomb wherever it reads, and switch to the pale
  // one only where it would not. Derived from the floor colour, so a new level
  // gets the right answer without anyone remembering to pick.
  BOMB_DARK: 0x101318,
  BOMB_PALE: 0xd8dce6,
  BOMB_MIN_CONTRAST: 200,
  BOMB_FUSE: 1.8,        // seconds — snappier again; classic is 2.5
  BLAST_LIFE: 0.52,      // seconds the flame stays lethal
  CHAIN_DELAY: 0.06,     // stagger on chain reactions, looks better
  KICK_SPEED: 7.5,       // tiles per second for a kicked bomb
  PUNCH_TILES: 3,        // how far a punched bomb travels
  THROW_TILES: 4,        // how far a thrown bomb travels
  FLIGHT_TIME: 0.42,     // seconds a bomb spends in the air
  // Screen shake compounds per Bomb Up its owner has collected. The rate is
  // set so that a player holding 5 bombs (4 Bomb Ups) shakes the camera
  // exactly twice as hard as the old 15%-per-step curve did at the same count:
  //   1.36759^4 = 3.498 = 2 x 1.15^4
  SHAKE_PER_BOMBUP: 1.36759,
  SHAKE_MAX: 1.0,        // headroom so the doubled 5-bomb hit is never clipped

  // ---- Endgame -----------------------------------------------------------
  // Halved from 30. Once the last crate is gone there is nothing left to open,
  // so the half-minute of nobody-finding-anything was dead time — the players
  // are already just circling each other waiting for the walls.
  // FIVE SECONDS, from the last crate to the walls closing. It was 15, and the
  // last stretch of a round was fifteen seconds of four players standing in an
  // empty arena waiting for something to happen.
  CRATES_CLEAR_GRACE: 5,   // seconds after the last crate before sudden death
  // Equal to the grace, so the warning and the countdown both start the INSTANT
  // the last crate goes rather than partway through. There is no longer a quiet
  // stretch for them to appear partway into.
  SD_WARNING: 5,           // warning shown this long before the walls move
  SD_RING_INTERVAL: 4.0,   // seconds between shrinking rings
  SD_MAX_RINGS: 4,         // how far the arena is allowed to close in
  SD_DRAW_AFTER: 20,       // seconds after the final ring before calling a draw
  SD_BLOCK_STAGGER: 0.035, // delay between blocks within one ring, for the look

  // Once every crate is gone, drop fresh pick-ups every Nth detonation.
  // These used to be 2 and 2, which works out at roughly ONE NEW ITEM PER
  // DETONATION with four players trading bombs — the floor of a stripped arena
  // filled up faster than anyone could collect, and the endgame turned into a
  // carpet of pick-ups. The cap is the real fix: top-ups stop entirely while
  // there are already MAX_LOOSE items lying about, so they replace what gets
  // taken instead of accumulating.
  RESUPPLY_EVERY: 6,
  RESUPPLY_COUNT: 1,
  RESUPPLY_MAX_LOOSE: 4,
  MINE_ARM: 0.7,         // land mine ignores contact for this long after landing
  MINE_FUSE: 90,         // effectively "never" — mines wait for a victim
  CURSE_TIME: 11,        // seconds a curse sticks
  CURSE_TOUCH_LOCK: 0.6, // grace before a curse can be passed on again
  SHIELD_INVULN: 1.6,    // seconds of flashing safety after a shield absorbs a hit

  // The Extra Life is the one prize on the map, so collecting it is announced
  // on the arena itself: every edge block lights up with a heart, in the
  // collector's colour, for this long.
  HEART_FLASH_TIME: 1.5,
  // Bombs laid by any one player before the heart's crate is pointed out.
  // RAISED FROM THREE TO EIGHT: three bombs is barely into the round — with four
  // players that is often under fifteen seconds, and the marker was up before
  // anyone had had a chance to find it themselves. Eight leaves the search to the
  // players first and only then gives it away.
  HEART_HINT_BOMBS: 8,
  HEART_FLASH_PEAK: 1.15,
  HEART_FLASH_COLOR: 0xff4d6d,

  // ---- Per-level rules ---------------------------------------------------
  // How fast a conveyor carries whatever is standing on it, in tiles a second.
  // Deliberately well under BASE_SPEED (3.9) so a belt is a current you can walk
  // against rather than a wall you cannot cross — a belt you cannot beat is a
  // hard block that looks like a floor.
  BELT_SPEED: 1.5,
  // A pad will not take the same traveller again for this long, or a pair of
  // pads is an infinite loop with a character trapped in it.
  PAD_COOLDOWN: 0.9,
  // Ice: how quickly you get up to speed and how slowly you lose it. Grip is
  // the fraction of your speed you keep each second once you stop steering.
  ICE_GRIP: 0.28,

  // Seconds between the angry snowman's bombs, on the maps that have one
  HAZARD_EVERY: 11,
  // How long the thing holds the bomb before it lets go, and how long the throw
  // spends in the air. Both are notice: a hazard you cannot fight back against
  // has to be a hazard you can SEE coming and walk away from.
  HAZARD_WINDUP: 1.5,
  HAZARD_FLIGHT: 1.05,
  // THE JETPACK HOP. Off the ground for 0.6s, and it cannot be used again for
  // 2.4s. Short enough that it has to be timed against a fuse rather than held
  // as a panic button, long enough to clear a blast that has already started.
  HOP_TIME: 0.6,
  HOP_COOLDOWN: 2.4,
  HOP_HEIGHT: 1.15,
  GO_HOLD: 0.7,          // seconds GO! stays up before the round clock is handed back
  MENU_CYCLE: 3.2,       // seconds each map is shown behind a Random selection
  MENU_ZOOM: 1.0,        // largest the menu arena can be with the whole map visible

  // ---- Match -------------------------------------------------------------
  ROUND_SECONDS: 120,
  WINS_NEEDED: 3,        // default only — the live value is opts.wins
  // A FULL THREE SECONDS OF DIGITS. At 2.2 the old formula never reached 3 —
  // the round opened on "2" — so this is 3.0 for the three numbers plus a
  // beat for the last one to finish its pop before GO!.
  ROUND_INTRO: 3.35,     // 3 - 2 - 1, then GO!
  ROUND_OUTRO: 6.0,      // full-screen character celebration after a round

  // ---- Simulation --------------------------------------------------------
  FIXED_DT: 1 / 60,
  MAX_FRAME_DT: 0.25,
};

// Grid cell types
const CELL = { EMPTY: 0, HARD: 1, SOFT: 2 };

// ---- Per-tile rules ------------------------------------------------------
// A SECOND GRID, LAID OVER THE FIRST, AND IT NEVER TOUCHES SOLIDITY.
//
// Invariant 2 says CELL is the only source of truth for whether a tile can be
// stood on, and that stays exactly true: a rule changes what happens ON a tile,
// never whether you can be there. Anything that wants to make a tile solid has
// to go through CELL like everything else.
//

// The Haunted House taught that one: `hazard` used to be the string 'snowman'
// written inside Props, which would have made the witch a harmless decoration
// the moment a second hazard existed, with nothing to say so.
const RULE = {
  NONE: 0,
  BELT_R: 1, BELT_L: 2, BELT_D: 3, BELT_U: 4,   // conveyor, carrying that way
  PAD: 5,                                        // teleport pad, paired by index

  // until something stops you, and a plain floor stops you dead — and the
  // pathfinder was taught to treat a slide as one move rather than one tile.
  // The bots still cannot play on it: measured over 10 bot-only rounds on a
  // full rink, 2.9 self-kills a round against 1.0 on a plain floor, with rounds
  // ending in ten seconds.
  //

  // cannot change its mind — and it re-decides every 0.14s — so every plan made
  // mid-slide is ignored by the floor. Making that work needs the bot to plan
  // in slide-space everywhere (hunting, wandering and bombing, not just
  // escaping) and to know it will overshoot when it lays a bomb. That is a
  // bigger piece of work than the two rules that did ship, and shipping a rink
  // where three of the four players spin into their own blasts is worse than
  // not shipping one.
  //
  // Everything stays: the rule, the layout, the player physics and slidePath.
  // No level declares `rule: 'ice'`, so none of it runs.
  ICE: 6,                                        // no grip: you keep going
};

// Which way a belt carries. Anything that is not a belt carries nowhere.

  [RULE.BELT_L]: { x: -1, y: 0 },
  [RULE.BELT_D]: { x: 0, y: 1 },
  [RULE.BELT_U]: { x: 0, y: -1 },

// ---- Small shared helpers ------------------------------------------------
// Luminance-weighted RGB distance. Rough, but it treats a light/dark pair as
// separated even when the hue matches, which plain Euclidean RGB does not.
// The level palette checks and the bomb-shell choice both use THIS function,
// so "readable" means one thing across the whole game.
function colourDistance(a, b) {
  const rgb = c => Array.isArray(c) ? c
    : typeof c === 'number' ? [(c >> 16) & 255, (c >> 8) & 255, c & 255]
    : [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
  const [r1, g1, b1] = rgb(a), [r2, g2, b2] = rgb(b);
  const rm = (r1 + r2) / 2;
  return Math.sqrt((2 + rm / 256) * (r1 - r2) ** 2 + 4 * (g1 - g2) ** 2 +
                   (2 + (255 - rm) / 256) * (b1 - b2) ** 2);
}

// Which shell this level's bombs wear. Dark unless dark would be invisible.
function bombColourFor(level) {
  return colourDistance(CFG.BOMB_DARK, level.ground) >= CFG.BOMB_MIN_CONTRAST
    ? CFG.BOMB_DARK : CFG.BOMB_PALE;
}

const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const lerp = (a, b, t) => a + (b - a) * t;
const approach = (v, target, step) => {
  if (v < target) return Math.min(v + step, target);
  if (v > target) return Math.max(v - step, target);
  return v;
};
// Deterministic RNG so a round can be replayed exactly for debugging
function makeRng(seed) {
  let s = seed >>> 0 || 1;
  return function () {
    s ^= s << 13; s >>>= 0;
    s ^= s >> 17;
    s ^= s << 5;  s >>>= 0;
    return s / 4294967296;
  };
}

/* ============================================================================
   SECTION 05 — COSMETICS CATALOGUE
   Everything that can be won, in one declarative table. A new cosmetic is ONE
   entry here — id, name, and the code that builds it — not a change in four
   files. Nothing in this section knows about saving, unlocking or the UI.

   TEN ITEMS, ONE LIST. The locker used to be four rows of tiles — 29 of them,
   scrolling sideways on a phone. It is now a single list of ten, and ten is a
   hard ceiling (LOCKER_MAX, enforced by a test). A list you can read at a
   glance is worth more than a catalogue you have to swipe through, so an
   eleventh item means one of these ten was not worth its line.

   Items still belong to a SLOT, because the model is built slot by slot, and
   two items in different slots can be worn together — a crown and a jetpack
   are not a choice between two things. What went is the four-row UI, not the
   four slots.

   Four slots:
     finish   how the body is made (never its hue — see below)
     hat      headgear
     extra    a flourish on the body
     bomb     the shape you drop

   THE SEAT-COLOUR RULE. You identify players by colour, so a finish may change
   lightness, roughness, metalness, transparency and glow — but NEVER hue. The
   ground ring under each character stays the pure seat colour whatever else is
   equipped. Break this and a four-player game becomes unreadable.

   Every item is procedural, like the rest of the game: no textures to load, and
   it all still works offline from a single file.
   ========================================================================== */

// A finish receives the material options object just before the material is
// made, plus the seat colour, and adjusts it. `hue` is never touched.
// ONLY THE DEFAULT LEFT, and the slot stays for a reason. Chrome and Ghost were
// both withdrawn: a surface finish changes no silhouette at all, and at arena
// size — a character about 40px tall — "mirror polish" and "see-through" simply
// did not read. Both measured 0% added outline, which is the whole story.
// The hook stays because it costs nothing and a future finish that DOES read
// (a hard rim light, say) plugs straight into it.
const FINISHES = [
  {
    id: 'classic', name: 'Classic', free: true,
    body() {}, trim() {},
  },
  {
    // SILVER CHROME, and it is not won on its own — it comes with the Gold
    // Crown, so the last prize on the ladder changes the whole character rather
    // than adding one more thing to the head.
    //
    // THE SEAT-COLOUR RULE BENDS HERE, deliberately, and is paid for. A finish
    // may never make four players look alike, and silver plate would. So the
    // seat colour moves rather than disappearing: the chest panel becomes the
    // PURE seat colour instead of the pale belly tint, the hands and feet keep
    // their trim colour untouched, and the floor ring is pure seat colour as
    // always. Measured from the play camera, the four chromed seats are still
    // further apart in colour than the four ordinary ones are — see the test.
    id: 'chrome', name: 'Silver Chrome', blurb: 'comes with the crown',
    body(o, seat) {
      // A TRUE NEUTRAL. A faintly blue "cool silver" reads the same to the eye
      // but is not achromatic, and the rule that lets this finish exist at all is
      // that it has no hue to shift a player to. Neutral, and the tint comes from
      // the seat glow below where it can be reasoned about.
      o.color = 0xf3f3f3;
      // NOT full metalness. A MeshStandardMaterial at metalness 1 with no
      // environment map has nothing to reflect and renders almost black —
      // measured, mean brightness 44 against 61 for the same character without
      // it. It looked like soot, not chrome. 0.45 with a low roughness catches
      // the key light and reads as polished metal under the arena's own lighting.
      o.metalness = 0.45;

// prize is worn at a time, so there is exactly one answer and no state to keep

function kitSpecial(kit) {
  if (!kit) return null;
  for (let i = 0; i < COSMETIC_SLOTS.length; i++) {
    const slot = COSMETIC_SLOTS[i];
    const id = kit[slot];
    if (!id || id === COSMETICS[slot].def) continue;
    const item = cosmeticItem(slot, id);
    if (item && item.special) return item.special;
  }
  return null;
}

function cosmeticItem(slot, id) {
  const s = COSMETICS[slot];

  return s.items.find(i => i.id === id) || s.items.find(i => i.id === s.def);

/* ==== 10-audio.js ================================================= */
/* ============================================================================
   SECTION 10 — AUDIO
   Every sound is synthesised at runtime with WebAudio. No audio files, which
   is what keeps the whole game inside one offline HTML file.

   THE SOUNDS ARE SCHEDULED, NOT FIRED. Every effect is a function of
   (context, output, startTime), which buys three things at once:

     * multi-part sounds keep their timing under load, because the second thump
       of an explosion is booked on the audio clock rather than handed to a
       setTimeout that a busy frame will deliver late;
     * the same code renders into an OfflineAudioContext, so `test/sfx.js` can
       measure the REAL signal path — same filters, same reverb, same limiter;
     * the audition page can play any sound on demand without reaching into the
       game's own graph.

   WHY THE OLD SET WAS ANNOYING, measured rather than asserted. Almost every
   effect was a bare `square` or `sawtooth` with a 5ms envelope. A square wave
   has every odd harmonic at 1/n and nothing filtering them, so a 520Hz menu
   blip put a third of its energy between 2kHz and 6kHz — the band the ear is
   most sensitive to and where listening fatigue comes from. Fifty of those
   while somebody scrolls a menu is the complaint.

   What replaces it: triangle and sine cores instead of square, a lowpass with
   its own envelope on everything, a small synthesised room so nothing lands
   completely dry, and a soft clipper on the master so peaks round over instead
   of biting. Attacks are 6-20ms rather than 5, because under about 3ms the ear
   hears a click on the front of the sound whatever else is true of it.
   ========================================================================== */

const Audio3 = (function () {
  let ctx = null;
  let master = null;        // everything, post-limiter
  let sfxBus = null;        // effects only, so music can be turned down alone
  let musicOut = null;      // music only
  let verb = null;          // shared reverb send
  let muted = false;

  const MASTER_LEVEL = 0.5;

  /* ------------------------------------------------------------ the room -- */
  // A short synthesised room. Nothing here is a file: the impulse is noise on a
  // decay curve, with the top rolled off so the tail is warm rather than fizzy.
  //
  // This is most of what "professional" means for a sound this small. A dry
  // blip sounds like a test tone; the same blip with 8% of a room behind it
  // sounds like an object in a place.
  function buildImpulse(c, secs, decay) {
    const len = Math.max(1, Math.floor(c.sampleRate * secs));
    const buf = c.createBuffer(2, len, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) {
        const t = i / len;
        // Two decays multiplied: a fast early one for the room's size and a
        // slow one for its tail. A single exponential reads as a plate.
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decay) * (0.35 + 0.65 * Math.pow(1 - t, 1.6));
      }
    }
    return buf;
  }

  // A gentle S-curve. Peaks round over instead of squaring off, which is the
  // difference between "loud" and "harsh" when four bombs go off together.
  function softClipCurve(k) {
    const n = 1024, curve = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const x = (i / (n - 1)) * 2 - 1;
      curve[i] = Math.tanh(k * x) / Math.tanh(k);
    }
    return curve;
  }

  // Builds the whole signal path into ANY context — the live one, or an offline
  // one being measured. Returns the nodes a caller needs to hang sounds on.
  function buildChain(c, level) {
    const out = c.createGain();
    out.gain.value = level == null ? MASTER_LEVEL : level;

    const shaper = c.createWaveShaper();
    shaper.curve = softClipCurve(1.6);
    shaper.oversample = '2x';

    // A shelf above 7kHz, pulled down a little. Nothing in this game lives up
    // there except the fizz off the noise generators.
    const air = c.createBiquadFilter();
    air.type = 'highshelf';
    air.frequency.value = 7000;
    air.gain.value = -6;

    air.connect(shaper);
    shaper.connect(out);
    out.connect(c.destination);

    const sfx = c.createGain();
    sfx.gain.value = 1;
    sfx.connect(air);

    const music = c.createGain();
    music.gain.value = 1;
    music.connect(air);

    const conv = c.createConvolver();
    conv.buffer = buildImpulse(c, 0.9, 2.6);
    const send = c.createGain();
    send.gain.value = 0.16;         // subtle: a room, not a cathedral
    const verbTop = c.createBiquadFilter();
    verbTop.type = 'lowpass';
    verbTop.frequency.value = 3200; // a bright tail is what makes reverb sound cheap
    send.connect(verbTop);
    verbTop.connect(conv);
    conv.connect(air);

    return { out, sfx, music, send };
  }

  function ensure() {
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    const chain = buildChain(ctx);
    master = chain.out;
    sfxBus = chain.sfx;
    musicOut = chain.music;
    verb = chain.send;
    applyMusicLevel();
    return ctx;
  }

  // Browsers block audio until the first user gesture; call this on keydown.
  //
  // The menu is up before anybody has touched anything, so the music asks to
  // start into a suspended context and is refused. It remembers that it wants to
  // be playing, and this is where that is honoured — otherwise the track never
  // starts at all until the player happens to leave the menu and come back.
  function unlock() {
    const c = ensure();
    if (!c) return;
    if (c.state === 'suspended') {
      const r = c.resume();
      if (r && r.then) r.then(() => { if (musicWant) musicPlay(true); });
    }
    if (musicWant && !musicTimer) musicPlay(true);
  }

  /* ------------------------------------------------------- the voice ----- */
  // One tone. Everything that is not noise goes through here, so "rounded"
  // is a property of the instrument rather than something remembered at each
  // of twenty call sites.
  //
  //   type      sine | triangle | sawtooth  (square is deliberately not used)
  //   cut       lowpass corner at the start, in Hz
  //   cutTo     where that corner ends up — a falling filter is what makes a
  //             sound decay naturally instead of merely getting quieter
  //   detune    cents of a second oscillator, for width. 0 = one voice.
  function voice(c, out, t0, o) {
    const dur = o.dur, vol = o.vol == null ? 0.2 : o.vol;
    const atk = o.attack == null ? 0.008 : o.attack;
    const g = c.createGain();
    const f = c.createBiquadFilter();
    f.type = 'lowpass';
    f.Q.value = o.q == null ? 0.9 : o.q;      // gentle: a resonant peak IS harshness
    f.frequency.setValueAtTime(o.cut || 2200, t0);
    if (o.cutTo) f.frequency.exponentialRampToValueAtTime(Math.max(o.cutTo, 60), t0 + dur);

    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(vol, 0.0002), t0 + atk);
    // A hold before the decay: without it a short sound is all transient and
    // reads as a click with a pitch rather than as a note.
    const hold = Math.min(o.hold == null ? dur * 0.18 : o.hold, dur * 0.5);
    g.gain.setValueAtTime(Math.max(vol, 0.0002), t0 + atk + hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    const oscs = [];
    const n = o.detune ? 2 : 1;
    for (let i = 0; i < n; i++) {
      const osc = c.createOscillator();
      osc.type = o.type || 'triangle';
      osc.frequency.setValueAtTime(o.freq, t0);
      if (o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(o.to, 1), t0 + (o.glide || dur));
      if (i) osc.detune.value = o.detune;
      osc.connect(f);
      osc.start(t0);
      osc.stop(t0 + dur + 0.08);
      oscs.push(osc);
    }
    f.connect(g);
    g.connect(out.sfx);
    if (o.room !== 0) {
      const s = c.createGain();
      s.gain.value = o.room == null ? 1 : o.room;
      g.connect(s); s.connect(out.send);
    }
    return oscs;
  }

  // Filtered noise. Bandpass by default rather than lowpass: an open lowpass on
  // white noise is the fizz that made the old explosions tiring.
  function hiss(c, out, t0, o) {
    const dur = o.dur;
    const len = Math.max(1, Math.floor(c.sampleRate * dur));
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = c.createBufferSource();
    src.buffer = buf;

    const f = c.createBiquadFilter();
    f.type = o.band ? 'bandpass' : 'lowpass';
    f.Q.value = o.q == null ? (o.band ? 1.1 : 0.7) : o.q;
    f.frequency.setValueAtTime(o.cut || 900, t0);
    if (o.cutTo) f.frequency.exponentialRampToValueAtTime(Math.max(o.cutTo, 40), t0 + dur);

    const g = c.createGain();
    const atk = o.attack == null ? 0.006 : o.attack;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(o.vol == null ? 0.25 : o.vol, 0.0002), t0 + atk);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    src.connect(f); f.connect(g); g.connect(out.sfx);
    if (o.room !== 0) {
      const s = c.createGain();
      s.gain.value = o.room == null ? 0.7 : o.room;
      g.connect(s); s.connect(out.send);
    }
    src.start(t0);
    return src;
  }

  // A sub-bass drop. The body of anything that is supposed to feel heavy.
  function thump(c, out, t0, o) {
    return voice(c, out, t0, {
      type: 'sine', freq: o.from || 150, to: o.to || 40, glide: o.glide || 0.13,
      dur: o.dur || 0.4, vol: o.vol == null ? 0.35 : o.vol,
      cut: 400, cutTo: 90, attack: 0.006, hold: 0.02, room: o.room == null ? 0.4 : o.room,
    });
  }

  /* --------------------------------------------------------- the sounds -- */
  // Each one is (context, chain, startTime). Nothing here reads the clock or
  // uses a timer, which is what makes them measurable and auditionable.
  const SFX = {
    // --- UI. These fire more than anything else in the game, so they are the
    //     quietest and the roundest things in it. A menu blip is punctuation.
    menuMove(c, o, t) {
      voice(c, o, t, { type: 'triangle', freq: 392, dur: 0.11, vol: 0.10,
                       cut: 1500, cutTo: 700, attack: 0.010, hold: 0.012, room: 0.5 });
    },
    menuSelect(c, o, t) {
      // A rounded two-note lift, a fourth apart. Sine on top of triangle so it
      // has a body without the buzz.
      voice(c, o, t, { type: 'triangle', freq: 523.25, dur: 0.16, vol: 0.12,
                       cut: 1900, cutTo: 800, attack: 0.010, hold: 0.02 });
      voice(c, o, t + 0.075, { type: 'sine', freq: 698.46, dur: 0.28, vol: 0.13,
                               cut: 2400, cutTo: 900, attack: 0.012, hold: 0.03, room: 1.2 });
    },
    // --- The countdown. It was a bare square at 520/880, once a second, and it
    //     is the single most repeated sound in the game. Now a soft mallet: a
    //     low body with a short wooden tap on top, and the final beat is a
    //     fifth up rather than a whole octave of shriek.
    countdown(c, o, t, hi) {
      const f = hi ? 587.33 : 392;
      voice(c, o, t, { type: 'sine', freq: f, dur: hi ? 0.5 : 0.34, vol: hi ? 0.2 : 0.16,
                       cut: 2000, cutTo: 600, attack: 0.008, hold: 0.03, room: 1.3 });
      voice(c, o, t, { type: 'triangle', freq: f * 2, dur: 0.09, vol: 0.045,
                       cut: 2600, cutTo: 1200, attack: 0.006, hold: 0.005, room: 0.6 });
      thump(c, o, t, { from: f * 0.5, to: f * 0.34, dur: 0.16, vol: 0.10, glide: 0.06 });
    },

    // --- Bombs and blasts ------------------------------------------------
    placeBomb(c, o, t) {
      // A soft "tok" of something heavy set down, not a laser.
      voice(c, o, t, { type: 'sine', freq: 180, to: 120, glide: 0.06, dur: 0.16,
                       vol: 0.22, cut: 700, cutTo: 260, attack: 0.006, hold: 0.01, room: 0.4 });
      hiss(c, o, t, { dur: 0.06, vol: 0.05, cut: 1400, band: true, q: 0.9, room: 0.3 });
    },
    explode(c, o, t) {
      // Body, air, and a tail — in that order, and all of it under a falling
      // filter so it collapses inwards the way a real one does.
      thump(c, o, t, { from: 190, to: 34, glide: 0.16, dur: 0.62, vol: 0.42, room: 0.5 });
      hiss(c, o, t, { dur: 0.5, vol: 0.30, cut: 1500, cutTo: 180, q: 0.6, room: 0.9 });
      voice(c, o, t + 0.012, { type: 'triangle', freq: 110, to: 44, glide: 0.2, dur: 0.42,
                               vol: 0.16, cut: 900, cutTo: 160, attack: 0.008, hold: 0.02 });
    },
    // The Mega Boom prize. Longer tail, an octave lower, and a second thump a
    // beat behind the first, so it lands like something much bigger went off.
    explodeBig(c, o, t) {
      thump(c, o, t, { from: 150, to: 22, glide: 0.26, dur: 1.0, vol: 0.5, room: 0.7 });
      hiss(c, o, t, { dur: 0.85, vol: 0.34, cut: 1200, cutTo: 90, q: 0.5, room: 1.2 });
      voice(c, o, t + 0.02, { type: 'triangle', freq: 90, to: 30, glide: 0.3, dur: 0.7,
                              vol: 0.18, cut: 700, cutTo: 120, attack: 0.01, hold: 0.03 });
      // The second thump is BOOKED, not queued on a timer. Under load a
      // setTimeout arrives late and the two hits smear into one.
      thump(c, o, t + 0.115, { from: 110, to: 18, glide: 0.3, dur: 0.8, vol: 0.4, room: 0.9 });
      hiss(c, o, t + 0.115, { dur: 0.5, vol: 0.2, cut: 700, cutTo: 70, q: 0.5, room: 1.0 });
    },
    breakBlock(c, o, t) {
      // Wood, not glass: a bandpass around 700Hz with a very short tail.
      hiss(c, o, t, { dur: 0.16, vol: 0.20, cut: 760, cutTo: 380, band: true, q: 1.4, room: 0.6 });
      voice(c, o, t, { type: 'triangle', freq: 150, to: 80, glide: 0.09, dur: 0.14,
                       vol: 0.10, cut: 900, cutTo: 300, attack: 0.005, hold: 0.008, room: 0.3 });
    },

    // --- Pick-ups and states ---------------------------------------------
    pickup(c, o, t) {
      // A warm two-note bell. Sine plus its own octave at a fifth of the level
      // is a bell; a square is a beep.
      [[0, 659.25, 0.13], [0.085, 987.77, 0.14]].forEach(([d, f, v]) => {
        voice(c, o, t + d, { type: 'sine', freq: f, dur: 0.34, vol: v,
                             cut: 3000, cutTo: 1100, attack: 0.008, hold: 0.02, room: 1.3 });
        voice(c, o, t + d, { type: 'sine', freq: f * 2, dur: 0.16, vol: v * 0.22,
                             cut: 4000, cutTo: 1600, attack: 0.008, hold: 0.01, room: 0.8 });
      });
    },
    death(c, o, t) {
      voice(c, o, t, { type: 'triangle', freq: 330, to: 70, glide: 0.5, dur: 0.62,
                       vol: 0.24, cut: 1600, cutTo: 220, attack: 0.012, hold: 0.04, room: 1.1 });
      hiss(c, o, t, { dur: 0.45, vol: 0.14, cut: 700, cutTo: 140, q: 0.6, room: 0.9 });
    },
    step(c, o, t) {
      voice(c, o, t, { type: 'sine', freq: 120, dur: 0.05, vol: 0.035,
                       cut: 500, attack: 0.006, hold: 0.004, room: 0.2 });
    },
    roundWin(c, o, t) {
      // A warm major arpeggio on sine bells, booked rather than timed.
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
        voice(c, o, t + i * 0.115, { type: 'sine', freq: f, dur: 0.5, vol: 0.15,
                                     cut: 2600, cutTo: 1000, attack: 0.010, hold: 0.04, room: 1.5 });
        voice(c, o, t + i * 0.115, { type: 'triangle', freq: f * 0.5, dur: 0.3, vol: 0.05,
                                     cut: 1400, cutTo: 600, attack: 0.010, hold: 0.02, room: 0.5 });
      });
    },
    matchWin(c, o, t) {
      [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5, 1318.5].forEach((f, i) => {
        voice(c, o, t + i * 0.135, { type: 'sine', freq: f, dur: 0.55, vol: 0.16,
                                     cut: 2800, cutTo: 1100, attack: 0.010, hold: 0.04, room: 1.6 });
        voice(c, o, t + i * 0.135, { type: 'triangle', freq: f * 0.5, dur: 0.34, vol: 0.055,
                                     cut: 1500, cutTo: 600, attack: 0.010, hold: 0.02, room: 0.6 });
      });
      thump(c, o, t, { from: 130, to: 44, dur: 0.6, vol: 0.22, room: 0.6 });
    },
    pause(c, o, t) {
      voice(c, o, t, { type: 'sine', freq: 330, to: 220, glide: 0.12, dur: 0.26,
                       vol: 0.16, cut: 1200, cutTo: 500, attack: 0.014, hold: 0.03, room: 1.0 });
    },

    // --- Abilities ---------------------------------------------------------
    kick(c, o, t) {
      voice(c, o, t, { type: 'sine', freq: 200, to: 420, glide: 0.09, dur: 0.16,
                       vol: 0.16, cut: 1200, cutTo: 600, attack: 0.006, hold: 0.01, room: 0.4 });
      hiss(c, o, t, { dur: 0.1, vol: 0.08, cut: 1600, band: true, q: 1.0, room: 0.4 });
    },
    punch(c, o, t) {
      thump(c, o, t, { from: 200, to: 55, glide: 0.1, dur: 0.28, vol: 0.3, room: 0.5 });
      hiss(c, o, t, { dur: 0.14, vol: 0.16, cut: 1100, cutTo: 320, q: 0.8, room: 0.5 });
    },
    throwBomb(c, o, t) {
      voice(c, o, t, { type: 'sine', freq: 260, to: 720, glide: 0.18, dur: 0.22,
                       vol: 0.13, cut: 1800, cutTo: 900, attack: 0.012, hold: 0.02, room: 0.8 });
      hiss(c, o, t, { dur: 0.2, vol: 0.06, cut: 900, cutTo: 2200, band: true, q: 0.9, room: 0.6 });
    },
    // The jetpack: a short rising whoosh, so the hop is heard by everyone at the
    // table and not just seen by the one who pressed it.
    hop(c, o, t) {
      hiss(c, o, t, { dur: 0.36, vol: 0.16, cut: 500, cutTo: 2200, band: true, q: 0.8, room: 0.9 });
      voice(c, o, t, { type: 'sine', freq: 220, to: 560, glide: 0.3, dur: 0.34,
                       vol: 0.10, cut: 1600, cutTo: 900, attack: 0.02, hold: 0.03, room: 0.8 });
    },
    // The wind-up. A low rising note under the round, so the bomb in the witch's
    // hand is heard as well as seen — on a phone the props are small.
    hazardWind(c, o, t) {
      voice(c, o, t, { type: 'triangle', freq: 80, to: 210, glide: 1.2, dur: 1.35,
                       vol: 0.09, cut: 500, cutTo: 900, attack: 0.06, hold: 0.4, room: 0.8 });
      voice(c, o, t + 0.7, { type: 'sine', freq: 150, to: 360, glide: 0.6, dur: 0.7,
                             vol: 0.06, cut: 1200, cutTo: 1500, attack: 0.05, hold: 0.15, room: 1.0 });
    },
    curse(c, o, t) {
      // Two detuned voices a semitone apart, sliding down. The beating between
      // them is what makes it uneasy — it does not need to be shrill to do that.
      voice(c, o, t, { type: 'triangle', freq: 196, to: 88, glide: 0.4, dur: 0.5,
                       vol: 0.15, cut: 900, cutTo: 260, attack: 0.02, hold: 0.06,
                       detune: 22, room: 1.2 });
      voice(c, o, t + 0.09, { type: 'sine', freq: 147, to: 70, glide: 0.4, dur: 0.5,
                              vol: 0.11, cut: 700, cutTo: 200, attack: 0.02, hold: 0.05, room: 1.0 });
    },
    shieldBreak(c, o, t) {
      // Glassy rather than shrill: a bandpass keeps the ring and throws away the
      // fizz either side of it.
      hiss(c, o, t, { dur: 0.3, vol: 0.16, cut: 2600, cutTo: 900, band: true, q: 1.6, room: 1.3 });
      voice(c, o, t, { type: 'sine', freq: 880, to: 440, glide: 0.2, dur: 0.34,
                       vol: 0.13, cut: 3000, cutTo: 1200, attack: 0.008, hold: 0.02, room: 1.4 });
    },
  };

  const SFX_NAMES = Object.keys(SFX);

  // Play a named sound into the live graph, now.
  function play(name, arg) {
    const c = ensure();
    if (!c || muted || !SFX[name]) return;
    SFX[name](c, { sfx: sfxBus, send: verb }, c.currentTime, arg);
  }

  // Render a named sound into an offline context for measurement or audition.
  // Deliberately exercises the SAME chain — limiter, shelf and room included —
  // because a measurement of the dry oscillator would be a measurement of a
  // sound nobody hears.
  function renderInto(oac, name, arg) {
    const chain = buildChain(oac);
    if (!SFX[name]) return null;
    SFX[name](oac, { sfx: chain.sfx, send: chain.send }, 0, arg);
    return chain;
  }

  /* ------------------------------------------------------------- MUSIC --- */
  /* "PULSE" — the menu track. A horror-film synth: a sixteenth-note minor
     arpeggio on a filtered saw, a heartbeat kick under it, and a pad that swells
     and backs off every eight bars.

     Synthesised like everything else here, so it costs no download and no file.
     It runs on the MENU, the locker and the results screen. The ROUND has its
     own thing now — see the bass below — because a melody under the explosions
     was one thing too many and a heartbeat is not.

     Scheduled by LOOKAHEAD, not by the timer that wakes it: notes are booked on
     the audio clock, so a timer that fires late plays nothing late. */
  const MUSIC = {
    BEAT: 0.15,            // a sixteenth at 100bpm
    LOOKAHEAD: 0.25,       // how far ahead notes are booked
    TICK: 60,              // how often the scheduler wakes, ms
    LEVEL: 0.44,           // the loop against the sound effects
    FADE: 0.7,             // seconds, in or out
  };
  const ARP  = ['A3', 'C4', 'E4', 'A4', 'C5', 'A4', 'E4', 'C4'];
  const ARP2 = ['G3', 'B3', 'D4', 'G4', 'B4', 'G4', 'D4', 'B3'];
  const SEMI = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function noteHz(name) {
    const oct = +name.slice(-1);
    return 440 * Math.pow(2, (SEMI[name[0]] + (oct - 4) * 12 - 9) / 12);
  }

  /* ---------------------------------------------------- MUSIC VOLUME ----- */
  // FOUR STEPS, NOT A SLIDER. The pause panel is one line of text and three
  // buttons and is read once, in a hurry; a drag target thin enough to fit it
  // is a drag target nobody hits on a phone. Four values move with the same
  // left/right the rest of the game uses and need no new input handling.
  //
  // It governs the MUSIC BUS ONLY. Effects are untouched — turning the music
  // down should not make the bomb you are running from quieter.
  const MUSIC_STEPS = [
    { key: 'off',  label: 'Off',  gain: 0 },
    { key: 'low',  label: 'Low',  gain: 0.35 },
    { key: 'mid',  label: 'Mid',  gain: 0.7 },
    { key: 'full', label: 'Full', gain: 1 },
  ];
  const AUDIO_KEY = 'blastarena.audio';
  let musicStepIdx = 2;                       // Mid by default

  // Storage is best-effort, exactly like the locker: Safari in Private Browsing
  // throws on every access, and an uncaught throw at boot takes the game down.
  (function loadAudioPref() {
    try {
      const raw = window.localStorage.getItem(AUDIO_KEY);
      if (!raw) return;
      const data = JSON.parse(raw);
      const i = MUSIC_STEPS.findIndex(s => s.key === (data && data.music));
      if (i !== -1) musicStepIdx = i;
    } catch (e) { /* play on regardless */ }
  })();

  function saveAudioPref() {
    try {
      window.localStorage.setItem(AUDIO_KEY,
        JSON.stringify({ music: MUSIC_STEPS[musicStepIdx].key }));
    } catch (e) { /* nothing is kept; the game is unaffected */ }
  }

  function applyMusicLevel() {
    if (!musicOut) return;
    musicOut.gain.value = MUSIC_STEPS[musicStepIdx].gain;
  }

  function setMusicStep(i) {
    musicStepIdx = ((i % MUSIC_STEPS.length) + MUSIC_STEPS.length) % MUSIC_STEPS.length;
    applyMusicLevel();
    saveAudioPref();
    return MUSIC_STEPS[musicStepIdx];
  }

  let musicBus = null, musicPad = null, musicPadOsc = null;
  let musicTimer = null, musicStep = 0, musicNext = 0, musicWant = false;

  function musicVoice(t, f, dur, vol, cut) {
    const o = ctx.createOscillator(), g = ctx.createGain(), fl = ctx.createBiquadFilter();
    o.type = 'sawtooth'; o.frequency.value = f;
    fl.type = 'lowpass'; fl.Q.value = 9;
    fl.frequency.setValueAtTime(cut, t);
    fl.frequency.exponentialRampToValueAtTime(Math.max(220, cut * 0.35), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(fl); fl.connect(g); g.connect(musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function musicKick(t, vol) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(140, t);
    o.frequency.exponentialRampToValueAtTime(38, t + 0.13);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
    o.connect(g); g.connect(musicBus);
    o.start(t); o.stop(t + 0.4);
  }

  function musicBuild() {
    if (musicBus) return;
    musicBus = ctx.createGain();
    musicBus.gain.value = 0.0001;
    musicTarget = 0;
    musicBus.connect(musicOut);
    // The pad: four detuned saws behind a lowpass, swelling on a long cycle
    musicPad = ctx.createGain();
    musicPad.gain.value = 0.0001;
    const pf = ctx.createBiquadFilter();
    pf.type = 'lowpass'; pf.frequency.value = 900; pf.Q.value = 3;
    pf.connect(musicPad); musicPad.connect(musicBus);
    musicPadOsc = [];
    [110, 130.81, 164.81, 220].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sawtooth'; o.frequency.value = f;
      o.detune.value = (i - 1.5) * 6;      // fixed, not random: same every session
      g.gain.value = 0.2;
      o.connect(g); g.connect(pf);
      o.start();
      musicPadOsc.push(o);
    });
  }

  function musicSchedule() {
    const now = ctx.currentTime;
    // A background tab throttles the timer to once a minute or worse. Without
    // this the catch-up loop books four hundred notes in the past and they all
    // fire at once the moment the tab comes back.
    if (musicNext < now - 0.5) musicNext = now + 0.05;
    while (musicNext < now + MUSIC.LOOKAHEAD) {
      const i = musicStep, t = musicNext;
      const bar = (i / 16) | 0;
      const set = (bar % 4 === 3) ? ARP2 : ARP;
      const cut = 700 + 900 * (0.5 + 0.5 * Math.sin(i * 0.045));
      musicVoice(t, noteHz(set[i % 8]), 0.3, 0.075, cut);
      if (i % 4 === 0) musicKick(t, 0.45);
      if (i % 128 === 0) {
        musicPad.gain.cancelScheduledValues(t);
        musicPad.gain.setValueAtTime(0.0001, t);
        musicPad.gain.exponentialRampToValueAtTime(0.08, t + 5.5);
        musicPad.gain.exponentialRampToValueAtTime(0.0001, t + 17);
      }
      musicNext += MUSIC.BEAT;
      musicStep++;
    }
  }

  // Ramp rather than switch. exponentialRamp cannot reach zero, hence the floor.
  //
  // AND ASKING FOR THE LEVEL IT IS ALREADY HEADING TO DOES NOTHING. Every call
  // cancels the running ramp and starts a new one FROM WHEREVER IT HAS GOT TO,
  // so a ramp restarted a few times a second never leaves the floor: measured,
  // the track sat at 0.004 of a 0.44 target and was inaudible while every flag
  // in the module said it was playing. The same lesson musicPlay already
  // carries, one layer further down.
  let musicTarget = 0;
  function musicRamp(to) {
    if (!musicBus) return;
    if (musicTarget === to) return;
    musicTarget = to;
    const t = ctx.currentTime;
    musicBus.gain.cancelScheduledValues(t);
    musicBus.gain.setValueAtTime(Math.max(musicBus.gain.value, 0.0001), t);
    musicBus.gain.exponentialRampToValueAtTime(Math.max(to, 0.0001), t + MUSIC.FADE);
  }

  function musicPlay(on) {
    on = !!on;
    // Nothing starts before the first gesture: a browser suspends the context
    // until then, and a track scheduled into a suspended context arrives as a
    // wall of notes the moment it resumes. What it wants is remembered, and
    // unlock() honours it.
    const canRun = !!ctx && ctx.state === 'running' && !muted;
    // ASKING FOR WHAT IS ALREADY HAPPENING DOES NOTHING. This is called every
    // frame from the render loop; without the early-out the fade ramp would be
    // cancelled and restarted sixty times a second and never actually arrive.
    if (on === musicWant && (!on || musicTimer || !canRun)) return;
    musicWant = on;
    if (!canRun) { if (!on) musicRamp(0); return; }
    musicBuild();
    if (on) {
      musicRamp(MUSIC.LEVEL);
      if (!musicTimer) {
        musicNext = ctx.currentTime + 0.1;
        musicTimer = setInterval(musicSchedule, MUSIC.TICK);
      }
    } else {
      musicRamp(0);
      // Let the fade finish before the scheduler stops, or the tail is cut off
      const stopAt = musicTimer;
      if (stopAt) setTimeout(() => {
        if (musicTimer === stopAt && !musicWant) { clearInterval(musicTimer); musicTimer = null; }
      }, (MUSIC.FADE + 0.2) * 1000);
    }
  }

  /* ------------------------------------------------- THE ROUND'S BASS ---- */
  /* A DEEP PULSE PER LEVEL, and deliberately not a track.

     Music was kept out of rounds on the grounds that a loop under the
     explosions is one thing too many, and that was right about a MELODY. A
     melody competes with the sound effects for the same attention and the same
     mid-range. A sub-bass heartbeat does not: it lives two octaves below
     anything else in the mix, it has no tune to follow, and what it actually
     does is give each arena a different weight underfoot.

     One root note, one pattern and one filter colour per level, so Circuit
     feels mechanical and the Haunted House feels slow and wrong. Everything
     rides the same music bus, so the pause panel's Off setting silences it. */
  const BASS = {
    forest:  { root: 49.00, pattern: [1, 0, 0, 0, 0.6, 0, 0, 0], beat: 0.42, cut: 260, type: 'sine',     wob: 0.0 },
    beach:   { root: 55.00, pattern: [1, 0, 0, 0.5, 0, 0, 0.4, 0], beat: 0.40, cut: 300, type: 'sine',     wob: 0.0 },
    glacier: { root: 43.65, pattern: [1, 0, 0, 0, 0, 0, 0.5, 0], beat: 0.46, cut: 220, type: 'sine',     wob: 0.15 },
    haunted: { root: 36.71, pattern: [1, 0, 0, 0, 0, 0.45, 0, 0], beat: 0.55, cut: 180, type: 'triangle', wob: 0.35 },
    factory: { root: 41.20, pattern: [1, 0, 0.7, 0, 1, 0, 0.7, 0], beat: 0.32, cut: 340, type: 'triangle', wob: 0.0 },
    circuit: { root: 46.25, pattern: [1, 0, 0.6, 0, 0.8, 0, 0.6, 0.4], beat: 0.30, cut: 380, type: 'triangle', wob: 0.0 },
    donut:   { root: 58.27, pattern: [1, 0, 0, 0.5, 0, 0.5, 0, 0], beat: 0.38, cut: 320, type: 'sine',     wob: 0.0 },
  };
  const BASS_DEFAULT = BASS.forest;
  const BASS_LEVEL = 0.5;            // against MUSIC.LEVEL, on the same bus

  let bassBus = null, bassTimer = null, bassNext = 0, bassStep = 0;
  let bassWant = false, bassCfg = BASS_DEFAULT;

  function bassBuild() {
    if (bassBus) return;
    bassBus = ctx.createGain();
    bassBus.gain.value = 0.0001;
    bassTarget = 0;
    bassBus.connect(musicOut);
  }

  function bassHit(t, vol) {
    const cfg = bassCfg;
    const o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
    o.type = cfg.type;
    o.frequency.setValueAtTime(cfg.root * 1.6, t);
    o.frequency.exponentialRampToValueAtTime(cfg.root, t + 0.09);
    f.type = 'lowpass';
    f.Q.value = 0.8;
    f.frequency.setValueAtTime(cfg.cut, t);
    f.frequency.exponentialRampToValueAtTime(Math.max(cfg.cut * 0.45, 60), t + 0.5);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.62);
    o.connect(f); f.connect(g); g.connect(bassBus);
    o.start(t); o.stop(t + 0.75);

    // A slow detuned partner on the levels that want to feel unwell. The beat
    // between the two is the effect; nothing about it is loud.
    if (cfg.wob) {
      const o2 = ctx.createOscillator(), g2 = ctx.createGain();
      o2.type = 'sine';
      o2.frequency.setValueAtTime(cfg.root * (1 + cfg.wob * 0.02), t);
      g2.gain.setValueAtTime(0.0001, t);
      g2.gain.exponentialRampToValueAtTime(vol * 0.5, t + 0.05);
      g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
      o2.connect(g2); g2.connect(bassBus);
      o2.start(t); o2.stop(t + 1.0);
    }
  }

  function bassSchedule() {
    const now = ctx.currentTime;
    if (bassNext < now - 0.5) bassNext = now + 0.05;
    while (bassNext < now + MUSIC.LOOKAHEAD) {
      const v = bassCfg.pattern[bassStep % bassCfg.pattern.length];
      if (v > 0) bassHit(bassNext, 0.55 * v);
      bassNext += bassCfg.beat;
      bassStep++;
    }
  }

  let bassTarget = 0;
  function bassRamp(to) {
    if (!bassBus) return;
    if (bassTarget === to) return;
    bassTarget = to;
    const t = ctx.currentTime;
    bassBus.gain.cancelScheduledValues(t);
    bassBus.gain.setValueAtTime(Math.max(bassBus.gain.value, 0.0001), t);
    bassBus.gain.exponentialRampToValueAtTime(Math.max(to, 0.0001), t + MUSIC.FADE);
  }

  function bassForLevel(id) {
    const next = BASS[id] || BASS_DEFAULT;
    if (next === bassCfg) return;
    bassCfg = next;
    bassStep = 0;              // a new arena starts its pattern from the top
  }

  function bassPlay(on) {
    on = !!on;
    const canRun = !!ctx && ctx.state === 'running' && !muted;
    if (on === bassWant && (!on || bassTimer || !canRun)) return;
    bassWant = on;
    if (!canRun) { if (!on) bassRamp(0); return; }
    bassBuild();
    if (on) {
      bassRamp(BASS_LEVEL);
      if (!bassTimer) {
        bassNext = ctx.currentTime + 0.1;
        bassTimer = setInterval(bassSchedule, MUSIC.TICK);
      }
    } else {
      bassRamp(0);
      const stopAt = bassTimer;
      if (stopAt) setTimeout(() => {
        if (bassTimer === stopAt && !bassWant) { clearInterval(bassTimer); bassTimer = null; }
      }, (MUSIC.FADE + 0.2) * 1000);
    }
  }

  // The music is wanted on every screen that is NOT a round being played, and
  // the bass is wanted on exactly the ones that are. Driven from one place off
  // the game's own state rather than hung on each transition, because there are
  // seven ways out of a round and six of them would be missed.
  const MUSIC_STATES = ['menu', 'select', 'matchEnd'];
  const BASS_STATES = ['intro', 'play'];
  function musicForState(state) {
    musicPlay(MUSIC_STATES.indexOf(state) !== -1);
    bassPlay(BASS_STATES.indexOf(state) !== -1);
  }

  function stopAllMusic() {
    musicRamp(0);
    bassRamp(0);
    if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
    if (bassTimer) { clearInterval(bassTimer); bassTimer = null; }
  }

  /* ------------------------------------------- WHEN THE PAGE GOES AWAY --- */
  /* THE MUSIC KEPT PLAYING AFTER THE GAME WAS CLOSED, and it is worth being
     precise about why, because two different things cause it.

     A track is not "playing" in one place. There are notes already BOOKED on
     the audio clock — up to a quarter of a second of them, by design, so a late
     timer cannot make a late note — and there is a scheduler booking more. Hide
     the tab and the browser throttles the scheduler but does NOT stop the audio
     clock, so everything already booked plays out to an empty room. Close the
     tab and, on some platforms, the context outlives the document long enough
     to finish its buffer.

     So both are handled, and the order matters: stop booking, then take the
     clock away.

       visibilitychange -> suspend. The clock stops, so nothing booked can
         sound, and it resumes exactly where it was when the player comes back.
       pagehide / beforeunload -> close. Unrecoverable and immediate, which is
         the correct trade when the document is going away.

     `pagehide` rather than `unload` alone: Safari and mobile Chrome put a page
     into the back/forward cache instead of unloading it, and `unload` never
     fires there — which is precisely the phone case where a game left playing
     in a backgrounded tab is most annoying. */
  let goneAway = false;
  function suspendForHide() {
    if (!ctx || goneAway) return;
    // Stop the schedulers first: a timer that wakes while suspended would book
    // notes against a clock that is not moving, and they would all arrive at
    // once on resume — the same wall-of-notes the lookahead exists to avoid.
    if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
    if (bassTimer) { clearInterval(bassTimer); bassTimer = null; }
    if (ctx.state === 'running' && ctx.suspend) ctx.suspend();
  }
  function resumeFromHide() {
    if (!ctx || goneAway) return;
    if (ctx.state === 'suspended' && ctx.resume) {
      const r = ctx.resume();
      const restart = () => {
        // Force the full start path for whatever wanted to be playing: both
        // musicPlay and bassPlay early-out on "already wanted" and would
        // otherwise leave a live flag with no scheduler behind it.
        if (musicWant) { musicWant = false; musicPlay(true); }
        if (bassWant) { bassWant = false; bassPlay(true); }
      };
      if (r && r.then) r.then(restart); else restart();
    }
  }
  function closeForGood() {
    if (goneAway) return;
    goneAway = true;
    if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
    if (bassTimer) { clearInterval(bassTimer); bassTimer = null; }
    if (ctx && ctx.state !== 'closed' && ctx.close) { try { ctx.close(); } catch (e) { /* going away anyway */ } }
  }
  if (typeof document !== 'undefined') {
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) suspendForHide(); else resumeFromHide();
    });
    window.addEventListener('pagehide', closeForGood);
    window.addEventListener('beforeunload', closeForGood);
  }

  return {
    unlock,
    setMuted(v) {
      muted = v;
      if (master) master.gain.value = v ? 0 : MASTER_LEVEL;
      if (v) {
        // Silence the buses AND stop the schedulers: the master gain alone would
        // make it inaudible while it went on booking notes forever.
        stopAllMusic();
      } else {
        // Unmuting has to force the full start path. musicPlay(true) on its own
        // would see "already wanted" and return without ramping anything back up.
        if (musicWant) { musicWant = false; musicPlay(true); }
        if (bassWant) { bassWant = false; bassPlay(true); }
      }
    },
    isMuted() { return muted; },
    musicForState,
    musicPlay,
    bassPlay,
    bassForLevel,
    // Genuinely making a sound, not merely asked for — a muted track with a live
    // timer is not "running" in any sense a listener would recognise.
    get musicRunning() {
      return !!musicTimer && musicWant && !muted && !!ctx && ctx.state === 'running';
    },
    get musicLevel() { return musicBus ? +musicBus.gain.value.toFixed(3) : 0; },
    get bassRunning() {
      return !!bassTimer && bassWant && !muted && !!ctx && ctx.state === 'running';
    },
    get bassLevel() { return bassBus ? +bassBus.gain.value.toFixed(3) : 0; },
    get bassLevelId() {
      for (const k in BASS) if (BASS[k] === bassCfg) return k;
      return null;
    },
    MUSIC_STATES,
    BASS_STATES,
    BASS,
    // Exposed so the suite can drive the hide/close paths without needing the
    // browser to actually navigate away.
    _suspendForHide: suspendForHide,
    _resumeFromHide: resumeFromHide,
    _closeForGood: closeForGood,
    get _contextState() { return ctx ? ctx.state : 'none'; },
    get _nowForTest() { return ctx ? +ctx.currentTime.toFixed(3) : -1; },
    // WHAT THE BUS HAS BEEN TOLD TO GO TO, as opposed to where it has got to.
    //
    // These exist because a headless browser has no sound card and its audio
    // clock barely advances — measured, 16.5 seconds of audio time after
    // minutes of wall clock. A test that waits for an AudioParam to finish a
    // 0.7s ramp is therefore testing the sandbox rather than the game, which is
    // why the music assertions have flaked all session. The target is the
    // decision the game made; the value is the sound card's business.
    get musicTargetLevel() { return musicTarget; },
    // How long the change takes. A CUT is zero; anything above it is a fade,
    // and that distinction is the one thing about the transition a headless
    // browser cannot show you in the bus value.
    get musicFadeSeconds() { return MUSIC.FADE; },
    get bassTargetLevel() { return bassTarget; },
    get _schedulersRunning() { return !!musicTimer || !!bassTimer; },

    // ---- The music setting ----
    MUSIC_STEPS,
    get musicStepIndex() { return musicStepIdx; },
    get musicStepKey() { return MUSIC_STEPS[musicStepIdx].key; },
    get musicStepLabel() { return MUSIC_STEPS[musicStepIdx].label; },
    // The volume the music bus is actually set to, so a test can assert the
    // setting reached the graph rather than only the variable.
    get musicBusGain() { return musicOut ? +musicOut.gain.value.toFixed(3) : null; },
    setMusicStep,
    cycleMusic(delta) { return setMusicStep(musicStepIdx + (delta || 1)); },

    // ---- For the measurement rig and the audition page ----
    SFX_NAMES,
    _renderInto: renderInto,
    _play: play,

    // ---- Game events ----
    placeBomb()  { play('placeBomb'); },
    explode()    { play('explode'); },
    explodeBig() { play('explodeBig'); },
    breakBlock() { play('breakBlock'); },
    pickup()     { play('pickup'); },
    death()      { play('death'); },
    step()       { play('step'); },
    menuMove()   { play('menuMove'); },
    menuSelect() { play('menuSelect'); },
    countdown(hi){ play('countdown', hi); },
    roundWin()   { play('roundWin'); },
    matchWin()   { play('matchWin'); },
    pause()      { play('pause'); },
    kick()       { play('kick'); },
    punch()      { play('punch'); },
    throwBomb()  { play('throwBomb'); },
    hop()        { play('hop'); },
    hazardWind() { play('hazardWind'); },
    curse()      { play('curse'); },
    shieldBreak(){ play('shieldBreak'); },
  };
})();


/* ==== 15-locker.js ================================================ */
/* ============================================================================
   SECTION 15 — THE LOCKER
   Who owns which cosmetics, what they have equipped, and the prize draw that
   happens every time somebody wins a round.

   TWO KINDS OF COLLECTION, on purpose:

     Seat 1 is YOURS. It is saved to localStorage and is still there tomorrow.
     Seats 2-4 are per session. They start with nothing — no hats at all — and
     build up a collection as they win rounds in front of you, then forget it
     when the page reloads.

   That second rule is the point of the whole feature: the bots visibly earn
   things while you watch, so a hat means something when you win one.

   STORAGE IS BEST-EFFORT. Safari in Private Browsing throws on every
   localStorage access, and an uncaught throw at boot takes the entire game
   down. Every access here is wrapped. No save degrades to "nothing is kept",
   never to a blank screen.
   ========================================================================== */

const Locker = (function () {
  const KEY = 'blastarena.locker';
  const VERSION = 1;

  // One collection per seat. Index 0 is the persisted one.
  const seats = [];

  function blank() {
    const owned = {};
    COSMETIC_SLOTS.forEach(slot => {
      // The free default of each slot is owned from the start, so a collection
      // is never empty and nothing can equip an item it does not own.
      owned[slot] = [COSMETICS[slot].def];
    });
    const equipped = {};
    COSMETIC_SLOTS.forEach(slot => { equipped[slot] = COSMETICS[slot].def; });
    return { owned, equipped, wins: 0 };
  }

  /* ------------------------------------------------------------ storage -- */
  // Reads and writes never throw. A corrupt or unreadable save starts fresh.
  function readSave() {
    let raw = null;
    try { raw = window.localStorage.getItem(KEY); } catch (e) { return null; }
    if (!raw) return null;
    try {
      const data = JSON.parse(raw);
      if (!data || data.v !== VERSION) return null;      // migrate here one day
      const fresh = blank();
      COSMETIC_SLOTS.forEach(slot => {
        const list = (data.owned && data.owned[slot]) || [];
        list.forEach(id => {
          // Ignore ids that no longer exist, so removing a cosmetic cannot
          // leave a save pointing at nothing.
          if (COSMETICS[slot].items.some(i => i.id === id) && fresh.owned[slot].indexOf(id) === -1)
            fresh.owned[slot].push(id);
        });
        const want = data.equipped && data.equipped[slot];
        if (want && fresh.owned[slot].indexOf(want) !== -1) fresh.equipped[slot] = want;
      });
      fresh.wins = Math.max(0, Math.floor(data.wins) || 0);
      return fresh;
    } catch (e) { return null; }
  }

  let saveBroken = false;
  function writeSave() {
    try {
      window.localStorage.setItem(KEY, JSON.stringify({
        v: VERSION,
        owned: seats[0].owned,
        equipped: seats[0].equipped,
        wins: seats[0].wins,
      }));
      saveBroken = false;
    } catch (e) {
      // Private browsing, quota, a disabled store — play on regardless
      saveBroken = true;
    }
  }

  function init() {
    seats.length = 0;
    seats.push(readSave() || blank());
    for (let i = 1; i < 4; i++) seats.push(blank());
  }

  /* -------------------------------------------------------------- query -- */
  const seatOf = i => seats[i] || seats[0];
  function owns(i, slot, id) { return seatOf(i).owned[slot].indexOf(id) !== -1; }
  function loadout(i) { return Object.assign({}, seatOf(i).equipped); }
  function ownedCount(i) {
    // The free default does not count — "3 of 9" should mean three things won
    return prizePool().filter(e => owns(i, e.slot, e.id)).length;
  }

  /* --------------------------------------------------------------- edit -- */
  function equip(i, slot, id) {
    if (!COSMETICS[slot] || !owns(i, slot, id)) return false;
    seatOf(i).equipped[slot] = id;
    if (i === 0) writeSave();
    return true;
  }

  function grant(i, slot, id) {
    if (!COSMETICS[slot] || owns(i, slot, id)) return false;
    seatOf(i).owned[slot].push(id);
    if (i === 0) writeSave();
    return true;
  }

  /* -------------------------------------------------- the list, by key -- */
  // The select screen deals in ONE flat list, so it asks by key and never has
  // to know which slot anything belongs to. Everything below is a thin
  // translation onto the per-slot storage above.

  function ownsKey(i, key) {
    const e = lockerItem(key);
    if (!e) return false;
    return e.free ? true : owns(i, e.slot, e.id);
  }

  // Is this line the one describing what you are wearing right now? "Classic"
  // is worn precisely when nothing else is — otherwise picking a crown would
  // leave two lines claiming to be on at once.
  function isWorn(i, key) {
    const e = lockerItem(key);
    if (!e) return false;
    const kit = seatOf(i).equipped;
    if (e.free) return COSMETIC_SLOTS.every(s => kit[s] === COSMETICS[s].def);
    return kit[e.slot] === e.id;
  }

  // ONE PRIZE AT A TIME. You choose freely from everything you have won, but
  // you take exactly one of them into the match — so picking the crown takes the
  // jetpack off, and the list can never show two lines both claiming to be worn.
  //
  // The storage underneath is still per-slot, because a hat and a bomb are
  // different things to a player mesh. Single-select is enforced HERE: clear
  // every slot to its default first, then set the one that was chosen. Picking
  // Classic is the same operation with nothing set afterwards.
  function wearOnly(i, slot, id) {
    const kit = seatOf(i).equipped;
    COSMETIC_SLOTS.forEach(s => { kit[s] = COSMETICS[s].def; });
    if (slot) kit[slot] = id;
    // An item may bring a finish with it — the Gold Crown chromes the wearer.
    // That is ONE prize still: the finish is part of the crown, not a second
    // thing chosen, and nothing else in the list can be worn alongside it.
    const item = slot && id ? cosmeticItem(slot, id) : null;
    if (item && item.withFinish) kit.finish = item.withFinish;
    if (i === 0) writeSave();
  }

  function equipKey(i, key) {
    const e = lockerItem(key);
    if (!e || !ownsKey(i, key)) return false;
    if (e.free) { wearOnly(i, null, null); return true; }
    if (!owns(i, e.slot, e.id)) return false;
    wearOnly(i, e.slot, e.id);
    return true;
  }

  /* ---------------------------------------------------------- the prize -- */
  // Somebody won a round. They take the NEXT item on the list they do not
  // already own, and put it on immediately — a prize you cannot see is not a
  // prize.
  //
  // A LADDER, NOT A LUCKY DIP. This used to be a random draw from the pool.
  // It is in list order now, because the select screen shows you the next two
  // coming up, and a preview of something you might not get is a lie. It is
  // also what lets the list run smallest prize to biggest and mean something:
  // nine round wins gets you the viking helm, and you can see it coming.
  //
  // Returns { key, slot, id, name } or null when that seat owns everything.
  function awardWin(i) {
    const s = seatOf(i);
    s.wins++;
    const next = prizePool().find(p => !owns(i, p.slot, p.id));
    if (!next) { if (i === 0) writeSave(); return null; }
    s.owned[next.slot].push(next.id);
    // Straight on, and on its own — one prize at a time, the same rule the
    // select screen enforces. Winning something swaps to it rather than adding
    // to a pile, so what the winner is wearing in the next round is the thing
    // they just won.
    wearOnly(i, next.slot, next.id);
    return next;
  }

  /* ------------------------------------------------- what you may look at -- */
  // Everything won, plus the next two, and nothing beyond that. The point is
  // anticipation: you can see what the next round is worth without the other
  // six spoiling the run to the end of the ladder.
  const PREVIEW_AHEAD = 2;
  function visible(i) {
    let ahead = 0;
    return LOCKER_ITEMS.filter(e => {
      if (ownsKey(i, e.key)) return true;
      return ahead++ < PREVIEW_AHEAD;
    });
  }
  // 0 for the next one up, 1 for the one after, -1 for anything already won
  function aheadIndex(i, key) {
    let ahead = -1;
    for (const e of LOCKER_ITEMS) {
      if (ownsKey(i, e.key)) { if (e.key === key) return -1; continue; }
      ahead++;
      if (e.key === key) return ahead;
    }
    return -1;
  }

  return {
    init, owns, equip, grant, loadout, awardWin, ownedCount,
    ownsKey, isWorn, equipKey, visible, aheadIndex,
    PREVIEW_AHEAD,
    wins: i => seatOf(i).wins,
    owned: (i, slot) => seatOf(i).owned[slot].slice(),
    total: () => PRIZE_COUNT,
    get storageWorks() { return !saveBroken; },
    // Testing hooks: wipe the device's collection, or read the raw seats
    _reset() { try { window.localStorage.removeItem(KEY); } catch (e) {} init(); },
    _seats: () => seats,
  };
})();


/* ==== 20-input.js ================================================= */
/* ============================================================================
   SECTION 20 — INPUT
   Raw keyboard state plus a per-seat directional resolver. Last-pressed
   direction wins, which is what makes grid movement feel responsive.
   ========================================================================== */

const Input = (function () {
  const down = Object.create(null);
  const pressedThisTick = Object.create(null);
  const order = [];               // direction keys in press order, newest last
  const listeners = [];

  const DIR_KEYS = new Set();
  KEYMAPS.forEach(m => { DIR_KEYS.add(m.up); DIR_KEYS.add(m.down); DIR_KEYS.add(m.left); DIR_KEYS.add(m.right); });

  window.addEventListener('keydown', e => {
    Audio3.unlock();
    if (e.repeat) { e.preventDefault(); return; }
    down[e.code] = true;
    pressedThisTick[e.code] = true;
    if (DIR_KEYS.has(e.code)) {
      const i = order.indexOf(e.code);
      if (i !== -1) order.splice(i, 1);
      order.push(e.code);
    }
    listeners.forEach(fn => fn(e.code));
    // Stop the page scrolling when players use arrows/space
    if (e.code.startsWith('Arrow') || e.code === 'Space' || e.code === 'Enter') e.preventDefault();
  });

  window.addEventListener('keyup', e => {
    down[e.code] = false;
    const i = order.indexOf(e.code);
    if (i !== -1) order.splice(i, 1);
  });

  // Losing focus must release everything, or players "stick" running at a wall
  window.addEventListener('blur', () => {
    for (const k in down) down[k] = false;
    order.length = 0;
  });

  // Shared by the real keydown handler and the touch layer, so a thumbstick
  // press goes through exactly the same "newest direction wins" ordering as a
  // key press. Nothing downstream can tell the two apart.
  // `force` is for the touch layer only. The early return exists to stop a held
  // KEY auto-repeating into a stream of one-shot presses; a thumb tap sends
  // exactly one press per tap, so it has nothing to guard against — and without
  // force, a bomb button would go dead while a physical CTRL was held down.
  function press(code, force) {
    if (down[code] && !force) return;
    down[code] = true;
    pressedThisTick[code] = true;
    if (DIR_KEYS.has(code)) {
      const i = order.indexOf(code);
      if (i !== -1) order.splice(i, 1);
      order.push(code);
    }
    listeners.forEach(fn => fn(code));
  }
  function release(code) {
    down[code] = false;
    const i = order.indexOf(code);
    if (i !== -1) order.splice(i, 1);
  }

  return {
    isDown: code => !!down[code],
    press, release,
    // True once, on the frame the key went down. Accepts a single code or a
    // list of alternatives (Player 2's bomb is either CTRL key).
    consumePress(code) {
      const codes = Array.isArray(code) ? code : [code];
      for (const c of codes) {
        if (pressedThisTick[c]) { pressedThisTick[c] = false; return true; }
      }
      return false;
    },
    endTick() { for (const k in pressedThisTick) pressedThisTick[k] = false; },
    // Drop any pending one-shot presses. Called when a round starts so the
    // ENTER that confirmed a menu is never also read as a bomb press.
    clearPresses() { for (const k in pressedThisTick) pressedThisTick[k] = false; },
    onAnyKey(fn) { listeners.push(fn); },

    // Resolve a player's held direction from their key map: newest key wins
    direction(m) {
      if (!m) return { x: 0, y: 0 };
      for (let i = order.length - 1; i >= 0; i--) {
        const k = order[i];
        if (k === m.up)    return { x: 0,  y: -1 };
        if (k === m.down)  return { x: 0,  y: 1  };
        if (k === m.left)  return { x: -1, y: 0  };
        if (k === m.right) return { x: 1,  y: 0  };
      }
      return { x: 0, y: 0 };
    },
  };
})();


/* ==== 25-touch.js ================================================= */
/* ============================================================================
   SECTION 25 — TOUCH CONTROLS
   An on-screen thumbstick and bomb button for phones and tablets.

   These do not introduce a second input path. They synthesise presses on the
   solo keymap (arrows + CTRL) through Input.press/release, so by the time the
   simulation reads a direction it cannot tell a thumb from a keyboard — and
   every existing input behaviour (newest direction wins, one-shot bomb
   presses, release-on-blur) applies unchanged.
   ========================================================================== */

const TouchPad = (function () {
  // Solo layout: this is the keymap a single human is always given, so the
  // stick drives whichever seat that human occupies.
  const KM = KEYMAPS[1];
  const BOMB = KM.action[0];
  const SPECIAL = KM.special[0];

  // A PAD, NOT A STICK. Direction is read from WHERE the thumb is relative to the
  // middle of the pad, so the first pointerdown already carries one and no drag
  // is required — see the note on #tstick in the stylesheet for why that matters.
  //
  // DEADZONE is now a distance from the CENTRE, not a distance travelled: press
  // the middle and you stop, which is the one thing a pad needs a null zone for.
  // As a fraction of the pad's radius, so it scales with --ctl.
  const DEADZONE = 0.22;       // of the pad radius
  // Press outside the pad and the direction still comes from the angle back to
  // its centre, out to this multiple of the radius. The whole lower-left corner
  // is live: there is nothing to aim at, which is most of what "responsive" means
  // with a thumb.
  const REACH = 3.2;

  // Remembered across sessions. The controls are ON by default — they are the
  // only way to play on a phone, and hunting through a pause menu to find them
  // is a poor first thirty seconds — so the saved value only ever records a
  // deliberate decision to turn them OFF.
  const PREF_KEY = 'blastarena.controls';
  function readPref() {
    let v = null;
    try { v = window.localStorage.getItem(PREF_KEY); } catch (e) { return 'on'; }
    return v === 'off' ? 'off' : 'on';        // legacy 'auto' lands on 'on'
  }
  function writePref(v) {
    // Best-effort, exactly like the locker: Safari in Private Browsing throws
    // on every access, and a preference is never worth taking the game down for.
    try { window.localStorage.setItem(PREF_KEY, v); } catch (e) { /* play on */ }
  }

  const state = {
    available: false,          // this device has a coarse pointer
    pref: 'on',                // 'on' | 'off' — binary, and it starts ON
    active: false,             // controls are currently on screen
    stickId: null,             // pointerId owning the stick
    bombId: null,              // pointerId owning the bomb zone
    specialId: null,           // pointerId owning the special zone
    heldCode: null,            // direction currently synthesised
    origin: { x: 0, y: 0 },
    cancels: 0,                // gestures taken away from us by the OS/browser
    last: null,                // last movement seen, for the on-screen readout
  };

  let pad, zone, bombZone, specialZone, stick, knob, bombBtn, specialBtn, arrows;
  let home = null;             // the pad's resting centre, in page coordinates

  // A touch-FIRST device: a coarse primary pointer and no fine pointer anywhere.
  //
  // `maxTouchPoints > 0` is not that test and must not be used as one. Plenty of
  // laptops, Surfaces and desktop monitors have touchscreens; they reported
  // touch points, so the game treated them as phones — on-screen controls, the
  // cramped phone layout, and a "rotate your device" wall on a desktop, which
  // is both meaningless and unplayable. `any-pointer: fine` is the honest
  // question: is there a mouse or trackpad on this machine?
  function detect() {
    if (typeof window === 'undefined' || !window.matchMedia) return false;
    const coarse = window.matchMedia('(pointer: coarse)').matches;
    const anyFine = window.matchMedia('(any-pointer: fine)').matches;
    return coarse && !anyFine;
  }

  // 4-way, not 8: the arena is a grid and diagonal input would fight the
  // auto-centring that makes movement feel tight. The dominant axis wins —
  // except that the axes are not equally easy to ask for.
  //
  // A thumb pivots from the base of the hand, so reaching UP from the bottom-left
  // corner traces an arc that carries it sideways as it rises, and DOWN carries
  // it back the other way. Left and right are a straight push; up and down are
  // always contaminated. V_BIAS makes the horizontal component clear a bar to win,
  // so a press that is mostly-but-not-purely vertical reads as vertical.
  const V_BIAS = 1.3;
  function codeFor(dx, dy, radius) {
    const dead = (radius || 40) * DEADZONE;
    if (Math.hypot(dx, dy) < dead) return null;
    return Math.abs(dx) > Math.abs(dy) * V_BIAS
      ? (dx > 0 ? KM.right : KM.left)
      : (dy > 0 ? KM.down : KM.up);
  }

  function setHeld(code) {
    if (state.heldCode === code) return;
    if (state.heldCode) Input.release(state.heldCode);
    state.heldCode = code;
    if (code) Input.press(code);
    lightArrow(code);
  }

  // The pressed arrow lights up. Not decoration: it is the only way to tell a
  // control that is not responding apart from a game that is not moving you,
  // which is the exact confusion the old stick left you in.
  const ARROW_OF = {};
  function lightArrow(code) {
    if (!arrows) return;
    ARROW_OF[KM.up] = 'up'; ARROW_OF[KM.down] = 'down';
    ARROW_OF[KM.left] = 'left'; ARROW_OF[KM.right] = 'right';
    const want = code ? ARROW_OF[code] : null;
    arrows.forEach(a => a.classList.toggle('lit', !!want && a.classList.contains(want)));
  }

  function releaseAll() {
    setHeld(null);
    state.stickId = null;
    state.bombId = null;
    state.specialId = null;
    if (bombBtn) bombBtn.classList.remove('on');
    if (specialBtn) specialBtn.classList.remove('on');
    Input.release(BOMB);
    Input.release(SPECIAL);
    if (stick) stick.classList.remove('on');
  }

  // SHOW IT ONLY WHEN IT DOES SOMETHING. A button that is on screen but inert
  // for nine rounds out of ten is a button nobody learns; one that appears the
  // moment you put the jetpack on teaches itself.
  //
  // `power` is the string the worn prize declares, or null. The glyph is chosen
  // by CSS off data-power, so a new power is a catalogue entry and a rule, not
  // another branch in here.
  function showSpecial(power, spent) {
    if (!specialBtn || !specialZone) return;
    const on = !!power;
    specialBtn.classList.toggle('off', !on);
    specialZone.classList.toggle('off', !on);
    // The bomb zone gives up the inboard part of its territory only while there
    // is a second button standing in it.
    if (bombZone) bombZone.classList.toggle('narrow', on);
    if (on && specialBtn.dataset.power !== power) specialBtn.dataset.power = power;
    specialBtn.classList.toggle('spent', !!spent);
    if (!on) {
