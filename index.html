      state.specialId = null;
      Input.release(SPECIAL);
    }
  }

  // The pad's centre. Read from layout rather than hard-coded so the CSS stays the
  // single source of truth for where it sits — and it no longer moves, so this is
  // simply where the pad is.
  function homeCentre() {
    const r = stick.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2, radius: r.width / 2 };
  }

  // ---- On-screen readout, for diagnosing a phone we cannot hold -------------
  // Add ?touch to the URL. Everything the stick actually receives is printed in
  // the corner: pointer type, raw travel, the direction chosen, and how many
  // gestures were CANCELLED — which is how you tell "the stick is broken" apart
  // from "the OS took the swipe and the page never saw it".
  function startReadout() {
    if (!/[?&]touch\b/.test(window.location.search)) return;
    const el = document.createElement('div');
    el.id = 'tdbg';
    el.style.cssText =
      'position:fixed;left:50%;top:4px;transform:translateX(-50%);z-index:99;' +
      'font:700 11px ui-monospace,Menlo,monospace;color:#7dff9b;text-align:center;' +
      'background:rgba(0,0,0,.75);padding:4px 8px;border-radius:6px;' +
      'pointer-events:none;white-space:pre;line-height:1.35';
    document.body.appendChild(el);
    const zoneOf = id => {
      const e = document.getElementById(id);
      if (!e) return '-';
      const r = e.getBoundingClientRect();
      return Math.round(r.left) + ',' + Math.round(r.top) + ' ' +
             Math.round(r.width) + 'x' + Math.round(r.height);
    };
    setInterval(() => {
      const L = state.last;
      const vv = window.visualViewport;
      el.textContent =
        'held ' + (state.heldCode || '-') + '   cancels ' + state.cancels + '\n' +
        'last ' + (L ? L.type + ' dx' + L.dx + ' dy' + L.dy + ' -> ' + L.code : 'none') + '\n' +
        'stick ' + zoneOf('tstick') + '   zone ' + zoneOf('tzone') + '\n' +
        'layout ' + window.innerHeight + '  visual ' +
          (vv ? Math.round(vv.height) : '?') + '  ctl ' +
          (getComputedStyle(document.documentElement).getPropertyValue('--ctl').trim() || 'unset');
    }, 120);
  }

  // ---- Wiring -------------------------------------------------------------
  function bind() {
    // The whole lower-left region grabs the stick, not just the pad itself.
    // Touch near the pad and it stays put, so an off-centre press registers a
    // direction instantly; touch further out and the pad comes to your thumb.
    // Either way there is nothing to aim at, which is most of what "responsive"
    // means on a phone.
    const onDown = e => {
      Audio3.unlock();
      if (state.stickId !== null) return;
      state.stickId = e.pointerId;
      home = homeCentre();
      // Capture keeps the press alive when the thumb slides off the zone. It is
      // an improvement, not a requirement — the up/cancel handlers and the
      // window blur fallback still release the pad without it — so a browser
      // that refuses the capture must not kill the whole handler.
      try { zone.setPointerCapture(e.pointerId); } catch (err) { /* not fatal */ }
      stick.classList.add('on');
      // THE PRESS ITSELF ALREADY CARRIES A DIRECTION. This is the whole point of
      // the pad: if not one pointermove is ever delivered, you still move.
      onStickMove(e);
      e.preventDefault();
    };
    const onStickMove = e => {
      if (e.pointerId !== state.stickId) return;
      if (!home) home = homeCentre();
      // FROM THE CENTRE OF THE PAD, not from wherever the press began. Press the
      // top of the pad and you go up; slide to the left edge and you go left;
      // there is no travel to accumulate and no origin to chase.
      const dx = e.clientX - home.x, dy = e.clientY - home.y;
      // Beyond REACH radii the press is nowhere near the pad — treat it as a
      // release rather than as a very committed direction.
      const far = Math.hypot(dx, dy) > home.radius * REACH;
      const code = far ? null : codeFor(dx, dy, home.radius);
      setHeld(code);
      state.last = { dx: Math.round(dx), dy: Math.round(dy), code: code || '-',
                     type: e.pointerType || '?' };
      e.preventDefault();
    };
    zone.addEventListener('pointerdown', onDown);
    zone.addEventListener('pointermove', onStickMove);
    // BELT AND BRACES AGAINST GESTURE CLAIMING. touch-action: none is supposed to
    // stop Chrome deciding a vertical drag was meant as a scroll, and in a desktop
    // browser emulating a phone it does. On real Android hardware the only thing
    // that reliably settles it is a non-passive touchmove that calls
    // preventDefault — and the vertical axis is the one at risk, because there is
    // nothing horizontal for the browser to want the gesture FOR.
    // Listener only; the pointer handlers above still drive everything.
    const swallow = e => { if (e.cancelable) e.preventDefault(); };
    ['touchstart', 'touchmove'].forEach(t =>
      zone.addEventListener(t, swallow, { passive: false }));
    ['pointerup', 'pointercancel'].forEach(t =>
      zone.addEventListener(t, e => {
        if (e.pointerId !== state.stickId) return;
        // A pointercancel here means something ABOVE the page took the gesture —
        // the OS navigation strip, or the browser deciding it was a scroll. Worth
        // recording: it is invisible otherwise and it is the difference between
        // "the stick is broken" and "the stick never got the events".
        if (t === 'pointercancel') state.cancels++;
        releaseAll();
        e.preventDefault();
      }));

    // Same principle as the stick: the whole lower-right region drops a bomb and
    // the round button is only the picture. Aiming at a circle under pressure
    // means a press that misses the edge by a few pixels does nothing at all —
    // which is exactly what an intermittent bomb button feels like.
    bombZone.addEventListener('pointerdown', e => {
      Audio3.unlock();
      state.bombId = e.pointerId;
      bombBtn.classList.add('on');
      Input.press(BOMB, true);          // a tap is always a fresh press
      try { bombZone.setPointerCapture(e.pointerId); } catch (err) { /* not fatal */ }
      e.preventDefault();
    });
    ['pointerup', 'pointercancel'].forEach(t =>
      bombZone.addEventListener(t, e => {
        if (state.bombId !== null && e.pointerId !== state.bombId) return;
        state.bombId = null;
        bombBtn.classList.remove('on');
        Input.release(BOMB);
      }));

    // The special button. Same shape as the bomb key: the zone takes the press
    // and the round button is only the picture.
    if (specialZone) {
      specialZone.addEventListener('pointerdown', e => {
        Audio3.unlock();
        state.specialId = e.pointerId;
        if (specialBtn) specialBtn.classList.add('on');
        Input.press(SPECIAL, true);
        try { specialZone.setPointerCapture(e.pointerId); } catch (err) { /* not fatal */ }
        e.preventDefault();
      });
      ['pointerup', 'pointercancel'].forEach(t =>
        specialZone.addEventListener(t, e => {
          if (state.specialId !== null && e.pointerId !== state.specialId) return;
          state.specialId = null;
          if (specialBtn) specialBtn.classList.remove('on');
          Input.release(SPECIAL);
        }));
    }

    // A thumb that leaves the window mid-drag must not leave the player running
    window.addEventListener('blur', releaseAll);
    document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });
  }

  function apply() {
    const want = state.pref === 'on';
    if (!want) releaseAll();
    state.active = want;
    if (pad) pad.classList.toggle('hidden', !want);
    if (!want) showSpecial(null, false);
    document.body.classList.toggle('touching', want);
  }

  return {
    init() {
      pad = document.getElementById('touch');
      zone = document.getElementById('tzone');
      bombZone = document.getElementById('tbombzone');
      specialZone = document.getElementById('tspecialzone');
      specialBtn = document.getElementById('tspecial');
      stick = document.getElementById('tstick');
      knob = document.getElementById('tknob');
      arrows = [...document.querySelectorAll('#tstick .tarr')];
      bombBtn = document.getElementById('tbomb');
      if (!pad || !zone || !bombZone || !stick || !knob || !bombBtn) return;
      state.available = detect();
      state.pref = readPref();
      bind();
      apply();
      startReadout();
    },
    // Two states, not three. "Auto" existed because the controls were a setting
    // you had to go and find; now they are on unless you say otherwise, and the
    // in-game button flicks them straight back, so a third state guessing on
    // your behalf is one more thing to explain and nothing to gain.
    setPref(pref) {
      state.pref = pref === 'off' ? 'off' : 'on';
      writePref(state.pref);
      apply();
    },
    toggle() {
      this.setPref(state.pref === 'on' ? 'off' : 'on');
      return state.pref;
    },
    showSpecial,
    get specialCode() { return SPECIAL; },
    get pref() { return state.pref; },
    get active() { return state.active; },
    get available() { return state.available; },
    label() { return state.pref.toUpperCase(); },
    releaseAll,
    _detect: detect,
    // Testing hook: forget the remembered choice and go back to the default
    _reset() {
      try { window.localStorage.removeItem(PREF_KEY); } catch (e) {}
      state.pref = readPref();
      apply();
    },
  };
})();


/* ==== 30-world.js ================================================= */
/* ============================================================================
   SECTION 30 — WORLD: renderer, camera, lighting, arena grid and its meshes
   ========================================================================== */

const World = (function () {
  const state = {
    scene: null, camera: null, renderer: null,
    grid: null,              // Int8Array COLS*ROWS of CELL values
    softMeshes: null,        // Map "x,y" -> mesh, for destructible crates
    hidden: null,            // Map "x,y" -> power-up id concealed under a crate
    group: null,             // everything that gets rebuilt each round
    shake: 0,
  };

  const idx = (x, y) => y * CFG.COLS + x;
  const key = (x, y) => x + ',' + y;
  const wx = gx => (gx - (CFG.COLS - 1) / 2) * CFG.TILE;
  const wz = gy => (gy - (CFG.ROWS - 1) / 2) * CFG.TILE;

  // ---- Procedural textures ------------------------------------------------
  function groundTexture(level) {
    const S = 128, c = document.createElement('canvas');
    c.width = c.height = S;
    const g = c.getContext('2d');
    const [r, gr, b] = level.ground;
    g.fillStyle = `rgb(${r},${gr},${b})`;
    g.fillRect(0, 0, S, S);
    // subtle mottling so the large floor plane is not flat colour
    for (let i = 0; i < 900; i++) {
      const v = 20 + Math.random() * 40;
      g.fillStyle = `rgba(${Math.min(255, r - 44 + v)},${Math.min(255, gr - 43 + v)},${Math.min(255, b - 26 + v)},0.35)`;
      const s = 2 + Math.random() * 5;
      g.fillRect(Math.random() * S, Math.random() * S, s, s);
    }
    g.strokeStyle = level.groundLine;
    g.lineWidth = 3;
    g.strokeRect(1.5, 1.5, S - 3, S - 3);
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(CFG.COLS, CFG.ROWS);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = 4;
    return tex;
  }

  function crateTexture(level) {
    const S = 128, c = document.createElement('canvas');
    c.width = c.height = S;
    const g = c.getContext('2d');
    g.fillStyle = level.crate; g.fillRect(0, 0, S, S);
    g.fillStyle = level.crateBand;
    for (let i = 0; i < 4; i++) g.fillRect(0, i * 32 + 26, S, 6);
    g.strokeStyle = level.crateEdge; g.lineWidth = 8;
    g.strokeRect(4, 4, S - 8, S - 8);
    g.fillStyle = 'rgba(255,255,255,0.14)';
    g.fillRect(8, 8, S - 16, 10);
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }

  const MAT = {};

  // Swap the palette when the chosen level changes. Textures are regenerated
  // rather than tinted so each level can look genuinely different.
  function applyLevel(level) {
    state.level = level;
    if (MAT.ground.map) MAT.ground.map.dispose();
    if (MAT.soft.map) MAT.soft.map.dispose();
    MAT.ground.map = groundTexture(level);
    MAT.soft.map = crateTexture(level);
    MAT.ground.needsUpdate = MAT.soft.needsUpdate = true;
    MAT.hard.color.setHex(level.hard);
    MAT.hardTop.color.setHex(level.hardTop);
    MAT.border.color.setHex(level.border);
    // Bombs have to stay visible against THIS floor — see bombColourFor
    MAT.bomb.color.setHex(bombColourFor(level));
    tintWalls(null);
    if (state.scene) {
      state.scene.background.setHex(level.sky);
      state.scene.fog.color.setHex(level.sky);
    }
  }

  // Paint the outer ring in a player's colour (winner celebration), or pass
  // null to restore the current level's own stone palette.
  function tintWalls(hex) {
    if (!MAT.wall) return;
    // The celebration owns `emissive` on these same materials, so a heart
    // flash still running would fight it — and win, once a frame.
    clearHeartFlash();
    state.wallTint = (hex === null || hex === undefined) ? null : hex;
    const lvl = state.level || LEVELS[0];
    if (state.wallTint === null) {
      MAT.wall.color.setHex(lvl.hard);
      MAT.wallTop.color.setHex(lvl.hardTop);
      MAT.border.color.setHex(lvl.border);
      MAT.wall.emissive.setHex(0x000000);
      MAT.wallTop.emissive.setHex(0x000000);
    } else {
      MAT.wall.color.setHex(hex);
      MAT.wallTop.color.setHex(hex);
      // Sudden-death blocks form the visible perimeter once rings have closed,
      // so they join the celebration too.
      MAT.border.color.setHex(hex);
      // A touch of self-illumination so the ring reads as lit-up, not repainted.
      MAT.wall.emissive.setHex(hex);
      MAT.wallTop.emissive.setHex(hex);
      MAT.wall.emissiveIntensity = 0.35;
      MAT.wallTop.emissiveIntensity = 0.5;
      MAT.wallTop.color.offsetHSL(0, 0, 0.12);
    }
  }

  /* ------------------------------------------------------- heart flash --- */
  // Somebody has picked up the one Extra Life on the map. Every block around
  // the edge lights up with a heart for a moment, in that player's colour, so
  // the whole table knows who got it without anyone having to read the HUD.
  //
  // Done with an emissiveMap, not a colour swap: black emits nothing, so only
  // the heart shape lights up and the wall keeps its own stone colour and its
  // per-level palette underneath. Nothing to restore afterwards except the
  // intensity, which is what makes this safe to fire mid-round.
  const FLASH_MATS = () => [MAT.wall, MAT.wallTop, MAT.border].filter(Boolean);

  function flashHearts(hex) {
    if (!MAT.wall) return;
    const map = Icons.heartMask();
    FLASH_MATS().forEach(m => {
      m.emissiveMap = map;
      m.emissive.setHex(hex === undefined || hex === null ? CFG.HEART_FLASH_COLOR : hex);
      m.emissiveIntensity = 0;
      m.needsUpdate = true;
    });
    state.heartFlash = CFG.HEART_FLASH_TIME;
    heartHint(false);            // somebody has it; stop advertising the crate
  }

  function updateHeartFlash(dt) {
    // Nothing to animate for the crate marker any more: it is a flat heart lying
    // on the lid, and "simple" was the brief. The bob belonged to the sprite.
    if (!state.heartFlash) return;
    state.heartFlash = Math.max(0, state.heartFlash - dt);
    const t = 1 - state.heartFlash / CFG.HEART_FLASH_TIME;   // 0 -> 1
    const k = Math.sin(Math.min(1, t) * Math.PI);            // in, hold, out
    FLASH_MATS().forEach(m => { m.emissiveIntensity = k * CFG.HEART_FLASH_PEAK; });
    if (state.heartFlash === 0) clearHeartFlash();
  }

  // Take the map back off. Leaving it attached would make the winner tint —
  // which sets emissive on the same materials — paint hearts on every block.
  function clearHeartFlash() {
    state.heartFlash = 0;
    FLASH_MATS().forEach(m => {
      if (!m.emissiveMap) return;
      m.emissiveMap = null;
      m.emissive.setHex(0x000000);
      m.emissiveIntensity = 1;
      m.needsUpdate = true;
    });
  }

  function initMaterials() {
    const L0 = LEVELS[0];
    MAT.ground = new THREE.MeshStandardMaterial({ map: groundTexture(L0), roughness: 0.95, metalness: 0 });
    MAT.hard = new THREE.MeshStandardMaterial({ color: L0.hard, roughness: 0.75, metalness: 0.05 });
    MAT.hardTop = new THREE.MeshStandardMaterial({ color: L0.hardTop, roughness: 0.7 });
    // The outer ring gets its own material pair so the winner's colour can be
    // painted onto the map edge without touching the interior pillars.
    MAT.wall = new THREE.MeshStandardMaterial({ color: L0.hard, roughness: 0.75, metalness: 0.05 });
    MAT.wallTop = new THREE.MeshStandardMaterial({ color: L0.hardTop, roughness: 0.7 });
    MAT.soft = new THREE.MeshStandardMaterial({ map: crateTexture(L0), roughness: 0.8 });
    MAT.border = new THREE.MeshStandardMaterial({ color: L0.border, roughness: 0.85 });
    state.level = L0;
    MAT.bomb = new THREE.MeshStandardMaterial({ color: bombColourFor(L0), roughness: 0.35, metalness: 0.35 });
    // Unlit + additive + toneMapped:false keeps the fire vivid orange instead
    // of letting ACES tone mapping wash it out to pale yellow.
    MAT.flame = new THREE.MeshBasicMaterial({
      color: 0xff7a1c, transparent: true, opacity: 0.88,
      depthWrite: false, toneMapped: false,
    });
    MAT.flameCore = new THREE.MeshBasicMaterial({
      color: 0xffc061, transparent: true, opacity: 0.75,
      blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false,
    });
    MAT.shock = new THREE.MeshBasicMaterial({
      color: 0xffe9b8, transparent: true, opacity: 0.9, side: THREE.DoubleSide,
      blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false,
    });
  }

  // ---- Boot ---------------------------------------------------------------
  function init(canvas) {
    initMaterials();

    state.renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    state.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    state.renderer.shadowMap.enabled = true;
    // PCFSoftShadowMap was deprecated in three r185 — it warns once and falls
    // back to PCFShadowMap anyway, so ask for the real thing and stay quiet.
    state.renderer.shadowMap.type = THREE.PCFShadowMap;
    state.renderer.toneMapping = THREE.ACESFilmicToneMapping;
    state.renderer.toneMappingExposure = 1.15;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x121826);
    scene.fog = new THREE.Fog(0x121826, 26, 44);
    state.scene = scene;

    // Fixed tilted overhead camera — the whole arena is always in frame
    const cam = new THREE.PerspectiveCamera(46, 16 / 9, 0.1, 120);
    state.camera = cam;
    state.camTarget = new THREE.Vector3(0, 0.35, 0.1);
    state.camBase = new THREE.Vector3(0, 15.5, 12.2);

    scene.add(new THREE.HemisphereLight(0xbfd8ff, 0x2b3b1e, 1.05));

    const key = new THREE.DirectionalLight(0xfff2d8, 2.0);
    key.position.set(7, 16, 8);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    const d = 12;
    key.shadow.camera.left = -d; key.shadow.camera.right = d;
    key.shadow.camera.top = d;   key.shadow.camera.bottom = -d;
    key.shadow.camera.near = 1;  key.shadow.camera.far = 45;
    key.shadow.bias = -0.0012;
    key.shadow.normalBias = 0.02;
    scene.add(key);

    const fill = new THREE.DirectionalLight(0x88aaff, 0.5);
    fill.position.set(-9, 8, -7);
    scene.add(fill);

    state.group = new THREE.Group();
    scene.add(state.group);

    resize();
    window.addEventListener('resize', resize);
    // Android Chrome and iOS Safari both hide and show the URL bar without firing
    // a window resize. The visual viewport does report it, and everything anchored
    // to the bottom of the screen — the thumb controls above all — depends on
    // knowing. On Android this fires repeatedly during ordinary play.
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', resize);
      window.visualViewport.addEventListener('scroll', resize);
    }
  }

  function resize() {
    // Publish the VISIBLE height before anything measures against it.
    if (typeof UI !== 'undefined' && UI.syncViewport) UI.syncViewport();
    // The RENDERER stays on the layout viewport. The canvas fills that box in
    // CSS, so sizing the drawing buffer to the shorter visible height instead
    // would simply stretch the picture. What the visible height changes is the
    // CAMERA FIT — see LIM.bottom — and where the touch layer ends.
    const w = window.innerWidth, h = window.innerHeight;
    // Capped at 2: a DPR-3 phone renders 2.25x the pixels of a DPR-2 one for a
    // difference nobody can see at a 32px tile, and fill rate is the first
    // thing to run out on mobile.
    state.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    state.renderer.setSize(w, h, false);
    state.camera.aspect = w / h;
    state.camera.fov = 46;
    state.camera.updateProjectionMatrix();
    fitCamera();
  }

  // 'menu' frames the arena as a backdrop: no HUD to dodge, and pulled in so it
  // reads as a proper preview. 'play' keeps the whole board on screen.
  function setFraming(mode) {
    state.framing = mode;
    fitCamera();
  }

  // How wide the arena floor actually is on screen, in CSS pixels. The menu
  // matches its option column to this so the two line up.
  function arenaScreenWidth() {
    const hx = (CFG.COLS / 2) * CFG.TILE;
    const hz = (CFG.ROWS / 2) * CFG.TILE;
    const cam = state.camera;
    cam.updateMatrixWorld(true);
    let min = Infinity, max = -Infinity;
    [-hx, hx].forEach(x => [-hz, hz].forEach(z => {
      const v = new THREE.Vector3(x, 0, z).project(cam);
      min = Math.min(min, v.x);
      max = Math.max(max, v.x);
    }));
    return ((max - min) / 2) * window.innerWidth;
  }

  // The arena floor's bounding box in CSS pixels. Used by the layout checks to
  // prove the on-screen controls sit beside the board, not on it.
  // insetTiles=1 gives the PLAYABLE interior, excluding the decorative outer
  // wall ring. That is the rectangle the on-screen controls must stay off:
  // overlapping the outer wall hides nothing a player can use.
  // THE FAR EDGE ON ITS OWN, as a line. arenaScreenRect returns the bounding box
  // of the whole projected board, and under perspective the NEAR edge is far
  // wider than the far one — so anything sized to that box overhangs the top of
  // the board by the difference. This projects only the two BACK corners, at the
  // height of the top of the outer wall, and they land on the same screen y
  // because the camera has no roll. That gives a genuine edge to align to.
  function arenaFarEdge(worldY) {
    const hx = (CFG.COLS / 2) * CFG.TILE;
    const hz = (CFG.ROWS / 2) * CFG.TILE;
    const cam = state.camera;
    cam.updateMatrixWorld(true);
    const y = worldY === undefined ? 1.0 : worldY;
    const pts = [-hx, hx].map(x => {
      const v = new THREE.Vector3(x, y, -hz).project(cam);
      return { x: (v.x * 0.5 + 0.5) * window.innerWidth,
               y: (-v.y * 0.5 + 0.5) * window.innerHeight };
    });
    return {
      left: Math.min(pts[0].x, pts[1].x),
      right: Math.max(pts[0].x, pts[1].x),
      y: (pts[0].y + pts[1].y) / 2,
    };
  }

  // The NEAR edge — the front of the board, where the countdown sits. Same
  // projection as arenaFarEdge with the sign of z flipped; a separate function
  // rather than a sign argument because every caller of either one means one
  // specific end of the board and reads better saying so.
  // `insetTiles` steps the line inwards, which is how the FRONT WALL is measured
  // as a band rather than as a line: inset 1 is the lid's inner corner, inset 0
  // is its outer one, and the strip between them is the only part of the bottom
  // of the screen guaranteed to be wall rather than board.
  function arenaNearEdge(worldY, insetTiles) {
    const inset = (insetTiles || 0) * CFG.TILE;
    const hx = (CFG.COLS / 2) * CFG.TILE - inset;
    const hz = (CFG.ROWS / 2) * CFG.TILE - inset;
    const cam = state.camera;
    cam.updateMatrixWorld(true);
    const y = worldY === undefined ? 1.0 : worldY;
    const pts = [-hx, hx].map(x => {
      const v = new THREE.Vector3(x, y, hz).project(cam);
      return { x: (v.x * 0.5 + 0.5) * window.innerWidth,
               y: (-v.y * 0.5 + 0.5) * window.innerHeight };
    });
    return {
      left: Math.min(pts[0].x, pts[1].x),
      right: Math.max(pts[0].x, pts[1].x),
      y: (pts[0].y + pts[1].y) / 2,
    };
  }

  function arenaScreenRect(insetTiles) {
    const inset = (insetTiles || 0) * CFG.TILE;
    const hx = (CFG.COLS / 2) * CFG.TILE - inset;
    const hz = (CFG.ROWS / 2) * CFG.TILE - inset;
    const cam = state.camera;
    cam.updateMatrixWorld(true);
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    [-hx, hx].forEach(x => [-hz, hz].forEach(z => [0, 1.1].forEach(y => {
      const v = new THREE.Vector3(x, y, z).project(cam);
      const px = (v.x * 0.5 + 0.5) * window.innerWidth;
      const py = (-v.y * 0.5 + 0.5) * window.innerHeight;
      x0 = Math.min(x0, px); x1 = Math.max(x1, px);
      y0 = Math.min(y0, py); y1 = Math.max(y1, py);
    })));
    return { left: x0, right: x1, top: y0, bottom: y1 };
  }

  // Pull the camera to the closest distance that still keeps the whole arena
  // on screen. Runs on resize only, so the binary search costs nothing.
  const PITCH = 57 * Math.PI / 180;
  function fitCamera() {
    const cam = state.camera;
    const t = state.camTarget;
    const dir = new THREE.Vector3(0, Math.sin(PITCH), Math.cos(PITCH));

    const hx = (CFG.COLS / 2) * CFG.TILE;
    const hz = (CFG.ROWS / 2) * CFG.TILE;
    const pts = [];
    [-hx, hx].forEach(x => [-hz, hz].forEach(z => [0, 1.25].forEach(y => pts.push(new THREE.Vector3(x, y, z)))));

    // The board's OUTLINE, sampled. Corners alone are not enough to say a convex
    // quad misses an axis-aligned box — a box can poke into the middle of an edge
    // between two corners that are both outside it. Eight samples an edge, at the
    // height of the top of the wall, which is the silhouette you actually see.
    const edge = [];
    const EDGE_N = 8;
    for (let i = 0; i <= EDGE_N; i++) {
      const f = (i / EDGE_N) * 2 - 1;
      edge.push(new THREE.Vector3(f * hx, 1.25, -hz), new THREE.Vector3(f * hx, 1.25, hz),
                new THREE.Vector3(-hx, 1.25, f * hz), new THREE.Vector3(hx, 1.25, f * hz));
    }
    // ...and the board as two CYCLIC QUADS, floor and wall-top. Sampling the
    // outline alone answers "does an edge cross the box", which misses a box
    // sitting entirely INSIDE the board — and on a tablet the board is big enough
    // that the thumb controls do exactly that. Both questions have to be asked.
    const quadLo = [[-hx, 0, -hz], [hx, 0, -hz], [hx, 0, hz], [-hx, 0, hz]]
      .map(([x, y, z]) => new THREE.Vector3(x, y, z));
    const quadHi = quadLo.map(v => new THREE.Vector3(v.x, 1.25, v.z));

    const menuMode = state.framing === 'menu';

    // Reserve room for the HUD: the clock across the top, and a column of
    // player panels down each edge. Widths mirror the CSS breakpoint.
    // The menu has no HUD, so it gets the full width.
    const w = window.innerWidth, h = window.innerHeight;
    // Never let the HUD claim more than a sixth of the width per side, or the
    // arena shrinks to nothing on a small window.
    // Compact (phone-sized) windows move the player panels into a strip across
    // the top, so nothing is beside the arena and the full width is available.
    // The predicate lives in UI so the CSS and the camera cannot disagree.
    const compact = !menuMode && UI.isCompact();
    // Solo mode measures what is really there — the big panel is wider than any
    // hardcoded breakpoint guess, and a guess that is too small puts it on the
    // board. Two-player keeps the original constants so its framing is
    // untouched. The cap stops a huge window handing the HUD the whole screen.
    // ONE MEASURED RESERVE, whatever the layout. The cards are a column in the
    // top-left and the buttons are a row in the top-right, so the board has to
    // clear the wider of the two — and because the board stays centred, clearing
    // one side means reserving both. Measured rather than mirrored from the
    // stylesheet: every time those two were kept in step by hand, one of them was
    // eventually changed without the other.
    // No side reserve any more: the HUD is handed to `fits` as real rectangles and
    // the board is grown until one of them is actually in the way. The only
    // limits left are the edges of the screen.
    const blockers = menuMode ? [] : (UI.hudBlockRects ? UI.hudBlockRects() : []);
    const PAD = 6;                       // breathing room around each box
    const LIM = menuMode
      ? { x: 0.99, top: 0.99, bottom: 0.99 }
      // Compact trades the side reserve for a deeper top reserve (the strip)
      // and a little at the bottom, where the thumbstick sits.
      // Compact reserves exactly as much room as the top strip actually occupies,
      // measured from the live layout. A fixed fraction cannot work: the strip
      // grows with the safe-area inset and with whatever each card is showing,
      // and the moment it outgrows the guess it sits on the board.
      : compact
        ? { x: 0.985,
            top: 0.985,
            // THE BOTTOM OF THE SCREEN IS NOT THE BOTTOM OF THE CANVAS on a phone.
            // The canvas fills the layout viewport, part of which sits under the
            // URL bar. NDC -1 is the canvas bottom; the visible bottom is at
            // 1 - 2*visible/layout, so the board must stay above that or its
            // front rows are drawn where nobody can see or touch them.
            //
            // THE VISIBLE LINE IS THE ONLY LIMIT NOW. There used to be a hard 0.86
            // on top of it, holding a strip clear at the bottom "where the
            // thumbstick sits" — and it was the single thing keeping the board
            // small: measured, the board sat at exactly -0.860 while the nearest
            // control was still 76px away. The controls are real rectangles handed
            // to `fits` now, so they defend themselves and this does not have to
            // guess on their behalf.
            bottom: Math.max(0.30, (2 * UI.viewportH()) / Math.max(h, 1) - 1 - 0.02) }
        : { x: 0.985, top: 0.985, bottom: 0.99 };
    const half = { w: w / 2, h: h / 2 };
    const v3 = new THREE.Vector3();
    const fits = d => {
      cam.position.copy(t).addScaledVector(dir, d);
      cam.lookAt(t);
      cam.updateMatrixWorld(true);
      // 1. On the screen at all
      for (const p of pts) {
        v3.copy(p).project(cam);
        if (Math.abs(v3.x) > LIM.x || v3.y > LIM.top || v3.y < -LIM.bottom) return false;
      }
      // 2. Clear of everything the HUD is actually occupying. Pulling the camera
      //    back shrinks the board towards the centre and away from the corners, so
      //    this stays monotonic in d and the binary search below is still valid.
      if (blockers.length) {
        // (a) does an edge of the board cross a box?
        for (const p of edge) {
          v3.copy(p).project(cam);
          const sx = (v3.x * 0.5 + 0.5) * w, sy = (-v3.y * 0.5 + 0.5) * h;
          for (let i = 0; i < blockers.length; i++) {
            const b = blockers[i];
            if (sx > b.left - PAD && sx < b.right + PAD &&
                sy > b.top - PAD && sy < b.bottom + PAD) return false;
          }
        }
        // (b) ...or is a box sitting wholly inside the board? On a big screen the
        //     thumb controls do exactly that, and (a) alone never sees them.
        const lo = toScreen(quadLo), hi2 = toScreen(quadHi);
        for (let i = 0; i < blockers.length; i++) {
          const b = blockers[i];
          const cs = [[b.left - PAD, b.top - PAD], [b.right + PAD, b.top - PAD],
                      [b.right + PAD, b.bottom + PAD], [b.left - PAD, b.bottom + PAD]];
          for (let c = 0; c < 4; c++) {
            if (inQuad(cs[c][0], cs[c][1], lo) || inQuad(cs[c][0], cs[c][1], hi2)) return false;
          }
        }
      }
      return true;
    };

    function toScreen(quad) {
      return quad.map(p => {
        const v = p.clone().project(cam);
        return [(v.x * 0.5 + 0.5) * w, (-v.y * 0.5 + 0.5) * h];
      });
    }
    // Point in a convex quad given in cyclic order: the cross products of each
    // edge with the point all share a sign.
    function inQuad(px, py, q) {
      let neg = false, pos = false;
      for (let i = 0; i < 4; i++) {
        const a = q[i], b2 = q[(i + 1) % 4];
        const cross = (b2[0] - a[0]) * (py - a[1]) - (b2[1] - a[1]) * (px - a[0]);
        if (cross < 0) neg = true; else if (cross > 0) pos = true;
        if (neg && pos) return false;
      }
      return true;
    }

    let lo = 6, hi = 60;
    if (!fits(hi)) hi = 90;
    for (let i = 0; i < 26; i++) {
      const mid = (lo + hi) / 2;
      if (fits(mid)) hi = mid; else lo = mid;
    }
    // On the menu, close in so the arena reads 50% larger than a plain fit
    const finalDist = menuMode ? hi / CFG.MENU_ZOOM : hi;
    fits(finalDist);
    state.camBase.copy(cam.position);

    // FOG IS PUSHED BEHIND THE BOARD, every time the camera moves.
    //
    // It was a fixed Fog(26, 44). On a desktop the camera sits close enough that
    // the whole arena is inside 26 units and nothing fogs. On a PHONE the strip of
    // cards across the top forces the camera much further back, the far half of
    // the board crosses 26 — and the far half of the board is the TOP half of the
    // screen. That is the "mist over the top of the arena on mobile only": not a
    // mobile rendering fault at all, a fixed distance measured from a camera that
    // moves. Anchored to the furthest corner of the board instead, so the arena is
    // always completely clear of it at any window size, and the fog only ever
    // grades what is behind the board.
    if (state.scene.fog) {
      let furthest = 0;
      for (const p of pts) furthest = Math.max(furthest, cam.position.distanceTo(p));
      state.scene.fog.near = furthest + 3;
      state.scene.fog.far = furthest + 26;
    }

    fitHooks.forEach(fn => fn());
  }

  const fitHooks = [];
  function onFit(fn) { fitHooks.push(fn); }

  // ---- Arena construction -------------------------------------------------
  function disposeGroup() {
    state.group.traverse(o => {
      if (o.isMesh && o.geometry && o.userData.ownGeometry) o.geometry.dispose();
    });
    state.group.clear();
  }

  // ---- The rule overlay ---------------------------------------------------
  // Layouts are FIXED per level rather than randomised. A hazard you can learn
  // where to expect is a hazard; one that moves every round is noise — the same
  // argument that fixed the snowman's corner.
  const RULE_LAYOUTS = {
    // Two counter-rotating loops, one either side of centre, well clear of the
    // spawn pockets. Each is a rectangle of belts that carries you round it.
    belts() {
      const out = [];
      const loop = (x0, y0, x1, y1, clockwise) => {
        for (let x = x0; x < x1; x++) out.push([x, y0, clockwise ? RULE.BELT_R : RULE.BELT_L]);
        for (let y = y0; y < y1; y++) out.push([x1, y, clockwise ? RULE.BELT_D : RULE.BELT_U]);
        for (let x = x1; x > x0; x--) out.push([x, y1, clockwise ? RULE.BELT_L : RULE.BELT_R]);
        for (let y = y1; y > y0; y--) out.push([x0, y, clockwise ? RULE.BELT_U : RULE.BELT_D]);
      };
      loop(3, 3, 5, 5, true);
      loop(9, 7, 11, 9, false);
      return out;
    },
    // Two pairs, on opposite diagonals, each a long way from its twin.
    pads() {
      return [[3, 9, RULE.PAD], [11, 3, RULE.PAD], [3, 3, RULE.PAD], [11, 9, RULE.PAD]];
    },
    // Ice covers the whole interior: a rink you have to learn, not a patch you
    // can walk around and forget about.
    ice() {
      const out = [];
      for (let y = 1; y < CFG.ROWS - 1; y++)
        for (let x = 1; x < CFG.COLS - 1; x++) out.push([x, y, RULE.ICE]);
      return out;
    },
  };

  function seedRule(level, safeTiles) {
    const make = RULE_LAYOUTS[level.rule];
    if (!make) return;
    const tiles = make();
    const pads = [];
    tiles.forEach(([x, y, r]) => {
      if (x < 1 || y < 1 || x > CFG.COLS - 2 || y > CFG.ROWS - 2) return;
      // NEVER over a pillar. The lattice is the board's skeleton and a rule that
      // moved it would change the arena's shape, which is not what a rule is for.
      if (state.grid[idx(x, y)] === CELL.HARD) return;
      // Ice is the floor itself, so it may lie under a crate; anything a player
      // has to SEE and step onto clears the crate off it first.
      if (r !== RULE.ICE && state.grid[idx(x, y)] === CELL.SOFT) {
        state.grid[idx(x, y)] = CELL.EMPTY;
        state.hidden.delete(key(x, y));
      }
      // A spawn pocket keeps its plain floor whatever the level wants: being
      // carried off your own spawn tile before the countdown finishes is not a
      // mechanic, it is a bug report.
      if (r !== RULE.ICE && safeTiles && safeTiles.has(key(x, y))) return;
      state.rules[idx(x, y)] = r;
      if (r === RULE.PAD) pads.push(key(x, y));
    });
    // Pads are paired in the order they were laid: 0 with 1, 2 with 3.
    for (let i = 0; i + 1 < pads.length; i += 2) {
      state.padPairs.set(pads[i], pads[i + 1]);
      state.padPairs.set(pads[i + 1], pads[i]);
    }
  }

  // The overlay's only readers. Everything that cares about a rule goes through
  // these, so a rule can never be half-applied — movement honouring it and the
  // AI not, which is what makes bots look stupid on a themed map.
  const ruleAt = (x, y) =>
    (x < 0 || y < 0 || x >= CFG.COLS || y >= CFG.ROWS || !state.rules)
      ? RULE.NONE : state.rules[idx(x, y)];
  const beltAt = (x, y) => BELT_DIR[ruleAt(x, y)] || null;
  const padTwin = (x, y) => {
    // THE OVERLAY IS THE TRUTH, the pairing map is only its index. Consulting
    // the map alone left pads working on a board that no longer had any: the
    // pairs outlive a rebuild that clears the rules, and a bot then plots a
    // route through a door that is not there and walks into the wall behind it.
    if (ruleAt(x, y) !== RULE.PAD) return null;
    const k = state.padPairs && state.padPairs.get(key(x, y));
    if (!k) return null;
    const [px, py] = k.split(',').map(Number);
    return { x: px, y: py };
  };
  const hasRule = () => !!(state.level && state.level.rule);

  function buildArena(rng, level) {
    if (level && level !== state.level) applyLevel(level);
    tintWalls(null);              // every new arena starts on its own palette
    disposeGroup();
    state.softMeshes = new Map();
    state.hidden = new Map();
    const grid = new Int8Array(CFG.COLS * CFG.ROWS);
    state.grid = grid;
    // The rule overlay is rebuilt with the arena and is empty unless the level
    // asks for something. A level with no `rule` is byte-for-byte the game it
    // was before this existed.
    state.rules = new Int8Array(CFG.COLS * CFG.ROWS);
    state.padPairs = new Map();

    // 1. Hard layout: outer wall plus the classic pillar lattice
    for (let y = 0; y < CFG.ROWS; y++) {
      for (let x = 0; x < CFG.COLS; x++) {
        const border = x === 0 || y === 0 || x === CFG.COLS - 1 || y === CFG.ROWS - 1;
        const pillar = x % 2 === 0 && y % 2 === 0;
        grid[idx(x, y)] = (border || pillar) ? CELL.HARD : CELL.EMPTY;
      }
    }

    // THE LATTICE IS COMPLETE — all 30 pillars, corners included.
    // The four pillars diagonally in front of the spawns were removed for a while,
    // because for the two BACK corners that pillar sits one tile nearer the camera
    // than the character on the spawn and covers them to the chest. Missing corner
    // blocks were the more obvious wrong, so they are back. The occlusion is a
    // camera-and-block-height problem and needs its own answer.

    // 2. Keep every spawn pocket clear so nobody is boxed in at the start
    const safe = new Set();
    SPAWNS.forEach(s => {
      [[0, 0], [1, 0], [0, 1], [-1, 0], [0, -1], [2, 0], [0, 2], [-2, 0], [0, -2]].forEach(([dx, dy]) => {
        const x = s.x + dx, y = s.y + dy;
        if (x > 0 && y > 0 && x < CFG.COLS - 1 && y < CFG.ROWS - 1) safe.add(key(x, y));
      });
    });

    // 3. Scatter crates
    const puBag = weightedBag(rng);
    for (let y = 1; y < CFG.ROWS - 1; y++) {
      for (let x = 1; x < CFG.COLS - 1; x++) {
        if (grid[idx(x, y)] !== CELL.EMPTY) continue;
        if (safe.has(key(x, y))) continue;
        if (rng() < (state.level.softDensity || CFG.SOFT_DENSITY)) {
          grid[idx(x, y)] = CELL.SOFT;
          if (rng() < CFG.POWERUP_CHANCE) state.hidden.set(key(x, y), puBag());
        }
      }
    }

    // 3b. The level's rule, if it has one. Laid AFTER the crates so a rule tile
    //     can clear whatever was dealt onto it: a conveyor under a crate is a
    //     conveyor nobody can see or use, and a teleport pad you have to blow
    //     open first is a pad most rounds never reveal.
    if (state.level.rule) seedRule(state.level, safe);

    // 4. Exactly ONE heart per round, seeded deliberately rather than left to
    //    the weighted bag — an extra life that turns up twice in a round, or
    //    not at all, is not the same prize. It overwrites whatever that crate
    //    was hiding, so it never inflates the item count either.
    //
    //    AND IT GOES NEAR THE MIDDLE. Anywhere on the board meant it could sit two
    //    tiles from somebody's spawn, and then it is not a prize anybody fights
    //    over — it is whoever happened to start next to it. Restricted to the
    //    central third of the board in both directions, so it is roughly the same
    //    distance from all four corners and reaching it costs everyone the same.
    //    Any crate is better than no heart, so the whole board is the fallback if
    //    the middle happens to have been left bare.
    const cx = (CFG.COLS - 1) / 2, cy = (CFG.ROWS - 1) / 2;
    const REACH_X = Math.max(1, Math.floor(CFG.COLS / 6));
    const REACH_Y = Math.max(1, Math.floor(CFG.ROWS / 6));
    const crates = [], middle = [];
    for (let y = 1; y < CFG.ROWS - 1; y++) {
      for (let x = 1; x < CFG.COLS - 1; x++) {
        if (grid[idx(x, y)] !== CELL.SOFT) continue;
        const k = key(x, y);
        crates.push(k);
        if (Math.abs(x - cx) <= REACH_X && Math.abs(y - cy) <= REACH_Y) middle.push(k);
      }
    }
    const pool = middle.length ? middle : crates;
    state.heartKey = pool.length
      ? pool[Math.floor(rng() * pool.length) % pool.length]
      : null;
    if (state.heartKey) state.hidden.set(state.heartKey, PU.SHIELD);
    state.heartHint = null;             // buildMeshes clears the group under us
    state.hazardMark = null;            // ...and the landing marker with it
    state.hazardMarkKey = null;

    buildMeshes();
    return grid;
  }

  function weightedBag(rng) {
    const total = PU_DROPS.reduce((a, p) => a + p.weight, 0);
    return function () {
      let r = rng() * total;
      for (const p of PU_DROPS) { r -= p.weight; if (r <= 0) return p.id; }
      return PU_DROPS[0].id;
    };
  }

  // One decal per rule tile, built from state.rules so the picture and the
  // behaviour can never disagree. Belts share a single texture and are turned
  // to face the way they carry.
  function buildRuleDecals(g) {
    if (!state.rules) return;
    const beltTex = Icons.beltDecal && Icons.beltDecal();
    for (let y = 0; y < CFG.ROWS; y++) {
      for (let x = 0; x < CFG.COLS; x++) {
        const r = state.rules[idx(x, y)];
        if (r === RULE.NONE) continue;
        if (r === RULE.PAD && Icons.padDecal) {
          const m = new THREE.Mesh(
            new THREE.PlaneGeometry(1, 1),
            new THREE.MeshBasicMaterial({ map: Icons.padDecal(), transparent: true,
                                          depthWrite: false, toneMapped: false }));
          m.rotation.x = -Math.PI / 2;
          m.position.set(wx(x), MARK_Y - 0.004, wz(y));
          m.renderOrder = 3;
          m.userData.ownGeometry = true;
          g.add(m);
          continue;
        }
        const belt = BELT_DIR[r];
        if (belt && beltTex) {
          const m = new THREE.Mesh(
            new THREE.PlaneGeometry(1, 1),
            new THREE.MeshBasicMaterial({ map: beltTex, transparent: true,
                                          depthWrite: false, toneMapped: false }));
          m.rotation.x = -Math.PI / 2;
          // The texture points +x; every other direction is that turned. Screen
          // z is the grid's +y, so a belt carrying "down" the board is -90deg.
          m.rotation.z = belt.x === 1 ? 0
                       : belt.x === -1 ? Math.PI
                       : belt.y === 1 ? -Math.PI / 2 : Math.PI / 2;
          m.position.set(wx(x), MARK_Y - 0.004, wz(y));
          m.renderOrder = 3;
          m.userData.ownGeometry = true;
          g.add(m);
        }
      }
    }
  }

  function buildMeshes() {
    const g = state.group;

    // Floor
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(CFG.COLS * CFG.TILE, CFG.ROWS * CFG.TILE),
      MAT.ground
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    floor.userData.ownGeometry = true;
    g.add(floor);

    // The level's rule, drawn ON the floor. Decoration is the one thing a rule
    // must never be: a conveyor you cannot see is a floor that cheats, so this
    // is built from the same overlay the movement code reads rather than from a
    // second list that could drift out of step with it.
    buildRuleDecals(g);

    // Hard blocks — the outer ring and the interior pillars are built as two
    // separate InstancedMesh pairs so the ring can be recoloured on its own
    // (winner celebration) without touching the pillars.
    const ringCells = [], pillarCells = [];
    for (let y = 0; y < CFG.ROWS; y++) {
      for (let x = 0; x < CFG.COLS; x++) {
        if (state.grid[idx(x, y)] !== CELL.HARD) continue;
        const edge = x === 0 || y === 0 || x === CFG.COLS - 1 || y === CFG.ROWS - 1;
        (edge ? ringCells : pillarCells).push([x, y]);
      }
    }

    const box = new THREE.BoxGeometry(0.98, 1.0, 0.98);
    const cap = new THREE.BoxGeometry(1.0, 0.14, 1.0);
    const m = new THREE.Matrix4();
    // THE OUTER WALL IS ONE HEIGHT ALL THE WAY ROUND, and it has to stay that way.
    // A shorter front row was tried, to stop it burying anybody standing on the
    // front row: it is the one wall between the camera and the board, and seen
    // almost edge-on its lid becomes a wide band across the bottom of the arena.
    // It worked, and it looked wrong — the bottom row of the board read as a
    // separate piece that had dropped away from the rest, and ramping the side
    // walls down into it only turned one step into three. Reverted. The front-row
    // occlusion is a camera-and-block-height problem and wants a real answer (see
    // the changelog), not a wall that no longer matches itself.
    const addLattice = (cells, matBody, matTop) => {
      if (!cells.length) return;
      const inst = new THREE.InstancedMesh(box, matBody, cells.length);
      const instCap = new THREE.InstancedMesh(cap, matTop, cells.length);
      inst.castShadow = inst.receiveShadow = true;
      instCap.castShadow = instCap.receiveShadow = true;
      // Box/cap geometry is shared by the ring and pillar pairs. THREE's
      // dispose() is idempotent, so flagging both is safe.
      inst.userData.ownGeometry = instCap.userData.ownGeometry = true;
      cells.forEach(([x, y], i) => {
        m.makeTranslation(wx(x), 0.5, wz(y));
        inst.setMatrixAt(i, m);
        m.makeTranslation(wx(x), 1.02, wz(y));
        instCap.setMatrixAt(i, m);
      });
      inst.instanceMatrix.needsUpdate = true;
      instCap.instanceMatrix.needsUpdate = true;
      g.add(inst, instCap);
    };
    addLattice(ringCells, MAT.wall, MAT.wallTop);
    addLattice(pillarCells, MAT.hard, MAT.hardTop);

    // Soft crates — individual meshes so they can be destroyed one at a time
    const crateGeo = new THREE.BoxGeometry(0.92, 0.92, 0.92);
    for (let y = 0; y < CFG.ROWS; y++) {
      for (let x = 0; x < CFG.COLS; x++) {
        if (state.grid[idx(x, y)] !== CELL.SOFT) continue;
        const mesh = new THREE.Mesh(crateGeo, MAT.soft);
        mesh.position.set(wx(x), 0.46, wz(y));
        mesh.castShadow = mesh.receiveShadow = true;
        g.add(mesh);
        state.softMeshes.set(key(x, y), mesh);
      }
    }

    // Theme dressing, sat on the outer wall — decorative only, never collidable
    g.add(Props.build(state.level, wx, wz));
  }

  // ---- Queries used by gameplay ------------------------------------------
  function cellAt(x, y) {
    if (x < 0 || y < 0 || x >= CFG.COLS || y >= CFG.ROWS) return CELL.HARD;
    return state.grid[idx(x, y)];
  }
  function setCell(x, y, type) {
    if (x < 0 || y < 0 || x >= CFG.COLS || y >= CFG.ROWS) return;
    state.grid[idx(x, y)] = type;
  }
  function isSolid(x, y) { return cellAt(x, y) !== CELL.EMPTY; }

  /* ------------------------------------------------------- the heart hint -- */
  // A heart ON THE LID of the crate that hides the Extra Life. It goes up once
  // the round is genuinely under way (see the caller) — late enough that finding
  // it yourself is still the first thing that can happen.
  //
  // A FLAT DECAL, not a floating sprite. The bobbing sprite a metre in the air
  // was ambiguous about which crate it belonged to — from this camera a marker
  // above a block lines up with the block BEHIND it — and it read as a pick-up
  // you could walk into. Painted on the lid there is nothing to misread: that
  // crate, that heart. The crate is a 0.92 cube centred at y 0.46, so its lid is
  // at 0.92; the decal sits a hair above it and lies flat.
  const HEART_LID_Y = 0.932;
  function heartHint(on) {
    if (on && !state.heartHint) {
      const k = state.heartKey;
      if (!k) return;
      const [hx, hy] = k.split(',').map(Number);
      const tex = Icons.heartDecal();
      if (!tex) return;
      const s = new THREE.Mesh(
        new THREE.PlaneGeometry(0.68, 0.68),
        new THREE.MeshBasicMaterial({
          map: tex, transparent: true, depthWrite: false, toneMapped: false })
      );
      s.rotation.x = -Math.PI / 2;
      s.position.set(wx(hx), HEART_LID_Y, wz(hy));
      s.renderOrder = 20;                 // on the lid, never inside it
      state.group.add(s);
      state.heartHint = s;
    } else if (!on && state.heartHint) {
      const s = state.heartHint;
      state.group.remove(s);
      // The geometry is this marker's own, unlike the shared crate box — so it
      // is disposed with the material rather than left behind every round.
      if (s.geometry) s.geometry.dispose();
      if (s.material) s.material.dispose();
      state.heartHint = null;
    }
  }

  function destroySoft(x, y) {
    // The crate is coming apart, so the marker over it has nothing left to mark
    if (state.heartHint && key(x, y) === state.heartKey) heartHint(false);
    if (cellAt(x, y) !== CELL.SOFT) return null;
    state.grid[idx(x, y)] = CELL.EMPTY;
    const mesh = state.softMeshes.get(key(x, y));
    if (mesh) { state.group.remove(mesh); state.softMeshes.delete(key(x, y)); }
    const pu = state.hidden.get(key(x, y)) || null;
    state.hidden.delete(key(x, y));
    return pu;
  }

  // One ceiling, from config — accumulation must not outrun the per-blast cap.
  function addShake(amount) { state.shake = Math.min(state.shake + amount, CFG.SHAKE_MAX); }

  // Shake decays on the fixed simulation step, not the render frame, so it is
  // frame-rate independent, freezes correctly while paused, and is testable
  // headlessly. updateCamera only applies whatever the current value is.
  // THE LANDING MARKER for a thrown red bomb. Set with a tile, cleared with
  // null, and it is safe to call with the tile it is already on — the caller
  // reconciles it every step rather than trying to remember whether it is up.
  const MARK_Y = 0.035;
  function hazardMark(x, y) {
    const want = x == null ? null : key(x, y);
    if (state.hazardMarkKey === want) return;
    state.hazardMarkKey = want;
    if (want == null) {
      const m = state.hazardMark;
      if (m) {
        state.group.remove(m);
        if (m.geometry) m.geometry.dispose();
        if (m.material) m.material.dispose();
      }
      state.hazardMark = null;
      return;
    }
    if (!state.hazardMark) {
      const tex = Icons.targetDecal();
      if (!tex) { state.hazardMarkKey = null; return; }
      const m = new THREE.Mesh(
        new THREE.PlaneGeometry(0.96, 0.96),
        new THREE.MeshBasicMaterial({
          map: tex, transparent: true, depthWrite: false, toneMapped: false })
      );
      m.rotation.x = -Math.PI / 2;
      m.renderOrder = 21;
      state.group.add(m);
      state.hazardMark = m;
      state.hazardMarkT = 0;
    }
    state.hazardMark.position.set(wx(x), MARK_Y, wz(y));
  }

  function decayShake(dt) {
    state.shake = Math.max(0, state.shake - dt * 1.8);
    // The props on the outer wall rock on the same step, for the same reason:
    // frame-rate independent, frozen while paused, testable headlessly.
    if (typeof Props !== 'undefined' && Props.tick) Props.tick(dt);
    // The landing marker breathes on the same clock. It is a warning, and a
    // warning that sits perfectly still on a busy board is furniture.
    if (state.hazardMark) {
      state.hazardMarkT += dt;
      state.hazardMark.material.opacity =
        0.62 + 0.38 * (0.5 + 0.5 * Math.sin(state.hazardMarkT * 8.6));
    }
  }

  function updateCamera() {
    const s = state.shake;
    state.camera.position.set(
      state.camBase.x + (Math.random() - 0.5) * s,
      state.camBase.y + (Math.random() - 0.5) * s,
      state.camBase.z + (Math.random() - 0.5) * s
    );
    state.camera.lookAt(state.camTarget);
  }

  function render() { state.renderer.render(state.scene, state.camera); }

  return {
    init, buildArena, applyLevel, render, updateCamera, addShake, decayShake,
    fit: fitCamera,
    tintWalls,
    flashHearts, updateHeartFlash, clearHeartFlash,
    get heartFlash() { return state.heartFlash || 0; },
    get wallTint() { return state.wallTint === undefined ? null : state.wallTint; },
    // The board as a QUAD in screen pixels, not a bounding box. Perspective makes
    // the near edge far wider than the far one, so the box's bottom corners are
    // empty screen — which is exactly where the thumb controls live, and exactly
    // why every "is that control on the board" check written against the box has
    // reported an overlap that is not there.
    boardQuad(insetTiles) {
      const i = insetTiles || 0;
      const hx = (CFG.COLS / 2 - i) * CFG.TILE, hz = (CFG.ROWS / 2 - i) * CFG.TILE;
      const cam = state.camera;
      cam.updateMatrixWorld(true);
      return [[-hx, -hz], [hx, -hz], [hx, hz], [-hx, hz]].map(([x, z]) => {
        const v = new THREE.Vector3(x, 0, z).project(cam);
        return [(v.x * 0.5 + 0.5) * window.innerWidth,
                (-v.y * 0.5 + 0.5) * window.innerHeight];
      });
    },
    // Is a screen point on the board? Convex quad, cyclic order, one sign test.
    onBoard(px, py, insetTiles) {
      const q = this.boardQuad(insetTiles);
      let neg = false, pos = false;
      for (let i = 0; i < 4; i++) {
        const a = q[i], b = q[(i + 1) % 4];
        const cross = (b[0] - a[0]) * (py - a[1]) - (b[1] - a[1]) * (px - a[0]);
        if (cross < 0) neg = true; else if (cross > 0) pos = true;
        if (neg && pos) return false;
      }
      return true;
    },
    resize, setFraming, arenaScreenWidth, arenaScreenRect, arenaFarEdge, arenaNearEdge, onFit,
    cellAt, setCell, isSolid, destroySoft,
    get level() { return state.level; },
    get shake() { return state.shake; },
    // Counts the GRID, not the mesh map. The grid is the source of truth for
    // solidity (invariant 2) and the two can legitimately diverge.
    softCount() {
      if (!state.grid) return 0;
      let n = 0;
      for (let i = 0; i < state.grid.length; i++) if (state.grid[i] === CELL.SOFT) n++;
      return n;
    },
    _hidden: () => state.hidden,
    get heartKey() { return state.heartKey || null; },
    heartHint,
    get heartHintOn() { return !!state.heartHint; },
    get heartHintMesh() { return state.heartHint; },   // for the test suite
    ruleAt, beltAt, padTwin, hasRule,
    get rules() { return state.rules; },
    hazardMark,
    get hazardMarkMesh() { return state.hazardMark; },
    get hazardMarkKey() { return state.hazardMarkKey; },
    HEART_LID_Y,
    wx, wz, key, idx,
    get scene() { return state.scene; },
    get group() { return state.group; },
    get camera() { return state.camera; },
    get renderer() { return state.renderer; },
    MAT,
  };
})();


/* ==== 35-icons.js ================================================= */
/* ============================================================================
   SECTION 35 — POWER-UP ICONS
   Every collectable's face is drawn to a canvas at runtime. No image files,
   no emoji (which render differently on every OS) — just shapes.
   ========================================================================== */

const Icons = (function () {
  const cache = new Map();
  const S = 128;

  function roundRect(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  function hex(n) { return '#' + n.toString(16).padStart(6, '0'); }

  function shade(n, f) {
    const r = Math.min(255, Math.round(((n >> 16) & 255) * f));
    const g = Math.min(255, Math.round(((n >> 8) & 255) * f));
    const b = Math.min(255, Math.round((n & 255) * f));
    return `rgb(${r},${g},${b})`;
  }

  // ---- Individual glyphs, drawn white on the tile ------------------------
  const GLYPH = {
    // The four that actually drop are drawn large and unmistakable, each with
    // a "+" badge so it reads as an upgrade at a glance.
    [PU.BOMB](g) {
      g.beginPath(); g.arc(58, 78, 40, 0, Math.PI * 2); g.fill();
      g.lineWidth = 11; g.lineCap = 'round';
      g.beginPath(); g.moveTo(76, 44); g.quadraticCurveTo(92, 28, 84, 14); g.stroke();
      plus(g, 100, 30, 30);
    },
    [PU.FIRE](g) {
      flame(g, 56, 72, 1.15);
      plus(g, 100, 30, 30);
    },
    [PU.SPEED](g) {
      // A lightning bolt: reads as "fast" instantly, at any size, in any culture
      g.beginPath();
      g.moveTo(84, 6);
      g.lineTo(34, 70);
      g.lineTo(60, 70);
      g.lineTo(46, 122);
      g.lineTo(100, 54);
      g.lineTo(72, 54);
      g.closePath();
      g.fill();
    },
    [PU.SHIELD](g) {
      // A fat heart — the classic extra life
      g.beginPath();
      g.moveTo(64, 112);
      g.bezierCurveTo(0, 68, 18, 12, 64, 44);
      g.bezierCurveTo(110, 12, 128, 68, 64, 112);
      g.closePath(); g.fill();
    },
    [PU.FULLFIRE](g) {
      flame(g, 50, 70, 0.82);
      flame(g, 84, 62, 0.62);
      g.beginPath(); g.arc(96, 26, 7, 0, Math.PI * 2); g.fill();
    },
    [PU.KICK](g) {
      // A single clean side-on trainer, matching the one-symbol style of the
      // other drop icons. An earlier version added a bomb and motion lines and
      // just read as clutter.
      // Sole
      roundRect(g, 6, 86, 116, 21, 10); g.fill();
      // Upper: heel at the left, toe stretching to the right
      g.beginPath();
      g.moveTo(18, 88);
      g.lineTo(18, 46);
      g.quadraticCurveTo(18, 30, 36, 30);
      g.lineTo(52, 30);
      g.quadraticCurveTo(63, 30, 68, 44);
      g.lineTo(80, 70);
      g.quadraticCurveTo(90, 84, 112, 87);
      g.lineTo(112, 88);
      g.closePath();
      g.fill();
      // Laces cut out so the tile colour reads through
      g.save();
      g.globalCompositeOperation = 'destination-out';
      g.lineWidth = 8; g.lineCap = 'round';
      [[28, 44, 56, 44], [28, 58, 62, 58], [30, 72, 68, 72]].forEach(([x1, y1, x2, y2]) => {
        g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
      });
      g.restore();
    },
    [PU.PUNCH](g) {
      fist(g, 40);
      g.lineWidth = 8; g.lineCap = 'round';
      [46, 66, 86].forEach(y => { g.beginPath(); g.moveTo(14, y); g.lineTo(30, y); g.stroke(); });
    },
    [PU.GLOVE](g) {
      // mitten
      roundRect(g, 40, 44, 54, 66, 18); g.fill();
      roundRect(g, 20, 58, 26, 34, 13); g.fill();
      g.lineWidth = 8; g.lineCap = 'round';
      g.beginPath(); g.moveTo(67, 34); g.lineTo(67, 12); g.stroke();
      g.beginPath(); g.moveTo(52, 24); g.lineTo(67, 10); g.lineTo(82, 24); g.stroke();
    },
    [PU.REMOTE](g) {
      roundRect(g, 42, 46, 44, 68, 10); g.fill();
      g.lineWidth = 8; g.lineCap = 'round';
      g.beginPath(); g.moveTo(78, 46); g.lineTo(90, 20); g.stroke();
      g.globalCompositeOperation = 'destination-out';
      g.beginPath(); g.arc(64, 66, 10, 0, Math.PI * 2); g.fill();
      g.globalCompositeOperation = 'source-over';
      g.lineWidth = 6;
      [16, 26].forEach((r, i) => {
        g.beginPath(); g.arc(90, 18, r, -Math.PI * 0.85, -Math.PI * 0.15); g.stroke();
      });
    },
    [PU.PIERCE](g) {
      g.lineWidth = 10; g.lineCap = 'round';
      roundRect(g, 50, 42, 44, 44, 8); g.stroke();
      g.beginPath(); g.moveTo(12, 64); g.lineTo(112, 64); g.stroke();
      g.beginPath(); g.moveTo(92, 46); g.lineTo(114, 64); g.lineTo(92, 82); g.closePath(); g.fill();
    },
    [PU.BOMBPASS](g) {
      g.lineWidth = 9; g.setLineDash([14, 11]);
      g.beginPath(); g.arc(64, 72, 34, 0, Math.PI * 2); g.stroke();
      g.setLineDash([]);
      g.lineWidth = 8; g.lineCap = 'round';
      g.beginPath(); g.moveTo(78, 40); g.quadraticCurveTo(92, 26, 88, 14); g.stroke();
    },
    [PU.BLOCKPASS](g) {
      g.lineWidth = 9; g.setLineDash([13, 10]);
      roundRect(g, 34, 34, 60, 60, 8); g.stroke();
      g.setLineDash([]);
      g.lineWidth = 10; g.lineCap = 'round';
      g.beginPath(); g.moveTo(14, 64); g.lineTo(104, 64); g.stroke();
      g.beginPath(); g.moveTo(88, 48); g.lineTo(112, 64); g.lineTo(88, 80); g.closePath(); g.fill();
    },
    [PU.MINE](g) {
      g.beginPath();
      g.moveTo(24, 96); g.lineTo(40, 56); g.lineTo(88, 56); g.lineTo(104, 96);
      g.closePath(); g.fill();
      g.lineWidth = 9; g.lineCap = 'round';
      [[46, 34], [64, 26], [82, 34]].forEach(([x, y]) => {
        g.beginPath(); g.moveTo(x, 56); g.lineTo(x, y); g.stroke();
      });
    },
    [PU.SKULL](g) {
      g.beginPath(); g.arc(64, 56, 38, Math.PI, 0); g.rect(26, 56, 76, 30); g.fill();
      roundRect(g, 44, 84, 40, 22, 8); g.fill();
      g.globalCompositeOperation = 'destination-out';
      g.beginPath(); g.arc(48, 58, 13, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.arc(80, 58, 13, 0, Math.PI * 2); g.fill();
      g.fillRect(60, 86, 8, 20);
      g.globalCompositeOperation = 'source-over';
    },
  };

  function flame(g, cx, cy, s) {
    g.save();
    g.translate(cx, cy); g.scale(s, s);
    g.beginPath();
    g.moveTo(0, -54);
    g.bezierCurveTo(26, -26, 38, -8, 38, 12);
    g.bezierCurveTo(38, 38, 18, 52, 0, 52);
    g.bezierCurveTo(-18, 52, -38, 38, -38, 12);
    g.bezierCurveTo(-38, -6, -20, -18, -10, -34);
    g.bezierCurveTo(-6, -22, 2, -18, 6, -26);
    g.closePath();
    g.fill();
    g.restore();
  }

  // Bold "+" badge, with a dark halo so it reads on any tile colour
  function plus(g, cx, cy, size) {
    const t = size * 0.3, h = size / 2;
    g.save();
    g.strokeStyle = 'rgba(0,0,0,0.45)';
    g.lineWidth = t + 8; g.lineCap = 'round';
    g.beginPath(); g.moveTo(cx - h, cy); g.lineTo(cx + h, cy);
    g.moveTo(cx, cy - h); g.lineTo(cx, cy + h); g.stroke();
    g.strokeStyle = '#ffffff';
    g.lineWidth = t;
    g.beginPath(); g.moveTo(cx - h, cy); g.lineTo(cx + h, cy);
    g.moveTo(cx, cy - h); g.lineTo(cx, cy + h); g.stroke();
    g.restore();
  }

  function chevron(g, x, y, h) {
    g.lineWidth = 11; g.lineCap = 'round'; g.lineJoin = 'round';
    g.beginPath();
    g.moveTo(x - 13, y - h / 2);
    g.lineTo(x + 5, y);
    g.lineTo(x - 13, y + h / 2);
    g.stroke();
  }

  function boot(g) {
    g.beginPath();
    g.moveTo(30, 22);
    g.lineTo(62, 22);
    g.lineTo(62, 74);
    g.lineTo(84, 74);
    g.quadraticCurveTo(94, 74, 94, 88);
    g.lineTo(94, 100);
    g.lineTo(30, 100);
    g.closePath();
    g.fill();
  }

  function fist(g, x) {
    roundRect(g, x, 40, 62, 52, 16); g.fill();
    [0, 1, 2].forEach(i => {
      g.beginPath(); g.arc(x + 14 + i * 18, 40, 11, Math.PI, 0); g.fill();
    });
  }

  // ---- Public: a CanvasTexture for one power-up ---------------------------
  function texture(id) {
    if (cache.has(id)) return cache.get(id);
    const def = PU_TABLE.find(p => p.id === id) || PU_TABLE[0];

    const c = document.createElement('canvas');
    c.width = c.height = S;
    const g = c.getContext('2d');

    // Tile background: flat colour with a lighter top edge so it reads as 3D
    g.fillStyle = shade(def.color, 0.85);
    g.fillRect(0, 0, S, S);
    const grad = g.createLinearGradient(0, 0, 0, S);
    grad.addColorStop(0, shade(def.color, 1.25));
    grad.addColorStop(1, shade(def.color, 0.7));
    g.fillStyle = grad;
    roundRect(g, 6, 6, S - 12, S - 12, 18);
    g.fill();
    // A tile with an `outline` gets a real coloured border in place of the
    // white top edge. A near-black tile has nothing to catch a highlight, so
    // the usual 35% white rim just disappears and the icon loses its shape.
    if (def.outline) {
      g.strokeStyle = hex(def.outline);
      g.lineWidth = 9;
      roundRect(g, 10, 10, S - 20, S - 20, 15);
      g.stroke();
    } else {
      g.strokeStyle = 'rgba(255,255,255,0.35)';
      g.lineWidth = 4;
      roundRect(g, 8, 8, S - 16, S - 16, 16);
      g.stroke();
    }

    // Glyph, inset a little so it never touches the border
    g.save();
    g.translate(S / 2, S / 2);
    g.scale(0.84, 0.84);
    g.translate(-S / 2, -S / 2);
    g.fillStyle = '#ffffff';
    g.strokeStyle = '#ffffff';
    (GLYPH[id] || GLYPH[PU.BOMB])(g);
    g.restore();

    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = 4;
    cache.set(id, tex);
    return tex;
  }

  // A white heart on black, for use as an emissiveMap. Black emits nothing, so
  // only the heart lights up and the block underneath keeps its own colour and
  // texture. Same bezier path as the SHIELD glyph above, so the icon on the
  // pick-up and the heart on the wall are the same heart.
  let heartMaskTex = null;
  function heartMask() {
    if (heartMaskTex) return heartMaskTex;
    const c = document.createElement('canvas');
    c.width = c.height = S;
    const g = c.getContext('2d');
    g.fillStyle = '#000000';
    g.fillRect(0, 0, S, S);
    // Inset a little so the heart never bleeds off the edge of a block face
    g.save();
    g.translate(S / 2, S / 2); g.scale(0.78, 0.78); g.translate(-S / 2, -S / 2);
    g.fillStyle = '#ffffff';
    GLYPH[PU.SHIELD](g);
    g.restore();
    heartMaskTex = new THREE.CanvasTexture(c);
    heartMaskTex.colorSpace = THREE.SRGBColorSpace;
    return heartMaskTex;
  }

  // A pink heart on TRANSPARENT, for the decal that sits on the lid of the crate
  // hiding the Extra Life. Not the mask above: that one is white-on-black because
  // an emissiveMap needs black to mean "emit nothing", and painted flat on a
  // crate a black square is a black square. Same bezier path as the pick-up, so
  // the heart on the lid and the heart you collect are the same heart.
  let heartDecalTex = null;
  function heartDecal() {
    if (heartDecalTex) return heartDecalTex;
    const c = document.createElement('canvas');
    c.width = c.height = S;
    const g = c.getContext('2d');
    g.save();
    g.translate(S / 2, S / 2); g.scale(0.86, 0.86); g.translate(-S / 2, -S / 2);
    // A dark edge under the fill: on a pale crate a flat pink shape loses its
    // outline entirely, and this reads at any distance across the board.
    g.fillStyle = 'rgba(24, 6, 14, .55)';
    g.save(); g.translate(0, S * 0.035); GLYPH[PU.SHIELD](g); g.restore();
    g.fillStyle = '#ff4d6d';
    GLYPH[PU.SHIELD](g);
    g.restore();
    heartDecalTex = new THREE.CanvasTexture(c);
    heartDecalTex.colorSpace = THREE.SRGBColorSpace;
    return heartDecalTex;
  }

  // WHERE THE RED BOMB IS GOING TO LAND. An outline, not a filled square: the
  // tile underneath has to stay readable, because the whole point of the marker
  // is that you look at that tile and decide whether you are standing on it.
  // Corner brackets as well as the ring — at 36 pixels a tile a plain thin
  // rectangle reads as part of the floor grid, and a bracket does not.
  // A conveyor tile, drawn once and rotated per tile by the mesh. Chevrons
  // pointing the way it carries, on a dark plate with a bright lip — a belt you
  // cannot read is a floor that cheats.
  let beltDecalTex = null;
  function beltDecal() {
    if (beltDecalTex) return beltDecalTex;
    const c = document.createElement('canvas');
    c.width = c.height = S;
    const g = c.getContext('2d');
    g.fillStyle = 'rgba(24,26,32,0.92)';
    g.fillRect(0, 0, S, S);
    // Rails down the two edges the belt runs between
    g.fillStyle = '#ffd60a';
    g.fillRect(0, 0, S, S * 0.07);
    g.fillRect(0, S - S * 0.07, S, S * 0.07);
    // Three chevrons pointing +x, which is the texture's own direction; every
    // other direction is the same texture turned.
    g.strokeStyle = '#ffd60a';
    g.lineWidth = S * 0.085;
    g.lineCap = 'round';
    g.lineJoin = 'round';
    [0.24, 0.5, 0.76].forEach((cx, i) => {
      g.globalAlpha = 0.45 + i * 0.22;
      g.beginPath();
      g.moveTo(S * (cx - 0.11), S * 0.28);
      g.lineTo(S * (cx + 0.09), S * 0.5);
      g.lineTo(S * (cx - 0.11), S * 0.72);
      g.stroke();
    });
    g.globalAlpha = 1;
    beltDecalTex = new THREE.CanvasTexture(c);
    beltDecalTex.colorSpace = THREE.SRGBColorSpace;
    return beltDecalTex;
  }

  // A teleport pad: concentric rings on a dark disc, so it reads as a hole in
  // the floor rather than as a pick-up you can walk over and collect.
  let padDecalTex = null;
  function padDecal() {
    if (padDecalTex) return padDecalTex;
    const c = document.createElement('canvas');
    c.width = c.height = S;
    const g = c.getContext('2d');
    const cx = S / 2;
    const grd = g.createRadialGradient(cx, cx, S * 0.05, cx, cx, S * 0.48);
    grd.addColorStop(0, 'rgba(190,255,255,0.95)');
    grd.addColorStop(0.55, 'rgba(60,200,235,0.55)');
    grd.addColorStop(1, 'rgba(20,40,70,0)');
    g.fillStyle = grd;
    g.beginPath(); g.arc(cx, cx, S * 0.48, 0, Math.PI * 2); g.fill();
    g.strokeStyle = '#6ef0ff';
    [0.44, 0.31, 0.18].forEach((r, i) => {
      g.lineWidth = S * (0.05 - i * 0.008);
      g.globalAlpha = 0.9 - i * 0.18;
      g.beginPath(); g.arc(cx, cx, S * r, 0, Math.PI * 2); g.stroke();
    });
    g.globalAlpha = 1;
    padDecalTex = new THREE.CanvasTexture(c);
    padDecalTex.colorSpace = THREE.SRGBColorSpace;
    return padDecalTex;
  }

  let targetDecalTex = null;
  function targetDecal() {
    if (targetDecalTex) return targetDecalTex;
    const c = document.createElement('canvas');
    c.width = c.height = S;
    const g = c.getContext('2d');
    const m = S * 0.10, w = S - m * 2;
    // A dark backing stroke under the red one, so the marker holds its shape on
    // a red-ish floor as well as on a pale one.
    g.lineJoin = 'round';
    g.strokeStyle = 'rgba(20, 4, 4, .75)';
    g.lineWidth = S * 0.13;
    g.strokeRect(m, m, w, w);
    g.strokeStyle = '#ff2d2d';
    g.lineWidth = S * 0.075;
    g.strokeRect(m, m, w, w);
    // Brackets, brighter than the ring, one at each corner
    g.strokeStyle = '#ffd0d0';
    g.lineWidth = S * 0.06;
    const k = w * 0.26;
    [[m, m, 1, 1], [S - m, m, -1, 1], [m, S - m, 1, -1], [S - m, S - m, -1, -1]]
      .forEach(([x, y, sx, sy]) => {
        g.beginPath();
        g.moveTo(x + sx * k, y);
        g.lineTo(x, y);
        g.lineTo(x, y + sy * k);
        g.stroke();
      });
    targetDecalTex = new THREE.CanvasTexture(c);
    targetDecalTex.colorSpace = THREE.SRGBColorSpace;
    return targetDecalTex;
  }

  // The same artwork as a data URL, so the HUD can show the real icon rather
  // than a letter standing in for it.
  const urls = new Map();
  function dataURL(id) {
    if (urls.has(id)) return urls.get(id);
    const tex = texture(id);
    const url = tex.image.toDataURL('image/png');
    urls.set(id, url);
    return url;
  }

  return { texture, dataURL, heartMask, heartDecal, beltDecal, padDecal, targetDecal, hex };
})();


/* ==== 37-props.js ================================================= */
/* ============================================================================
   SECTION 37 — THEME PROPS
   A couple of decorative objects per level, sat on top of the outer wall so
   they dress the arena without ever touching gameplay. Pure geometry, built
   fresh each round with the rest of the arena group.
   ========================================================================== */

const Props = (function () {
  const mat = (c, o) => new THREE.MeshStandardMaterial(
    Object.assign({ color: c, roughness: 0.6, metalness: 0.05 }, o || {}));

  // Each builder returns a Group standing on y = 0, facing +Z
  const BUILD = {
    // ---- Forest ----------------------------------------------------------
    pine(g) {
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.12, 0.36, 8), mat(0x6b4423));
      trunk.position.y = 0.18;
      g.add(trunk);
      [[0.42, 0.5, 0.36], [0.33, 0.42, 0.66], [0.22, 0.34, 0.92]].forEach(([r, h, y]) => {
        const tier = new THREE.Mesh(new THREE.ConeGeometry(r, h, 9), mat(0x2f7d3a));
        tier.position.y = y;
        tier.castShadow = true;
        g.add(tier);
      });
    },
    toadstool(g) {
      const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.14, 0.34, 10), mat(0xf2e6cf));
      stem.position.y = 0.17;
      g.add(stem);
      const cap = new THREE.Mesh(
        new THREE.SphereGeometry(0.3, 16, 10, 0, Math.PI * 2, 0, Math.PI * 0.5), mat(0xd8352a));
      cap.scale.y = 0.75;
      cap.position.y = 0.32;
      cap.castShadow = true;
      g.add(cap);
      [[0.12, 0.1], [-0.14, -0.06], [0.02, -0.16]].forEach(([x, z]) => {
        const spot = new THREE.Mesh(new THREE.SphereGeometry(0.055, 8, 6), mat(0xfff4e6));
        spot.scale.set(1, 0.4, 1);
        spot.position.set(x, 0.46, z);
        g.add(spot);
      });
    },

    // ---- Beach -----------------------------------------------------------
    beachball(g) {
      const ball = new THREE.Mesh(new THREE.SphereGeometry(0.33, 20, 14), mat(0xfdfdfd, { roughness: 0.35 }));
      ball.position.y = 0.33;
      ball.castShadow = true;
      g.add(ball);
      // Coloured segments, drawn as thin sphere wedges over the white ball
      [[0xe23b3b, 0], [0x2f7fd8, 1], [0xffd23f, 2], [0x35b76a, 3]].forEach(([c, i]) => {
        const seg = new THREE.Mesh(
          new THREE.SphereGeometry(0.335, 16, 12, i * Math.PI / 2, Math.PI / 3.4), mat(c, { roughness: 0.35 }));
        seg.position.y = 0.33;
        g.add(seg);
      });
    },
    parasol(g) {
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 1.0, 8), mat(0xf0e4d0));
      pole.position.y = 0.5;
      g.add(pole);
      // STRIPED, and every stripe a saturated colour. One flat muted orange was
      // the dullest thing on any map. Six wedges of a 12-segment cone, alternating
      // around the canopy — cheap, and it reads as a beach parasol from the far
      // side of the board rather than as a traffic cone.
      const STRIPES = [0xff2d6f, 0xffd60a, 0x00d1c1, 0xff7a00, 0x7c4dff, 0x2bd94a];
      for (let i = 0; i < 6; i++) {
        const wedge = new THREE.Mesh(
          new THREE.ConeGeometry(0.58, 0.32, 12, 1, true, (i / 6) * Math.PI * 2, Math.PI / 3),
          mat(STRIPES[i], { side: THREE.DoubleSide, roughness: 0.42 }));
        wedge.position.y = 0.98;
        wedge.castShadow = true;
        g.add(wedge);
      }
      const trim = new THREE.Mesh(new THREE.TorusGeometry(0.57, 0.03, 6, 18), mat(0xffffff));
      trim.position.y = 0.855;
      trim.rotation.x = Math.PI / 2;
      g.add(trim);
      const finial = new THREE.Mesh(new THREE.SphereGeometry(0.055, 10, 8), mat(0xffd60a));
      finial.position.y = 1.14;
      g.add(finial);
    },

    // ---- Glacier ---------------------------------------------------------
    // ONE OF THEM IS NOT FRIENDLY. `angry` turns him red and he starts lobbing
    // bombs onto the board (see Game.updateHazard) — the arena itself joins in
    // rather than being scenery you stop noticing after two rounds.
    snowman(g, angry) {
      const body = angry ? 0xe03024 : 0xf2f8ff;
      [[0.3, 0.3], [0.22, 0.72], [0.16, 1.02]].forEach(([r, y]) => {
        const ball = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), mat(body, { roughness: 0.5 }));
        ball.position.y = y;
        ball.castShadow = true;
        g.add(ball);
      });
      const nose = new THREE.Mesh(new THREE.ConeGeometry(0.045, 0.2, 8), mat(0xff8c2b));
      nose.position.set(0, 1.03, 0.2);
      nose.rotation.x = Math.PI / 2;
      g.add(nose);
