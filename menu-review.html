<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="build" content="pirate-tides-r1-20260912"><title>Bomberfan menu review</title><style>
  :root {
    --ink: #0d111c;
    --panel: rgba(13, 17, 28, 0.86);
    --edge: rgba(255, 255, 255, 0.14);
    --hi: #ffd166;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0b0f18; color: #fff; font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    user-select: none; -webkit-user-select: none;
    /* No panning, no pinch, no double-tap zoom. Every one of those makes the
       browser wait to see what the gesture becomes before delivering it. */
    touch-action: none; overscroll-behavior: none;
  }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  #ui { position: fixed; inset: 0; pointer-events: none; }
  .hidden { display: none !important; }
  .dim { opacity: 0.6; }

  /* ------------------------------------------------------------- HUD --- */
  /* ONE ROW, ACROSS THE TOP — all four cards side by side, above the board, on
     every screen.
     A column down the left read well but it was the wrong shape for this board.
     The arena is a projected diamond: it is WIDEST at the bottom of the screen
     and narrowest along its far edge at the top, and the camera fit grows it
     until something is in the way. A column is in the way down the whole height
     of the screen, right where the board is widest, so every pixel of column
     width cost the board width it could not spare on a phone. A strip is only in
     the way across the top, where the board is a narrow far edge and there is
     already dead screen either side of it.
     The strip is anchored to the top and CENTRED over the board, sized by its
     contents, and its height is the only thing it costs — which is why every
     card in it is kept to one or two short lines. */
  #hud { position: absolute; inset: 0; }
  #hud .side {
    /* FULL WIDTH, contents centred — NOT `left: 50%` plus a transform. An
       absolutely positioned box with `left: 50%` and no `right` may only be as
       wide as the half it starts in, so a shrink-to-fit strip silently capped
       itself at half the screen and wrapped four cards into three lines. Spanning
       the width and centring the CARDS inside it has no such limit, and costs
       nothing: the camera is handed the cards' own box, not this container's. */
    position: absolute; top: 16px; left: 0; right: 0; box-sizing: border-box;
    display: flex; flex-direction: row; align-items: stretch;
    justify-content: center; flex-wrap: wrap;
    /* As a column the WIDTH was the thing to bound (the 272 -> 208 -> 156
       history); as a strip it is the HEIGHT, and that is bounded by keeping each
       card to a single line rather than by a number. */
    gap: 8px; padding: 0 16px;
  }
  #hud #cards-left  { }
  /* Empty now — every seat goes in the one strip. Kept in the DOM because the
     layout code, the camera reserve and the test suite all still ask for it by
     id, and an element that exists and holds nothing is cheaper than four places
     that have to remember it might be missing. */
  #hud #cards-right { width: 0; height: 0; overflow: hidden; }

  /* A FULL EDGE in the seat colour, all the way round. It used to be a fat bar
     down one side plus a coloured square inside — two things saying the same
     thing, and the square ate the width the pick-up list now uses. One ring
     reads faster and from further away. */
  .card {
    display: flex; align-items: center; gap: 13px;
    background: rgba(8,12,22,0.80);
    border: 2px solid var(--c);
    border-radius: 13px;
    /* ONE LINE, so the padding came down with the contents. A card is a name
       and a score now; the depth of this strip is what the board pays for, and
       8px of padding round a single line of text is a card pretending to still
       hold something. */
    padding: 4px 11px;
    /* NEITHER STRETCHED NOR SQUEEZED. In a row, `width: 100%` made every card
       demand the whole strip and flex then shrank them all to a quarter each
       whatever they held; `flex: 0 0 auto` lets each card be exactly as wide as
       its own contents, which is what makes a loaded player's card wider than an
       empty one instead of everybody's text being clipped. */
    flex: 0 0 auto;
    backdrop-filter: blur(5px);
    box-shadow: 0 0 0 1px rgba(0,0,0,.6), 0 10px 30px rgba(0,0,0,.55),
                0 0 22px -6px var(--c), inset 0 0 26px -14px var(--c);
    transition: opacity .25s, filter .25s;
  }
  .card.dead { opacity: 0.32; filter: grayscale(1); }
  .card .info { flex: 1; min-width: 0; }
  .card .name { font-size: 20px; font-weight: 800; letter-spacing: .3px; display: flex; gap: 8px; align-items: baseline; }
  .card .name .tagme { font-size: 12px; font-weight: 700; opacity: .55; letter-spacing: 1px; }

  /* PICK-UPS IN A ROW, under the name. They were one per line while the card
     lived in a column and height was free; in a strip across the top height is
     the whole cost, and a stacked list of six would push the board down the
     screen by an inch. Two short lines — name, then artwork — is the shape that
     fits, and the artwork alone says what each one is. */
  .card .pu {
    display: flex; flex-direction: row; flex-wrap: wrap;
    gap: 3px 7px; margin-top: 4px; align-items: center;
  }
  .card .abils { display: flex; flex-direction: row; flex-wrap: wrap; gap: 3px 7px; align-items: center; }
  .card .stat { display: flex; align-items: center; gap: 8px; }
  .card .stat.hidden { display: none; }
  .card .stat .si {
    width: 24px; height: 24px; border-radius: 6px; display: block; flex: none;
    box-shadow: 0 2px 6px rgba(0,0,0,.45);
  }
  .card .stat b {
    font-size: 17px; font-weight: 900; font-variant-numeric: tabular-nums;
    letter-spacing: .3px;
  }
  /* NO WORDS ON THE ABILITY ROWS. The label was the widest thing on the card by
     a distance, and it was describing artwork that already says what it is —
     these are the same tiles you picked up off the floor thirty seconds ago.
     The title attribute keeps the name for a hover. */
  .card .stat.ab b, .card .stat.cz b { display: none; }
  /* Rounds won, as a figure. It was a row of filled and hollow circles sitting
     between the bomb count and the abilities, which read as another pick-up. */
  .card .wins {
    font-size: 11px; font-weight: 900; letter-spacing: 1.4px;
    color: var(--hi); opacity: .9; margin-left: auto;
    font-variant-numeric: tabular-nums;
  }
  .card.cursed { border-color: #7bd83a; box-shadow: 0 0 18px rgba(123,216,58,.45); }

  /* Off the very top edge: flush against it the digits read as browser chrome
     rather than as part of the game, and on a phone they sit under the notch. */
  #clock {
    position: absolute; top: 26px; left: 50%; transform: translateX(-50%);
    text-align: center;
  }
  /* NO ROUND CLOCK. There used to be a big white 2:00 counting down here and it
     answered a question nobody asks: the round does not end on the clock in any
     way you can play around, and the one piece of timing that matters — sudden
     death is coming, then it is here — is already told twice, by the scrolling
     band along the back edge and by the skulls that take this space.
     #clock survives as the anchor for those skulls, and it is an empty box for
     most of a round, which is why hudReserveTop measures it rather than assuming
     a height. */
  @keyframes pulse { 50% { opacity: .45; } }

  /* THE START COUNTDOWN. Blood-red and black, and the ONLY timer on screen while it
     runs — the round clock is hidden underneath it (#hud.counting #clock), so
     there is one number to look at instead of two competing for the same
     second. The rainbow is a gradient clipped to the glyph and slid sideways,
     which is why the fill has to be transparent: text-fill-color transparent
     with background-clip: text means the letterform is the window. */
  #count {
    position: absolute; left: 50%; top: 46%; z-index: 3;
    transform: translate(-50%, -50%);
    font-family:Impact,'Arial Black',sans-serif; font-size: clamp(96px, 21vw, 250px); font-weight: 900; line-height: .9;
    letter-spacing: 4px; pointer-events: none; white-space: nowrap;
    background: linear-gradient(180deg,#ff554c 8%,#bf081c 46%,#210007 94%);
    -webkit-background-clip:text; background-clip:text;
    color:transparent; -webkit-text-fill-color:transparent;
    -webkit-text-stroke:2px #140006;
    filter:drop-shadow(0 5px 0 #000) drop-shadow(0 0 22px #a4001a);
  }
  #count.hidden, #level-intro.hidden { display:none; }
  #count.pop { animation:cpop .42s cubic-bezier(.2,1.3,.35,1) both; }
  #count.pop.last { animation:cpop .35s ease-out both, cfade .5s .75s ease-in forwards; }
  @keyframes cpop {
    from { transform:translate(-50%,-50%) scale(1.35); opacity:0; }
    to { transform:translate(-50%,-50%) scale(1); opacity:1; }
  }
  @keyframes cfade { to { opacity:0; transform:translate(-50%,-50%) scale(1.14); filter:blur(7px); } }
  #level-intro {
    position:absolute;top:clamp(54px,13vh,145px);left:5%;width:90%;z-index:13;
    pointer-events:none;text-align:center;text-transform:uppercase;
    font:1000 clamp(28px,5.5vw,78px)/1.05 Impact,'Arial Black',sans-serif;
    letter-spacing:.09em;color:#ec263b;-webkit-text-stroke:1px #100006;
    text-shadow:0 4px 0 #000,0 0 25px #740016;
  }
  #hud.counting #clock { visibility:hidden; }
  @media (prefers-reduced-motion:reduce) {
    #count.pop { animation:none; }
    #count.pop.last { animation:count-opacity .5s .75s linear forwards; }
    @keyframes count-opacity { to { opacity:0; } }
  }

  /* Narrow windows: shrink the cards rather than let the strip run off the
     screen. No widths here any more — the strip is sized by its contents, so the
     only lever is how big the contents are. */
  @media (max-width: 900px) {
    #hud .side { gap: 6px; }
    .card { padding: 6px 9px; gap: 8px; border-radius: 12px; }
    .card .name { font-size: 15px; }
    .card .stat .si { width: 18px; height: 18px; }
    .card .stat b { font-size: 14px; }
    .card .stat.ab b { font-size: 10px; letter-spacing: 1px; }
  }
  @media (min-width: 901px) and (max-width: 1400px) {
    .card .name { font-size: 17px; }
    .card .stat .si { width: 21px; height: 21px; }
    .card .stat b { font-size: 15px; }
    .card .stat.ab b { font-size: 11px; }
  }

  /* --------------------------------------------------------- banners --- */
  /* ONE TIMER. The round clock freezes when the walls start closing and a ROW OF
     SIX SKULLS takes the digits' place — there is nothing left to count, and a
     second countdown in the corner was the same information twice.

     Six rather than one because the row fills the space the digits gave up, and
     a single glyph pulsing on its own read as a loading spinner. Each skull owns
     a different shade of red (--sk) and flashes to a second shade (--sk2) three
     places along the row, so the flash never lands on the colour beside it. The
     delay is staggered by index, which makes it travel left to right instead of
     the whole row blinking at once. */
  #tskulls { display: none; justify-content: center; align-items: center; gap: 7px; }
  #clock.sd #tskulls { display: flex; }
  .tsk {
    width: 32px; height: 32px; color: var(--sk); flex: none;
    filter: drop-shadow(0 0 7px rgba(255, 40, 30, .55));
    animation: sdflash 1.08s steps(1, end) infinite;
    animation-delay: calc(var(--i) * .09s);
  }
  /* steps(1, end) means these are swaps, not fades — no interpolation of a
     custom property is needed, which is what would otherwise make this fail. */
  @keyframes sdflash {
    0%, 46%   { color: var(--sk);  opacity: 1; }
    47%, 100% { color: var(--sk2); opacity: .3; }
  }
  body.compact #tskulls { gap: 4px; }
  body.compact .tsk { width: 19px; height: 19px; }
  @media (prefers-reduced-motion: reduce) {
    .tsk { animation-duration: 3.2s; }
  }

  /* SUDDEN DEATH runs along the EDGE OF THE BOARD, scrolling right to left.
     Positioned from the arena's own projected rectangle (UI.placeSdBand) rather
     than from the viewport, so it sits on the front wall at any window size —
     and it does not cover a single playable tile, which a slab of centred text
     across the middle of the arena always did. */
  #sdband, #sdband2 {
    position: absolute; overflow: hidden; pointer-events: none;
    display: flex; align-items: center;
    background: linear-gradient(180deg, rgba(120,8,8,.0), rgba(150,10,10,.72) 45%, rgba(120,8,8,.0));
    border-top: 1px solid rgba(255,91,82,.45);
    border-bottom: 1px solid rgba(255,91,82,.45);
  }
  #sdband .sdtrack, #sdband2 .sdtrack {
    display: flex; white-space: nowrap; will-change: transform;
    animation: sdscroll 9s linear infinite;
  }
  #sdband .sdtrack span, #sdband2 .sdtrack span {
    font-weight: 900; letter-spacing: .28em; color: #ffdedb;
    text-shadow: 0 0 14px rgba(255,60,50,.9), 0 2px 0 rgba(0,0,0,.6);
    padding-right: 2.4em;
  }
  /* THE COUNTDOWN TO SUDDEN DEATH, on the arena's own front edge.
     The far edge carries the words and the near edge carries the number, so the
     two halves of the same warning are not fighting for one strip. It is on the
     board rather than in a HUD corner because it is a fact about the ARENA — the
     walls are about to close — and because the near edge is the one part of the
     screen the camera guarantees is empty. */
  #sdcount {
    position: absolute; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
  }
  /* EVIL RED. It was near-white with a red glow behind it, which reads as a
     scoreboard. The glyph ITSELF is the hot colour now, sunk into a dark red
     bloom with a hard black edge under it so it still holds its shape against
     the wall it is written on — and it flickers, slightly and irregularly, like
     something about to fail. */
  #sdcount b {
    font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums;
    color: #ff2216;
    -webkit-text-stroke: .05em #2b0000;
    text-shadow: 0 0 6px rgba(255,40,20,1), 0 0 18px rgba(220,0,0,.95),
                 0 0 40px rgba(150,0,0,.8), 0 2px 0 rgba(0,0,0,.85);
    animation: sdtick .96s ease-out infinite, sdevil 1.7s steps(1, end) infinite;
  }
  /* Irregular on purpose: a regular blink reads as a cursor. */
  @keyframes sdevil {
    0%, 41%, 47%, 63%, 100% { filter: brightness(1); }
    43%   { filter: brightness(1.55); }
    64%   { filter: brightness(.72); }
    66%   { filter: brightness(1.3); }
  }
  /* A pulse per second, keyed off the digit changing rather than left running:
     re-adding the class restarts it, so the beat lands ON the number changing
     instead of drifting a little further out of step with every second. */
  @keyframes sdtick {
    0%   { transform: scale(1.28); opacity: 1; }
    22%  { transform: scale(1);    opacity: 1; }
    100% { transform: scale(1);    opacity: .82; }
  }
  @media (prefers-reduced-motion: reduce) {
    #sdcount b { animation: none; }
  }

  /* The track holds the phrase twice, so -50% is a seamless loop */
  @keyframes sdscroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) {
    #sdband .sdtrack, #sdband2 .sdtrack { animation-duration: 26s; }
  }

  /* THE WINNER LINE FIRST, THE PRIZE UNDER IT. Both were inline, so they sat
     side by side on one row and the prize competed with the name for the same
     glance. A column puts the result first and the reward second, which is the
     order they happen in. */
  #banner {
    position: absolute; left: 0; right: 0; top: 34%;
    display: flex; flex-direction: column; align-items: center; gap: .34em;
    text-align: center; font-size: clamp(34px, 7vw, 84px);
    font-weight: 900; letter-spacing: 3px;
    text-shadow: 0 6px 0 rgba(0,0,0,.5), 0 0 40px rgba(0,0,0,.6);
  }
  /* Round result: the map edge carries the winner's colour, so the text can
     step back and stop covering the arena. It sits on a dark plate because the
     text is the winner's colour and the wall behind it now is too — without the
     plate the two match exactly and the words vanish. */
  #banner.small {
    top: auto; bottom: 4%;          /* below the arena, so it covers nothing */
    font-size: clamp(18px, 2.9vw, 38px); letter-spacing: .11em;
    text-shadow: none;
    padding: 0 12px;
  }
  #banner.small span {
    background: rgba(4, 7, 13, 0.92);
    border: 2px solid currentColor;
    border-radius: 999px;
    padding: .34em 1.05em .38em;
    box-shadow: 0 0 26px rgba(0,0,0,.75), 0 0 22px -6px currentColor;
    max-width: 92vw;
    /* currentColor is the winner's colour, so the ring and glow identify them
       while the near-black fill guarantees the letters stay legible. */
    text-shadow: 0 2px 0 rgba(0,0,0,.6);
  }
  /* The victory line comes FIRST and any won prize sits BELOW it: you read who
     won, then what they got. Plain `column` puts the first child (the line) on
     top; the banner is anchored by its bottom edge, so the pair grows upwards
     into free space rather than off the bottom of the screen. */
  #banner.small { display: flex; flex-direction: column; align-items: center; gap: 7px; }
  #prize {
    font-style: normal; font-weight: 800;
    font-size: clamp(11px, 1.5vw, 17px); letter-spacing: .16em;
    color: #ffd166;
    background: rgba(4, 7, 13, 0.9);
    border: 2px dashed rgba(255, 209, 102, .75);
    border-radius: 999px;
    padding: .3em 1em .34em;
    box-shadow: 0 0 20px rgba(255, 209, 102, .28);
    max-width: 92vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #prize.hidden { display: none; }
  #banner.pop span { display: inline-block; animation: pop .4s cubic-bezier(.2,1.6,.4,1); }
  #banner.pop #prize { animation: pop .5s .12s backwards cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { 0% { transform: scale(.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

  /* Full-screen winner celebration. The 3D character is rendered directly to
     the canvas underneath this transparent type layer. */
  #victory {
    position: absolute; inset: 0; z-index: 14; pointer-events: none;
    display: flex; flex-direction: column; align-items: center;
    justify-content: space-between; text-align: center;
    padding: clamp(22px, 4vh, 48px) 18px clamp(24px, 5vh, 56px);
    overflow: hidden;
  }
  #victory.hidden { display: none; }
  #victory .vtitle {
    color: rgba(255,248,233,.72);
    font: 900 clamp(11px, 1.4vw, 18px)/1 system-ui, sans-serif;
    letter-spacing: clamp(4px, .9vw, 10px);
    text-transform: uppercase;
    text-shadow: 0 2px 8px #000;
  }
  #victory .vbottom { width: min(92vw, 900px); }
  #victory .vname {
    color: #fff8e9;
    font: 1000 clamp(42px, 8vw, 104px)/.88 'Arial Black', Impact, system-ui, sans-serif;
    letter-spacing: clamp(3px, .7vw, 10px);
    text-transform: uppercase;
    -webkit-text-stroke: 1px rgba(0,0,0,.5);
    text-shadow: 0 6px 0 rgba(0,0,0,.7), 0 0 28px var(--winner), 0 0 70px var(--winner);
  }
  #victory .vline {
    display: inline-block; margin-top: 12px;
    padding: .45em 1.15em .5em;
    border: 1px solid color-mix(in srgb, var(--winner) 72%, white);
    border-radius: 999px;
    background: rgba(5,7,11,.76);
    color: #fff5e5;
    font: 900 clamp(12px, 1.7vw, 22px)/1.1 system-ui, sans-serif;
    letter-spacing: clamp(1px, .25vw, 4px);
    text-transform: uppercase;
    box-shadow: 0 0 30px color-mix(in srgb, var(--winner) 38%, transparent);
  }
  @media (max-width: 719px) {
    #victory { padding-top: 18px; padding-bottom: 30px; }
    #victory .vname { font-size: clamp(38px, 13vw, 64px); }
    #victory .vline { max-width: 94vw; }
  }

  /* ------------------------------------------------- touch controls --- */
  /* Safe-area insets keep the stick, bomb button and pause clear of the notch
     and the home indicator on phones. */
  /* ANCHORED TO THE VISUAL VIEWPORT, not the layout one.
     CHROME ON ANDROID and Safari on iOS both lay a `position: fixed` box out
     against the LAYOUT viewport, which is taller than what you can actually see
     while the URL bar is up — and on Android that bar hides and shows as you
     play. So `bottom: 30px` is 30px above the bottom of a box whose bottom is
     underneath the bar: the stick renders lower than it looks, and there is no
     reachable screen beneath it to drag DOWN into. Pulling UP from a thumb
     already resting at the bottom edge lands on the bar rather than the page, so
     that fails too, while left and right keep working along the strip that IS
     reachable. Exactly the symptom: "I cannot move up and down at all."
     --vvh is written from window.visualViewport (see UI.syncViewport). */
  #touch {
    position: absolute; left: 0; right: 0; top: 0;
    height: var(--vvh, 100%);
    pointer-events: none;
  }

  /* The grab zone: touching anywhere in the lower-left drives the stick, so
     there is nothing to aim at. Invisible, and the arena under it is not
     interactive, so it costs nothing. */
  #tzone, #tbombzone, #tspecialzone {
    /* Stops 40px short of the bottom edge on purpose: a drag that STARTS in
       Android's home-gesture strip is the OS's, not ours, and accepting it there
       only teaches the thumb to rest somewhere that does not work. */
    position: absolute; bottom: 40px; top: 22%;
    touch-action: none; -webkit-tap-highlight-color: transparent;
  }
  #tzone { left: 0; width: 46%; }
  /* The bomb zone mirrors it. A round button is a small target to hit under
     pressure, and a press that misses its edge does nothing — so the whole
     lower-right drops a bomb and the button is just the picture. */
  #tbombzone { right: 0; width: 40%; }
  /* The special button's own grab zone, carved out of the LEFT of the bomb
     zone rather than laid on top of it: two zones that overlap means one of
     them silently wins every press, and which one is a source-order accident. */
  /* THE RIGHT-HAND 40% IS SPLIT, not overlaid, and only when there are two
     buttons in it. With no special power the bomb zone keeps the whole 40% and
     there is still nothing to aim at. With one, the split falls between the two
     buttons: the bomb keeps the outer 12% it sits in and the special takes the
     28% inboard of it. Each button is inside its own zone, which is the bit the
     first attempt got wrong — the button sat over the bomb zone and every press
     on it dropped a bomb instead.
     Overlapping the two would be worse than either: where grab zones overlap,
     one silently wins every press and which one is an accident of source order. */
  /* The split is measured in the SAME units the buttons are placed in, not in a
     percentage of the screen. A percentage is a different number of pixels on
     every phone, and the first attempt put the bomb button's own left edge on
     the wrong side of it — pressing the edge of the bomb key fired the special. */
  #touch { --split: calc(var(--ctl, 152px) + 34px); }
  #tspecialzone { right: var(--split); width: 26%; }
  #tbombzone.narrow { width: var(--split); }

  /* The controls belong to a live round. Left up on the menu or the results
     screen these zones cover the buttons and swallow the taps. */
  #touch.off, #tpause.off, #tctl.off { display: none !important; }
  #tstick, #tbomb {
    /* Lifted clear of the bottom edge. Sitting flush against it, the outer
       ring of the stick and the lower arc of the bomb key ran off the screen on
       a phone with rounded corners, and a thumb resting at the very bottom of
       the glass is an awkward place to hold. */
    /* WELL CLEAR OF THE SYSTEM GESTURE ZONES. On an Android phone with gesture
       navigation the bottom ~48px of the glass is the swipe-up-for-Home strip and
       the left and right ~24px are the back gesture. A touch that starts in any of
       them belongs to the OS, and Chrome never sees the move — which is why a
       DOWNWARD drag from a low stick does nothing and an UPWARD one from a thumb
       resting near the bottom edge sends you to the home screen instead. Left and
       right survive because they run along the middle of the glass.
       env(safe-area-inset-*) does NOT report these on Android, so the clearance
       has to be real pixels rather than an inset. */
    position: absolute; bottom: calc(74px + env(safe-area-inset-bottom, 0px));
    touch-action: none; -webkit-tap-highlight-color: transparent;
  }
  /* Only these two take input. The pad is PURELY VISUAL — the zone beneath it
     handles every event, so the pad must never win a hit test. Stated here,
     once, rather than as an override later in the file: an earlier attempt put
     `#tstick { pointer-events: none }` above the shared rule above, lost on
     source order, and silently swallowed every touch. */
  #tzone, #tbombzone, #tspecialzone { pointer-events: auto; }
  #tbomb, #tspecial { pointer-events: none; }   /* visual only, like the pad */
  #tspecial.off, #tspecialzone.off { display: none !important; }
  /* A FOUR-WAY PAD, NOT AN ANALOGUE STICK.
     It was a stick you dragged: the direction came from how far your thumb had
     travelled since it went down. Two things kill that on a phone and both of
     them kill the VERTICAL axis first. A drag has to be delivered as a stream of
     pointermove events, and a vertical swipe is the gesture a browser and an
     Android launcher both want for themselves — so the moves get eaten and your
     thumb slides up and down a pad that never hears about it, while left and
     right, which nothing else wants, carry on working.
     A pad does not need the moves. The direction is WHERE YOU ARE PRESSING,
     measured from the middle of the pad, so the very first pointerdown already
     says "up" and every later event only refines it. Nothing to drag, nothing to
     steal, and it suits a game played on a grid better than an analogue stick
     ever did. */
  #tstick { pointer-events: none; }
  #tstick {
    left: calc(20px + env(safe-area-inset-left, 0px));
    /* --ctl is MEASURED against the board by UI.sizeTouch and set on any touch
       device, phone or tablet. The literal here is the desktop fallback. */
    width: var(--ctl, 156px); height: var(--ctl, 156px); border-radius: 26%;
    background: rgba(9, 13, 22, .40);
    border: 2px solid rgba(255,255,255,.18);
    backdrop-filter: blur(3px);
    transition: background .15s, border-color .15s;
  }
  #tstick.on { background: rgba(9,13,22,.55); border-color: rgba(255,255,255,.34); }

  /* The four arrows. Each is a triangle drawn with borders, parked against its
     own edge of the pad, and each lights up while that direction is held — so
     the control tells you what the game thinks you are asking for. */
  .tarr {
    position: absolute; left: 50%; top: 50%;
    width: 0; height: 0;
    opacity: .55; transition: opacity .08s, filter .08s;
    pointer-events: none;
  }
  .tarr.lit { opacity: 1; filter: drop-shadow(0 0 6px rgba(255,255,255,.85)); }
  .tarr.up {
    border-left: calc(var(--ctl, 156px) * 0.13) solid transparent;
    border-right: calc(var(--ctl, 156px) * 0.13) solid transparent;
    border-bottom: calc(var(--ctl, 156px) * 0.15) solid #fff;
    transform: translate(-50%, calc(-50% - var(--ctl, 156px) * 0.25));
  }
  .tarr.down {
    border-left: calc(var(--ctl, 156px) * 0.13) solid transparent;
    border-right: calc(var(--ctl, 156px) * 0.13) solid transparent;
    border-top: calc(var(--ctl, 156px) * 0.15) solid #fff;
    transform: translate(-50%, calc(-50% + var(--ctl, 156px) * 0.25));
  }
  .tarr.left {
    border-top: calc(var(--ctl, 156px) * 0.13) solid transparent;
    border-bottom: calc(var(--ctl, 156px) * 0.13) solid transparent;
    border-right: calc(var(--ctl, 156px) * 0.15) solid #fff;
    transform: translate(calc(-50% - var(--ctl, 156px) * 0.25), -50%);
  }
  .tarr.right {
    border-top: calc(var(--ctl, 156px) * 0.13) solid transparent;
    border-bottom: calc(var(--ctl, 156px) * 0.13) solid transparent;
    border-left: calc(var(--ctl, 156px) * 0.15) solid #fff;
    transform: translate(calc(-50% + var(--ctl, 156px) * 0.25), -50%);
  }
  /* The hub: the dead centre, where pressing means "stop". Kept as #tknob so the
     pad still has a middle to aim at. */
  #tknob {
    position: absolute; left: 50%; top: 50%;
    width: calc(var(--ctl, 156px) * 0.22); height: calc(var(--ctl, 156px) * 0.22);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    background: rgba(255,255,255,.30);
    pointer-events: none;
  }
  /* Deliberately NOT a knob. The stick is a dark ring with a pale ball in the
     middle; giving the bomb control the same treatment made it read as a second
     joystick. This is a solid warm-coloured key with a flat face and a hard rim
     — something you strike, not something you steer. */
  #tbomb {
    right: calc(16px + env(safe-area-inset-right, 0px));
    width: var(--ctl, 152px); height: var(--ctl, 152px); border-radius: 50%;
    border: 3px solid #ffd166;
    background:
      radial-gradient(circle at 50% 118%, rgba(255,255,255,.18), transparent 60%),
      linear-gradient(180deg, #ff8b3d 0%, #f4551f 62%, #c22f10 100%);
    box-shadow:
      0 7px 0 #8f2109,                       /* the key's side, so it reads raised */
      0 12px 26px rgba(0,0,0,.5),
      inset 0 2px 0 rgba(255,255,255,.35);
    display: flex; align-items: center; justify-content: center;
    padding: 0; cursor: pointer;
    transition: transform .06s ease-out, box-shadow .06s ease-out;
  }
  /* A bomb glyph drawn in CSS: body, fuse, spark */
  #tbomb span {
    position: relative;
    width: calc(var(--ctl, 152px) * 0.36); height: calc(var(--ctl, 152px) * 0.36);
    border-radius: 50%;
    background: #241206;
    box-shadow: inset -4px -5px 0 rgba(0,0,0,.35), inset 5px 6px 0 rgba(255,255,255,.14);
  }
  #tbomb span::before {
    content: ''; position: absolute; right: 4px; top: -13px;
    width: 6px; height: 17px; border-radius: 3px; background: #241206;
    transform: rotate(28deg);
  }
  #tbomb span::after {
    content: ''; position: absolute; right: -3px; top: -22px;
    width: 15px; height: 15px; border-radius: 50%;
    background: radial-gradient(circle, #fff3c4 0%, #ffd166 45%, #ff8b3d 100%);
    box-shadow: 0 0 12px rgba(255,209,102,.9);
  }
  /* THE SPECIAL BUTTON. Left of the bomb key, smaller than it, and a completely
     different colour — it is not a second bomb and must never be mistaken for
     one under pressure. Only on screen when the prize you are wearing actually
     grants something, so an empty button is never sitting there to wonder about.
     One button for every power: the glyph changes, the position never does. */
  #tspecial {
    position: absolute;
    bottom: calc(74px + env(safe-area-inset-bottom, 0px));
    right: calc(16px + env(safe-area-inset-right, 0px) + var(--ctl, 152px) * 1.16);
    width: calc(var(--ctl, 152px) * 0.78); height: calc(var(--ctl, 152px) * 0.78);
    border-radius: 50%;
    border: 3px solid #8fe3ff;
    background:
      radial-gradient(circle at 50% 118%, rgba(255,255,255,.2), transparent 60%),
      linear-gradient(180deg, #4fc3f7 0%, #2c7fd4 62%, #1b4f9c 100%);
    box-shadow:
      0 6px 0 #113463,
      0 10px 22px rgba(0,0,0,.5),
      inset 0 2px 0 rgba(255,255,255,.35);
    display: flex; align-items: center; justify-content: center;
    touch-action: none; -webkit-tap-highlight-color: transparent;
    transition: transform .06s ease-out, box-shadow .06s ease-out;
  }
  #tspecial.on { transform: translateY(5px); box-shadow: 0 2px 0 #113463, 0 6px 14px rgba(0,0,0,.5); }
  /* SPENT, and counting itself back. The hop has a cooldown and a button that
     looks identical whether or not it will do anything is a button you press
     twice and blame the game for. */
  #tspecial.spent { filter: grayscale(.75) brightness(.6); }
  #tspecial b {
    position: relative; display: block;
    width: calc(var(--ctl, 152px) * 0.3); height: calc(var(--ctl, 152px) * 0.3);
  }
  /* JETPACK: two exhaust cones under a body, pointing down — an up arrow made of
     thrust rather than a chevron, so it reads as "lift" and not "menu". */
  #tspecial[data-power="hop"] b {
    background: #eaf6ff; border-radius: 40% 40% 30% 30%;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.18);
  }
  #tspecial[data-power="hop"] b::before,
  #tspecial[data-power="hop"] b::after {
    content: ''; position: absolute; bottom: -46%; width: 34%; height: 46%;
    background: linear-gradient(180deg, #ffd166 0%, #ff7a1a 55%, rgba(255,60,20,0) 100%);
    border-radius: 0 0 50% 50%;
  }
  #tspecial[data-power="hop"] b::before { left: 6%; }
  #tspecial[data-power="hop"] b::after  { right: 6%; }
  /* DYNAMITE: a plunger detonator — a box with a handle you push down. */
  #tspecial[data-power="detonate"] b {
    background: #d94b2b; border-radius: 4px; height: calc(var(--ctl, 152px) * 0.2);
    align-self: flex-end; margin-top: calc(var(--ctl, 152px) * 0.12);
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.25);
  }
  #tspecial[data-power="detonate"] b::before {
    content: ''; position: absolute; left: 50%; top: -60%;
    width: 12%; height: 62%; margin-left: -6%; background: #f4f7fb;
  }
  #tspecial[data-power="detonate"] b::after {
    content: ''; position: absolute; left: 18%; top: -76%;
    width: 64%; height: 22%; border-radius: 3px; background: #f4f7fb;
  }

  /* Tall windows (tablets) have room to spare, so the controls hug the corners
     and stay off the board entirely rather than clipping its edge. */
  @media (min-height: 560px) {
    #tstick { left: calc(26px + env(safe-area-inset-left, 0px)); }
    #tbomb  { right: calc(26px + env(safe-area-inset-right, 0px)); }
    #tstick, #tbomb { bottom: calc(70px + env(safe-area-inset-bottom, 0px)); }
  }

  /* PHONE-HEIGHT WINDOWS GET SMALLER CONTROLS — and the cut-off is 559px, not
     430px. At 430 an iPhone 16 Pro Max in landscape (956x440) fell through to the
     full-size 156px pad, and on a screen that tall the board is wide enough that a
     156px ring in the corner sits on it. Every phone in landscape is under 560px
     tall and every tablet is over it, so that is the line.
     Sized against the viewport as well as in pixels, so a control can never take
     more than a third of the height whatever the device reports. */
  @media (max-height: 559px) {
    /* Size comes from --ctl (see UI.sizeTouch); only the trimmings are here. */
    #tstick, #tbomb { width: var(--ctl, 84px); height: var(--ctl, 84px); }
    #tbomb { border-width: 2px; }
    #tbomb span::before { width: 4px; height: 10px; top: -8px; }
    #tbomb span::after { width: 10px; height: 10px; top: -14px; right: -2px; }
    #tstick, #tbomb { bottom: calc(70px + env(safe-area-inset-bottom, 0px)); }
    /* Pushed right into the corners. On the narrowest phone (667x375) the
       board's side margin is 140px and the pad is 124px, so a 20px inset put
       the pad 4px over the playing field. Nothing else here is negotiable —
       the pad size is what makes it responsive — so the inset gives way. */
    #tstick { left: calc(26px + env(safe-area-inset-left, 0px)); }
    #tbomb  { right: calc(26px + env(safe-area-inset-right, 0px)); }
    #tpause { width: 34px; height: 34px; border-radius: 10px; }
    #tpause i { width: 4px; height: 13px; }
  }
  /* Pressed: the key travels down onto its own side. Unmistakable in the corner
     of your eye, which is where you actually see it. */
  #tbomb.on {
    transform: translateY(6px);
    box-shadow: 0 1px 0 #8f2109, 0 4px 12px rgba(0,0,0,.5),
                inset 0 2px 0 rgba(255,255,255,.2);
  }

  /* The round's own button row, top-left, opposite the sudden-death countdown.
     A flex row rather than two absolutely-positioned buttons: the toggle used
     to be placed at a hardcoded offset and landed on top of the pause button
     the moment a breakpoint changed the pause button's size. */
  /* TOP RIGHT. The player cards own the top-left corner now, and two things
     competing for one corner is what put the home button on top of Pyro's card. */
  #tbtns {
    position: absolute;
    top: calc(10px + env(safe-area-inset-top, 0px));
    right: calc(14px + env(safe-area-inset-right, 0px));
    display: flex; align-items: center; gap: 6px;
    pointer-events: none; z-index: 2;
  }
  #tbtns > * { pointer-events: auto; }

  /* Pause: phones have no P key. */
  #tpause {
    width: 42px; height: 42px; border-radius: 12px;
    background: rgba(8,12,22,.72); border: 1px solid var(--edge);
    display: none; align-items: center; justify-content: center; gap: 5px;
    pointer-events: auto; cursor: pointer; padding: 0;
    -webkit-tap-highlight-color: transparent;
  }
  #tpause i { width: 5px; height: 16px; border-radius: 2px; background: #fff; opacity: .85; }
  /* Also up on any compact window, so a phone that has switched the controls
     OFF still has something to pause with — there is no P key on a phone. */
  body.touching #tpause, body.compact #tpause { display: flex; }

  /* CONTROLS TOGGLE. Sits beside the pause button and is up for the whole
     round, whether the controls are on or off — a switch you can only reach
     while the thing it switches is already on is not a switch. This is why it
     lives outside #touch: that element is the thing being hidden. */
  #tctl {
    width: 42px; height: 42px; border-radius: 12px;
    background: rgba(8,12,22,.72); border: 1px solid var(--edge);
    display: flex; align-items: center; justify-content: center;
    pointer-events: auto; cursor: pointer; padding: 0;
    -webkit-tap-highlight-color: transparent;
    transition: opacity .15s, border-color .15s, background .15s;
  }
  /* A thumbstick, drawn: a ring with the knob resting off-centre in it */
  #tctl b {
    position: relative; display: block;
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid #fff; opacity: .9;
  }
  #tctl b::after {
    content: ''; position: absolute; left: 50%; top: 50%;
    width: 9px; height: 9px; border-radius: 50%; background: #fff;
    transform: translate(-20%, -70%);
  }
  #tctl.down { border-color: var(--hi); background: rgba(255,209,102,.22); }

  /* HOME. Out of a round and back to the menu, from anywhere, without going
     through the pause panel first — the same 42px chip as the other two so the
     row reads as one control cluster. Up on desktop as well: ESC opens the pause
     panel, and there was no single key that just left.
     Drawn, not an emoji or a glyph font: a square with a triangle roof, which is
     the same house on every machine. */
  #thome {
    width: 42px; height: 42px; border-radius: 12px;
    background: rgba(8,12,22,.72); border: 1px solid var(--edge);
    display: flex; align-items: flex-end; justify-content: center;
    pointer-events: auto; cursor: pointer; padding: 0 0 11px 0;
    -webkit-tap-highlight-color: transparent;
    transition: border-color .15s, background .15s;
  }
  #thome:hover { border-color: var(--hi); background: rgba(255,209,102,.16); }
  #thome b {
    position: relative; display: block;
    width: 15px; height: 11px;
    background: #fff; opacity: .9;
    border-radius: 0 0 2px 2px;
  }
  /* The roof: a triangle wider than the walls, sitting on top of them */
  #thome b::before {
    content: ''; position: absolute; left: 50%; top: -9px;
    width: 0; height: 0; transform: translateX(-50%);
    border-left: 11px solid transparent;
    border-right: 11px solid transparent;
    border-bottom: 9px solid #fff;
  }
  /* ...and a doorway punched out of the walls, so it is not a plain block */
  #thome b::after {
    content: ''; position: absolute; left: 50%; bottom: 0;
    width: 5px; height: 6px; transform: translateX(-50%);
    background: rgba(8,12,22,.95); border-radius: 1px 1px 0 0;
  }
  /* Hidden on the menu and the locker with the rest of the row: there is
     nowhere to go home TO from there. Driven by the same class the others use. */
  #thome.off { display: none !important; }
  /* Off: dimmed and struck through, so the state reads at a glance */
  #tctl.down b { opacity: 1; }
  #tctl.up { opacity: .5; }
  #tctl.up b::before {
    content: ''; position: absolute; left: -5px; right: -5px; top: 50%;
    height: 2px; background: #fff; border-radius: 2px;
    transform: rotate(-45deg);
  }
  /* The pause button is only up with the controls; on a keyboard you have P.
     The toggle is up either way, so on a desktop it needs the same treatment
     the pause button gets on a phone. */
  #tctl { display: flex; }
  /* Deliberately NOT shrunk on a small screen: the pause button next to it is
     42px at every breakpoint, and two buttons of different sizes sitting side
     by side in the corner just looks like a mistake. */

  /* ROOM FOR BOTH. On a roomy window the controls no longer force the phone
     strip — the seat panels just stack at the TOP of each column so the bottom
     corners are free for the stick and the bomb key. Without this the stick
     sits on the lower-left panel, which is what made switching the controls on
     mean giving up the full layout. */
  body.padded #hud .side { bottom: auto; }

  /* Buttons in the pause panel — the only way to resume on a phone */
  .pbtns { display: flex; flex-direction: column; gap: 8px; margin: 14px 0 4px; }
  .pbtns button {
    font: inherit; font-size: 14px; font-weight: 800; letter-spacing: 1.2px;
    color: #fff; background: rgba(255,255,255,.07);
    border: 1px solid var(--edge); border-radius: 11px;
    padding: 12px 16px; cursor: pointer; pointer-events: auto;
    -webkit-tap-highlight-color: transparent;
  }
  .pbtns button:hover { background: rgba(255,255,255,.14); border-color: var(--hi); }
  .pbtns button b { color: var(--hi); }
  /* The one line of text left on the panel. Sized to sit above the buttons
     without becoming a heading — it is a jab, not a title. */
  #pause .ptaunt {
    margin: 0 0 16px; font-size: clamp(13px, 1.5vw, 17px); font-weight: 800;
    letter-spacing: .6px; line-height: 1.45; color: #ffe6a8; max-width: 26em;
  }
  #pause .ptaunt b { color: var(--hi); }
  #pause .pmusic {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin: 0 0 14px; user-select: none;
  }
  #pause .pmusic .pmlbl {
    font-size: 13px; letter-spacing: 3px; opacity: .62; min-width: 62px; text-align: right;
  }
  #pause .pmusic .pmval {
    font-size: 15px; letter-spacing: 2px; color: var(--hi);
    min-width: 58px; text-align: left; font-weight: 700;
  }
  /* Real buttons, sized for a thumb rather than for a cursor. 34px is the
     smallest the device sweep will accept for anything you have to hit. */
  #pause .pmusic button {
    width: 38px; height: 34px; line-height: 1; font-size: 13px;
    border-radius: 9px; cursor: pointer;
    border: 1px solid rgba(255,255,255,.22);
    background: rgba(255,255,255,.07); color: #fff;
  }
  #pause .pmusic button:hover { background: rgba(255,255,255,.16); }
  /* Build id, moved to the front screen. Still readable on a phone, still the
     answer to "did my upload land?", and no longer in the way mid-round. */
  #menu .build {
    position: absolute; bottom: 10px; right: 14px; margin: 0;
    font-size: 10px; letter-spacing: 1.5px; opacity: .3; pointer-events: none;
  }

  /* Overlays sit above the controls and take their own taps */
  #pause, #results { pointer-events: auto; z-index: 15; }
  #results { cursor: pointer; }

  /* ---------------------------------------------------------- rotate --- */
  #rotate {
    position: absolute; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    background: rgba(6,9,16,.96); pointer-events: auto; text-align: center;
  }
  #rotate .phone {
    width: 52px; height: 84px; margin: 0 auto 20px;
    border: 3px solid var(--hi); border-radius: 10px;
    animation: tip 1.8s ease-in-out infinite;
  }
  @keyframes tip {
    0%, 40% { transform: rotate(0deg); }
    60%, 100% { transform: rotate(-90deg); }
  }
  #rotate h2 { margin: 0 0 6px; font-size: 22px; letter-spacing: 2px; }

  /* ------------------------------------------- compact (phone) layout --- */
  /* Panels move from the two side columns into one strip across the top, which
     hands the full window width back to the arena. Driven by the body class so
     fitCamera and the CSS always agree about which mode we are in. */
  /* THE SAME STRIP ON A PHONE, just tighter. One row across the top on every
     screen — the phone and the desktop are the same layout at different sizes,
     which is one set of rules to reason about instead of two. */
  body.compact #hud .side {
    position: absolute; top: calc(6px + env(safe-area-inset-top, 0px));
    bottom: auto; flex-direction: row; gap: 3px;
    padding: 0 calc(6px + env(safe-area-inset-left, 0px));
    /* WRAPS RATHER THAN CLIPS. Four loaded cards on one line need about 700px;
       a phone held sideways has it, a phone held upright does not. Wrapping to a
       second line costs height on the screen that has height to spare and costs
       nothing on the one that has not — a phone in portrait is showing the
       rotate prompt anyway. */
    flex-wrap: wrap; justify-content: center;
  }
  /* The strip is centred over the board by the base rule. It is NOT anchored to
     the left edge any more: a centred strip is the thing that sits "above the
     arena" rather than off in a corner, and the button row it used to collide
     with is handled by measurement (UI.placeCards) rather than by an inset that
     had to be edited every time a button was added. */
  /* One tight card per player: name, then the artwork for whatever they are
     carrying. On a 390px-tall phone the board is the thing that matters, so the
     ability LABELS and the win count come off the card and the icons alone do
     the work. The whole strip has to stay well under the camera's top reserve. */
  body.compact .card {
    width: auto; padding: 3px 6px; gap: 4px; border-radius: 7px;
    border-width: 2px; box-shadow: 0 0 0 1px rgba(0,0,0,.6), 0 4px 14px rgba(0,0,0,.5);
    /* NEVER SHRUNK. `flex: 0 1 auto` let the strip squeeze each card below its
       own content width, the pick-up row wrapped inside it, and a strip that was
       meant to be one line came out three. Cards keep their natural width and
       the STRIP wraps instead. */
    align-items: center; flex: 0 0 auto;
  }
  /* Name on one line, pick-ups on the next, and the pick-ups WRAP — a fully
     loaded player has six things to show and four cards have to share the width
     of a phone. Two short lines beats one long one. */
  /* ONE LINE, not two. The strip's height is the only thing this layout costs
     the board, and in landscape — which is the only way a phone plays this — the
     board is height-limited, so every pixel of strip is a pixel off the arena.
     Measured on a 740x360 phone: a two-line strip took 19% of the board's area,
     a one-line strip takes 7%. The name and the artwork sit side by side. */
  body.compact .card .info {
    display: flex; flex-direction: row; align-items: center; gap: 5px;
    min-width: 0; width: auto;
  }
  body.compact .card .name { font-size: 10px; gap: 3px; line-height: 1; }
  body.compact .card .name .tagme { font-size: 7px; }
  /* Tighter than the base rule, and no top margin: on a phone the two lines sit
     right on top of each other or the strip eats the board. */
  body.compact .card .pu {
    flex-direction: row; flex-wrap: wrap; gap: 2px 4px;
    margin-top: 0; align-items: center;
  }
  body.compact .card .abils { flex-direction: row; flex-wrap: wrap; gap: 2px 4px; }
  body.compact .card .stat { gap: 2px; }
  body.compact .card .stat .si { width: 11px; height: 11px; border-radius: 3px; }
  body.compact .card .stat b { font-size: 11px; }
  /* Ability NAMES are off the card on a phone; the artwork alone has to do it */
  body.compact .card .stat.ab b, body.compact .card .stat.cz b { display: none; }
  body.compact .card .wins { display: none; }
  /* NARROW AND SIDEWAYS — the shape a phone is actually played in. Four loaded
     cards have to fit on ONE line here or the strip wraps to two, and measured on
     a 740x360 phone that second line costs the board 22% of its area. Everything
     below is a few pixels off the widest thing on the card, bought back with
     nothing anybody reads: gaps, not glyphs. */
  @media (max-width: 900px) {
    body.compact .card { padding: 3px 5px; gap: 3px; }
    body.compact .card .info { gap: 4px; }
    body.compact .card .pu,
    body.compact .card .abils { gap: 2px 3px; }
    body.compact .card .stat { gap: 1px; }
    body.compact .card .stat .si { width: 10px; height: 10px; border-radius: 3px; }
    body.compact .card .stat b { font-size: 10px; }
  }
  /* THE CLOCK STAYS AT THE TOP, on a phone as well — but on a phone the player
     cards form a strip across the top with it, and a clock hard-centred there
     lands on whichever card happens to reach the middle. So in compact it is
     POSITIONED BY MEASUREMENT (UI.placeClock): dropped just under the strip,
     which is where the free space actually is and which moves as the cards grow.
     top is written from script; the centring stays in the sheet. */
  body.compact #clock { top: calc(6px + env(safe-area-inset-top, 0px)); }
  body.compact #hint { display: none; }
  body.compact #banner.small { bottom: auto; top: 46%; }

  /* ------------------------------------------------------------ menu --- */
  #menu {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 0;
    /* Light enough to read the map preview through, dark enough for the text */
    background: radial-gradient(ellipse at center, rgba(9,13,22,.30) 0%, rgba(6,9,16,.80) 78%);
    pointer-events: none;
  }
  /* ------------------------------------------------------- the wordmark --- */
  /* Chunky cartoon lettering: every letter is its own block with its own tilt,
     bob and size, a warm gradient on the first word and a cool one on the
     second, and a heavy dark outline round the lot.
     THE OUTLINE IS TWO LAYERS, not one. -webkit-text-stroke centres the stroke
     on the glyph edge, so a single stroked-and-filled copy loses half its ink to
     the outline and the gradient goes muddy. A fat stroked copy sits behind and
     a gradient-filled copy sits on top of it, which keeps the fill crisp and
     the outline a full weight. */
  #menu h1 {
    /* width: fit-content so its true ink width can be measured and the option
       column matched to it exactly. */
    width: fit-content;
    font-size: clamp(58px, 12vw, 148px); font-weight: 900; letter-spacing: 2px;
    margin: 0; line-height: .92; text-align: center;
    position: relative; color: transparent;
    font-family: 'Arial Black', 'Arial Bold', 'Helvetica Neue', Impact, system-ui, sans-serif;
    filter: drop-shadow(0 6px 0 rgba(0,0,0,.35)) drop-shadow(0 0 44px rgba(255,150,40,.3));
  }
  #menu h1 .wline { display: block; white-space: nowrap; }
  /* The second word rides smaller and tighter, like a tail on the first */
  #menu h1 .wline.two { font-size: .56em; letter-spacing: 6px; margin-top: -.04em; }
  #menu h1 .wl {
    position: relative; display: inline-block;
    transform: rotate(var(--r, 0deg)) translateY(var(--y, 0)) scale(var(--s, 1));
  }
  #menu h1 .wl > i, #menu h1 .wl > b {
    display: block; font-style: normal; font-weight: 900;
  }
  /* Behind: the outline */
  #menu h1 .wl > i { -webkit-text-stroke: .085em #0a1024; color: #0a1024; }
  /* In front: the gradient fill, clipped to the glyph */
  #menu h1 .wl > b {
    position: absolute; left: 0; top: 0; right: 0;
    background-image: var(--g);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  /* A burst going off behind the join between the two words. Drawn, like every
     other decoration in this game — see the icons and the locker backdrop. */
  #menu h1 .wburst {
    position: absolute; right: -.10em; top: -.20em;
    width: .40em; height: .40em; pointer-events: none;
    animation: wpop 2.6s ease-in-out infinite alternate;
  }
  @keyframes wpop {
    from { transform: rotate(-8deg) scale(.94); }
    to   { transform: rotate(8deg) scale(1.06); }
  }
  @media (prefers-reduced-motion: reduce) {
    #menu h1 .wburst { animation: none; }
  }

  /* Options column is sized to sit flush under the wordmark */
  /* Width is set in JS to exactly match the wordmark above, so the title and
     every option row share one clean edge-to-edge alignment. */
  .opts {
    display: flex; flex-direction: column; gap: 9px;
    width: min(420px, 86vw); margin-top: 34px;
    pointer-events: auto;
  }
  .opt {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 20px; border-radius: 13px; cursor: pointer;
    background: rgba(10,14,24,.62); border: 1px solid var(--edge);
    backdrop-filter: blur(3px);
    transition: transform .14s ease, background .14s, border-color .14s, box-shadow .14s;
  }
  .opt:hover {
    background: rgba(255,209,102,.16);
    border-color: rgba(255,209,102,.5);
  }
  .opt.sel {
    background: rgba(255,209,102,.22);
    border-color: var(--hi);
    transform: scale(1.035);
    box-shadow: 0 0 0 1px rgba(255,209,102,.22), 0 10px 32px rgba(255,150,40,.18);
  }
  .opt.sel .val { color: var(--hi); opacity: 1; }
  /* Never wrap. A row that wraps is taller than its neighbours and the whole
     column stops reading as a set — the width is sized to the content instead
     (see alignOptionsToTitle). */
  .opt .lbl, .opt .val { white-space: nowrap; }
  .opt .lbl { font-weight: 700; font-size: 15px; letter-spacing: .5px; }
  .opt .val { font-size: 14px; opacity: .8; transition: color .14s, opacity .14s; }
  .opt .lbl { margin-right: 18px; }   /* a real gap between label and value */

  /* START MATCH: single centred label, no value column */
  .opt.go { justify-content: center; padding: 17px 20px; margin-top: 8px; }
  .opt.go .lbl.start {
    color: var(--hi); font-size: 17px; letter-spacing: 4px; font-weight: 900;
    text-align: center; width: 100%;
  }
  .opt.go.sel { background: rgba(255,209,102,.28); }
  .opt.go.sel .lbl.start { color: #fff2cf; text-shadow: 0 0 18px rgba(255,209,102,.6); }

  /* ------------------------------------------------- character select --- */
  /* The 3D preview is drawn by the game renderer straight into #spreview's
     rectangle, so that element must stay TRANSPARENT and must not be covered.
     Everything else here is ordinary DOM on top of the canvas. */
  #select {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    padding: 16px clamp(12px, 3vw, 40px) 14px;
    /* NO background here. The scrim is punched out around the preview instead —
       see #spreview below. A scrim on this element would sit on top of the
       canvas the preview is drawn into and black the character out. */
    pointer-events: none;
  }
  #select.hidden { display: none; }
  /* Everything except the preview paints above the scrim */
  #select .shead, #select .slist, #select .sfoot { position: relative; z-index: 1; }
  #select h2, #select .shint { text-shadow: 0 2px 10px rgba(0,0,0,.75); }
  #select .shead { display: flex; align-items: baseline; gap: 16px; }
  #select h2 { font-size: clamp(18px, 3vw, 30px); font-weight: 900; letter-spacing: 4px; margin: 0; }

  #select .sbody { flex: 1; display: flex; justify-content: center;
    gap: clamp(10px, 2vw, 26px); min-height: 0; margin: 10px 0; }
  #spreview {
    position: relative; z-index: 1; flex: 0 0 clamp(120px, 22vw, 250px);
    /* Kept close to 3:4 so the character is framed rather than lost in a long
       thin column — the preview camera is set up for that shape. */
    align-self: center; aspect-ratio: 3 / 4; max-height: 100%;
    border-radius: 16px;
    /* MUST STAY TRANSPARENT. The character inside is drawn by the WebGL canvas
       underneath this overlay; any background here blacks it out. The backdrop
       layer below is clipped around this exact rectangle for the same reason. */
    background: transparent;
    /* A WHITE EDGE GLOW. With the floating shapes gone this is the only thing
       separating the character from the gradient, so the edge does the framing:
       a bright white hairline, a tight white halo just outside it, and a wider
       soft one beyond that. The inset stays white too — the old purple inner
       glow was tinting the character's own colours near the border. */
    border: 1px solid rgba(255,255,255,.9);
    box-shadow: 0 0 0 1px rgba(255,255,255,.5),
                0 0 16px rgba(255,255,255,.55),
                0 0 44px rgba(255,255,255,.28),
                inset 0 0 30px rgba(255,255,255,.12);
  }

  /* ----------------------------------------------- the cosmic wardrobe --- */
  /* A static gradient with a lot of junk floating in it. The whole layer is
     CLIPPED into a keyhole around the preview panel — see UI.punchPreviewHole
     — because an opaque background over the canvas would black the character
     out. The polygon is computed from the live panel rect, not guessed: the
     panel resizes with the viewport, and a hardcoded hole drifts off it. */
  #select .sbg {
    position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    /* PURPLE AND PINK ONLY. The teal and the blue were pulling it four ways at
       once and the list had to fight the background to be read. Two hues, one
       diagonal, and the brightest part kept away from the middle where the
       character and the list actually live. */
    background:
      radial-gradient(1200px 820px at 8% 2%,    rgba(150, 70, 255, .55), transparent 64%),
      radial-gradient(1000px 760px at 96% 96%,  rgba(240, 80, 170, .48), transparent 62%),
      linear-gradient(160deg, #2a0f52 0%, #3a1160 34%, #4a1157 62%, #2b0a38 100%);
  }
  /* The starfield is one painted layer rather than 200 elements */
  #select .sbg::after {
    content: ''; position: absolute; inset: -10%;
    background-image:
      radial-gradient(1.6px 1.6px at 12% 18%, #fff, transparent),
      radial-gradient(1.4px 1.4px at 27% 62%, #cfe6ff, transparent),
      radial-gradient(1.8px 1.8px at 41% 12%, #fff, transparent),
      radial-gradient(1.2px 1.2px at 55% 78%, #ffe6fa, transparent),
      radial-gradient(1.7px 1.7px at 68% 32%, #fff, transparent),
      radial-gradient(1.3px 1.3px at 79% 66%, #d9fbff, transparent),
      radial-gradient(1.9px 1.9px at 91% 24%, #fff, transparent),
      radial-gradient(1.2px 1.2px at 8% 86%,  #fff, transparent),
      radial-gradient(1.5px 1.5px at 34% 92%, #ffeccf, transparent),
      radial-gradient(1.3px 1.3px at 62% 6%,  #fff, transparent),
      radial-gradient(1.6px 1.6px at 86% 88%, #fff, transparent),
      radial-gradient(1.1px 1.1px at 19% 44%, #fff, transparent),
      radial-gradient(1.4px 1.4px at 47% 40%, #cfe6ff, transparent),
      radial-gradient(1.2px 1.2px at 73% 52%, #fff, transparent);
    background-repeat: repeat;
    background-size: 340px 260px;
    opacity: .45;
  }
  /* Shown while the cursor is on something you have NOT won: the character is
     wearing it so you can see what you are playing for, but nothing has been
     equipped and the round will not start with it on. */
  #spreview .sghost {
    position: absolute; left: 0; right: 0; top: 8px; text-align: center;
    font-size: clamp(8px, 1vw, 11px); font-weight: 900; letter-spacing: 2.5px;
    color: #8fd8ff; opacity: 0; transition: opacity .12s;
    text-shadow: 0 2px 8px rgba(0,0,0,.8);
  }
  #spreview.ghost .sghost { opacity: 1; }
  #spreview.ghost { border-color: rgba(143, 216, 255, .55);
    box-shadow: 0 0 0 1px rgba(0,0,0,.55), 0 0 34px rgba(90,180,255,.4),
                inset 0 0 40px rgba(60, 120, 220, .2); }
  #spreview .sname {
    position: absolute; left: 0; right: 0; bottom: 8px; text-align: center;
    font-size: clamp(11px, 1.4vw, 15px); font-weight: 800; letter-spacing: 3px;
  }
  /* ONE list, one line per item, ten of them. Nothing scrolls sideways and
     there is nothing hidden off an edge: ten lines fit the shortest phone in
     landscape. overflow-y is a safety net for a freak window, not the plan. */
  #select .slist {
    flex: 1; display: flex; flex-direction: column; justify-content: center;
    gap: clamp(2px, .5vh, 6px); min-width: 0; min-height: 0;
    /* Capped, not stretched to the window. Ten short names across 1200px of
       monitor reads as a spreadsheet; a column you can take in at a glance is
       the entire point of collapsing four rows into one. */
    max-width: clamp(300px, 48vw, 560px);
    overflow-y: auto; scrollbar-width: none;
  }
  #select .slist::-webkit-scrollbar { display: none; }
  .sitem {
    pointer-events: auto; cursor: pointer; text-align: left;
    display: flex; align-items: center; gap: 12px;
    /* Lines GROW into whatever height the column has spare, up to a sensible
       ceiling, rather than sitting at their natural 21px and leaving a thumb
       aiming at a hairline. The cap stops ten lines becoming ten slabs on a
       tall monitor. */
    flex: 1 1 auto; min-height: 26px; max-height: 46px;
    font: inherit; font-size: clamp(11px, 1.35vw, 15px); font-weight: 700; letter-spacing: .6px;
    color: #e8eefc;
    padding: clamp(4px, .9vh, 9px) clamp(10px, 1.4vw, 16px);
    border-radius: 10px;
    background: rgba(7,10,22,.74); border: 1px solid rgba(255,255,255,.10);
    backdrop-filter: blur(4px);
    box-shadow: 0 4px 14px rgba(0,0,0,.35);
    transition: background .12s, border-color .12s, opacity .12s;
  }
  .sitem .sname2 { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* The right-hand column is the whole status report: worn, or not won yet */
  .sitem .snote {
    flex: 0 0 auto; font-size: .78em; font-weight: 800; letter-spacing: 1.4px;
    text-transform: uppercase; opacity: .8;
  }
  .sitem:hover { background: rgba(255,209,102,.2); border-color: rgba(255,209,102,.55); }
  /* Beyond the two-item preview window there is nothing to see yet */
  .sitem.gone { display: none; }
  /* The next one up is a tease, not a tombstone: brighter than a locked row */
  .sitem.next { opacity: .82; border-color: rgba(150, 220, 255, .45);
    background: rgba(20, 40, 70, .74); }
  .sitem.next .snote { color: #8fd8ff; opacity: 1; }
  .sitem.soon { opacity: .5; }
  #select .smore {
    text-align: center; font-size: clamp(9px, 1.05vw, 12px); font-weight: 800;
    letter-spacing: 2px; text-transform: uppercase; opacity: .55;
    margin-top: clamp(4px, 1vh, 10px); pointer-events: none; flex: 0 0 auto;
    text-shadow: 0 2px 10px rgba(0,0,0,.75);
  }
  /* Owned and worn right now */
  .sitem.on { background: rgba(255,209,102,.26); border-color: var(--hi); color: #fff2cf; }
  .sitem.on .snote { color: var(--hi); opacity: 1; }
  /* Not won yet: visible, so you can see what is out there, but obviously not yours */
  .sitem.locked { opacity: .38; }
  .sitem.sel { border-color: var(--hi); box-shadow: 0 0 0 2px rgba(255,209,102,.35); }

  #select .sfoot { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  #select .sfoot .opt.go {
    pointer-events: auto; min-width: clamp(180px, 26vw, 280px); margin-top: 0;
    background: rgba(10,6,28,.78); backdrop-filter: blur(4px);
    box-shadow: 0 8px 26px rgba(0,0,0,.5), 0 0 24px rgba(255,209,102,.18);
  }
  #select .shint { margin: 0; font-size: clamp(10px, 1.3vw, 13px); text-align: center; }
  #select .shint.hidden { display: none; }

  /* FIGHT: the word dead centre, and sparkle round the edge of the box. The
     button inherits .opt, which is space-between for a label/value pair — with
     only a label in it, that pushed the word hard to the left. */
  #select .sfoot .opt.go { justify-content: center; position: relative; overflow: visible; }
  /* Three separate things push the word off centre and all three must go:
     .opt .lbl carries an 18px right margin for the label/value gap (worth 9px
     of leftward drift), the flex item must actually fill the content box, and
     letter-spacing hangs 4px of empty space off the final T (worth 2px). */
  #select .sfoot .opt.go .lbl.start {
    text-align: center; flex: 1 1 100%; width: 100%; min-width: 0;
    margin-right: 0; text-indent: 4px;
  }
  .fsp {
    position: absolute; left: var(--fx); top: var(--fy);
    width: .7em; height: .7em; margin: -.35em 0 0 -.35em;
    pointer-events: none;
    animation: fspark 2.4s ease-in-out infinite;
    animation-delay: var(--fd, 0s);
  }
  /* A four-point star, not a dot: a round blob on a border reads as a smudge */
  .fsp::before {
    content: ''; position: absolute; inset: 0; background: #fff9e0;
    clip-path: polygon(50% 0, 57% 43%, 100% 50%, 57% 57%, 50% 100%, 43% 57%, 0 50%, 43% 43%);
    filter: drop-shadow(0 0 6px rgba(255,209,102,.95));
  }
  @keyframes fspark {
    0%, 100% { transform: scale(.3) rotate(0deg); opacity: .2; }
    50%      { transform: scale(1) rotate(45deg); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .fsp { animation: none; transform: scale(.7); opacity: .7; }
  }

  /* Short windows (phones in landscape): shrink the preview and tighten the
     lines so all ten still fit without anyone having to scroll for them. */
  @media (max-height: 460px) {
    #select { padding: 6px 12px 6px; }
    #select h2 { font-size: 17px; }
    #select .sbody { margin: 4px 0; }
    #spreview { flex: 0 0 clamp(84px, 15vw, 130px); }
    #select .sitem { padding: 3px 10px; font-size: 11px; border-radius: 8px;
      min-height: 24px; max-height: 34px; }
    #select .slist { gap: 2px; }
    #select .sfoot { gap: 3px; }
    #select .sfoot .opt.go { padding: 8px 20px; }
    #select .shint { font-size: 10px; }
  }

  .panel .keys { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--edge);
    font-size: 12px; line-height: 1.9; opacity: .8; }
  .panel .keys b { letter-spacing: 1px; }

  /* --------------------------------------------------------- overlays -- */
  #pause, #results {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(5,8,14,.72); backdrop-filter: blur(3px);
  }
  .panel {
    background: var(--panel); border: 1px solid var(--edge); border-radius: 16px;
    padding: 28px 40px; text-align: center; min-width: min(420px, 86vw);
    box-shadow: 0 24px 80px rgba(0,0,0,.6);
  }
  .panel h2 { margin: 0 0 12px; font-size: 30px; letter-spacing: 3px; font-weight: 900; }
  .panel p { margin: 6px 0; font-size: 13px; }
  .scores { margin: 16px 0 18px; display: flex; flex-direction: column; gap: 8px; }
  .scores .row { display: flex; align-items: center; gap: 10px; font-size: 15px; }
  .scores .dot { width: 14px; height: 14px; border-radius: 4px; }
  .scores .nm { flex: 1; text-align: left; font-weight: 700; }
  .scores .nm i { font-style: normal; font-size: 10px; opacity: .5; margin-left: 6px; }
  .scores .sc { font-weight: 900; color: var(--hi); font-variant-numeric: tabular-nums; }

  /* ------------------------------------------------------------------------
     SHORT WINDOWS — last in the file on purpose. These override the menu
     sizing above, and with equal specificity the later rule is the one that
     wins. Moving this block earlier silently stops it working.
     ------------------------------------------------------------------------ */
  @media (max-height: 560px) {
    #menu h1 { font-size: clamp(30px, 8.5vh, 58px); letter-spacing: 1px; }
    #menu .opts { gap: 5px; margin-top: 10px; }
    #menu .opt { padding: 6px 14px; border-radius: 9px; font-size: 13px; }
    #menu .opt .lbl.start { font-size: 15px; }
    #menu .opt .lbl, #menu .opt .val { font-size: 13px; }
  }
  @media (max-height: 420px) {
    #menu h1 { font-size: clamp(26px, 7.5vh, 44px); }
    #menu .opts { gap: 4px; margin-top: 6px; }
    #menu .opt { padding: 5px 12px; font-size: 12px; }
    #menu .opt .lbl, #menu .opt .val { font-size: 12px; }
    #menu .opt .lbl.start { font-size: 14px; }
  }

  /* BOMBER FAN ARMOURY LOCKER REFRESH */
  #select {
    isolation: isolate;
    color: #f4f2ec;
  }
  #select .sbg {
    background:
      radial-gradient(900px 620px at 18% 42%, rgba(255,139,24,.18), transparent 58%),
      radial-gradient(800px 600px at 88% 14%, rgba(116,42,16,.30), transparent 62%),
      linear-gradient(155deg, #111318 0%, #090b0f 42%, #15100c 72%, #07080b 100%) !important;
  }
  #select .sbg::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background:
      repeating-linear-gradient(90deg, transparent 0 78px, rgba(255,255,255,.018) 79px 80px),
      repeating-linear-gradient(0deg, transparent 0 58px, rgba(255,255,255,.013) 59px 60px),
      linear-gradient(112deg, transparent 0 49%, rgba(255,131,27,.035) 50%, transparent 51% 100%);
    opacity: .75;
  }
  #select .sbg::after {
    content: ''; position: absolute; inset: -8%;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 18%, rgba(255,185,73,.9), transparent),
      radial-gradient(1.2px 1.2px at 31% 74%, rgba(255,113,31,.72), transparent),
      radial-gradient(1.6px 1.6px at 70% 22%, rgba(255,215,133,.75), transparent),
      radial-gradient(1.1px 1.1px at 86% 68%, rgba(255,126,32,.62), transparent),
      radial-gradient(1.4px 1.4px at 54% 50%, rgba(255,177,64,.62), transparent);
    background-size: 137px 137px, 181px 181px, 211px 211px, 163px 163px, 239px 239px;
    filter: drop-shadow(0 0 5px rgba(255,120,24,.45));
    opacity: .42;
    animation: armourEmbers 9s linear infinite alternate;
  }
  @keyframes armourEmbers { from { transform: translateY(0); } to { transform: translateY(-12px); } }
  #select .shead {
    align-items: center;
    min-height: 48px;
    padding: 0 4px 9px;
    border-bottom: 1px solid rgba(255,154,46,.22);
  }
  #select h2 {
    position: relative;
    color: #f6ead6;
    font-family: 'Arial Black', 'Arial Bold', Impact, system-ui, sans-serif;
    font-size: clamp(20px, 3.2vw, 34px) !important;
    letter-spacing: 5px !important;
    text-transform: uppercase;
    text-shadow: 0 2px 0 #000, 0 0 20px rgba(255,121,25,.25) !important;
  }
  #select h2::before {
    content: 'LOADOUT'; display: inline-block; margin-right: 12px;
    padding: 5px 9px 4px; border: 1px solid rgba(255,151,43,.50);
    border-radius: 5px; color: #ffad45; font: 900 10px/1 system-ui, sans-serif;
    letter-spacing: 2px; vertical-align: middle; transform: translateY(-2px);
    background: rgba(255,113,20,.08); box-shadow: inset 0 0 14px rgba(255,103,15,.08);
  }
  #select .sbody {
    align-items: stretch; gap: clamp(14px, 2.4vw, 30px) !important;
    margin: 12px 0 10px !important;
  }
  #spreview {
    border-radius: 18px !important;
    border: 1px solid rgba(255,151,46,.54) !important;
    box-shadow: 0 0 0 1px rgba(0,0,0,.72), 0 0 26px rgba(255,111,18,.16), inset 0 0 42px rgba(255,122,21,.05) !important;
  }
