<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Refreshing Bomber Fan</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      background: #080810;
      color: #fff5e8;
      font: 900 18px/1.3 system-ui, sans-serif;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>Loading BombOG…
<script>
(async () => {
  const scope = new URL('./', window.location.href).href;
  try {
    if ('serviceWorker' in navigator) {
      const registrations = await navigator.serviceWorker.getRegistrations();
      await Promise.all(
        registrations.filter(registration => registration.scope.startsWith(scope))
          .map(registration => registration.unregister())
      );
    }
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(
        keys.filter(key => key.startsWith('bomberfan-')).map(key => caches.delete(key))
      );
    }
  } catch (_) {}
  window.location.replace(new URL('./?build=9fffdcf&preview=bombog', scope).href);
})();
</script>
</body>
</html>
