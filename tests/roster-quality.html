<!doctype html><meta charset="utf-8"><title>Six fighter quality check</title>
<style>body{background:#151b24;color:white;font:14px monospace}iframe{position:fixed;right:0;top:0;width:512px;height:512px;border:0}pre{width:35vw;white-space:pre-wrap}</style>
<pre id="report">Loading six fighters…</pre><iframe></iframe>
<script>
const frame=document.querySelector('iframe'), report=document.querySelector('#report');
(async()=>{
 const rows=[],failures=[];
 for(const id of ['tribal','bunny','skull-orc','evolved-dragon','orc','hulk']) {
  await new Promise(resolve=>{frame.onload=resolve;frame.src=`../?preview=${id}&portraitCapture=1&audit=characters`;});
  const w=frame.contentWindow,A=w.BlastArena,g=A.Game._debug;
  const deadline=performance.now()+30000;
  while(!g.preview?.mesh?.userData.modelReady&&performance.now()<deadline)await new Promise(r=>setTimeout(r,50));
  if(!g.preview?.mesh?.userData.modelReady)throw Error(`${id}: model not ready`);
  g.paused=true;A.Player.resetShowcase(g.preview.mesh);A.Game._renderPreview();
  while(w.document.documentElement.dataset.characterAudit==='running'&&performance.now()<deadline)await new Promise(r=>setTimeout(r,50));
  const audit=JSON.parse(w.document.documentElement.dataset.characterAudit||'null');
  if(audit?.failures.length)failures.push(...audit.failures);
  if(A.PLAYER_DEFS.length!==6)failures.push('roster is not six');
  if(A.Game.opts.difficulty!=='normal')failures.push('default is not normal');
  const r=g.preview;
  const canvas=A.World.renderer.domElement;
  A.Game._renderPreview();
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',.93));
  if(!blob||blob.size<4000)throw Error(`${id}: blank portrait capture`);
  const response=await fetch(`/__portrait/${id}`,{method:'POST',body:blob});
  if(!response.ok)throw Error('Portrait save failed');
  rows.push({id,ready:true,portraitBytes:blob.size,cameraDistance:r.cam.position.z,roster:A.PLAYER_DEFS.length});
  report.textContent=JSON.stringify({rows,failures},null,2);
 }
 const layouts=[];
 for(const [width,height] of [[390,844],[844,390],[1280,720]]) {
  frame.style.width=width+'px';frame.style.height=height+'px';
  for(const id of ['tribal','bunny','skull-orc','evolved-dragon','orc','hulk']) {
   await new Promise(resolve=>{frame.onload=resolve;frame.src=`../?preview=${id}&layoutReview=1`;});
   const w=frame.contentWindow,A=w.BlastArena,g=A.Game._debug,T=w.BFCharacter3D.THREE;
   while(!g.preview?.mesh?.userData.modelReady)await new Promise(r=>setTimeout(r,50));
   g.paused=true;A.Player.resetShowcase(g.preview.mesh);A.Game._renderPreview();
   const pv=g.preview;pv.scene.updateMatrixWorld(true);pv.cam.updateMatrixWorld(true);
   const box=new T.Box3().setFromObject(pv.mesh.userData.modelRoot);
   let clipped=false;
   for(const x of [box.min.x,box.max.x])for(const y of [box.min.y,box.max.y])for(const z of [box.min.z,box.max.z]){
    const v=new T.Vector3(x,y,z).project(pv.cam);if(Math.abs(v.x)>1||Math.abs(v.y)>1)clipped=true;
   }
   const cards=[...w.document.querySelectorAll('.charpick')],fight=w.document.querySelector('[data-srow="fight"]');
   const onScreen=el=>{const r=el.getBoundingClientRect();return r.width>0&&r.height>0&&r.left>=0&&r.right<=width+1&&r.top>=0&&r.bottom<=height+1;};
   const ok=!clipped&&cards.length===6&&cards.every(onScreen)&&onScreen(fight);
   if(!ok)failures.push({id,width,height,clipped,cardsFit:cards.every(onScreen),fightFits:onScreen(fight)});
   layouts.push({id,width,height,ok});
  }
 }
 report.textContent=JSON.stringify({status:failures.length?'FAIL':'PASS',rows,layouts,failures},null,2);
})().catch(e=>report.textContent=e.stack);
</script>
